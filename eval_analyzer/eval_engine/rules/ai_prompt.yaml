# AI Comment [사례]/[제안] 지시문 · 금지 문구 — /pe/eval "AI 지시문" 탭에서 편집한다.
#
# instructions : 프롬프트 base 지시문 뒤에 순서대로 덧붙는 문장. 프롬프트에 들어가므로
#                저장하면 prompt sha 가 갈려 기존 [제안] 이 폐기되고 Honey 가 재대행한다.
# deny_patterns: 서버가 클라 push 를 받을 때 [사례]/[제안] 을 **줄 단위**로 걷어내는 정규식.
#                프롬프트에 안 들어가므로 sha 는 그대로 — 다음 push 부터 적용된다.
#                only_with_precedents: true 면 선례가 실제로 프롬프트에 실린 item 에만 적용.
#
# ⚠ 사례가 0건인 item 은 LLM 을 아예 부르지 않는다(recommend.has_precedent_comments) —
#    "사례가 없을 때" 를 다루는 지시는 필요 없다.
#
# ⚠ no_metric_names 는 **출력 문장에만** 거는 금지다(2026-09-02 사용자 결정). 프롬프트
#    재료 쪽의 수치([근거: …] · [현재 통계] · 선례의 당시 통계)는 그대로 둔다 — 그게
#    사라지면 "그때 값 vs 지금 값" 대조가 원리적으로 불가능해져 사례가 무용지물이 된다.
#    사용자가 모르는 것은 지표 **이름**이지 대조 자체가 아니다.
instructions:
- id: keep_precedents
  enabled: true
  text: 주어진 사례를 버리거나 부정하는 문장은 쓰지 마라 - "직접 적용할 수 있는 사례는 없다/확인되지
    않았다/해당 사례 없음" 같은 표현은 전부 금지다.
- id: summarize_only
  enabled: true
  text: '[사례] 블록은 요약만 한다 - 현재 현상에 적용 가능한지 판단하거나 평가하지 말고 각 사례가
    무엇을 근거로 어떻게 처리됐는지만 있는 그대로 적어라.'
- id: no_distortion
  enabled: true
  text: 사실을 왜곡하지 마라 - 사례에 없는 내용을 사례가 말한 것처럼 쓰지 말고 사례의 수치 조치
    결과를 바꾸거나 과장하지 마라.
- id: integrate_precedents
  enabled: true
  text: '[제안] 은 사례가 중심이다 - 기본 조치 문구를 그대로 쓰거나 요약하지 말고 사례가 실제로
    내린 결론(진성/낙도성 여부, 재현 여부, wait 안정화, 개발팀과의 협의 내용 등 사례에 있는
    그대로의 판단)을 지금 확인할 일로 바꿔 써라. 기본 조치 목록은 사례로 덮이지 않는 signature
    에만 쓰되 문장을 그대로 옮겨 적지 마라.'
- id: cover_all_signatures
  enabled: true
  text: 발화한 signature 는 위 [발화 signature 전체] 목록에 있는 것이 전부다 - primary 하나만
    다루지 말고 목록의 각 항목이 최소 한 줄에서 다뤄지게 쓰되 목록에 없는 항목을 새로 만들지는
    마라.
- id: signature_budget_first
  enabled: true
  text: '[제안] 은 전체 12줄 한 signature 당 5줄이 상한이다 - 예산은 발화 signature 를 먼저
    덮는 데 쓰고 남는 줄로 사례 대조를 써라. 예산이 부족하면 사례가 없는 signature 줄부터
    줄이고 사례가 있는 signature 의 구체적 판단 조치는 최대한 적게 줄여라. signature 가
    목록에 있는데 근거가 약하면 빼는 것이 아니라 무엇을 더 확인해야 판단할 수 있는지로 한
    줄 써라.'
- id: keep_english_terms
  enabled: true
  text: 현장에서 영어로 쓰는 용어는 영어 그대로 써라 - retest contact open leak wait bin lot
    yield trim probe socket 같은 말을 재시험 재테스트 콘택트 오프리크 대기 같은 한글로 옮기지
    마라. 반대로 원래 한글로 쓰는 말을 굳이 영어로 바꾸지도 마라.
- id: no_meta_judgment
  enabled: true
  text: 사례를 고르거나 평가하는 메타 문장을 쓰지 마라 - "대표 사례로 선정하기 어렵다" "어느
    사례가 더 적합한지 판단하기 어렵다" 같은 말은 읽는 사람에게 쓸모가 없다. 확실하지 않으면
    그런 사례가 있었다는 사실만 적고 끝내라.
- id: omit_when_no_info
  enabled: true
  text: 사례에 구체적인 판단 근거나 조치 내용이 없으면 그 사실을 설명하지 말고 생략하거나 크게
    줄여라 - "제공된 과거 사례는 제품명과 LOT 정보만 있어 활용할 수 없다" 같은 문장은 절대 쓰지
    마라. 쓸 내용이 없으면 그 줄을 아예 비워 두는 편이 낫다.
- id: no_metric_names
  enabled: true
  text: 내부 지표 이름과 그 수치는 문장에 쓰지 마라 - FAIL_MAD_MIN TAIL_MASS_3S_HIGH
    spread_norm fail_body_jump_ratio 같은 이름과 값은 읽는 사람이 모른다. 그 지표가 뜻하는
    현상을 우리말로 풀어 쓰되 CPK 와 수율 그리고 단위가 붙은 측정값은 그대로 써도 된다.
- id: terse_lines
  enabled: true
  text: 한 줄은 핵심 단어만 남겨 짧게 써라 - 인사말 배경설명 같은 말 반복 "~로 판단됩니다"
    류의 군더더기를 빼고 무엇을 확인할지가 바로 읽히게 하라.
deny_patterns:
- id: precedent_denial
  enabled: true
  only_with_precedents: true
  regex: 사례(는|가|은|이|도|를)?\s*(직접\s*|바로\s*|그대로\s*)*(없|확인되지\s*않|존재하지\s*않|찾을\s*수\s*없|해당\s*없|적용되지\s*않|적용할\s*수\s*없|(직접\s*)?(적용|참고)(이|은|는|하기)?\s*(어렵|불가|힘들))
  note: 사례를 버리는 문장만 제거한다. "사례와 달리 …", "사례에서 확인되지 않은 항목" 같은
    비교문은 조사가 달라 통과한다. 매칭은 공백을 무시하므로 "확인 되지 않았습니다" 도 잡힌다.
- id: no_info_excuse
  enabled: true
  only_with_precedents: false
  regex: (제품명|LOT|lot)(과|와|정보)?.{0,20}(만)\s*(있|존재|기재).{0,20}(활용|참고|판단).{0,10}(할\s*수\s*없|어렵|불가|힘들)|(구체적인?)\s*(판단\s*근거|조치\s*(내용|사항))(가|는|도|이)?\s*(없|미기재|기재되지\s*않|확인되지\s*않)
  note: '"제공된 과거 사례는 제품명과 LOT 정보만 존재할 뿐 구체적인 판단 근거 조치내용이 없어서
    활용할 수 없다" 류의 **변명 문장**을 지운다(2026-09-02 사용자 요청 — "차라리 빈칸이 낫다").
    지시문 omit_when_no_info 의 안전망이다. only_with_precedents 를 false 로 둔 이유: 선례가
    실렸는데 내용이 부실한 경우가 바로 이 문장이 나오는 상황이라, 선례 유무로 게이트하면
    정작 잡아야 할 때 안 걸린다.'
- id: meta_judgment
  enabled: true
  only_with_precedents: false
  regex: (대표|대표적인)\s*사례(로|를|가)?.{0,10}(선정|선별|고르|꼽).{0,10}(하기)?\s*(어렵|힘들|곤란|불가)|어느\s*사례(가|를)?.{0,15}(적합|유사|가까운)(한|지).{0,10}(판단|결정).{0,10}(하기)?\s*(어렵|힘들|불가)
  note: '"대표 사례로 선정하기 어렵다" 류 **메타 판단 문장**을 지운다(2026-09-02 사용자 요청).
    사례를 고르는 고민 자체는 읽는 사람에게 쓸모가 없다 — 확실하지 않으면 그런 사례가
    있었다는 사실만 남기면 된다. 지시문 no_meta_judgment 의 안전망.'
