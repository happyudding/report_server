# 룰 임계값 — 코드 밖(config), calibrate.py 가 분위수로 갱신.
# 스코프: default → product_type override → item_class override. (구체값이 우선)
# estimator 는 표준 robust 기본값(cold-start 시드). 표본 쌓이면 calibration 으로 대체.
version: ev1

default:
  cpk_warn: 1.33        # 주의 (업계 표준 시드)
  cpk_bad: 1.00         # 부적합 (절대 floor)
  outlier_fail_mad_min: 4.0       # OUTLIER 컷① 거리 — 중심에 **가장 가까운** fail 이 중앙값에서
                                  # MAD 의 몇 배 밖인가(fail_mad_min). limit 바로 밖에 붙은
                                  # fail(공정능력 문제)을 걸러내는 하한이다.
  outlier_body_z: 3.0             # OUTLIER 컷② 끊김 — 몸통 경계(|modified z|). 여기서부터
                                  # 최근접 fail 까지의 구간을 "비었나" 로 본다.
  outlier_jump_ratio_min: 0.30    # 그 구간에서 한 번에 비어 있는 최대 폭이 구간 전체의 몇
                                  # 배인가(fail_body_jump_ratio). 컷①과 AND 다.
                                  # 0.35 → 0.30 (2026-08-19 사용자 지시) — USL 쪽으로 fail
                                  # 26개가 뚝 떨어진 관찰 항목이 0.3043 으로 아슬하게 미달해
                                  # UNKNOWN 으로 떨어졌다. 낮춘 대신 꼬리 겨냥 데이터를
                                  # 더 촘촘하게 만들어(tools/eval_testdata `_kurt_plan` 의
                                  # 넓은 성분 비중 p) 두 유형의 간격을 데이터 쪽에서 벌린다.
                                  # ⚠ 거리만으로는 못 가른다: 실측에서 z 13.2 가 heavy tail,
                                  # z 8.5 가 outlier 였다(순서가 뒤집힌다). 가르는 것은 연속성 —
                                  # 꼬리가 촘촘히 이어져 limit 을 넘었으면 비율 0 쪽(HEAVY_TAIL),
                                  # 몸통과 뚝 끊겨 구간이 통째로 비면 1 쪽(OUTLIER).
                                  # 0.35 근거(v9 겨냥 세트 실측): HEAVY_TAIL 0.170~0.287 /
                                  # OUTLIER 0.940~1.000, 사용자가 outlier 로 지목한 관찰군
                                  # 8건 0.406~1.000. 양쪽 여유가 균형 잡히는 지점이다.
  outlier_fail_gap_sigma_min: 1.5 # [미사용 — 2026-08-14] 구 컷②. `fail_pass_gap_sigma` 는
                                  # |z| 라 양쪽 꼬리를 한 자에 섞어 재서, 반대쪽에 더 먼 pass 가
                                  # 하나만 있어도 음수가 됐다(끊긴 fail 덩어리가 통째로 미발화).
                                  # 지표 자체는 evidence 로 남기므로 키도 남긴다(참조 시 KeyError 방지).
  outlier_sigma: 2.5         # outlier_ratio 계산 컷 — 중앙값에서 robust σ(1.4826·MAD) 이 배수 밖이면 outlier (Iglewicz-Hoaglin modified z)
                             # 룰 판정에는 안 쓰인다(evidence 표시 + BIMODALITY 게이트용)
                             # 4.5(과검출 완화) → 2.5 로 낮췄다(2026-08-19 사용자 지시).
                             # ⚠ 이 부작용은 **실제로 터졌다**(2026-08-19 v12 검증) — 값이
                             # 낮아지자 outlier_ratio 가 커져 BIMODALITY 게이트에 걸려 이봉
                             # 항목이 판정 보류됐다(실측: σ4.5 기준 0.010 → σ2.5 기준 0.153).
                             # 그래서 **게이트는 이 값을 쓰지 않는다** — 아래
                             # `subpop_outlier_sigma` 로 분리했다. 이 키는 evidence 표시와
                             # 사용자가 보는 outlier_ratio 전용이다.
  skew_warn: 1.0            # |skew| 주의
  spec_margin_warn: 1.0     # σ 단위 여유 (작을수록 위험)
  region_fail_share_min: 0.95  # 공간 룰(E1/EDGE/CENTER/RING) 컷 — 전체 fail 중 그 영역이 차지하는
                               # **점유율**. "fail 이 죄다 거기 있다" 가 엔지니어의 판단 기준이라
                               # 밀도 비(*_fail_ratio)에서 갈아탔다(2026-08-12). 밀도 비는 영역이
                               # 좁을수록 쉽게 커지고 상한도 영역마다 달라 임계값 공유가 불가능했다.
  spot_fail_spread_max: 0.25 # SPOT_FAIL 컷 — fail 좌표가 서로 얼마나 붙어 있나
                                # (무게중심 기준 RMS 거리 / 웨이퍼 반경). 웨이퍼 전면에 고루
                                # 흩어지면 ≈0.6, 한 곳에 뭉치면 0 에 가깝다. 존으로 설명 안 되는
                                # 국부 뭉침(scratch·파티클)을 위치·모양 무관하게 잡는다.
                                # (2026-08-19 spot_cluster_spread_max 에서 개명 — 룰 개명과 함께)
  n_min: 20                 # min-n 가드 (고차모멘트 룰)
  bimodality_warn: 0.555    # Sarle's bimodality coefficient (5/9 권장값)
  edge_region_pct: 0.8      # 반경 정규화 0~1 중 상위 20% = edge
  center_region_pct: 0.3    # 반경 정규화 하위 30% = center
  mean_shift_warn: 0.30     # center_bias 이탈도(무차원 0~1) — 중심 치우침 컷
  cpk_trump_yield_floor: 0.7  # trump: cpk<cpk_bad AND yield<이값 → CRITICAL 강제
  site_cpk_delta_warn: 0.5  # site 간 cpk 편차 컷 (EQUIPMENT_SUSPECT)
  gross_yield_bad: 0.5      # yield 이 값 미만 → GROSS_FAIL
  code_edge_hit_warn: 0.05  # CODE/TRIM 레일(min/max) 포화 비율 컷 (CODE_RAIL)
  kurtosis_warn: 10.0       # excess kurtosis 컷 — heavy tail(간헐 spike) (USL_TAIL/LSL_TAIL)
                            # 2.0 → 8.0 → 10.0 으로 두 번 올렸다. kurtosis 하나로는 부족해
                            # 아래 꼬리 질량 밴드와 **AND** 로 묶는다(2026-08-13).
  heavy_tail_mass_min: 0.01 # USL_TAIL/LSL_TAIL 꼬리 질량 하한 — 중심에서 3 robust σ 밖,
                            # **그 방향** 값의 비율(tail_mass_3s_high / _low).
                            # ⚠ 2026-08-19 부터 밴드가 **방향별 질량**에 걸린다(종전엔 양쪽
                            # 합 `tail_mass_3s`). 경위는 signatures.yaml USL_TAIL 주석.
                            # 이보다 적으면 "꼬리"가 아니라 점 몇 개가 튄 것이다(실측: 질량
                            # 0.9% 인데 kurtosis 21.5 — 4제곱이라 소수 점에도 치솟는다).
  tail_side_share_min: 0.2  # USL_TAIL/LSL_TAIL — 꼬리 질량 중 **그 방향이 가진 몫**의 하한.
                            # 밴드가 방향별로 바뀐 뒤로는 보조 조건이다(밴드가 이미 방향을
                            # 가른다). 남겨 두는 이유는 **반대쪽에 점 한둘이 섞였을 뿐인
                            # 경우**를 여전히 한쪽 꼬리로 읽기 위해서다 — 두 조건은 모순
                            # 없이 공존한다(단방향 1.0 / 대칭 0.5, 둘 다 0.2 이상).
                            # 0.2 는 "완전히 한쪽" 과 "양쪽 다" 사이의 선이다: 한쪽으로만
                            # 접힌 꼬리는 1.0/0.0 이라 한 룰만, 대칭이면 0.5/0.5 라 두 룰이
                            # 모두 떠 BIDIR_TAIL 로 합쳐진다. 반대쪽에 점 한둘이 섞인 정도
                            # (0.85/0.15)는 여전히 한쪽 꼬리로 읽힌다.
  heavy_tail_mass_max: 0.07 # 꼬리 질량 상한 — 이보다 많으면 꼬리가 아니라 **몸통이 갈라진**
                            # 것이다(실측: 질량 17% 인 양자화 다봉이 kurtosis 112 로 잡혔다).
                            # 진짜 heavy tail 항목의 실측 질량은 1.55~1.89% 였다.
                            # ⚠ 2026-08-20 에 0.05 → 0.07. 방향별로 5.3~6.2% 인 **대칭 양측
                            # 꼬리**가 상한에 걸려 통째로 미발화했다(v13 UNKNOWN_000·001).
                            # 상한의 취지는 다봉 배제이고 그 실측이 10% 이상이라, 두 사례
                            # 사이인 7% 로 옮겨도 취지가 산다.
  tail_extent_min: 5.0      # 꼬리가 **몸통 σ 의 몇 배**까지 뻗어야 꼬리로 보나 — 꼬리 룰
                            # 3종(USL/LSL/BIDIR_TAIL)의 판정 자(尺). 정규분포는 2.58 이므로
                            # 5.0 은 "정규의 약 2배로 늘어졌다" 는 눈금이다.
                            # 2026-08-20 신설 — kurtosis 는 4제곱이라 점 몇 개로도 치솟아
                            # "늘어진 그림" 과 단조 대응하지 않았다(v13 실측 반례:
                            # RANDOM_027 은 kurtosis 50 인데 꼬리는 4.2σ 뿐인데도 BIDIR 오탐,
                            # UNKNOWN_001~004 는 kurtosis 6~8 이라 침묵했지만 꼬리는 7~8.7σ).
                            # v13 120항목 대입 결과 이 값에서 겨냥 누락 0·겨냥 밖 발화 0.
  spatial_fail_count_min : 10     # 공간 룰(E1/EDGE/CENTER/RING/SPOT) 최소 fail 수
                                  # 판정이 점유율(95%)로 바뀌면서 5 로는 부족해졌다 — fail 이
                                  # 6개뿐이면 무작위 배치라도 한 영역에 다 들어갈 확률이 몇 %
                                  # 나 되어(ring 은 0.55^6≈3%) 엉뚱한 항목에 공간 룰이 붙는다.
                                  # 실제로 LOW_CPK 겨냥 항목이 RING_FAIL 로 오발화했다.
  subpop_n_min : 50               # 부분집단(BIMODALITY) 판정 최소 표본 — 미만이면 판정 보류
  subpop_outlier_sigma : 4.5      # BIMODALITY 게이트 **전용** outlier 컷(2026-08-19 신설).
                                  # 게이트가 `outlier_sigma` 를 함께 쓰던 것을 떼어냈다 —
                                  # 그 값은 화면 표시용이라 사용자가 자유롭게 조절하는데,
                                  # 내리면 이봉 판정이 조용히 죽는 결합이 있었다(위 주석).
                                  # 두 값은 **목적이 다르다**: 표시용은 "튄 값을 얼마나
                                  # 보여줄까", 게이트는 "산발이라 이봉으로 못 볼 정도인가".
  subpop_outlier_ratio_max : 0.15 # 이 비율 이상 outlier 면 부분집단이 아니라 산발로 보고 판정 보류
                                  # (`subpop_outlier_sigma` 기준). 0.03 → 0.15 로 완화
                                  # (2026-08-19) — 몸통에서 멀리 떨어진 무리는 그 자체가
                                  # outlier 로도 세어지므로, 0.03 은 "떨어져 나간 이봉" 을
                                  # 구조적으로 전부 막았다(실측 관찰 항목 0.109).
  subpop_density_gap_warn : 0.3   # 분포 사이 골(density gap) 약한 컷 — multimodal/bimodal 판정용
  subpop_density_gap_strong : 0.20 # 분포 사이 골 강한 컷 — separated(완전 분리) 판정용.
                                  # 0.5 → 0.20 (2026-08-19). **이 키가 실질 판별자다** —
                                  # 값 축 구조가 거의 같은 두 항목(빈 구간 비율 0.30 vs 0.35,
                                  # 소수쪽 질량 0.0034 vs 0.0004)을 density_gap 이 0.0039 대
                                  # 0.2279 로 58배 갈라 준다. 앞은 OUTLIER, 뒤는 분리다.
  subpop_value_gap_warn : 0.3     # 값 축 최대 빈 구간(전체 범위 대비 비율) 컷 — separated 판정에 AND
  subpop_minor_mass_min : 0.0003  # 빈 구간 양쪽 중 소수쪽 최소 질량 — 극단 소수점 분리 오탐 방지.
                                  # 0.05 → 0.0003 (2026-08-19 사용자 지시로 완화). 솔직히
                                  # 적자면 **이 하한은 사실상 비활성화됐다** — 오탐을 막는
                                  # 일은 위 `subpop_density_gap_strong` 이 한다. 되돌릴 때는
                                  # 둘을 함께 봐야 한다(이 값만 올리면 "떨어져 나간 소수
                                  # 무리" 유형이 다시 통째로 막힌다).
  func_fail_pass_fix_min : 0.99   # FUNC_FAIL — pass 값이 고정값(=limit)에 붙어 있는 비율 하한.
                                  # 기능성 item 은 "0~0 에서 0 이면 통과" 처럼 limit 폭이 0
                                  # 이고 pass 는 전부 그 값이다. 모수를 **pass 만**으로 잡아
                                  # (`pass_limit_hit_ratio`) fail 수에 희석되지 않게 한다.
                                  # 1.0 이 아니라 0.99 인 것은 측정 잡음·기록 오차 몇 개를
                                  # 허용하기 위해서다.
  source_min_count : 2            # 소스 간 비교(cross_source) 최소 소스 수 — evaluate 는 미사용
  source_fail_rate_delta_warn: 0.3 # 소스 간 fail 률 격차 컷 (cross_source 전용, evaluate 미사용)
# 제품군별 override 예시 (필요 시 채움)
product_type:
  PMIC: {}
  MDDI: {}

# calibrate.recalibrate 가 읽는 분위수 스펙 — {임계값 키: {feature 컬럼, 분위수, abs 여부}}.
# 여기 없는 키(cpk_warn 등 업계표준/이론값)는 보정 대상 아님.
calibration:
  min_n: 30                 # item_class 당 최소 표본(features 행 수) — 미만이면 skip
  quantiles:
    skew_warn:          {feature: skewness,      q: 0.90, abs: true}
    # 2026-08-13 로 보정 대상이 skew_warn 하나만 남았다:
    #   · spread_norm_warn / outlier_ratio_* — 그 키를 쓰던 룰이 삭제됐다.
    #   · kurtosis_warn — 분위수 q0.90 은 관측 분포 상위 10% 지점이라 늘 낮게 내려앉아,
    #     손으로 올린 값을 item_class override 가 조용히 덮었다(2026-08-12 제외).

# item_class 별 override (TRIM|CODE|18 형태). calibrate 가 이 섹션을 재작성하므로
# 반드시 파일 마지막 섹션으로 유지할 것(위 주석/섹션은 보존됨).
item_class: {}
