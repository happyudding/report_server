# Layer2 진단 signature — feature 조합 → named 고장 모드. 선언형.
# when_all: 모두 발화해야 / when_metric: 수치 조건 / scope: 적용 범위(item_class 등)
# status_hint: 기본 심각도(bin_taxonomy 로 변조됨) / action_ko: 코멘트 골격 / evidence: 근거 템플릿
# issue_category: report_server Issue Table 버킷 YIELD|CPK (미지정 시 ETC). primary 로 노출.
# scope: (하위호환) 적용 제품군 제한 — {product_type: [...], family_product: [...]}.
#   키가 없거나 목록이 비면 전 제품 공통. 제품군별 차이는 이제 오버레이 트리로 낸다:
#   signatures/<PT>/_default.yaml → signatures/<PT>/<FAMILY>.yaml (/pe/eval 에서 편집).
#   이 파일은 그 트리가 덮기 전의 **기준값**이다.
version: ev1
signatures:
  - id: MISSING_LIMIT
    enabled: false
    when_metric: { limit_missing: ">0"}
    status_hint: MINOR
    phenomenon_ko : "LSL/USL limit 정보가 일부 누락되어 있습니다."
    action_ko: "limit 정보 부족 - LSL/USL 적용 여부와 item limit mapping 확인"
    evidence: ["limit_missing {limit_missing}"]

  - id: CONSTANT_VALUE
    enabled: false
    when_metric: { stdev: "<=0"}
    status_hint: MAJOR
    phenomenon_ko : "측정값이 단일 값에 고정되어 있습니다."
    action_ko: "측정값이 단일 값에 고정 - logging, measurement clamp, item parsing 오류 확인"
    evidence: ["stdev {stdev}"]

  # outlier 축의 단일 룰. 구 SEVERE_OUTLIER/OUTLIER_WARN 은 **삭제**했다(2026-08-13) —
  # 같은 지표(outlier_ratio)의 강약 표현이라 늘 함께 떴고, 비율로는 "limit 바로 밖에 붙은
  # fail" 과 "뚝 떨어져 나간 fail" 이 구분되지 않았다.
  # 판정축은 **거리 AND 끊김**이다. 거리 하나로는 못 가른다는 것이 실측으로 확인됐다
  # (z 13.2=heavy tail, z 8.5=outlier — 순서가 뒤집힘). 꼬리가 몸통에서 limit 까지 이어져
  # 넘어갔으면 HEAVY_TAIL, 몸통과 끊겨 따로 놀면 OUTLIER 다.
  # ⚠ 끊김 지표는 2026-08-14 에 `fail_pass_gap_sigma` → `fail_body_jump_ratio` 로 갈았다.
  # 구 지표는 |z| 라 **양쪽 꼬리를 한 자에 섞어서**, 반대쪽에 더 먼 pass 가 하나만 있어도
  # 음수가 됐다 — 사용자가 outlier 로 지목한 v9 관찰군 8건이 −3.4~+1.5 로 통째 미발화했다.
  # 새 지표는 같은 쪽에서 몸통 경계~최근접 fail 구간의 "최대 빈 폭 / 구간 폭" 만 본다.
  - id: OUTLIER
    when_metric: { fail_mad_min: ">=outlier_fail_mad_min",
                   fail_body_jump_ratio: ">=outlier_jump_ratio_min" }
    status_hint: MAJOR
    phenomenon_ko : "일부 die 가 정상 분포와 뚝 떨어진 곳에서 fail 했습니다."
    action_ko: "outlier 성 fail — 개별 die 산발 이상, contact/probe mark·retest 재현성 확인"
    evidence: ["fail_mad_min {fail_mad_min}",
               "fail_body_jump_ratio {fail_body_jump_ratio}",
               "fail_pass_gap_sigma {fail_pass_gap_sigma}",
               "fail_robust_z_max {fail_robust_z_max}", "outlier_ratio {outlier_ratio}"]

  - id: TAIL_RISK
    enabled: false
    # ⚠ 지표 교체(2026-08-12): 종전 `skewness` 는 비모수 왜도 (mean-median)/stdev 로
    # **수학적 상한이 1.0** 이라 skew_warn(1.0)을 넘을 수 없었다 = 켜도 영원히 미발화.
    # 상한이 없는 3차 모멘트 왜도(features.skewness_moment)로 바꿔 실제 판정이 되게 한다.
    when_metric: { skewness_moment: "abs>skew_warn", spec_margin_min: "<spec_margin_warn" }
    status_hint: MAJOR
    phenomenon_ko : "분포의 한쪽 꼬리가 spec에 근접해 있습니다."
    action_ko: "한쪽 꼬리가 spec 근접 — centering/방향성 trim 검토"
    evidence: ["skewness {skewness}", "nearest {nearest_spec_side}"]

  - id: EQUIPMENT_SUSPECT
    enabled: false
    when_metric: { site_cpk_delta: ">site_cpk_delta_warn" }
    status_hint: MAJOR
    phenomenon_ko : "site 간 편차가 크게 나타납니다."
    action_ko: "site 간 편차 큼 — golden unit 재측정 / handler·site correlation"
    evidence: ["site_cpk_delta {site_cpk_delta}"]

  # 공간 축은 존(zone)으로 가른다: E1(최외곽 한 줄) / EDGE(그 안쪽 바깥 밴드) / CENTER /
  # RING(중간 밴드). 영역은 서로 배타라 동시 발화가 드물고, 조치 방향이 다르다
  # (E1 = 에지 노출·척킹, EDGE = uniformity, CENTER = 증착/CMP, RING = radial uniformity).
  # **판정 기준은 점유율(share)** — "전체 fail 중 그 영역이 몇 % 를 가졌나". 종전 밀도 비
  # (*_fail_ratio)는 영역이 좁을수록 쉽게 커지고 수학적 상한도 영역마다 달라(edge≈2.8,
  # center≈11, ring≈1.8) 임계값을 공유할 수 없었고, ring 은 상한이 임계 아래라 아예
  # 발화 불가였다. 배수 지표는 evidence 로만 남긴다.
  - id: E1_FAIL
    # E1 = 각 행의 좌·우 끝 + 각 열의 위·아래 끝 die (features._e1_mask).
    # 반경 비율로는 "한 줄" 을 표현할 수 없어 줄의 양끝으로 판정한다.
    when_metric: { e1_fail_share: ">=region_fail_share_min", fail_count : ">spatial_fail_count_min" }
    status_hint: MAJOR
    phenomenon_ko : "wafer 최외곽 한 줄(E1)에 불량이 집중되어 있습니다."
    action_ko: "최외곽 1열(E1) 불량 집중 — edge exclusion/척킹·프로브 접촉, edge die 취급 기준 확인"
    evidence: ["e1_fail_share {e1_fail_share}", "e1_fail_ratio {e1_fail_ratio}", "fail_count {fail_count}"]

  - id: EDGE_FAIL
    # edge 영역은 **E1 을 제외한** 바깥 밴드다(features._spatial_features).
    when_metric: { edge_fail_share: ">=region_fail_share_min", fail_count : ">spatial_fail_count_min" }
    status_hint: MAJOR
    phenomenon_ko : "wafer edge 영역(최외곽 한 줄 제외)에 불량이 집중되어 있습니다."
    action_ko: "wafer edge 불량 집중 — uniformity/edge 보정, 모과제 동일유형 확인"
    evidence: ["edge_fail_share {edge_fail_share}", "edge_fail_ratio {edge_fail_ratio}", "fail_count {fail_count}"]

  - id: GROSS_FAIL
    enabled: false
    when_metric: { yield: "<gross_yield_bad" }
    status_hint: CRITICAL
    issue_category: YIELD
    phenomenon_ko : "불량률이 매우 높게 나타납니다."
    action_ko: "불량률 매우 높음 — primary item 기준으로 공정 설계 test 조건 점검"
    evidence: ["yield {yield}"]

  # review_metric: 표본 검수(/pe/eval 표본함)가 "임계값에서 얼마나 떨어졌나" 로 경계·중간·
  # 극단 표본을 고를 때 쓰는 기준. 평소에는 when_metric 첫 조건에서 자동으로 뽑지만,
  # BIMODALITY 는 when_metric 이 판정에 쓰이지 않는 특수분기라 여기서 따로 지목한다.
  # 판정에는 아무 영향이 없다(표본 정렬 전용).
  # (2026-08-12 개명: SUBPOP_GAP → BIMODALITY. 과거 DB 값은 마이그레이션으로 치환됐다.)
  - id: BIMODALITY
    review_metric: { density_gap: subpop_density_gap_warn }
    # 특수분기 — when_metric/evidence 는 실평가에 안 쓰인다(features.modality_v2 로 판정).
    when_metric: { bimodality_score: ">bimodality_warn" }
    status_hint: MAJOR
    phenomenon_ko : "분포가 분리되는 양상입니다."
    action_ko: "분포가 두 무리로 분리(이봉) — 로트/장비 혼입·조건 이원화 점검"
    evidence: ["bimodality_score {bimodality_score}", "density_gap {density_gap}"]

  - id: BIDIR_TAIL
    # 양쪽 margin 이 모두 1σ 미만이면 σ > spec 폭/2 — 분포가 spec 을 양방향으로 넘는다.
    # 종전엔 WIDE_DISTRIBUTION 의 극단 구간이라 억제했는데, 그 룰이 삭제되면서
    # 억제 선언도 함께 걷었다(2026-08-13 재활성화 — 양방향 초과는 조치가 다르다).
    when_metric: { spec_margin_low: "<spec_margin_warn", spec_margin_high: "<spec_margin_warn" }
    # `replaces` — 나열한 signature 가 **모두** 발화하면 그것들을 목록에서 지우고 이 룰이
    # 대신 발화한다(자기 when_metric 이 성립하지 않아도 발화한다). 양쪽 꼬리가 함께
    # 두꺼운 것은 "USL 쪽 문제 + LSL 쪽 문제" 두 건이 아니라 **분포가 양방향으로 퍼진**
    # 한 건이고, 한쪽 방향 조치로는 해결되지 않는다(2026-08-19 사용자 요청).
    replaces: [USL_TAIL, LSL_TAIL]
    status_hint: MAJOR
    phenomenon_ko : "분포가 양방향(USL·LSL 양쪽)으로 벗어나 있습니다."
    action_ko: "양방향 모두 이상(양쪽 spec 근접 또는 양쪽 꼬리 과대) — 한쪽 방향 조치로 해결되지 않음, 분포 폭·센터링을 함께 재검토"
    evidence: ["spec_margin_low {spec_margin_low}", "spec_margin_high {spec_margin_high}",
               "tail_mass_3s_low {tail_mass_3s_low}", "tail_mass_3s_high {tail_mass_3s_high}"]

  - id: LOW_CPK
    when_metric: { cpk: "<cpk_warn" }
    # cpk 는 **결과 지표**다 — "왜 낮은가"(중심 치우침/산포 과대/spec 여유 부족)를 말하는
    # 룰이 떠 있으면 primary 자리를 그쪽에 내준다(현상 5축 재편, 2026-08-12).
    #   · MEAN_SHIFT : 중심이 치우치면 가까운 쪽 margin 이 줄어 cpk 가 따라 내려간다
    #   · OUTLIER : 멀리 튄 die 가 stdev 를 부풀려 cpk 를 끌어내린다 — 조치 대상은
    #     분포 전체가 아니라 그 몇 개 die 다
    #   · BIMODALITY : 두 무리로 갈라진 분포는 합쳐 재면 산포가 넓어 cpk 가 낮게 나온다.
    #     고칠 것은 산포가 아니라 무리를 가른 원인(로트/장비 혼입)이다
    # 이 선언이 없으면 MAJOR 인 LOW_CPK 가 primary 를 독점해 원인 룰이 안 보인다.
    # (SPEC_TOO_TIGHT·WIDE_DISTRIBUTION 은 이 룰로 통합돼 2026-08-13 에 삭제됐다.)
    suppressed_by: [MEAN_SHIFT, OUTLIER, BIMODALITY]
    status_hint: MAJOR
    issue_category: CPK
    phenomenon_ko : "공정능력지수(Cpk)가 기준(1.33) 미달입니다."
    action_ko: "공정능력지수 미달(cpk<1.33) — 산포/센터링 근본 점검"
    evidence: ["cpk {cpk}"]

  - id: MEAN_SHIFT
    when_metric: { center_bias: "abs>mean_shift_warn" }
    status_hint: MINOR
    phenomenon_ko : "분포 중심이 한쪽 spec으로 치우쳐 있습니다."
    action_ko: "분포 중심이 한쪽 spec 으로 치우침 — offset/센터링 trim 검토"
    evidence: ["center_bias {center_bias}", "nearest {nearest_spec_side}"]

  - id: CENTER_FAIL
    # fail_count 가드가 없고 edge 임계 키를 빌려 쓰던 것을 share 전환과 함께 정비했다.
    when_metric: { center_fail_share: ">=region_fail_share_min", fail_count: ">spatial_fail_count_min" }
    status_hint: MAJOR
    phenomenon_ko : "wafer 중심부에 불량이 집중되어 있습니다."
    action_ko: "wafer 중심부 불량 집중 — center 공정(증착/CMP 등) 점검"
    evidence: ["center_fail_share {center_fail_share}", "center_fail_ratio {center_fail_ratio}", "fail_count {fail_count}"]

  # CODE(이산) 항목 전용 — 2026-08-13 활성화. 이산값은 "울퉁불퉁한 것" 자체가 정상이라
  # 분포 모양 룰로는 잡을 것이 없고, **레일(min/max)에 처박히는 것**이 실제 불량 신호다.
  # 나머지(꼬리·치우침·산포)는 USL_TAIL/LSL_TAIL·MEAN_SHIFT·LOW_CPK 가 그대로 받는다.
  - id: CODE_RAIL
    # code_edge_hit 는 value_type=CODE 인 item 에만 계산(그 외 None → applies=False) — CODE 전용 룰
    when_metric: { code_edge_hit: ">code_edge_hit_warn" }
    status_hint: MAJOR
    phenomenon_ko : "CODE 값이 min/max 레일에 포화되어 있습니다."
    action_ko: "CODE/TRIM 값이 레일(min/max)에 포화 — trim range/알고리즘·headroom 점검"
    # 상·하단을 갈라 보여 준다 — 조치가 다르다(하단=trim 하한 부족, 상단=상한 부족).
    evidence: ["code_edge_hit {code_edge_hit}", "rail_low_ratio {rail_low_ratio}",
               "rail_high_ratio {rail_high_ratio}"]

  # 구 HEAVY_TAIL 을 **방향으로 갈랐다**(2026-08-19 사용자 요청). 판정축은 그대로
  # **kurtosis + 꼬리 질량 밴드** 두 개인데, 질량을 방향별로 본다.
  # kurtosis 는 4제곱이라 양쪽으로 오해를 만든다:
  #   · 점 몇 개(질량 0.9%)만 튀어도 21.5 까지 올라간다 → 그건 꼬리가 아니라 outlier 다
  #   · 몸통이 갈라진 다봉(질량 17%)에서도 커진다 → 그건 꼬리가 아니라 분포가 갈라진 것
  # "평소엔 얌전한데 가끔 크게 튄다" 는 그 사이(1~5%)에 있다 — 실측에서 진짜 heavy tail
  # 항목의 3σ 밖 질량이 1.55~1.89% 였다.
  # 방향을 가르는 이유는 **조치가 다르기 때문**이다 — 상한 쪽으로 튀는 것과 하한 쪽으로
  # 처지는 것은 원인·대응이 같지 않은데 |z| 하나로 재면 구분이 사라진다.
  # ⚠ **판정 범위는 구 HEAVY_TAIL 과 똑같이 유지한다** — 밴드는 계속 `tail_mass_3s`(양쪽
  # 합)에 걸고, 방향은 그 질량이 어느 쪽에 얼마나 실렸나(`tail_side_share_*`)로만 가른다.
  # 밴드를 방향별 질량에 걸면 대칭 분포의 판정 범위가 사실상 두 배가 된다 — 총 질량 8%
  # (한쪽 4%)로 밴드 상한 5% 를 넘겨 일부러 제외했던 "몸통이 벌어진" 항목이 통째로
  # 발화한다(실측: UNKNOWN 겨냥 5건 전부가 BIDIR_TAIL 로 뒤집혔다).
  - id: USL_TAIL
    when_metric:
      kurtosis: ">kurtosis_warn"
      tail_mass_3s: [">=heavy_tail_mass_min", "<=heavy_tail_mass_max"]
      tail_side_share_high: ">=tail_side_share_min"
    # outlier 와 kurtosis 는 같은 현상(튀는 값)을 두 통계로 본 것이라 함께 뜨기 쉽다.
    # 목록에는 남기고 primary 만 양보한다.
    suppressed_by: [OUTLIER]
    status_hint: MINOR
    phenomenon_ko : "분포의 USL(상한) 쪽 꼬리가 두껍게 나타납니다."
    action_ko: "상한(USL) 쪽 꼬리가 두꺼움(상방 간헐 spike) — 위로 튀는 산발 이상치 원인(contact/노이즈) 관찰"
    evidence: ["tail_mass_3s_high {tail_mass_3s_high}", "kurtosis {kurtosis}",
               "tail_mass_3s {tail_mass_3s}", "tail_side_share_high {tail_side_share_high}"]

  - id: LSL_TAIL
    when_metric:
      kurtosis: ">kurtosis_warn"
      tail_mass_3s: [">=heavy_tail_mass_min", "<=heavy_tail_mass_max"]
      tail_side_share_low: ">=tail_side_share_min"
    suppressed_by: [OUTLIER]
    status_hint: MINOR
    phenomenon_ko : "분포의 LSL(하한) 쪽 꼬리가 두껍게 나타납니다."
    action_ko: "하한(LSL) 쪽 꼬리가 두꺼움(하방 간헐 처짐) — 아래로 처지는 산발 이상치 원인(contact/노이즈) 관찰"
    evidence: ["tail_mass_3s_low {tail_mass_3s_low}", "kurtosis {kurtosis}",
               "tail_mass_3s {tail_mass_3s}", "tail_side_share_low {tail_side_share_low}"]

  # 존(E1/EDGE/CENTER/RING)으로 설명되지 않는 **국부 뭉침**(2026-08-13 신설,
  # 2026-08-19 SPOT_CLUSTER → SPOT_FAIL 개명 — 공간 룰 이름을 `<영역>_FAIL` 로 통일).
  # 사용자 제안: "fail 의 x,y 좌표가 서로 일정 수준 이하로 몰려 있으면 몰림성으로 본다".
  # 위치·모양과 무관하다 — 웨이퍼 어디든, 동그랗든 네모나든 붙어 있으면 걸린다.
  - id: SPOT_FAIL
    when_metric: { fail_spread_norm: "<=spot_fail_spread_max",
                   fail_count: ">spatial_fail_count_min" }
    # ⚠ `suppressed_by`(primary 양보, 목록 유지)가 아니라 **목록에서 제거**다(2026-08-19
    # 사용자 결정). 중심부에 뭉친 fail 은 CENTER_FAIL 과 SPOT_FAIL 이 구조적으로 함께
    # 뜨는데(center 점유율 1.0 이면서 좌표가 붙어 있다), 사용자에게는 같은 사실을 두 번
    # 말하는 것이라 "CENTER 만 보이게" 해 달라는 요구였다. 조치도 CENTER 쪽이 분명하다.
    hidden_by: [CENTER_FAIL]
    status_hint: MAJOR
    phenomenon_ko : "불량이 wafer 의 좁은 한 곳에 뭉쳐 있습니다."
    action_ko: "국부 몰림 불량 — scratch/파티클/척킹 자국 등 국부 결함 위치 확인"
    evidence: ["fail_spread_norm {fail_spread_norm}", "fail_count {fail_count}"]


  - id: RING_FAIL
    # ring = center 와 edge 사이 중간 밴드(E1 제외). 배수 기준일 때는 이 영역이 die 의
    # 절반 이상이라 지표 상한(~1.8)이 임계 아래여서 켜도 발화할 수 없었다 — share 기준으로
    # 바꾸면서 실제로 판정 가능해졌다(2026-08-12).
    # ⚠ 점유율만 보면 **ring 밴드 안의 한 점 뭉침**이 전부 ring 으로 잡힌다(2026-08-14).
    # ring 밴드는 die 의 절반을 차지해 국부 blob 이 거기 놓일 확률이 높고, RING_FAIL 이
    # SPECIFICITY_ORDER 에서 SPOT_FAIL 보다 앞이라 primary 까지 가져갔다 — v9 의
    # SPOT 겨냥 L2~L5 가 전부 RING_FAIL 로 판정됐다. 그래서 산포 하한을 AND 로 건다:
    # ring 은 원주를 한 바퀴 돌아야 하므로 fail 이 넓게 퍼진다(v9 겨냥 실측 0.593~0.619),
    # 한 점 뭉침은 그럴 수 없다(0.094~0.211). 임계는 SPOT_FAIL 과 같은 키를 쓴다 —
    # 두 룰이 같은 선을 공유해야 "둘 다 발화" / "둘 다 미발화" 틈이 안 생긴다.
    when_metric: { ring_fail_share : ">=region_fail_share_min",
                   fail_count: ">spatial_fail_count_min",
                   fail_spread_norm: ">spot_fail_spread_max"}
    status_hint: MAJOR
    phenomenon_ko : "wafer 반경 방향으로 ring성 fail이 나타납니다."
    action_ko: "wafer 반경 방향 ring성 fail - radial uniformity 및 edge/center band 반복성 확인"
    evidence: ["ring_fail_share {ring_fail_share}", "ring_fail_ratio {ring_fail_ratio}",
               "fail_spread_norm {fail_spread_norm}", "fail_count {fail_count}"]


  # (WAFER_GRADIENT 는 2026-08-13 삭제 — 경사형 편중은 Map 화면으로 보는 것이 낫고,
  #  CLUSTER_FAIL 은 2026-08-19 삭제 — 사분면 격자는 실제 결함 모양과 무관한 인공 경계라
  #  같은 blob 이 위치만 달라져도 값이 반토막 났고(축 경계 2.20 vs 한가운데 4.00),
  #  "좁은 한 곳에 뭉쳤나" 는 SPOT_FAIL 이 위치·모양 무관하게 직접 본다.
  #  공간 축은 이제 존 4종(E1/EDGE/CENTER/RING) + SPOT_FAIL 이다.)

  # 미분류 명시 발화 — fail 이 있는데 위 룰이 하나도 안 뜬 케이스를 "설명되지 않음" 으로
  # 남긴다. 특수분기라 when_metric 을 쓰지 않는다(다른 룰의 발화 결과로 판정 —
  # signatures._evaluate_unknown). 발화 사유(왜 못 떴나)는 evidence 로 실린다:
  #   NO_STATS_PF(단위 미등록 → 통계 없음) / NO_LIMIT / LOW_SAMPLE / NO_MATCH.
  # ⚠ 이 룰이 발화한 건수는 **커버율에서 빼고 센다** — 자동 UNKNOWN 을 성과로 세면
  #   커버율이 가짜로 100% 가 된다(docs/13 §6-3). 사람이 고르는 UNKNOWN 라벨과도 별개다.
  - id: UNKNOWN
    status_hint: MONITOR
    phenomenon_ko : "fail 이 있으나 기존 룰로 설명되지 않는 상태입니다."
    action_ko: "기존 signature 로 설명되지 않는 fail — 발화 사유(단위/limit/표본/조건)를 확인하고 새 불량유형 후보로 검토"

# 보류(구현 시 추가): gradient(radial/x/y — 좌표 스케일 정규화 선행),
#   TRIM_INEFFECTIVE/RETEST_RECOVERY(family — 이력 기반, 단일 case snapshot 밖)
