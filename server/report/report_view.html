// ── web_report: wafer map + fail-bin 차트 (Plotly) ─────────────────────────
// Pass 는 초록 고정, Fail 은 등장 순서대로 팔레트(dataviz 검증 팔레트에서 초록 제외).
// 색이 넘치면 순환하지만 Fail 셀의 bin 번호 텍스트가 2차 식별자 역할을 한다.
const FAIL_PALETTE = ["#2a78d6","#eda100","#e34948","#4a3aa7","#eb6834","#e87ba4","#1baf7a"];
const PASS_COLOR = "#0ca30c";
const PLOTLY_FONT = { family: 'system-ui, -apple-system, "Segoe UI", sans-serif', size: 11, color: "#52514e" };

function webReportSheets() {
  return (DATA && DATA.web_report && DATA.web_report.sheets) ? DATA.web_report.sheets : null;
}

function makeBinColorMap(binList) {
  const map = {}; let fi = 0;
  binList.forEach(b => {
    if (b === "1") map[b] = PASS_COLOR;
    else { map[b] = FAIL_PALETTE[fi % FAIL_PALETTE.length]; fi++; }
  });
  return map;
}

// 세션 전체에서 같은 bin 은 어느 차트(Summary 미니 웨이퍼/Fail Bin 막대/Yield Pareto/
// Map Analysis 범례)에서든 같은 색이 되도록, Map Analysis 전역 범례 순서를 기준으로
// 색상 매핑을 한 번만 만든다. load() 가 DATA 갱신 시 _globalBinColors 를 초기화한다.
let _globalBinColors = null;
function globalBinColorMap() {
  if (_globalBinColors) return _globalBinColors;
  const sheets = webReportSheets() || {};
  const bins = [];
  buildGlobalBinLegend(sheets["Map Analysis"] || []).forEach(r => {
    const b = String(r.bin);
    if (!bins.includes(b)) bins.push(b);
  });
  (sheets["Fail Bin"] || []).forEach(r => {
    const b = String(r.bin);
    if (!bins.includes(b)) bins.push(b);
  });
  _globalBinColors = makeBinColorMap(bins);
  return _globalBinColors;
}

// 전역 매핑에 없던 bin(좌표 없는 die 등)도 안정적으로 이어서 색을 배정.
function binColor(bin) {
  const map = globalBinColorMap();
  const b = String(bin);
  if (!(b in map)) {
    const failCount = Object.values(map).filter(c => c !== PASS_COLOR).length;
    map[b] = (b === "1") ? PASS_COLOR : FAIL_PALETTE[failCount % FAIL_PALETTE.length];
  }
  return map[b];
}

// 소스 map dict → { trace } (die → bin 이산 heatmap). opts.showText: Fail 셀에 bin 번호.
// opts.binOrder/opts.colorMap 을 넘기면 그 값을 그대로 쓴다 (여러 맵 간 동일 bin 색상 통일용).
function waferHeatmap(m, opts) {
  opts = opts || {};
  const xMin = m.x_min, xMax = m.x_max, yMin = m.y_min, yMax = m.y_max;
  if (xMin == null || yMin == null) return null;
  const W = xMax - xMin + 1, H = yMax - yMin + 1;
  const binOrder = opts.binOrder || (m.bin_counts || []).map(bc => bc.bin);
  const colorMap = opts.colorMap || makeBinColorMap(binOrder);
  const binIndex = {}; binOrder.forEach((b, i) => { binIndex[b] = i; });
  const N = binOrder.length || 1;

  const z = Array.from({ length: H }, () => Array(W).fill(null));
  const text = Array.from({ length: H }, () => Array(W).fill(""));
  const cbin = Array.from({ length: H }, () => Array(W).fill(""));
  (m.dies || []).forEach(d => {
    const c = d.x - xMin, r = d.y - yMin;
    if (r < 0 || r >= H || c < 0 || c >= W) return;
    const idx = binIndex[d.bin] != null ? binIndex[d.bin] : 0;
    z[r][c] = idx + 0.5;
    cbin[r][c] = d.bin;
    if (d.bin !== "1") text[r][c] = d.bin;   // Fail 셀만 bin 번호, Pass 는 빈칸
  });

  const colorscale = [];
  binOrder.forEach((b, i) => {
    colorscale.push([i / N, colorMap[b]]);
    colorscale.push([(i + 1) / N, colorMap[b]]);
  });

  const trace = {
    type: "heatmap", z, zmin: 0, zmax: N,
    x0: xMin, dx: 1, y0: yMin, dy: 1,
    colorscale: colorscale.length ? colorscale : [[0, PASS_COLOR], [1, PASS_COLOR]],
    showscale: false, xgap: 0.5, ygap: 0.5, hoverongaps: false,
    customdata: cbin,
  };
  if (opts.showText) {
    trace.text = text;
    trace.texttemplate = "%{text}";
    trace.textfont = { size: opts.textSize || 8, color: "#0b0b0b" };
  }
  if (opts.mini) trace.hoverinfo = "skip";
  else trace.hovertemplate = "(%{x}, %{y})<br>Bin %{customdata}<extra></extra>";
  return { trace, colorMap, binOrder };
}

function waferLayout(m, opts) {
  opts = opts || {};
  const layout = {
    margin: opts.mini ? { l: 2, r: 2, t: 2, b: 2 } : { l: 42, r: 10, t: 8, b: 36 },
    paper_bgcolor: "#ffffff", plot_bgcolor: "#ffffff", font: PLOTLY_FONT,
    showlegend: false,
    // 셀 정사각(y축 scale 을 x 에 1:1 고정) → 웨이퍼 원형 비율 유지
    xaxis: { zeroline: false, showgrid: false, constrain: "domain",
             title: opts.mini ? "" : "X", visible: !opts.mini },
    yaxis: { zeroline: false, showgrid: false, constrain: "domain",
             scaleanchor: "x", scaleratio: 1,
             title: opts.mini ? "" : "Y", visible: !opts.mini },
  };
  return layout;
}

// 모든 소스의 bin_counts 를 합산해 하나의 공통 범례 순서/집계를 만든다.
// Pass 항상 최상단, 나머지는 전체 합산 count 내림차순.
// step 분리 맵(m.step 있음)은 Pass 칩이 step 수만큼 중복 등장하므로 Pass 는 소스별
// step 맵 중 최솟값(=마지막 step 의 Pass = 전체 Pass)만 반영한다. fail bin 은 칩당
// 한 step 맵에만 나오므로 그대로 합산. step 없는 맵(단일 STEP/legacy)은 현행 합산.
function buildGlobalBinLegend(maps) {
  const totals = {};
  const order = [];
  const stepPassBySource = {};   // source → step 맵별 Pass count 목록
  (maps || []).forEach(m => {
    let stepPass = 0;
    (m.bin_counts || []).forEach(bc => {
      if (!(bc.bin in totals)) { order.push(bc.bin); totals[bc.bin] = { count: 0, is_pass: bc.is_pass }; }
      if (bc.is_pass && m.step != null) stepPass += bc.count;
      else totals[bc.bin].count += bc.count;
    });
    if (m.step != null) {
      (stepPassBySource[m.source] = stepPassBySource[m.source] || []).push(stepPass);
    }
  });
  const passBin = order.find(b => totals[b].is_pass);
  if (passBin != null) {
    Object.values(stepPassBySource).forEach(arr => {
      totals[passBin].count += Math.min.apply(null, arr);
    });
  }
  order.sort((a, b) => {
    const pa = totals[a].is_pass, pb = totals[b].is_pass;
    if (pa !== pb) return pa ? -1 : 1;
    return totals[b].count - totals[a].count;
  });
  const grandTotal = order.reduce((s, b) => s + totals[b].count, 0);
  return order.map(b => ({
    bin: b, count: totals[b].count, is_pass: totals[b].is_pass,
    pct: grandTotal ? Math.round((totals[b].count / grandTotal) * 10000) / 100 : 0,
  }));
}

// selectedBin 이 있으면 해당 행에 is-selected 클래스 + data-bin 부여(클릭 하이라이트용).
function binLegendHtml(legendRows, colorMap, selectedBin) {
  const body = legendRows.map(bc => {
    const cls = [bc.is_pass ? "is-pass" : "", bc.bin === selectedBin ? "is-selected" : ""]
      .filter(Boolean).join(" ");
    return `<tr${cls ? ` class="${cls}"` : ""} data-bin="${esc(bc.bin)}">` +
      `<td><span class="bin-swatch" style="background:${colorMap[bc.bin]}"></span>${esc(bc.bin)}${bc.is_pass ? " (Pass)" : ""}</td>` +
      `<td>${bc.count}</td><td>${bc.pct}%</td></tr>`;
  }).join("");
  return `<table class="bin-table"><thead><tr><th>Bin</th><th>Count</th><th>비율</th></tr></thead>` +
         `<tbody>${body}</tbody></table>`;
}

// 선택된 bin만 원색 유지, 나머지는 회색으로 dim 처리한 colorMap 생성(Map Analysis 하이라이트).
const MAP_BIN_DIM_COLOR = "#d9d9d9";
function dimColorMap(colorMap, binOrder, selectedBin) {
  if (!selectedBin) return colorMap;
  const out = {};
  binOrder.forEach(b => { out[b] = (b === selectedBin) ? colorMap[b] : MAP_BIN_DIM_COLOR; });
  return out;
}

// source 가 여럿이면 가로 2칸 그리드로 wafer map 을 나열하고, bin 범례는 전체 소스
// 합산 기준으로 한 번만 만들어 오른쪽에 고정(sticky)한다. 모든 맵이 같은 색상 매핑을 쓴다.
let mapGridCols = 2;   // Map Analysis 가로 칸수(1=확대, 2~3=한눈에). 숫자 입력으로 조절, 세션 내 유지.
// 칸수가 적을수록 맵을 크게(높게) 보여준다 — scaleanchor 정사각 맵이라 폭·높이 함께 커져야 확대됨.
function mapPlotHeight() { return Math.min(720, Math.max(220, Math.round(720 / mapGridCols))); }

function renderMapAnalysis() {
  const panel = document.getElementById("panel-map-analysis");
  const sheets = webReportSheets();
  const maps = sheets ? sheets["Map Analysis"] : null;
  if (!window.Plotly || !maps || !maps.length) {
    emptyPanel(panel, "Map Analysis 데이터 없음"); return;
  }
  panel.classList.add("viz-root");

  const legendRows = buildGlobalBinLegend(maps);
  const binOrder = legendRows.map(r => r.bin);
  const colorMap = globalBinColorMap();   // 세션 전체 공통 색상 (Summary/Fail Bin 과 일치)
  let mapBinFilter = null;   // 범례 클릭으로 선택된 bin (재클릭 시 해제)

  const plotH = mapPlotHeight();
  // 선택 좌표 색 Legend (Map Analysis 전용). 각 항목: 색 스와치 + 좌표 + 제거(×).
  const selLegend = mapSelChips.length
    ? `<div class="mapsel-legend"><span class="mapsel-leg-title">선택 좌표</span>` +
      mapSelChips.map(c =>
        `<span class="mapsel-leg-item"><span class="mapsel-sw" style="background:${c.color}"></span>` +
        `X ${esc(c.xpos)}·Y ${esc(c.ypos)} <span class="mapsel-src">${esc(c.source)}</span>` +
        `<button type="button" class="mapsel-del" data-key="${esc(c.key)}" title="제거">×</button></span>`
      ).join("") +
      `<button type="button" id="mapSelClearBtn" class="btn-sm mapsel-clear">전체 해제</button></div>`
    : "";
  panel.innerHTML =
    `<div class="map-toolbar">가로 칸수 ` +
    `<input type="number" id="mapGridColsInput" min="1" max="8" step="1" value="${mapGridCols}">` +
    `<span class="map-toolbar-hint">칸 (1 = 확대해서 보기 · 2~3 = 한꺼번에 보기)</span>` +
    `<span class="mapsel-sep"></span>` +
    `<button type="button" id="mapSelBtn" class="btn-sm">좌표 선택</button>` +
    `</div>` +
    `<div id="mapSelSearchBox" class="mapsel-search" style="display:none">` +
      `<div class="common-search">` +
        `<input id="mapSelSerial" type="text" class="mapsel-field" placeholder="SERIAL (부분일치)" />` +
        `<input id="mapSelXpos" type="text" class="mapsel-field" placeholder="XPOS (정확)" />` +
        `<input id="mapSelYpos" type="text" class="mapsel-field" placeholder="YPOS (정확)" />` +
        `<button id="mapSelSearchBtn" class="btn-sm">검색</button>` +
        `<button id="mapSelAddSelected" class="btn-sm primary" disabled>선택 추가</button>` +
        `<button id="mapSelCollapseBtn" class="btn-sm" title="검색 패널 접기">접기 ▲</button>` +
        `<span id="mapSelInfo" class="muted"></span>` +
      `</div>` +
      `<div class="common-list mapsel-list" id="mapSelList"><div class="placeholder">SERIAL(부분) / XPOS·YPOS(정확) 칸에 입력해 검색하고, 체크한 좌표를 '선택 추가' 로 한 번에 추가하세요 (여러 개 가능).</div></div>` +
    `</div>` +
    selLegend +
    `<div class="wafer-analysis-layout">` +
    `<div class="wafer-grid" style="grid-template-columns:repeat(${mapGridCols}, minmax(0, 1fr))">` +
    maps.map((m, i) =>
      `<div class="wafer-card">
        <div class="wafer-card-title">${esc(m.source)}${m.step ? " — " + esc(m.step) : ""} — ${esc(String(m.total))} dies</div>
        <div id="wafer-full-${i}" style="width:100%;height:${plotH}px;"></div>
      </div>`).join("") +
    `</div>` +
    `<div class="wafer-legend-fixed">` +
    `<div class="wafer-legend-title">Bin Legend</div>` +
    `<div class="wafer-legend-body"></div>` +
    `</div>` +
    `</div>`;

  panel.querySelector("#mapGridColsInput").addEventListener("change", (e) => {
    const v = parseInt(e.target.value, 10);
    mapGridCols = isNaN(v) ? 2 : Math.min(8, Math.max(1, v));
    renderMapAnalysis();   // 칸수 변경 → 그리드·플롯 높이 다시 그림(범례 선택은 초기화됨)
  });

  // 좌표 선택 툴바 — 검색 패널 토글 + 검색 + 해제.
  panel.querySelector("#mapSelBtn").addEventListener("click", mapSelToggleSearch);
  const _mapSelClearBtn = panel.querySelector("#mapSelClearBtn");
  if (_mapSelClearBtn) _mapSelClearBtn.addEventListener("click", mapSelClear);
  const _doMapSelSearch = () => mapSelSearch();
  panel.querySelector("#mapSelSearchBtn").addEventListener("click", _doMapSelSearch);
  panel.querySelector("#mapSelAddSelected").addEventListener("click", mapSelAddSelected);
  panel.querySelector("#mapSelCollapseBtn").addEventListener("click", () => {
    const box = document.getElementById("mapSelSearchBox");
    if (box) box.style.display = "none";   // 검색 패널 접기(명시적 닫기).
  });
  ["mapSelSerial", "mapSelXpos", "mapSelYpos"].forEach(id => {
    const el = panel.querySelector("#" + id);
    if (el) el.addEventListener("keydown", e => { if (e.key === "Enter") _doMapSelSearch(); });
  });
  panel.querySelectorAll(".mapsel-del").forEach(b => b.addEventListener("click", () => mapSelRemove(b.dataset.key)));

  // colorMap 만 dim 처리해서 다시 넘기면 되므로 waferHeatmap 구조는 그대로 재사용.
  function redraw() {
    const activeColorMap = dimColorMap(colorMap, binOrder, mapBinFilter);
    maps.forEach((m, i) => {
      const built = waferHeatmap(m, { showText: true, textSize: 8, colorMap: activeColorMap, binOrder });
      if (!built) return;
      const traces = [built.trace];
      // 이 source 의 map 에 속한 선택 좌표들을 각자 색의 빈 원으로 강조.
      mapSelChips.forEach(c => {
        if (c.source === m.source && c.x != null && c.y != null) {
          traces.push({ type: "scatter", mode: "markers", x: [c.x], y: [c.y],
            marker: { symbol: "circle-open", size: 20, color: c.color, line: { width: 3, color: c.color } },
            hovertemplate: `X ${c.x} · Y ${c.y}<extra></extra>` });
        }
      });
      Plotly.react(`wafer-full-${i}`, traces, waferLayout(m, {}),
        { responsive: true, displayModeBar: false });
    });
    const legendBody = panel.querySelector(".wafer-legend-body");
    legendBody.innerHTML = binLegendHtml(legendRows, colorMap, mapBinFilter);
    legendBody.querySelectorAll("tbody tr[data-bin]").forEach(tr => {
      tr.addEventListener("click", () => {
        const bin = tr.dataset.bin;
        mapBinFilter = (mapBinFilter === bin) ? null : bin;
        redraw();
      });
    });
  }
  redraw();
}

// ── Compare 모드 (같은 Wafer 2~3 source 비교) ─────────────────────────────────
const COMPARE_SRC_PALETTE = ["#e11d48", "#2563eb", "#d97706"];
const CMP_COMMON_COLOR = "#cbd5e1";   // 공통 fail(모든 source fail) — 배경 처리
const CMP_MIXED_COLOR = "#7c3aed";    // 일부(2개↑ 그러나 전체는 아님) source fail

function _cmpNum(v, digits) {
  if (v === null || v === undefined || v === "") return "–";
  if (typeof v !== "number") return esc(String(v));
  return Number.isInteger(v) ? String(v) : v.toFixed(digits == null ? 3 : digits);
}
function _cmpDeltaCell(v, digits) {
  if (v === null || v === undefined || v === "") return `<td class="num">–</td>`;
  const cls = v > 0 ? "cmp-up" : (v < 0 ? "cmp-down" : "");
  const s = v > 0 ? "+" + _cmpNum(v, digits) : _cmpNum(v, digits);
  return `<td class="num ${cls}">${s}</td>`;
}

// 공통성 Map: 공통 fail 은 회색 배경, 비공통 fail 은 "어느 source 에서만 fail 했는지"
// 색으로 구분(before/after). waferHeatmap 을 그대로 재사용하되 bin 값을 분류 라벨로 넣는다.
function drawCompareCommonMap(cm, sources) {
  const div = document.getElementById("cmp-common-map");
  if (!div || !window.Plotly) return;
  if (cm.x_min == null) { div.innerHTML = '<div class="placeholder">좌표 데이터 없음</div>'; return; }
  const srcColor = {};
  sources.forEach((s, i) => { srcColor[s] = COMPARE_SRC_PALETTE[i % COMPARE_SRC_PALETTE.length]; });

  const dies = [];
  (cm.common_fail || []).forEach(d => dies.push({ x: d.x, y: d.y, bin: "공통Fail" }));
  (cm.unique_fail || []).forEach(d => {
    const fs = d.fail_sources || [];
    dies.push({ x: d.x, y: d.y, bin: fs.length === 1 ? fs[0] : "혼합" });
  });
  const binOrder = ["공통Fail", ...sources, "혼합"];
  const colorMap = { "공통Fail": CMP_COMMON_COLOR, "혼합": CMP_MIXED_COLOR };
  sources.forEach(s => { colorMap[s] = srcColor[s]; });

  const m = { x_min: cm.x_min, x_max: cm.x_max, y_min: cm.y_min, y_max: cm.y_max, dies };
  const built = waferHeatmap(m, { colorMap, binOrder });
  if (!built) { div.innerHTML = '<div class="placeholder">Fail die 없음</div>'; return; }
  Plotly.newPlot(div, [built.trace], waferLayout(m, {}), { responsive: true, displayModeBar: false });

  // 범례
  const legend = document.getElementById("cmp-common-legend");
  if (legend) {
    const rows = [`<span class="cmp-lg"><i style="background:${CMP_COMMON_COLOR}"></i>공통 Fail</span>`]
      .concat(sources.map(s => `<span class="cmp-lg"><i style="background:${srcColor[s]}"></i>${esc(s)} 에서만 Fail</span>`))
      .concat([`<span class="cmp-lg"><i style="background:${CMP_MIXED_COLOR}"></i>혼합(일부만)</span>`]);
    legend.innerHTML = rows.join("");
  }
}

// 동일 좌표 Bin before→after 전이표 (Map 바로 밑). null/빈 rows 면 생략.
function compareBinTransitionHtml(bt) {
  if (!bt || !bt.rows || !bt.rows.length) return "";
  const c = bt.counts || {};
  const binLabel = b => (String(b) === "1") ? `${esc(String(b))} (Pass)` : esc(String(b));
  const head = `<thead><tr>
      <th>Before Bin<div class="gl-sub">${esc(bt.before_source || "")}</div></th>
      <th>After Bin<div class="gl-sub">${esc(bt.after_source || "")}</div></th>
      <th class="num">Count</th></tr></thead>`;
  const body = bt.rows.map(r =>
    `<tr class="${r.changed ? "bt-changed" : ""}"><td>${binLabel(r.before_bin)}</td>` +
    `<td>${binLabel(r.after_bin)}</td><td class="num">${_cmpNum(r.count)}</td></tr>`).join("");
  const summary = `<div class="compare-summary">
      <span class="cmp-chip">공통 die ${c.common_dies || 0}</span>
      <span class="cmp-chip cmp-unique">Bin 변경 ${c.changed || 0}</span>
      <span class="cmp-chip">Pass→Fail ${c.pass_to_fail || 0}</span>
      <span class="cmp-chip">Fail→Pass ${c.fail_to_pass || 0}</span></div>`;
  return summary + `<div class="sheet-wrap"><table class="sheet-table compare-table">${head}<tbody>${body}</tbody></table></div>`;
}

// 공통 항목 산포(avg/stdev/cpk) before/after 병기 + delta. |Δcpk| 큰 순(백엔드 정렬).
function compareDistShiftHtml(rows, sources) {
  if (!rows || !rows.length) return '<div class="placeholder">공통 항목 없음</div>';
  const after = sources[0] || "", before = sources[1] || "";   // payload sources = [after, before]
  const gapCell = v => {
    if (v === null || v === undefined) return `<td class="num">–</td>`;
    return `<td class="num${Math.abs(v) >= 10 ? " gl-gap-red" : ""}">${_cmpNum(v, 2)}</td>`;
  };
  const head = `<thead>
      <tr><th rowspan="2">Item</th><th rowspan="2">Unit</th>
          <th colspan="3">After — ${esc(after)}</th><th colspan="3">Before — ${esc(before)}</th>
          <th class="num" rowspan="2">ΔAvg</th><th class="num" rowspan="2">ΔStdev</th>
          <th class="num" rowspan="2">ΔCpk</th><th class="num" rowspan="2">평균 gap %</th></tr>
      <tr><th class="num">Avg</th><th class="num">Stdev</th><th class="num">Cpk</th>
          <th class="num">Avg</th><th class="num">Stdev</th><th class="num">Cpk</th></tr></thead>`;
  const body = rows.map(r => {
    const a = r.after || {}, b = r.before || {};
    return `<tr><td>${esc(r.subject)}</td><td>${esc(r.units || "")}</td>` +
      `<td class="num">${_cmpNum(a.average)}</td><td class="num">${_cmpNum(a.stdev)}</td><td class="num">${_cmpNum(a.cpk)}</td>` +
      `<td class="num">${_cmpNum(b.average)}</td><td class="num">${_cmpNum(b.stdev)}</td><td class="num">${_cmpNum(b.cpk)}</td>` +
      _cmpDeltaCell(r.delta_average) + _cmpDeltaCell(r.delta_stdev) + _cmpDeltaCell(r.delta_cpk) +
      gapCell(r.mean_gap_pct) + `</tr>`;
  }).join("");
  return `<div class="sheet-wrap"><table class="sheet-table compare-table">${head}<tbody>${body}</tbody></table></div>`;
}

function compareBinTableHtml(binDelta, sources) {
  if (!binDelta || !binDelta.length) return '<div class="placeholder">Bin 데이터 없음</div>';
  const srcHead = sources.map(s => `<th colspan="2">${esc(s)}</th>`).join("");
  const subHead = sources.map(() => `<th class="num">Cnt</th><th class="num">%</th>`).join("");
  const head = `<thead>
      <tr><th rowspan="2">Bin</th>${srcHead}
          <th class="num" rowspan="2">Δ%</th><th class="num" rowspan="2">편차%</th></tr>
      <tr>${subHead}</tr></thead>`;
  const body = binDelta.map(r => {
    const perSrc = {};
    (r.sources || []).forEach(s => { perSrc[s.source] = s; });
    const cells = sources.map(s => {
      const d = perSrc[s] || {};
      return `<td class="num">${_cmpNum(d.count)}</td><td class="num">${_cmpNum(d.pct, 2)}</td>`;
    }).join("");
    const binLabel = r.is_pass ? `${esc(String(r.bin))} (Pass)` : esc(String(r.bin));
    return `<tr class="${r.is_pass ? "cmp-pass-row" : ""}"><td>${binLabel}</td>${cells}` +
      _cmpDeltaCell(r.delta_pct, 2) +
      `<td class="num">${_cmpNum(r.range_pct, 2)}</td></tr>`;
  }).join("");
  return `<div class="sheet-wrap"><table class="sheet-table compare-table">${head}<tbody>${body}</tbody></table></div>`;
}

// ── goodlog(테스트 프로그램 diff) — Honey Compare Mode 이식. after/before 두 파일의
//    항목명/limit 일치 여부(True 초록/False 빨강) + reference die 값 gap%(|gap|≥10% 빨강).
//    이상(항목 추가/제거·limit 변경)만 상단 요약 + 항상 표시하고, 나머지 정상 행은
//    git-diff 식으로 접어둔다(초기 접힘, '전체 펼치기' 토글). ──
// 행 분류: added(after 만)·removed(before 만)·limitchg(양쪽 존재 & limit 불일치)·normal.
function goodlogRowType(r) {
  const aHas = (r.after_item_name || "") !== "";
  const bHas = (r.before_item_name || "") !== "";
  if (aHas && !bHas) return "added";
  if (!aHas && bHas) return "removed";
  if (aHas && bHas && (r.compare_lolimit === false || r.compare_hilimit === false)) return "limitchg";
  return "normal";
}

function goodlogSectionHtml(gl) {
  if (!gl) return "";   // legacy(3-source 등) 세션 — 섹션 생략
  const title = `<h3 class="compare-h">테스트 프로그램 비교 (goodlog) — ` +
    `after: ${esc(gl.after_source || "")} / before: ${esc(gl.before_source || "")}</h3>`;
  if (gl.identical) {
    return title + `<div class="gl-identical">두 파일의 테스트 프로그램(항목/limit)이 동일합니다.</div>`;
  }
  // 결측(None)은 공백 — Honey goodlog 시트의 _disp 관례와 동일 (한쪽만 존재하는 행 포함).
  const glNum = v => (v === null || v === undefined) ? "" : _cmpNum(v);
  const boolCell = v => v === true ? `<td class="gl-true">True</td>`
    : (v === false ? `<td class="gl-false">False</td>` : `<td></td>`);
  const gapCell = v => {
    if (v === null || v === undefined) return `<td class="num"></td>`;
    return `<td class="num${Math.abs(v) >= 10 ? " gl-gap-red" : ""}">${_cmpNum(v, 2)}</td>`;
  };
  const COLS = 15;
  const rows = gl.rows || [];
  const types = rows.map(goodlogRowType);

  // ── 이상 요약(항목 추가/제거·limit 변경) ──
  const added = [], removed = [], limitchg = [];
  rows.forEach((r, i) => {
    if (types[i] === "added") added.push(r.after_item_name);
    else if (types[i] === "removed") removed.push(r.before_item_name);
    else if (types[i] === "limitchg") limitchg.push(r.after_item_name || r.before_item_name);
  });
  const abnCount = added.length + removed.length + limitchg.length;
  const nameChips = (arr, cls) => arr.map(n => `<span class="gl-ab-item ${cls}">${esc(n)}</span>`).join("");
  let summary;
  if (abnCount === 0) {
    summary = `<div class="gl-ab-summary gl-ab-none">항목/Limit 차이 없음 — 값 gap 만 존재
      <button class="btn-sm gl-expand-all" type="button">전체 펼치기</button></div>`;
  } else {
    summary = `<div class="gl-ab-summary">
      <div class="gl-ab-head">이상 항목
        <span class="cmp-chip gl-chip-add">추가 ${added.length}</span>
        <span class="cmp-chip gl-chip-del">제거 ${removed.length}</span>
        <span class="cmp-chip gl-chip-lim">Limit 변경 ${limitchg.length}</span>
        <button class="btn-sm gl-expand-all" type="button">전체 펼치기</button></div>
      <div class="gl-ab-items">${nameChips(added, "gl-add")}${nameChips(removed, "gl-del")}${nameChips(limitchg, "gl-lim")}</div>
    </div>`;
  }

  const head = `<thead>
      <tr><th colspan="5">After — ${esc(gl.after_source || "")}</th><th colspan="3">Compare</th>
          <th rowspan="2">Comment</th><th class="num" rowspan="2">Gap %</th>
          <th colspan="5">Before — ${esc(gl.before_source || "")}</th></tr>
      <tr><th>Item</th><th class="num">LoLim</th><th class="num">HiLim</th><th>Unit</th><th class="num">Value</th>
          <th>Item</th><th>LoLim</th><th>HiLim</th>
          <th>Item</th><th class="num">LoLim</th><th class="num">HiLim</th><th>Unit</th><th class="num">Value</th></tr></thead>`;
  const rowHtml = (r, t) =>
    `<tr class="gl-row gl-${t}"><td>${esc(r.after_item_name || "")}</td><td class="num">${glNum(r.after_lolimit)}</td>` +
    `<td class="num">${glNum(r.after_hilimit)}</td><td>${esc(r.after_unit || "")}</td>` +
    `<td class="num">${esc(r.after_value || "")}</td>` +
    boolCell(r.compare_item_name) + boolCell(r.compare_lolimit) + boolCell(r.compare_hilimit) +
    `<td>${esc(r.comment || "")}</td>` + gapCell(r.gap) +
    `<td>${esc(r.before_item_name || "")}</td><td class="num">${glNum(r.before_lolimit)}</td>` +
    `<td class="num">${glNum(r.before_hilimit)}</td><td>${esc(r.before_unit || "")}</td>` +
    `<td class="num">${esc(r.before_value || "")}</td></tr>`;

  // ── git-diff 식 세그먼트: normal run 은 접힘 tbody, 이상 행은 항상 노출 ──
  const parts = [];
  let i = 0;
  while (i < rows.length) {
    if (types[i] === "normal") {
      let j = i; const buf = [];
      while (j < rows.length && types[j] === "normal") { buf.push(rowHtml(rows[j], "normal")); j++; }
      parts.push(
        `<tbody class="gl-fold-summary"><tr class="gl-fold-toggle"><td colspan="${COLS}">` +
        `<span class="gl-fold-arrow">▸</span> 변화 없음 ${buf.length}개</td></tr></tbody>` +
        `<tbody class="gl-fold" hidden>${buf.join("")}</tbody>`);
      i = j;
    } else {
      let j = i; const buf = [];
      while (j < rows.length && types[j] !== "normal") { buf.push(rowHtml(rows[j], types[j])); j++; }
      parts.push(`<tbody>${buf.join("")}</tbody>`);
      i = j;
    }
  }
  return title + summary +
    `<div class="sheet-wrap"><table class="sheet-table compare-table goodlog-table">${head}${parts.join("")}</table></div>`;
}

// goodlog 접기/펼치기 바인딩 — renderCompare 가 innerHTML 갱신 후 호출(직접 바인딩).
function bindGoodlogFolding(panel) {
  const setLabel = (toggleRow, shown) => {
    const arrow = toggleRow.querySelector(".gl-fold-arrow");
    if (arrow) arrow.textContent = shown ? "▾" : "▸";
  };
  panel.querySelectorAll(".gl-fold-toggle").forEach(row => {
    row.addEventListener("click", () => {
      const fold = row.closest(".gl-fold-summary").nextElementSibling;
      if (!fold || !fold.classList.contains("gl-fold")) return;
      const show = fold.hasAttribute("hidden");
      if (show) fold.removeAttribute("hidden"); else fold.setAttribute("hidden", "");
      setLabel(row, show);
    });
  });
  const btn = panel.querySelector(".gl-expand-all");
  if (btn) btn.addEventListener("click", () => {
    const anyHidden = !!panel.querySelector(".gl-fold[hidden]");
    panel.querySelectorAll(".gl-fold").forEach(f => {
      if (anyHidden) f.removeAttribute("hidden"); else f.setAttribute("hidden", "");
    });
    panel.querySelectorAll(".gl-fold-toggle").forEach(r => setLabel(r, anyHidden));
    btn.textContent = anyHidden ? "전체 접기" : "전체 펼치기";
  });
}

// ── Map 좌표 선택 (Map Analysis 탭에서 chip 여러 개 골라 각기 다른 색으로 Map 강조 +
//    Distribution 전 항목 CDF 에 반영). 선택 상태는 전역 — Map redraw 와 Distribution 이 함께 참조. ──
const MAPSEL_PALETTE = ["#e11d48", "#2563eb", "#059669", "#d97706", "#7c3aed",
  "#0891b2", "#db2777", "#65a30d", "#ea580c", "#4f46e5"];
let mapSelChips = [];   // [{serial,shot,dut,xpos,ypos,bin,source,x,y, key, color, items:{subject:{value,cum_pct}}}]
let _mapSelLastQ = { serial: "", xpos: "", ypos: "" };  // 직전 검색 필드값 — 추가 후 검색 패널 재실행에 재사용(연속 추가 편의).
let _mapSelResults = []; // 직전 검색 결과 chip 배열 — 체크박스 index → chip 매핑용.

function mapSelChipKey(c) { return `${c.source || ""}|${c.serial || ""}|${c.xpos || ""}|${c.ypos || ""}`; }
function mapSelReassignColors() { mapSelChips.forEach((c, i) => { c.color = MAPSEL_PALETTE[i % MAPSEL_PALETTE.length]; }); }

// 한 항목(subject)에 대해 선택된 모든 chip 의 위치 마커(각 chip 색). 단일 선택일 때만
// 포커싱용 점선 크로스헤어 추가(다중은 점 색으로 구분). 해당 항목 값 없는 chip 은 건너뜀.
function chipMarkersFor(subject) {
  if (!mapSelChips.length) return null;
  const traces = [], shapes = [];
  mapSelChips.forEach(c => {
    const it = c.items[subject];
    if (!it || typeof it.value !== "number" || typeof it.cum_pct !== "number") return;
    traces.push({ type: "scatter", mode: "markers", x: [it.value], y: [it.cum_pct],
      marker: { color: c.color, size: 7, line: { width: 1, color: "#fff" } },
      cliponaxis: false, hoverinfo: "skip", showlegend: false });
  });
  if (!traces.length) return null;
  if (mapSelChips.length === 1) {   // 단일: 해당 색 점선 크로스헤어로 포커싱
    const c = mapSelChips[0], it = c.items[subject];
    if (it && typeof it.value === "number" && typeof it.cum_pct === "number") {
      shapes.push({ type: "line", x0: it.value, x1: it.value, yref: "paper", y0: 0, y1: 1,
        line: { color: c.color, width: 1, dash: "dot" } });
      shapes.push({ type: "line", xref: "paper", x0: 0, x1: 1, y0: it.cum_pct, y1: it.cum_pct,
        line: { color: c.color, width: 1, dash: "dot" } });
    }
  }
  return { traces, shapes };
}

// 선택 변경 후 Distribution 소비처(보이는 갤러리 카드 + 열려있는 Item_detail) 재렌더.
function applyChipToDistribution() {
  document.querySelectorAll('#panel-distribution .distg-card').forEach(c => { c.dataset.rendered = ""; });
  document.querySelectorAll('#panel-distribution .distg-card[data-visible="1"]').forEach(distQueueRender);

// Map Analysis 툴바 '좌표 선택' → 검색 패널 토글.
function mapSelToggleSearch() {

// 좌표 검색(serial 부분일치 / xpos·ypos 정확일치, AND) → 후보 목록(체크박스). 여러 개 체크 후 '선택 추가' 로 일괄 추가.
// 행 아무 곳이나 클릭하면 그 행 체크박스가 토글되고, 헤더 체크박스로 전체 선택 가능.
function mapSelSearch() {
  const list = document.getElementById("mapSelList");
  const info = document.getElementById("mapSelInfo");
  if (!list) return;
  const serial = ((document.getElementById("mapSelSerial") || {}).value || "").trim();
  const xpos = ((document.getElementById("mapSelXpos") || {}).value || "").trim();
  const ypos = ((document.getElementById("mapSelYpos") || {}).value || "").trim();
  _mapSelLastQ = { serial, xpos, ypos };
  list.innerHTML = `<div class="placeholder">검색 중...</div>`;
  const p = new URLSearchParams({ serial, xpos, ypos });
  const url = `/pe/report/session/${SESSION_ID}/web_report/commonality/chips?${p.toString()}`;
  fetch(url, { cache: "no-cache" })
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(j => {
      const chips = j.chips || [];
      _mapSelResults = chips;
      if (info) info.textContent = `${chips.length}개${j.truncated ? "+ (잘림)" : ""}`;
      if (!chips.length) { list.innerHTML = `<div class="placeholder">일치하는 chip 없음</div>`; updateMapSelAddBtn(); return; }
      const head = `<table class="sheet-table common-chip-table"><thead><tr>
        <th class="common-chk-col"><input type="checkbox" id="mapSelChkAll" title="전체 선택"></th>
        <th>SERIAL</th><th>XPOS</th><th>YPOS</th><th>DUT</th><th>BIN</th></tr></thead><tbody>`;
      const body = chips.map((c, i) => {
        const added = mapSelChips.some(x => x.key === mapSelChipKey(c));
        return `<tr class="common-chip-row${added ? " common-chip-added" : ""}" data-i="${i}">
          <td class="common-chk-col"><input type="checkbox" class="mapsel-chk" data-i="${i}"${added ? " checked disabled" : ""}></td>
          <td>${esc(c.serial)}</td><td class="num">${esc(c.xpos)}</td><td class="num">${esc(c.ypos)}</td>
          <td class="num">${esc(c.dut)}</td><td class="num">${esc(c.bin)}</td></tr>`;
      }).join("");
      list.innerHTML = head + body + `</tbody></table>`;
      list.querySelectorAll(".common-chip-row").forEach(tr => {
        tr.addEventListener("click", e => {
          const chk = tr.querySelector(".mapsel-chk");
          if (!chk || chk.disabled) return;
          if (e.target !== chk) chk.checked = !chk.checked;   // 체크박스 자체 클릭은 기본동작
          updateMapSelAddBtn();
        });
      });
      const chkAll = list.querySelector("#mapSelChkAll");
      if (chkAll) chkAll.addEventListener("click", e => {
        e.stopPropagation();
        list.querySelectorAll(".mapsel-chk:not(:disabled)").forEach(c => { c.checked = chkAll.checked; });
        updateMapSelAddBtn();
      });
      updateMapSelAddBtn();
    })
    .catch(e => { list.innerHTML = `<div class="placeholder">검색 실패: ${esc(e.message)}</div>`; updateMapSelAddBtn(); });
}

// 체크된 개수로 '선택 추가' 버튼 라벨/활성 상태 갱신.
function updateMapSelAddBtn() {
  const btn = document.getElementById("mapSelAddSelected");
  if (!btn) return;
  const list = document.getElementById("mapSelList");
  const n = list ? list.querySelectorAll(".mapsel-chk:not(:disabled):checked").length : 0;
  btn.textContent = n ? `선택 ${n}개 추가` : "선택 추가";
  btn.disabled = !n;
}

// chip 좌표 → /chip 로 항목별 값·누적% 조회. 이미 선택돼 있으면 null 반환(중복 무시).
function mapSelFetchChip(chip) {
  const key = mapSelChipKey(chip);
  if (mapSelChips.some(c => c.key === key)) return Promise.resolve(null);
  const p = new URLSearchParams({ serial: chip.serial || "", xpos: chip.xpos || "",
    ypos: chip.ypos || "", source: chip.source || "" });
  return fetch(`/pe/report/session/${SESSION_ID}/web_report/commonality/chip?${p.toString()}`, { cache: "no-cache" })
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(j => {
      const items = {};
      (j.items || []).forEach(it => { items[it.subject] = { value: it.value, cum_pct: it.cum_pct }; });
      return { ...(j.chip || {}), key, items };
    });
}

// 체크된 좌표를 일괄 추가 → 색 재배정 → Map 강조 + Distribution 재렌더 → 검색결과 갱신.
async function mapSelAddSelected() {
  const list = document.getElementById("mapSelList");
  if (!list) return;
  const chips = Array.from(list.querySelectorAll(".mapsel-chk:not(:disabled):checked"))
    .map(chk => _mapSelResults[Number(chk.dataset.i)]).filter(Boolean);
  if (!chips.length) { showToast("선택된 좌표가 없습니다"); return; }
  const btn = document.getElementById("mapSelAddSelected");
  if (btn) { btn.disabled = true; btn.textContent = "추가 중..."; }
  let added = 0, failed = 0;
  for (const chip of chips) {
    try { const obj = await mapSelFetchChip(chip); if (obj) { mapSelChips.push(obj); added++; } }
    catch (e) { failed++; }
  }
  mapSelReassignColors();
  renderMapAnalysis();          // Map 강조 반영(전역 상태 읽어 redraw)
  applyChipToDistribution();    // Distribution 카드+상세 재렌더
  showToast(`${added}개 추가${failed ? ` · ${failed}개 실패` : ""}`);
  // renderMapAnalysis 가 패널을 다시 그려 검색 패널이 닫히므로, 다시 열고 재검색(추가된 항목 disabled 반영).
  const box = document.getElementById("mapSelSearchBox");
  if (box) {
    box.style.display = "";
    const q = _mapSelLastQ || {};
    const setVal = (id, v) => { const el = document.getElementById(id); if (el) el.value = v || ""; };
    setVal("mapSelSerial", q.serial); setVal("mapSelXpos", q.xpos); setVal("mapSelYpos", q.ypos);
    mapSelSearch();
  }
}

function mapSelRemove(key) {
  mapSelChips = mapSelChips.filter(c => c.key !== key);
  mapSelReassignColors();
  renderMapAnalysis();
  applyChipToDistribution();
}

function mapSelClear() {
  mapSelChips = [];
  renderMapAnalysis();
  applyChipToDistribution();
}

// Major Fail Bin: 전체 average(모든 소스 fail rate 평균) 기준 상위 N개(고정).
const MAJOR_FAIL_TOP_N = 5;
// 전체 Yield(세로 병합 셀) + 소스별 Yield + 전체 average 기준 Major Fail Bins Top5 를 한 테이블로.
// 데이터: yield_summary(전체·소스별 yield%) + sheets["Yield"](행별 avg).
function majorFailBinsTableHtml() {
  const ov = DATA.web_report && DATA.web_report.yield_summary;
  if (!ov) return `<div class="placeholder">Yield 데이터 없음</div>`;
  const sheets = webReportSheets() || {};
  const fmtPct = v => (typeof v === "number" ? v.toFixed(2) : v);

  // 소스별 Yield (높은 순).
  const sources = (Array.isArray(ov.by_source) ? ov.by_source.slice() : [])
    .sort((a, b) => (Number(b.yield_pct) || 0) - (Number(a.yield_pct) || 0));

  // 전체 average 기준 Major Fail Bin Top N (Pass 제외).
  const majors = (sheets["Yield"] || [])
    .filter(r => String(r.bin) !== "1")
    .map(r => ({ item: r.Item, bin: r.bin, rate: Number(r.avg) || 0 }))
    .sort((a, b) => b.rate - a.rate)
    .slice(0, MAJOR_FAIL_TOP_N);

  const rowCount = Math.max(sources.length, majors.length, 1);
  let body = "";
  for (let i = 0; i < rowCount; i++) {
    const cells = [];
    if (i === 0) cells.push(`<td class="mfb-yield" rowspan="${rowCount}">${esc(fmtPct(ov.yield_pct))}%</td>`);
    const s = sources[i];
    cells.push(s
      ? `<td class="mfb-src">${esc(s.source)}</td><td class="mfb-syield">${esc(fmtPct(s.yield_pct))}%</td>`
      : `<td class="mfb-src"></td><td class="mfb-syield"></td>`);
    const m = majors[i];
    cells.push(m
      ? `<td class="mfb-item">${esc(m.item)}</td><td class="mfb-bin">${esc(m.bin)}</td>` +
        `<td class="mfb-rate">${esc(fmtPct(m.rate))}%</td>`
      : `<td class="mfb-item"></td><td class="mfb-bin"></td><td class="mfb-rate"></td>`);
    body += `<tr>${cells.join("")}</tr>`;
  }

  return `<div class="mfb-wrap"><table class="mfb-table">
    <thead>
      <tr><th rowspan="2">전체 Yield</th><th colspan="2">Source 별 Yield</th><th colspan="3">Major Fail Bins</th></tr>
      <tr><th>Source</th><th>Yield</th><th>Item</th><th>Bin</th><th>Fail Rate</th></tr>
    </thead>
    <tbody>${body}</tbody>
  </table></div>`;
}

let summaryJumpBound = false;
function renderWebSummary() {
  const panel = document.getElementById("panel-summary");
  const sheets = webReportSheets();
  if (!window.Plotly || !sheets) { emptyPanel(panel, "Summary 데이터 없음"); return; }
  // Summary 카드(Yield) 클릭 → 해당 탭 버튼 클릭 재사용(1회 위임 바인딩).
  if (!summaryJumpBound) {
    panel.addEventListener("click", (e) => {
      const card = e.target.closest(".summary-jump");
      if (!card) return;
      const tabBtn = document.querySelector(`.tab[data-tab="${card.dataset.jump}"]`);
      if (tabBtn) tabBtn.click();
    });
    summaryJumpBound = true;
  }
  panel.classList.add("viz-root");
  const engr = (DATA.web_report && DATA.web_report.summary_engr) || {};
  // Engr Comment 편집은 다른 web_report 편집과 동일하게 업로더(edit 모드)만 허용한다.
  // view 모드에서는 읽기전용으로 렌더하고 저장 바인딩을 하지 않는다(저장 요청은 서버가 거부).
  const engrEditable = (MODE === "edit");
  panel.innerHTML =
    `<div class="summary-section-card summary-jump" data-jump="yield" title="Yield 탭으로 이동">` +
    `<div class="section-title">Yield <span class="summary-jump-hint">▸ 탭 이동</span></div>` + majorFailBinsTableHtml() +
    `</div>` +
    `<div class="summary-section-card">` +
    `<div class="section-title">Engr Comment</div>` +
    `<div class="engr-comment-grid">` +
    ENGR_COMMENT_FIELDS.map(f =>
      `<label class="engr-comment-label" for="engr-${f.key}">${f.label}</label>` +
      `<textarea id="engr-${f.key}" class="engr-comment-input" data-engr="${f.key}" rows="4"${engrEditable ? "" : " readonly"}>${esc(engr[f.key] || "")}</textarea>`).join("") +
    `</div></div>`;
  if (engrEditable) bindEngrComment(panel);
}

// Summary 탭 Engr Comment 3칸 정의 (manifest.summary_engr 키와 일치).
const ENGR_COMMENT_FIELDS = [
  { key: "yield", label: "Yield" },
  { key: "cpk", label: "CPK" },
  { key: "etc", label: "ETC" },
];

// textarea 값이 바뀌면(blur 시 change 발생) 변경분을 manifest.summary_engr 로 저장.
function bindEngrComment(panel) {
  panel.querySelectorAll("textarea[data-engr]").forEach(ta => {
    ta.addEventListener("change", () => { saveSummaryEngr().catch(() => {}); });
  });
}

// Summary Engr Comment 저장: 3칸 현재값을 원본(DATA.web_report.summary_engr)과 비교해
// 변경 있을 때만 POST. 성공 시 DATA 에 반영해 재렌더 시 값 유지.
async function saveSummaryEngr() {
  if (MODE !== "edit") return;   // 뷰 모드는 저장 시도 안 함(서버도 업로더만 허용).
  const panel = document.getElementById("panel-summary");
  if (!panel || !DATA || !DATA.web_report) return;
  const cur = DATA.web_report.summary_engr || {};
  const values = {};
  let changed = false;
  panel.querySelectorAll("textarea[data-engr]").forEach(ta => {
    const k = ta.dataset.engr;
    const v = (ta.value || "").trim();
    values[k] = v;
    if (v !== String(cur[k] || "").trim()) changed = true;
  });
  if (!changed) return;
  const res = await fetch(`/pe/report/session/${SESSION_ID}/web_report/summary/engr`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken() },
    body: JSON.stringify({ values }),
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) { alert(j.error || `Engr Comment 저장 실패 (HTTP ${res.status})`); throw new Error("engr save failed"); }
  DATA.web_report.summary_engr = j.summary_engr || values;
}

// 막대 위(바깥)엔 count 를 bold 로, 막대 안엔 yield_pct(%) 를 채워 넣는다.
function failBinCountText(rows) { return rows.map(r => `<b>${r.count}</b>`); }
function failBinPctAnnotations(x, rows) {
  return rows.map((r, i) => ({
    x: x[i], y: (r.count || 0) / 2,
    text: (typeof r.yield_pct === "number") ? `${r.yield_pct.toFixed(2)}%` : "",
    showarrow: false, xanchor: "center", yanchor: "middle",
    font: { color: "#fff", size: 13, family: PLOTLY_FONT.family },
  })).filter(a => a.text);
}
// x축(Bin·항목명) 라벨 가독성 공통 설정.
const FAILBIN_XAXIS = { tickangle: -30, automargin: true, tickfont: { size: 12, color: "#333" } };

function renderFailBinBar(divId, rows) {
  const el = document.getElementById(divId);
  if (!el) return;
  if (!window.Plotly || !rows || !rows.length) {
    el.innerHTML = `<div class="placeholder">Fail bin 데이터 없음</div>`; return;
  }
  const x = rows.map(r => r.item ? `Bin ${r.bin} : ${r.item}` : `Bin ${r.bin}`);
  const y = rows.map(r => r.count);
  const trace = {
    type: "bar", x, y, marker: { color: rows.map(r => binColor(r.bin)) },
    text: failBinCountText(rows), textposition: "outside", textfont: { size: 12, color: "#222" },
    customdata: rows.map(r => r.bin),
    hovertemplate: "%{x}<br>Bin %{customdata}<br>Count %{y}<extra></extra>",
  };
  const layout = {
    margin: { l: 44, r: 10, t: 14, b: 96 },
    paper_bgcolor: "#ffffff", plot_bgcolor: "#ffffff", font: PLOTLY_FONT,
    xaxis: FAILBIN_XAXIS,
    yaxis: { title: "Fail count", gridcolor: "#e1e0d9", zeroline: false },
    showlegend: false, bargap: 0.35, annotations: failBinPctAnnotations(x, rows),
  };
  Plotly.newPlot(divId, [trace], layout, { responsive: true, displayModeBar: false });
}

// Fail Bin 소스 합산 막대 차트: x축 라벨 "Bin xx : 항목명".

  }

    hovertemplate: "%{x}<br>Count %{y}<extra></extra>",

// fail_bin_ranking 은 (bin, TNO) 조합별 행이라, 같은 Bin 의 여러 TNO 를 하나로 합쳐
// Bin 단위로 집계한다(x축이 TNO 가 아니라 Bin 기준이 되도록). count·fail rate 는 합산,
// item 은 그 Bin 의 most-fail TNO(입력이 count 내림차순이라 첫 행) Item 명을 대표로 유지해
// 라벨이 "Bin xx : 항목명" 이 되게 한다. count 내림차순 정렬.
function aggregateFailBinsByBin(rows) {
  const map = new Map();
  (rows || []).forEach(r => {
    const key = String(r.bin);
    if (!map.has(key)) map.set(key, { bin: r.bin, item: r.item || "", count: 0, yield_pct: 0 });
    const g = map.get(key);
    g.count += (Number(r.count) || 0);
    g.yield_pct += (Number(r.yield_pct) || 0);
  });
  return [...map.values()].sort((a, b) => b.count - a.count);
}

// Yield 패널 하단에 Fail bin 차트 2개 추가: 상위 10 (Fail Yield ≥ 0.5%) + 나머지 전부.
// 나머지 차트는 상위 10에 못 든 ≥0.5% bin 과 0.5% 미만 bin 을 전부 합쳐 하나로 표시.
function renderYieldFailBins() {
  const sheets = webReportSheets();
  if (!window.Plotly || !sheets) return;
  const failBins = aggregateFailBinsByBin(sheets["Fail Bin"] || []);   // Bin 단위 집계
  if (!failBins.length) return;
  const panel = document.getElementById("panel-yield");
  panel.classList.add("viz-root");
  const major = failBins.filter(r => (r.yield_pct || 0) >= 0.5);
  // ≥0.5% bin 이 하나도 없으면 폴백으로 count 상위 10개를 첫 차트에 표시.
  const majorTop = major.length ? major.slice(0, 10) : failBins.slice(0, 10);
  const rest = failBins.filter(r => !majorTop.includes(r));   // 상위 10 제외 나머지 전부

  const chartHtml = (id, h) =>
    `<div class="chart-box chart-box-wide"><div id="${id}" style="width:100%;height:${h}px;"></div></div>`;
  const wrap = document.createElement("div");
  wrap.innerHTML =
    `<div class="section-title small">Fail Bin — 상위 10 (Fail Yield ≥ 0.5%)</div>` +
    chartHtml("yield-pareto", 360) +
    (rest.length
      ? `<div class="section-title small">Fail Bin — 나머지</div>` + chartHtml("yield-rest", 340)
      : "");
  panel.appendChild(wrap);
  renderPareto("yield-pareto", majorTop);
  if (rest.length) renderFailBinBar("yield-rest", rest);
}

// ── CPK ──────────────────────────────────────────────────────────────────
const CPK_COLUMNS = ["subject", "lower_limit", "upper_limit", "units", "source",
  "n", "min", "median", "max", "average", "stdev", "cpl", "cpu", "cp", "cpk"];
const CPK_NUMERIC = new Set(["lower_limit", "upper_limit", "n", "min", "median", "max",
  "average", "stdev", "cpl", "cpu", "cp", "cpk"]);
const CPK_WARN_THRESHOLD = 1.33;
const CPK_PAGE_SIZE = 50;     // 페이지당 표시 행 수

let cpkBasisBin1 = false;     // false=전체(모든 die) 기준, true=Bin1(양품) 기준 통계 표시
let cpkShowLowOnly = true;    // 기본값: CPK < 1.33 항목만 오름차순(최악 우선) 정렬해 보여줌
let cpkSearchTerm = "";       // subject/source 검색어 (실시간 필터)
let cpkPage = 1;              // 현재 페이지 (1-base)
let cpkPanelBound = false;    // panel-cpk 페이저 클릭 위임 1회 바인딩 플래그
let cpkTargetMode = false;    // "Limit 계산" 토글 — 켜지면 체크박스 열 + 목표 Cpk 역산 컨트롤 노출
let cpkSelected = new Set();  // 선택된 행 키 (`${subject}||${source}`)
let cpkTargetVal = 1.33;      // 목표 Cpk 입력값
let cpkMarginPct = 0;         // 역산 Margin(%) — 0/1/5/10. 각 한계값을 (1-margin) 으로 나눠 확대
let cpkTargetResults = new Map(); // 역산 결과: 행 키 → {lo, hi}

function cpkRowKey(r) { return `${r.subject}||${r.source}`; }

// bin 필터에 따라 값이 달라지는 통계 컬럼(전체 ↔ Bin1). limit/units/subject/source 는 무관.
const CPK_STAT_FIELDS = ["n", "min", "median", "max", "average", "stdev", "cp", "cpl", "cpu", "cpk"];
// 활성 기준(전체/Bin1)의 통계값을 base 컬럼 이름에 채운 표시용 복사본을 만든다.
// Bin1 기준이면 *_bin1 값을 base 이름으로 옮겨, 이후 필터·정렬·렌더·역산이 모두 base 이름만
// 써도 활성 기준으로 동작하게 한다.
function cpkBasisRow(r) {
  if (!cpkBasisBin1) return r;
  const o = { ...r };
  for (const f of CPK_STAT_FIELDS) o[f] = r[f + "_bin1"];
  return o;
}

function cpkFmt(x) { return Number(x.toFixed(4)); }

// 목표 Cpk 로부터 선택 행의 규격 한계 역산 (평균 중심 대칭: avg ± 3·Cpk·stdev).
function cpkComputeTargets() {
  cpkTargetResults.clear();
  const cpk = parseFloat(cpkTargetVal);
  if (!(cpk > 0)) return;
  const sheets = webReportSheets();
  const byKey = new Map((sheets ? (sheets["CPK"] || []) : []).map(r => [cpkRowKey(r), r]));
  for (const key of cpkSelected) {
    const row0 = byKey.get(key);
    if (!row0) continue;
    const row = cpkBasisRow(row0);   // 활성 기준(전체/Bin1)의 average/stdev 로 역산
    const avg = parseFloat(row.average), sd = parseFloat(row.stdev);
    if (isNaN(avg) || isNaN(sd) || sd <= 0) continue;   // 계산 불가 → 빈칸
    const d = 3 * cpk * sd;
    let lo = avg - d, hi = avg + d;
    // Margin: 최종 규격이 (역산값)/(1-margin) 가 되도록 각 한계값을 확대.
    // 예) 역산 -0.95~0.95 에 5% → -1~1 (0.95/0.95 = 1.0).
    const m = (parseFloat(cpkMarginPct) || 0) / 100;
    if (m > 0 && m < 1) { lo = lo / (1 - m); hi = hi / (1 - m); }
    cpkTargetResults.set(key, { lo: cpkFmt(lo), hi: cpkFmt(hi) });
  }
}

function updateCpkSelInfo() {
  const el = document.getElementById("cpkSelInfo");
  if (el) el.textContent = `선택 ${cpkSelected.size}개`;
}

function cpkFilterRows(rows) {
  const term = cpkSearchTerm.trim().toLowerCase();
  if (!term) return rows;
  return rows.filter(r => String(r.subject || "").toLowerCase().includes(term)
    || String(r.source || "").toLowerCase().includes(term));
}

// 표시용 행 목록 생성. 각 행에 _key(원본 subject/source 기준 안정 키)를 붙여 접힌 행도
// 개별 선택이 가능하게 한다. (select-all 계산과 cpkTableHtml 이 공용으로 사용)
function cpkBodyRows(rows) {
  rows = rows.map(cpkBasisRow);   // 활성 기준(전체/Bin1)으로 통계 컬럼 정규화
  if (cpkShowLowOnly) {
    // cpk 값 내림/오름차순이 아니라 같은 Item name 끼리 묶여 보이도록 항목명(subject) 순으로 정렬.
    return rows
      .filter(r => { const v = parseFloat(r.cpk); return !isNaN(v) && v < CPK_WARN_THRESHOLD; })
      .slice()
      .sort((a, b) => String(a.subject).localeCompare(String(b.subject)))
      .map(r => ({ ...r, _key: cpkRowKey(r) }));
  }
  // subject 가 연속으로 반복되면(같은 item, source 별 행) 2번째 행부터 subject/limit/units 를 비움
  let prevSubject = null;
  return rows.map(r => {
    const row = { ...r, _key: cpkRowKey(r) };
    if (r.subject === prevSubject) {
      row.subject = ""; row.lower_limit = ""; row.upper_limit = ""; row.units = "";
    } else {
      prevSubject = r.subject;
    }
    return row;
  });
}

function cpkTableHtml(rows) {
  const bodyRows = cpkBodyRows(rows);

  if (!bodyRows.length) {
    const msg = cpkSearchTerm.trim() ? "검색 결과 없음"
      : `CPK &lt; ${CPK_WARN_THRESHOLD} 항목 없음`;
    return `<div class="placeholder">${msg}</div>`;
  }

  // 50개씩 페이지네이션 (subject/source 컬럼 좌측 고정, cpk 컬럼 우측 고정, 헤더 상단 고정).
  const totalPages = Math.max(1, Math.ceil(bodyRows.length / CPK_PAGE_SIZE));
  if (cpkPage > totalPages) cpkPage = totalPages;
  if (cpkPage < 1) cpkPage = 1;
  const start = (cpkPage - 1) * CPK_PAGE_SIZE;
  const pageRows = bodyRows.slice(start, start + CPK_PAGE_SIZE);

  // Limit 계산 모드면 표시 컬럼에 target 열 2개를 upper_limit 뒤에 삽입, 체크박스 열은 별도 선두.
  const displayCols = CPK_COLUMNS.slice();
  if (cpkTargetMode) {
    const i = displayCols.indexOf("upper_limit");
    displayCols.splice(i + 1, 0, "target_lolimit", "target_hilimit");
  }
  const allSelected = cpkTargetMode && bodyRows.every(r => cpkSelected.has(r._key));
  const selTh = cpkTargetMode
    ? `<th class="cpk-sel-col"><input type="checkbox" id="cpkSelAll"${allSelected ? " checked" : ""}></th>` : "";
  const head = "<thead><tr>" + selTh + displayCols.map(c => `<th>${esc(c)}</th>`).join("") + "</tr></thead>";
  const body = "<tbody>" + pageRows.map(row => {
    const cpkVal = parseFloat(row.cpk);
    const isWarn = !isNaN(cpkVal) && cpkVal < CPK_WARN_THRESHOLD;
    const res = cpkTargetResults.get(row._key);
    const selTd = cpkTargetMode
      ? `<td class="cpk-sel-col"><input type="checkbox" class="cpk-row-chk" data-key="${esc(row._key)}"${cpkSelected.has(row._key) ? " checked" : ""}></td>` : "";
    const tds = displayCols.map(c => {
      if (c === "target_lolimit" || c === "target_hilimit") {
        const tv = res ? (c === "target_lolimit" ? res.lo : res.hi) : "";
        const cls = tv === "" ? "st-empty" : "st-num cpk-target";
        return `<td class="${cls}">${esc(String(tv))}</td>`;
      }
      const v = row[c];
      const txt = (v === null || v === undefined) ? "" : String(v);
      const cls = [];
      if (txt === "") cls.push("st-empty");
      else if (CPK_NUMERIC.has(c)) cls.push("st-num");
      if (c === "cpk" && isWarn) cls.push("cpk-warn");
      // subject 셀(비어있지 않을 때) → Item_detail 링크
      const inner = (c === "subject" && txt !== "")
        ? `<span class="item-detail-link" data-subject="${esc(txt)}">${esc(txt)}</span>` : esc(txt);
      return `<td${cls.length ? ` class="${cls.join(" ")}"` : ""}>${inner}</td>`;
    }).join("");
    return `<tr>${selTd}${tds}</tr>`;
  }).join("") + "</tbody>";

  const table = `<div class="sheet-wrap cpk-sheet"><table class="sheet-table cpk-sheet${cpkTargetMode ? " has-select" : ""}">${head}${body}</table></div>`;
  const end = Math.min(start + CPK_PAGE_SIZE, bodyRows.length);
  const pager = `<div class="cpk-pager">` +
    `<button type="button" class="btn-sm" data-cpk-page="${cpkPage - 1}"${cpkPage <= 1 ? " disabled" : ""}>‹ 이전</button>` +
    `<span class="cpk-pager-info">${start + 1}–${end} / ${bodyRows.length} (page ${cpkPage}/${totalPages})</span>` +
    `<button type="button" class="btn-sm" data-cpk-page="${cpkPage + 1}"${cpkPage >= totalPages ? " disabled" : ""}>다음 ›</button>` +
    `</div>`;
  return table + pager;
}

// 검색어/토글 상태만 바뀌었을 때 테이블만 다시 그림 (검색창 포커스 유지).
function renderCpkTable() {
  const sheets = webReportSheets();
  const rows = sheets ? (sheets["CPK"] || []) : [];
  const host = document.getElementById("cpkTableHost");
  if (host) host.innerHTML = cpkTableHtml(cpkFilterRows(rows));
}

function renderCpk() {
  const panel = document.getElementById("panel-cpk");
  const sheets = webReportSheets();
  const rows = sheets ? (sheets["CPK"] || []) : [];
  if (!rows.length) { emptyPanel(panel, "CPK 데이터 없음"); return; }

  const targetBar = cpkTargetMode
    ? `<div class="cpk-target-bar">목표 Cpk ` +
      `<input type="number" id="cpkTargetInput" min="0" step="0.01" value="${esc(String(cpkTargetVal))}">` +
      `<span class="cpk-margin-wrap">Margin ` +
      `<select id="cpkMarginSel">` +
      [0, 1, 5, 10].map(v =>
        `<option value="${v}"${Number(cpkMarginPct) === v ? " selected" : ""}>${v === 0 ? "없음" : v + "%"}</option>`).join("") +
      `</select></span>` +
      `<button type="button" id="cpkCalcBtn" class="btn-sm">역산</button>` +
      `<button type="button" id="cpkCopyBtn" class="btn-sm">역산값 복사</button>` +
      `<button type="button" id="cpkClearSelBtn" class="btn-sm">선택 해제</button>` +
      `<span id="cpkSelInfo" class="cpk-pager-info"></span></div>`
    : "";
  panel.innerHTML =

function buildDistDataFromCompact(payload) {

function ensureDistData() {

  _distContentHash = ch;
  distDataReady = false;
  distDataPromise = fetch(`/pe/report/session/${SESSION_ID}/web_report/distribution`, { cache: "no-cache" })
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })

// ── 미니셀 표시용 다운샘플 (ECDF 전제: x 오름차순, y 누적%) ────────────────────
// 단순 stride 는 꼬리 outlier·고질량 계단(Δy 큰 점)·x축 고립점을 눈멀고 떨어뜨려
// 누적산포를 왜곡한다. 규칙: (1) 첫/마지막 + 누적% 상·하위 7% 전량 보존,
// (2) Δy ≥ 0.2%p(질량 큰 고유값)·x갭 ≥ range×1%(갭 양끝) 강제 보존,
// (3) 나머지만 잔여 budget 으로 균등 stride. 강제 보존 때문에 총점이 1000 을
// 다소 넘는 것은 허용(소프트 상한) — 왜곡 없음이 우선.
function distDownsampleForDisplay(xs, ys) {
  const n = xs.length;
  if (n <= DIST.DOWNSAMPLE) return { xs, ys };
  const keep = new Uint8Array(n);
  keep[0] = 1; keep[n - 1] = 1;
  const range = xs[n - 1] - xs[0];
  const gap = range > 0 ? range * 0.01 : Infinity;
  for (let i = 0; i < n; i++) {
    if (ys[i] <= 7 || ys[i] >= 93) { keep[i] = 1; continue; }             // 꼬리 전량
    if (ys[i] - ys[i - 1] >= 0.2) keep[i] = 1;                            // Δy 질량
    if (xs[i] - xs[i - 1] >= gap) { keep[i] = 1; keep[i - 1] = 1; }       // x갭 양끝
  }
  let kept = 0;
  for (let i = 0; i < n; i++) kept += keep[i];
  const rest = [];
  for (let i = 0; i < n; i++) if (!keep[i]) rest.push(i);
  // 꼬리에 고유값이 많아 budget 이 소진되어도 중간 몸통이 비지 않도록 최소 200점 보장
  const budget = Math.max(DIST.DOWNSAMPLE - kept, 200);
  if (budget > 0 && rest.length > budget) {
    const st = Math.ceil(rest.length / budget);
    for (let j = 0; j < rest.length; j += st) keep[rest[j]] = 1;
  } else if (budget > 0) {
    for (const i of rest) keep[i] = 1;
  }
  const ox = [], oy = [];
  for (let i = 0; i < n; i++) if (keep[i]) { ox.push(xs[i]); oy.push(ys[i]); }
  return { xs: ox, ys: oy };
}

// ── 갤러리 미니셀(정적 CDF, distDataCache 재사용, 표시용만 1000점 다운샘플) ─────
function distRenderGalleryCell(cell) {
  if (cell.dataset.rendered === "1") return;
  // 분포 데이터 도착 전 — rendered 플래그를 세우지 않고 리턴해야 도착 후
  // refreshDistConsumers 의 재큐잉으로 다시 그려진다 (빈 차트 고정 방지).
  if (!distDataReady) return;
  const subject = cell.dataset.subject;
  const status = cell.dataset.status || "ok";
  const info = distDataCache[subject];
  const plot = cell.querySelector(".distg-plot");
  if (!plot || typeof Plotly === "undefined") return;
  const lo = info ? info.lower_limit : null;
  const hi = info ? info.upper_limit : null;
  const traces = [];
  if (info) Object.keys(info.bySource).forEach(src => {
    // 미니셀 표시용만 다운샘플(통계·상세는 전체점) — 꼬리/계단/갭 보존 규칙 적용
    const ds = distDownsampleForDisplay(info.bySource[src].xs, info.bySource[src].ys);
    traces.push({ type: "scatter", mode: "markers", cliponaxis: false, x: ds.xs, y: ds.ys,
      marker: { color: distColorFor(src), size: 3 } });
  });
  // 선택 좌표(Map Analysis)가 있으면 이 항목 위치를 점+빨간 점선으로 오버레이.
  let shapes = distSpecShapes(lo, hi, false).concat(beforeLimitShapes(subject));
  const cm = chipMarkersFor(subject);
  if (cm) { traces.push(...cm.traces); shapes = shapes.concat(cm.shapes); }
  const layout = { ...DIST_PLOT_BG, plot_bgcolor: DIST_STATUS_BG[status] || "#FFFFFF",
    xaxis: { showgrid: true, gridcolor: "#eee", zeroline: false, ticks: "outside",
      tickcolor: "#bbb", tickfont: { size: 9 } },
    yaxis: { range: [0, 100], ticksuffix: "%", showgrid: true, gridcolor: "#eee",
      zeroline: false, tickfont: { size: 9 } },
    shapes, annotations: distSpecAnnos(lo, hi, true),
    margin: { l: 34, r: 10, t: 8, b: 20 }, showlegend: false };
  Plotly.newPlot(plot, traces, layout, DIST_CFG_STATIC);
  cell.dataset.rendered = "1";
}
function distPurgeGalleryCell(cell) {
  if (cell.dataset.rendered !== "1") return;
  const plot = cell.querySelector(".distg-plot");
  try { if (plot && window.Plotly) Plotly.purge(plot); } catch (e) {}
  cell.dataset.rendered = "";
}

// ── rAF 분할 렌더(프레임당 PER_FRAME 개) ──────────────────────────────────────
function distQueueRender(cell) {
  if (cell.dataset.rendered === "1" || distRenderQueue.includes(cell)) return;
  distRenderQueue.push(cell);
  if (!distRafScheduled) { distRafScheduled = true; requestAnimationFrame(distFlushRender); }
}
function distFlushRender() {
  distRafScheduled = false;
  let n = 0;
  while (distRenderQueue.length && n < DIST.PER_FRAME) {
    const cell = distRenderQueue.shift();
    if (cell.isConnected && cell.dataset.visible === "1") { distRenderGalleryCell(cell); n++; }
  }
  if (distRenderQueue.length) { distRafScheduled = true; requestAnimationFrame(distFlushRender); }
}

// ── 툴바 + 갤러리 ─────────────────────────────────────────────────────────────
function distToolbarHtml() {
  // cpk<1.33 / Fail Only 독립 토글(둘 다 켜면 교집합). 둘 다 끄면 전체.
  const seg = (on, key, label) => `<button class="distseg${on ? " active" : ""}" data-seg="${key}">${esc(label)}</button>`;
  // 검색창 오른쪽 범례: 소스별 색상(distColorMap) 을 스와치로 표시(갤러리 미니셀 색과 동일).
  const sources = (DATA.web_report && DATA.web_report.sources) || [];
  const legend = sources.length ? `<div class="dist-legend">` + sources.map(s =>
    `<span class="dist-leg-item"><span class="dist-leg-sw" style="background:${distColorFor(s.name)}"></span>${esc(s.name)}</span>`
  ).join("") + `</div>` : "";
  // 검색 체크박스로 고른 항목이 있으면 개수+해제 버튼을 세그먼트 옆에 표시.
  const selChip = distSelected.size
    ? `<button class="distseg dist-sel-clear" data-seg="clearsel" title="선택 해제">선택 ${distSelected.size}개 ✕</button>` : "";
  return `<div class="dist-toolbar">
    <div class="distseg-group">${seg(distCpkOnly, "cpk", "cpk < 1.33")}${seg(distFailOnly, "fail", "Fail Only")}${selChip}</div>
    <div class="dist-search-wrap">
      <input id="distSearch" class="dist-search" type="text" autocomplete="off" placeholder="항목 검색 (체크로 선택)">
      <div id="distSuggest" class="dist-suggest" style="display:none"></div>
    </div>
    ${legend}
    <span class="dist-count"></span>
  </div>`;
}
function distUpdateCount() {
  const el = document.querySelector("#panel-distribution .dist-count");
  if (el) el.textContent = `${distFiltered.length} 개`;
}
function distRenderGallery() {
  const panel = document.getElementById("panel-distribution");
  distView = "gallery";
  if (distGalleryObserver) { try { distGalleryObserver.disconnect(); } catch (e) {} distGalleryObserver = null; }
  distRenderQueue = []; distRafScheduled = false;
  // 검색 체크박스 선택이 있으면 그 항목들만(세그먼트 무시), 없으면 세그먼트 필터.
  distFiltered = distSelected.size
    ? distIndex.filter(r => distSelected.has(r.subject))
    : distApplySegment(distIndex);
  const cards = distFiltered.map(r => {
    const cpk = r.cpk == null ? "-" : r.cpk;
    const lim = `${distFmtLimit(r.lower_limit)} ~ ${distFmtLimit(r.upper_limit)}${r.units ? " " + r.units : ""}`;
    return `<div class="distg-card" data-subject="${esc(r.subject)}" data-status="${esc(r.status)}" style="background:${DIST_STATUS_BG[r.status] || "#fff"}">
      <div class="distg-head">
        <div class="distg-line1">
          <span class="distg-tno">${esc(r.test_num || "")}</span>
          <span class="distg-name" title="${esc(r.subject)}">${esc(r.subject)}</span>
        </div>
        <div class="distg-line2">
          <span class="distg-lim">${esc(lim)}</span>
          <span class="distg-cpk">cpk ${esc(cpk)}</span>
        </div>
      </div>
      <div class="distg-plot"></div>
    </div>`;
  }).join("");
  panel.innerHTML = distToolbarHtml() +
    (distFiltered.length ? `<div class="distg-grid">${cards}</div>`
                         : `<div class="placeholder">해당 조건의 항목이 없습니다</div>`);
  distUpdateCount();
  if (typeof Plotly === "undefined" || typeof IntersectionObserver === "undefined") return;
  distGalleryObserver = new IntersectionObserver(entries => {
    entries.forEach(en => {
      const cell = en.target;
      if (en.isIntersecting) { cell.dataset.visible = "1"; distQueueRender(cell); }
      else {
        cell.dataset.visible = "";
        distPurgeGalleryCell(cell);
        const i = distRenderQueue.indexOf(cell);
        if (i >= 0) distRenderQueue.splice(i, 1);
      }
    });
  }, { rootMargin: DIST.ROOT_MARGIN, threshold: 0 });
  panel.querySelectorAll(".distg-card").forEach(c => distGalleryObserver.observe(c));
}

// ── 상세(검색뷰): CDF + 히스토그램 (전체점 지연 로드) ─────────────────────────
// ── Item_detail (콘텐츠 상세 뷰) ────────────────────────────────────────────────
// sticky-head(topbar+tabs)는 그대로 두고 #panel-item-detail 만 활성화한다. Back(또는 Esc)으로
// 원래 탭 패널 복원. Distribution 카드/Yield/CPK/IssueTable item 클릭 모두 이 화면으로 온다.
const ITEM_FAIL_PAGE_SIZE = 30;
let _itemDetailReturnId = null;   // 복귀할 탭 패널 id
let _itemDetailSubject = null;
let _itemDetailNav = [];          // prev/next 이동 목록(subject 배열)
let _itemDetailFailRows = [];
let _itemDetailFailPage = 1;
let _itemDetailReq = 0;           // 경합 가드(진행 중 fetch 무효화)
let _itemDetailBound = false;
let _itemDetailData = null;        // 현재 상세 응답(scatter_item) — CDF 재렌더에 재사용
let idetHistMode = "analysis";     // 히스토그램 블록 탭: "analysis"(빈도 폴리곤) | "report"(정규분포 곡선)
let _idetNormalRendered = false;   // report 정규분포 곡선 1회 렌더 가드(항목 진입마다 리셋)
// ── CDF 칩 편집(임시, 클라이언트 전용) — 항목 이동/새로고침 시 초기화 ──────────────
let cdfExcluded = new Set();       // 제외할 칩 키 `${source}||${serial}` → CDF 곡선에서 뺌(분모 감소)
let cdfHighlighted = new Set();    // 강조할 칩 키 → CDF 점 색/크기 변경
let cdfEditMode = "none";          // "none" | "exclude" | "highlight" (선택이 어느 Set 에 들어가는지)
const CDF_HIGHLIGHT_COLOR = "#EF553B";
function cdfChipKey(source, serial) { return `${source}||${serial}`; }
function cdfActiveSet() { return cdfEditMode === "exclude" ? cdfExcluded : cdfEditMode === "highlight" ? cdfHighlighted : null; }
function cdfResetEdits() { cdfExcluded.clear(); cdfHighlighted.clear(); cdfEditMode = "none"; }

function openItemDetail(subject, navList) {
  const dp = document.getElementById("panel-item-detail");
  if (!dp) return;
  bindItemDetailPanel();
  // 상세가 아직 안 열려 있으면 현재 활성 탭 패널을 복귀 대상으로 기억하고 숨긴다.
  if (!dp.classList.contains("active")) {
    const cur = document.querySelector(".content > .panel.active");
    _itemDetailReturnId = cur ? cur.id : "panel-summary";
    if (cur) cur.classList.remove("active");
    dp.classList.add("active");
  }
  _itemDetailSubject = subject;
  _itemDetailNav = Array.isArray(navList) && navList.length ? navList : [subject];
  _itemDetailFailPage = 1;
  cdfResetEdits();   // 항목이 바뀌면 CDF 제외/강조 편집 초기화
  _itemDetailData = null;
  const reqId = ++_itemDetailReq;
  window.scrollTo(0, 0);
  dp.innerHTML = `<div class="idet"><div class="idet-head"><button class="btn-sm idet-back">← Back</button>` +
    `<span class="idet-title"><b>${esc(subject)}</b></span></div><div class="placeholder">로드 중…</div></div>`;
  fetch(`/pe/report/session/${SESSION_ID}/web_report/scatter/${encodeURIComponent(subject)}`, { cache: "no-store" })
    .then(res => { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
    .then(data => { if (reqId === _itemDetailReq) renderItemDetail(data); })
    .catch(e => {
      if (reqId !== _itemDetailReq) return;
      dp.innerHTML = `<div class="idet"><div class="idet-head"><button class="btn-sm idet-back">← Back</button></div>` +
        `<div class="placeholder">상세 로드 실패 (${esc(e.message)})</div></div>`;
    });
}

// 헤더 요약 통계: min/max/average/stdev 를 한 줄로. 다중 source 면 첫 source 값을
// 소스명과 함께 표시(상세 per-source 값은 아래 통계표에서 전부 확인 가능).
function idetHeaderStats(stats) {
  if (!stats || !stats.length) return "";
  const s = stats[0];
  const fmt = v => (v === null || v === undefined || v === "") ? "-" : String(v);
  const src = stats.length > 1 ? `<span class="idet-stat-src">${esc(s.source || "")}</span>` : "";
  return `<span class="idet-stat">${src}` +
    `min <b>${esc(fmt(s.min))}</b> · max <b>${esc(fmt(s.max))}</b> · ` +
    `avg <b>${esc(fmt(s.average))}</b> · σ <b>${esc(fmt(s.stdev))}</b></span>`;
}

// 상세 상단 공용 legend 스트립 — distUseExtLegend 일 때만 (툴바 .dist-legend 와 동일
// 마크업/CSS 재사용, flex-wrap 줄바꿈). 순서는 상세 응답 data.sources 순서.
function idetLegendHtml(data) {
  if (!distUseExtLegend(data)) return "";
  return `<div class="dist-legend idet-legend">` + (data.sources || []).map(s =>
    `<span class="dist-leg-item"><span class="dist-leg-sw" style="background:${distColorFor(s.name)}"></span>${esc(s.name)}</span>`
  ).join("") + `</div>`;
}

function renderItemDetail(data) {
  const dp = document.getElementById("panel-item-detail");
  if (!dp) return;
  const subject = data.subject;
  _itemDetailData = data;   // CDF 재렌더(제외/강조 반영)에 재사용
  idetHistMode = "analysis";      // 항목 진입 시 기본 Analysis 탭
  _idetNormalRendered = false;
  const navLen = _itemDetailNav.length;
  const pos = _itemDetailNav.indexOf(subject);
  const navHtml = navLen > 1
    ? `<button class="btn-sm idet-prev" title="이전 (Alt+↑)">‹</button>` +
      `<button class="btn-sm idet-next" title="다음 (Alt+↓)">›</button>` +
      `<span class="idet-navpos">${pos + 1} / ${navLen}</span>` : "";
  const statusLabel = { fail: "FAIL", cpk_low: "CPK LOW", ok: "OK" }[data.status] || data.status || "";
  _itemDetailFailRows = data.fail_rows || [];
  const failTitle = data.is_fail
    ? `<div class="section-title small idet-fail-title">이 항목으로 Fail 된 die — ${data.fail_total}개` +
      `${data.fail_truncated ? ` (앞 ${_itemDetailFailRows.length}개만 표시)` : ""}</div><div id="idetFailHost"></div>`
    : "";
  dp.innerHTML = `<div class="idet">
    <div class="idet-head">
      <button class="btn-sm idet-back">← Back</button>
      ${navHtml}
      <span class="idet-title" data-status="${esc(data.status || "ok")}">
        ${data.test_num ? `<span class="idet-tno">#${esc(data.test_num)}</span>` : ""}
        <b class="idet-subject">${esc(subject)}</b>
        <span class="idet-badge idet-${esc(data.status || "ok")}">${esc(statusLabel)}</span>
        <span class="idet-cpk">cpk ${esc(data.cpk == null ? "-" : data.cpk)}</span>
        <span class="idet-lim">(${esc(distFmtLimit(data.lower_limit))} ~ ${esc(distFmtLimit(data.upper_limit))}${data.units ? " " + esc(data.units) : ""})</span>
        ${idetHeaderStats(data.stats)}
      </span>
    </div>
    <div id="cdfEditBar" class="cdf-editbar"></div>
    ${idetLegendHtml(data)}
    <div class="idet-charts">
      <div class="idet-chart-block"><div class="dist-chart-cap">누적분포 CDF</div><div id="distCdf" class="dist-chart"></div></div>
      <div class="idet-chart-block">
        <div class="dist-chart-cap idet-hist-cap">
          <span>분포 히스토그램</span>
          <span class="idet-hist-tabs">
            <button type="button" class="btn-sm idet-hist-mode${idetHistMode === "analysis" ? " active" : ""}" data-hist-mode="analysis">Analysis</button>
            <button type="button" class="btn-sm idet-hist-mode${idetHistMode === "report" ? " active" : ""}" data-hist-mode="report">Report</button>
          </span>
        </div>
        <div id="distHist" class="dist-chart"${idetHistMode === "report" ? ' style="display:none"' : ""}></div>
        <div id="distNormal" class="dist-chart"${idetHistMode === "analysis" ? ' style="display:none"' : ""}></div>
      </div>
    </div>
    ${itemStatsTableHtml(data.stats)}
    ${failTitle}
  </div>`;
  renderCdfEditBar();
  distRenderDetailCharts(data);   // #distCdf / #distHist (기존 함수 재사용)
  if (data.is_fail) renderItemFailRows();
}

const ITEM_STAT_COLS = ["n", "min", "median", "max", "average", "stdev", "cp", "cpl", "cpu", "cpk"];
function itemStatsTableHtml(stats) {
  if (!stats || !stats.length) return "";
  const multi = stats.length > 1;
  const head = "<thead><tr>" + (multi ? "<th>source</th>" : "") +
    ITEM_STAT_COLS.map(c => `<th>${esc(c)}</th>`).join("") + "</tr></thead>";
  const body = "<tbody>" + stats.map(s => {
    const warn = (s.cpk != null && parseFloat(s.cpk) < CPK_WARN_THRESHOLD);
    const tds = ITEM_STAT_COLS.map(c => {
      const v = s[c]; const t = (v === null || v === undefined) ? "" : String(v);
      const cls = "st-num" + (c === "cpk" && warn ? " cpk-warn" : "");
      return `<td class="${cls}">${esc(t)}</td>`;
    }).join("");
    return "<tr>" + (multi ? `<td>${esc(s.source)}</td>` : "") + tds + "</tr>";
  }).join("") + "</tbody>";
  return `<div class="idet-stats sheet-wrap"><table class="sheet-table">${head}${body}</table></div>`;
}

function renderItemFailRows() {
  const host = document.getElementById("idetFailHost");
  if (!host) return;
  const rows = _itemDetailFailRows;
  if (!rows.length) { host.innerHTML = `<div class="placeholder">Fail 행 없음</div>`; return; }
  const multi = !!(DATA.web_report && (DATA.web_report.sources || []).length > 1);
  const cols = (multi ? ["SOURCE"] : []).concat(["SERIAL", "SHOT", "DUT", "XPOS", "YPOS", "BIN", "FAILTNO", "value"]);
  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total / ITEM_FAIL_PAGE_SIZE));
  if (_itemDetailFailPage > pages) _itemDetailFailPage = pages;
  if (_itemDetailFailPage < 1) _itemDetailFailPage = 1;
  const start = (_itemDetailFailPage - 1) * ITEM_FAIL_PAGE_SIZE;
  const page = rows.slice(start, start + ITEM_FAIL_PAGE_SIZE);
  // 체크박스 열: 현재 편집 모드(제외/강조)의 Set 멤버십을 표시·토글. 모드=없음이면 비활성.
  const editing = cdfEditMode !== "none";
  const activeSet = cdfActiveSet();
  const chkLabel = cdfEditMode === "highlight" ? "강조" : cdfEditMode === "exclude" ? "제외" : "칩";
  const chkTh = `<th class="idet-fail-chk-col">${chkLabel}</th>`;
  const head = "<thead><tr>" + chkTh + cols.map(c => `<th>${esc(c)}</th>`).join("") + "</tr></thead>";
  const body = "<tbody>" + page.map(r => {
    const key = cdfChipKey(r.SOURCE, r.SERIAL);
    const checked = activeSet && activeSet.has(key) ? " checked" : "";
    const chkTd = `<td class="idet-fail-chk-col"><input type="checkbox" class="cdf-fail-chk" data-chipkey="${esc(key)}"${editing ? "" : " disabled"}${checked}></td>`;
    return "<tr>" + chkTd + cols.map(c => {
      const v = r[c]; const t = (v === null || v === undefined) ? "" : String(v);
      return `<td>${esc(t)}</td>`;
    }).join("") + "</tr>";
  }).join("") + "</tbody>";
  const end = Math.min(start + ITEM_FAIL_PAGE_SIZE, total);
  const pager = pages > 1
    ? `<div class="cpk-pager">` +
      `<button type="button" class="btn-sm" data-idet-page="${_itemDetailFailPage - 1}"${_itemDetailFailPage <= 1 ? " disabled" : ""}>‹ 이전</button>` +
      `<span class="cpk-pager-info">${start + 1}–${end} / ${total} (page ${_itemDetailFailPage}/${pages})</span>` +
      `<button type="button" class="btn-sm" data-idet-page="${_itemDetailFailPage + 1}"${_itemDetailFailPage >= pages ? " disabled" : ""}>다음 ›</button></div>`
    : "";
  host.innerHTML = `<div class="sheet-wrap"><table class="sheet-table">${head}${body}</table></div>` + pager;
}

function itemDetailNav(delta) {
  if (_itemDetailNav.length < 2) return;
  let p = _itemDetailNav.indexOf(_itemDetailSubject) + delta;
  if (p < 0) p = 0;
  if (p >= _itemDetailNav.length) p = _itemDetailNav.length - 1;
  const next = _itemDetailNav[p];
  if (next && next !== _itemDetailSubject) openItemDetail(next, _itemDetailNav);
}

function closeItemDetail() {
  const dp = document.getElementById("panel-item-detail");
  if (!dp) return;
  _itemDetailReq++;   // 진행 중 fetch 무효화
  dp.classList.remove("active");
  dp.innerHTML = "";
  const back = document.getElementById(_itemDetailReturnId || "panel-summary");
  if (back) back.classList.add("active");
  _itemDetailReturnId = null;
}

// 탭 버튼 클릭 시: 복원 없이 상세만 닫는다(해당 탭 패널이 이어서 활성화됨).
function hideItemDetail() {
  const dp = document.getElementById("panel-item-detail");
  if (dp && dp.classList.contains("active")) { _itemDetailReq++; dp.classList.remove("active"); dp.innerHTML = ""; }
  _itemDetailReturnId = null;
}

function bindItemDetailPanel() {
  if (_itemDetailBound) return;
  const dp = document.getElementById("panel-item-detail");
  if (!dp) return;
  dp.addEventListener("click", e => {
    if (e.target.closest(".idet-back")) { closeItemDetail(); return; }
    if (e.target.closest(".idet-prev")) { itemDetailNav(-1); return; }
    if (e.target.closest(".idet-next")) { itemDetailNav(1); return; }
    const hm = e.target.closest("[data-hist-mode]");
    if (hm) { setIdetHistMode(hm.dataset.histMode); return; }
    const mb = e.target.closest("[data-cdf-mode]");
    if (mb) { cdfEditMode = mb.dataset.cdfMode; cdfAfterEdit(); return; }
    if (e.target.closest(".cdf-reset")) { cdfResetEdits(); cdfAfterEdit(); return; }
    const pg = e.target.closest("[data-idet-page]");
    if (pg && !pg.disabled) { _itemDetailFailPage = parseInt(pg.dataset.idetPage, 10) || 1; renderItemFailRows(); return; }
  });
  dp.addEventListener("change", e => {
    const chk = e.target.closest(".cdf-fail-chk");
    if (!chk) return;
    const set = cdfActiveSet();
    if (!set) return;
    if (chk.checked) set.add(chk.dataset.chipkey); else set.delete(chk.dataset.chipkey);
    cdfAfterEdit();
  });
  document.addEventListener("keydown", e => {
    if (!dp.classList.contains("active")) return;
    if (e.key === "Escape") { closeItemDetail(); return; }
    if (e.altKey && e.key === "ArrowUp") { e.preventDefault(); itemDetailNav(-1); }
    else if (e.altKey && e.key === "ArrowDown") { e.preventDefault(); itemDetailNav(1); }
  });
  _itemDetailBound = true;
}
// values 를 오름차순 정렬하며 원래 index 순서를 함께 반환 — serial/xpos/ypos 를 같은 순서로
// 재배열해 CDF hover(customdata)에 붙이는 데 쓴다.
function distCdfFromValues(values) {
  const order = values.map((_, i) => i).sort((a, b) => values[a] - values[b]);
  const n = order.length;
  return { x: order.map(i => values[i]), y: order.map((_, k) => (k + 1) / n * 100), order };
}
// 빈도 폴리곤: subject 의 모든 source 를 21 균등구간으로 빈닝해 중심점-빈도 곡선을 만든다.
// 서버가 보낸 원본 values 재사용(재계산 최소화, 다운샘플 없음). 반환 곡선은 양끝 0 패딩 포함 23점.
function distHistPolygon(sources, lo, hi) {
  // 3-1 hist_range(소스 공용): 전체값 min/max + LSL/USL 확장. 대용량이라 스프레드 대신 for 루프.
  let rlo = Infinity, rhi = -Infinity;
  (sources || []).forEach(s => {
    for (const v of s.values) { if (v < rlo) rlo = v; if (v > rhi) rhi = v; }
  });
  [lo, hi].forEach(v => { if (v !== null && v !== undefined) {
    if (v < rlo) rlo = v; if (v > rhi) rhi = v; } });
  if (!isFinite(rlo) || !isFinite(rhi)) { rlo = 0; rhi = 1; }   // 값이 전무한 경우 가드
  if (rhi === rlo) rhi = rlo + 1;                                // 축퇴(단일값) 가드
  const B = 21, step = (rhi - rlo) / B;
  // 3-3 중심점(21) → 3-4 양끝 0 패딩(bw=step)으로 23점 (곡선이 바닥에서 시작·종료)
  const centers = [rlo - step * 0.5];                            // padded left
  for (let k = 0; k < B; k++) centers.push(rlo + step * (k + 0.5));
  centers.push(rlo + step * (B + 0.5));                          // padded right
  return (sources || []).map(s => {
    // 3-2 균등 21구간 누적 (오른쪽 끝값은 마지막 bin 에 포함). 3-5 빈 source 는 자연히 전부 0.
    const counts = new Array(B).fill(0);
    for (const v of s.values) {
      let idx = Math.floor((v - rlo) / step);
      if (idx === B) idx = B - 1;
      if (idx >= 0 && idx < B) counts[idx]++;
    }
    return { source: s.name, centers, counts: [0, ...counts, 0] };  // 패딩 0 앞뒤 → 23
  });
}
// 스펙 4장 x축 표시범위(히스토그램 전용): 소스 합친 data min/max·median 기준 4분기 규칙.
// 가드밴드 5% 기준은 USL-LSL span, median 은 소스 합친 전체값 기준.
function distHistXRange(sources, lo, hi, isFail) {
  const all = [];
  (sources || []).forEach(s => { for (const v of s.values) all.push(v); });
  const hasLo = lo !== null && lo !== undefined, hasHi = hi !== null && hi !== undefined;
  if (hasLo && hasHi) {
    if (!isFail) return [lo, hi];
    const span = hi - lo, gb = span * 0.05;
    let dmin = Infinity, dmax = -Infinity;
    for (const v of all) { if (v < dmin) dmin = v; if (v > dmax) dmax = v; }
    let x0 = lo, x1 = hi;
    if (dmin < lo) x0 = dmin - gb;      // 아래로 벗어난 쪽만 확장
    if (dmax > hi) x1 = dmax + gb;      // 위로 벗어난 쪽만 확장
    return [x0, x1];
  }
  // median (소스 합친 전체값)
  let med = 0;
  if (all.length) {
    const sorted = all.slice().sort((a, b) => a - b), m = sorted.length >> 1;
    med = sorted.length % 2 ? sorted[m] : (sorted[m - 1] + sorted[m]) / 2;
  }
  if (hasLo) return [lo, 2 * med - lo];        // USL 없음 → 위쪽을 median 대칭 확장
  if (hasHi) return [2 * med - hi, hi];        // LSL 없음 → 아래쪽을 median 대칭 확장
  // Limit 없음 → data min/max
  let dmin = Infinity, dmax = -Infinity;
  for (const v of all) { if (v < dmin) dmin = v; if (v > dmax) dmax = v; }
  if (!isFinite(dmin) || !isFinite(dmax)) return undefined;   // 값 전무 → Plotly 자동
  return [dmin, dmax];
}
// CDF 편집 툴바 렌더 (모드 세그먼트 + 초기화 + 카운트). 리스너는 bindItemDetailPanel 위임.

function cdfToggleChip(key) {

// CDF 만 렌더(제외→분모 재계산, 강조→점 색/크기, 편집 모드→dragmode=select + 클릭/박스선택).
function distRenderCdf(data) {
  const cdfDiv = document.getElementById("distCdf");
  if (!cdfDiv) return;
  const lo = data.lower_limit, hi = data.upper_limit;
  const bg = DIST_STATUS_BG[data.status] || "#FFFFFF";
  const multi = (data.sources || []).length > 1;
  const unit = data.units || "";
  const xtitle = `측정값${unit ? " (" + unit + ")" : ""}`;
  const traces = (data.sources || []).map(s => {
    const hasId = Array.isArray(s.serial) && s.serial.length === s.values.length;
    // 제외 칩을 뺀 값/식별정보 — 제외는 CDF 곡선에만 반영(분모 n 감소로 곡선 재계산).
    let vals = s.values, serial = s.serial, xpos = s.xpos, ypos = s.ypos;
    if (hasId && cdfExcluded.size) {
      vals = []; serial = []; xpos = []; ypos = [];
      for (let i = 0; i < s.values.length; i++) {
        if (cdfExcluded.has(cdfChipKey(s.name, s.serial[i]))) continue;
        vals.push(s.values[i]); serial.push(s.serial[i]); xpos.push(s.xpos[i]); ypos.push(s.ypos[i]);
      }
    }
    const c = distCdfFromValues(vals);
    const base = distColorFor(s.name);
    const trace = { type: "scatter", mode: "markers", cliponaxis: false, name: s.name, x: c.x, y: c.y };
    if (hasId) {
      // customdata/hover 는 필터·정렬된 동일 순서 유지(클릭 식별·hover 지속).
      trace.customdata = c.order.map(i => [serial[i], xpos[i], ypos[i]]);
      trace.hovertemplate = "측정값 %{x}<br>누적 %{y:.1f}%<br>SERIAL %{customdata[0]} · X %{customdata[1]} / Y %{customdata[2]}<extra></extra>";
      if (cdfHighlighted.size) {   // 강조 칩만 색/크기 배열로 표시
        trace.marker = {
          color: c.order.map(i => cdfHighlighted.has(cdfChipKey(s.name, serial[i])) ? CDF_HIGHLIGHT_COLOR : base),
          size: c.order.map(i => cdfHighlighted.has(cdfChipKey(s.name, serial[i])) ? 9 : 5),
        };
      } else {
        trace.marker = { color: base, size: 5 };
      }
    } else {
      trace.marker = { color: base, size: 5 };
      trace.hovertemplate = "측정값 %{x}<br>누적 %{y:.1f}%<extra></extra>";
    }
    return trace;
  });
  // 선택 좌표(Map Analysis)가 있으면 이 항목 위치를 점+빨간 점선으로 오버레이.
  let cdfShapes = distSpecShapes(lo, hi, true).concat(beforeLimitShapes(data.subject));
  const cdfCm = chipMarkersFor(data.subject);
  if (cdfCm) { traces.push(...cdfCm.traces); cdfShapes = cdfShapes.concat(cdfCm.shapes); }
  const dragmode = cdfEditMode === "none" ? "zoom" : "select";
  Plotly.newPlot(cdfDiv, traces, { ...DIST_PLOT_BG, plot_bgcolor: bg, dragmode,
    xaxis: { title: { text: xtitle }, nticks: 10, showgrid: true, gridcolor: "#eee", zeroline: false },
    yaxis: { title: { text: "누적 %" }, range: [0, 100], ticksuffix: "%", showgrid: true, gridcolor: "#eee", zeroline: false },
    shapes: cdfShapes,
    annotations: distSpecAnnos(lo, hi, false).concat(beforeLimitAnnos(data.subject)),
    margin: { l: 60, r: 22, t: 16, b: 46 }, showlegend: multi && !distUseExtLegend(data) }, DIST_CFG);
  // 재렌더마다 중복 방지 후 편집 모드에서만 동작하는 선택 이벤트 바인딩.
  if (cdfDiv.removeAllListeners) { cdfDiv.removeAllListeners("plotly_click"); cdfDiv.removeAllListeners("plotly_selected"); }
  cdfDiv.on("plotly_click", ev => {
    if (!cdfActiveSet() || !ev.points || !ev.points.length) return;
    const pt = ev.points[0];
    if (!pt.customdata) return;
    cdfToggleChip(cdfChipKey(pt.data.name, pt.customdata[0]));
    cdfAfterEdit();
  });
  cdfDiv.on("plotly_selected", ev => {
    const set = cdfActiveSet();
    if (!set || !ev || !ev.points || !ev.points.length) return;
    ev.points.forEach(pt => { if (pt.customdata) set.add(cdfChipKey(pt.data.name, pt.customdata[0])); });
    cdfAfterEdit();
  });
}
function distRenderDetailCharts(data) {
  const lo = data.lower_limit, hi = data.upper_limit;
  const bg = DIST_STATUS_BG[data.status] || "#FFFFFF";
  const multi = (data.sources || []).length > 1;

  const xtitle = `측정값${unit ? " (" + unit + ")" : ""}`;

  const hDiv = document.getElementById("distHist");

    const polys = distHistPolygon(data.sources || [], lo, hi);
    let ymax = 0;
    polys.forEach(p => p.counts.forEach(c => { if (c > ymax) ymax = c; }));

      xaxis: { title: { text: xtitle },

        showgrid: true, gridcolor: "#eee", zeroline: false },
