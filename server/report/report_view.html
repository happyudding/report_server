<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Report</title>
<script>
/* 테마 부트스트랩: 첫 페인트 전에 저장된 다크 테마 적용 (FOUC 방지).
   localStorage "report_theme" 는 검색결과/세션 상세 페이지가 공유한다. */
try {
  if (localStorage.getItem("report_theme") === "dark")
    document.documentElement.setAttribute("data-theme", "dark");
} catch (e) {}
</script>
<link rel="stylesheet" href="/pe/report/vendor/tabulator.min.css">
<!-- defer: plotly 4.8MB(gz 1.4MB) 파싱이 HTML 파싱/첫 페인트를 막지 않도록.
     defer 스크립트는 DOMContentLoaded 전에 순서대로 실행되므로, 하단 인라인 스크립트의
     load() 를 DOMContentLoaded 이후로 미루면 Tabulator/Plotly 존재가 보장된다. -->
<script defer src="/pe/report/vendor/tabulator.min.js"></script>
<script defer src="/pe/report/vendor/plotly.min.js"></script>
<style>
@font-face {
  font-family: "Pretendard Variable";
  src: url("/pe/report/vendor/pretendard/PretendardVariable.woff2") format("woff2");
  font-weight: 45 920;
  font-display: swap;
}
* { box-sizing: border-box; }
body {
  font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
    "Segoe UI", "Malgun Gothic", sans-serif;
  background: #fafafa; margin: 0; color: #222;
}

/* ── sticky-head: topbar + tabs 를 한 덩어리로 고정 (topbar 가 1~2줄로 높이가
   바뀌어도 tabs 가 항상 그 바로 아래 붙도록 top:49px 같은 매직넘버 대신 부모째 sticky) ── */
.sticky-head { position: sticky; top: 0; z-index: 100; background: #fff; }

/* ── topbar: 제목 + 세션 정보 인라인 ─────────────────────────────────────── */
.topbar {
  background: #fff; border-bottom: 1px solid #ddd;
  padding: 8px 16px; display: flex; gap: 10px; align-items: center;
  flex-wrap: wrap; box-shadow: 0 1px 3px rgba(0,0,0,.06);
}
.back-btn {
  padding: 5px 12px; border-radius: 8px; border: 1px solid #d0d5dd;
  background: #fff; cursor: pointer; font-size: 12px; color: #555;
  text-decoration: none; box-shadow: 0 1px 2px rgba(0,0,0,.05);
  transition: all .15s ease;
}
.back-btn:hover {
  background: #f0f6ff; border-color: #4a90e2; color: #4a90e2;
  box-shadow: 0 2px 6px rgba(0,0,0,.08); transform: translateY(-1px);
}

.topbar-meta { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.meta-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.meta-inline {
  font-size: 12px; color: #444; background: #f3f5f8;
  padding: 3px 9px; border-radius: 4px; white-space: nowrap;
}
.meta-inline .mk { color: #999; margin-right: 4px; font-size: 11px; }
.meta-inline-file {
  font-size: 12px; color: #444; max-width: 480px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pt-badge {
  display: inline-block; padding: 3px 11px; border-radius: 4px;
  font-size: 12px; font-weight: 700; color: #fff;
}
.pt-badge.MDDI { background: #4a90e2; }
.pt-badge.PDDI { background: #1e3a8a; }
.pt-badge.PMIC { background: #16a34a; }
.pt-badge.SECURITY { background: #9333ea; }
.pt-badge.TCON { background: #0d9488; }
.pt-badge.default { background: #64748b; }
/* 분석 모드 배지 (web_report, Normal 이 아닐 때만 표시) */
.mode-badge {
  display: inline-block; padding: 3px 11px; border-radius: 4px;
  font-size: 12px; font-weight: 700; color: #fff; background: #db2777;
}
.mode-badge.Compare { background: #db2777; }
.mode-badge.DUT { background: #2563eb; }
.mode-badge.Commonality { background: #d97706; }
/* ── Compare 탭 ─────────────────────────────────────────────────────────── */
.compare-wrap { padding: 4px 2px 40px; }
.compare-summary { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  font-size: 13px; margin: 6px 0 12px; }
.compare-h { font-size: 14px; font-weight: 700; margin: 20px 0 8px; color: #334155; }
.cmp-chip { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 12px;
  font-weight: 600; background: #e2e8f0; color: #334155; }
.cmp-chip.cmp-common { background: #cbd5e1; color: #1e293b; }
.cmp-chip.cmp-unique { background: #fee2e2; color: #b91c1c; }
.cmp-legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 4px; font-size: 12px; }
.cmp-lg { display: inline-flex; align-items: center; gap: 5px; }
.cmp-lg i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
.compare-table td.num, .compare-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.compare-table td.cmp-up { color: #b91c1c; }
.compare-table td.cmp-down { color: #1d4ed8; }
.compare-table .cmp-pass-row { background: #f0fdf4; }
/* goodlog(테스트 프로그램 diff) — Honey Compare Mode 색상 관례: True 초록/False 빨강 배경 */
.compare-table td.gl-true { background: #c6efce; color: #1e6b30; text-align: center; }
.compare-table td.gl-false { background: #ffc7ce; color: #9c0006; text-align: center; }
.compare-table td.gl-gap-red { color: #b91c1c; font-weight: 600; }
.gl-identical { margin: 8px 0; padding: 10px 12px; background: #f0fdf4;
  border: 1px solid #bbf7d0; border-radius: 6px; color: #166534; font-size: 13px; }
/* goodlog 이상 요약 + git-diff 식 접기 */
.gl-ab-summary { margin: 8px 0 4px; padding: 10px 12px; background: #fff7ed;
  border: 1px solid #fed7aa; border-radius: 6px; font-size: 13px; }
.gl-ab-summary.gl-ab-none { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }
.gl-ab-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 600; color: #9a3412; }
.gl-ab-none .gl-ab-head { color: #166534; }
.cmp-chip.gl-chip-add { background: #dcfce7; color: #166534; }
.cmp-chip.gl-chip-del { background: #fee2e2; color: #b91c1c; }
.cmp-chip.gl-chip-lim { background: #fef9c3; color: #854d0e; }
.gl-ab-summary .gl-expand-all { margin-left: auto; }
.gl-ab-items { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 5px; }
.gl-ab-item { font-size: 12px; padding: 1px 7px; border-radius: 4px; border: 1px solid transparent; }
.gl-ab-item.gl-add { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }
.gl-ab-item.gl-del { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
.gl-ab-item.gl-lim { background: #fefce8; border-color: #fde68a; color: #854d0e; }
.gl-fold-toggle td { cursor: pointer; background: #f1f5f9; color: #64748b;
  font-size: 12px; padding: 4px 10px; user-select: none; }
.gl-fold-toggle:hover td { background: #e2e8f0; }
.gl-fold-arrow { display: inline-block; width: 12px; color: #94a3b8; }
.goodlog-table tr.gl-added > td:first-child { box-shadow: inset 3px 0 0 #22c55e; }
.goodlog-table tr.gl-removed > td:first-child { box-shadow: inset 3px 0 0 #ef4444; }
.goodlog-table tr.gl-limitchg > td:first-child { box-shadow: inset 3px 0 0 #f59e0b; }
.goodlog-table tr.gl-added { background: #f6fef9; }
.goodlog-table tr.gl-removed { background: #fef6f6; }
.goodlog-table tr.gl-limitchg { background: #fffdf5; }
/* Bin 전이표: 변경된 조합 강조 */
.compare-table tr.bt-changed { background: #fff7ed; }
.compare-table tr.bt-changed td:first-child { font-weight: 600; }
.gl-sub { font-size: 11px; font-weight: 400; color: #64748b; }
/* ── 좌표 선택(Map Analysis) 검색 UI ─────────────────────────────────────── */
.common-search { display: flex; gap: 8px; align-items: center; margin: 6px 0 12px; }
.common-search input { padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 5px;
  font-size: 13px; width: 280px; max-width: 60%; }
.common-search .muted { color: #64748b; font-size: 12px; }
.btn-sm { padding: 6px 14px; border: 1px solid #2563eb; background: #2563eb; color: #fff;
  border-radius: 5px; font-size: 13px; cursor: pointer; }
.common-list { max-height: 340px; overflow: auto; border: 1px solid #e2e8f0; border-radius: 6px; }
.common-chip-table th, .common-chip-table td { padding: 4px 8px; font-size: 12px; }
.common-chip-row { cursor: pointer; }
.common-chip-row:hover { background: #f1f5f9; }
.common-chip-row.is-selected { background: #dbeafe; }
.common-chip-row.common-chip-added { color: #94a3b8; background: #f8fafc; }
.common-chk-col { width: 30px; text-align: center; }
.common-chk-col input { cursor: pointer; }
.mapsel-sep { display: inline-block; width: 1px; height: 16px; background: #d5dbe6; margin: 0 8px; vertical-align: middle; }
.mapsel-cur { font-size: 12px; color: #0f172a; background: #fee2e2; border: 1px solid #fca5a5;
  border-radius: 5px; padding: 3px 8px; margin: 0 6px; }
.mapsel-search { max-width: 900px; margin: 4px 0 14px; padding: 8px 10px;
  border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc; }
.mapsel-search .common-search { flex-wrap: wrap; }
/* 좌표 개별 검색칸(serial/xpos/ypos) — .common-search input 기본 280px 를 좁게 재정의 */
.mapsel-field { width: 120px !important; max-width: 120px !important; flex: 0 0 auto; }
.mapsel-list { max-height: 300px; }
.mapsel-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 2px 0 12px; }
.mapsel-leg-title { font-size: 12px; font-weight: 700; color: #475569; }
.mapsel-leg-item { display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
  background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 12px; padding: 2px 6px 2px 8px; }
.mapsel-sw { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.mapsel-src { color: #64748b; }
.mapsel-del { border: none; background: transparent; color: #94a3b8; cursor: pointer;
  font-size: 14px; line-height: 1; padding: 0 2px; }
.mapsel-del:hover { color: #e11d48; }
.mapsel-clear { padding: 3px 10px; }
/* ── tabs ──────────────────────────────────────────────────────────────── */
.tabs {
  display: flex; gap: 6px; flex-wrap: wrap; background: #fff;
  border-bottom: 1px solid #e6e9ef; padding: 8px 16px 0;
}
.tab {
  padding: 8px 16px; font-size: 13px; font-weight: 700; color: #6b7280;
  background: #f4f6fa; border: 1px solid #dfe4ec; border-radius: 8px 8px 0 0;
  margin-bottom: -1px; cursor: pointer; transition: all .12s;
}
.tab:hover { color: #1f4d8c; background: #eef3fb; border-color: #cfdbf0; }
.tab.active {
  color: #1f4d8c; background: #fff; border-color: #cfdbf0; border-bottom-color: #fff;
  box-shadow: 0 -2px 6px rgba(31,77,140,.06);
}

/* ── content ───────────────────────────────────────────────────────────── */
.content { padding: 18px 20px 90px; max-width: 1200px; margin: 0 auto; }
.panel { display: none; }
.panel.active { display: block; }

.section-title {
  font-size: 13px; font-weight: 700; color: #333;
  margin: 0 0 8px; padding-bottom: 6px; border-bottom: 1px solid #eef0f3;
}
.section-title.small { margin-top: 24px; }

.yield-overview {
  display: flex; align-items: center; gap: 28px; flex-wrap: wrap;
  background: #f6f9ff; border: 1px solid #dbe6f7; border-radius: 10px;
  padding: 14px 22px; margin-bottom: 14px;
}
.yield-overview .yo-pct { font-size: 30px; font-weight: 800; color: #1f4d8c; }
.yield-overview .yo-stats { display: flex; gap: 24px; flex-wrap: wrap; }
.yield-overview .yo-stat { display: flex; flex-direction: column; }
.yield-overview .yo-num { font-size: 17px; font-weight: 700; color: #222; }
.yield-overview .yo-label { font-size: 11px; color: #888; margin-top: 2px; }
.yield-overview .yo-stat.yo-fail .yo-num { color: #d9480f; }
/* source 별 수율을 메인 Total Yield 오른쪽에 작은 테이블로 이어 붙인다(세로 공간 차지 X). */
.yield-by-source {
  align-self: center; max-height: 132px; overflow-y: auto;
  border: 1px solid #dbe6f7; border-radius: 8px; background: #fff;
}
.ybs-table { width: auto; margin: 0; font-size: 11px; border-collapse: collapse; }
.ybs-table th, .ybs-table td {
  padding: 3px 10px; border-bottom: 1px solid #eef2f8; white-space: nowrap; text-align: right;
}
.ybs-table tr:last-child td { border-bottom: none; }
.ybs-table th { background: #f6f9ff; color: #6b7a90; font-weight: 600; font-size: 10px; }
.ybs-table .ybs-src { color: #1f4d8c; font-weight: 700; text-align: left; }
.ybs-table .ybs-pct { color: #222; font-weight: 800; }
.ybs-table .ybs-cnt { color: #888; }
/* Yield 표 avg 셀: 값 + 100% 대비 가로 게이지 막대 */
.yield-avg-cell { display: inline-flex; align-items: center; gap: 6px; justify-content: flex-end; }
.yield-avg-val { text-align: right; }
.yield-gauge { display: inline-block; width: 56px; height: 8px; background: #edf0f4;
  border-radius: 4px; overflow: hidden; flex: none; }
.yield-gauge-fill { display: block; height: 100%; background: #2a78d6; border-radius: 4px; }

/* ── Summary: 전체/소스별 Yield + Major Fail Bins 통합 테이블 ─────────────── */
.mfb-wrap { overflow-x: auto; margin-bottom: 18px; }
.mfb-table { width: auto; min-width: 480px; border-collapse: collapse; font-size: 12px; margin: 0; }
.mfb-table th, .mfb-table td {
  border: 1px solid #b8c4d4; padding: 5px 12px; text-align: right; white-space: nowrap;
}
.mfb-table thead th { background: #f6f9ff; color: #445; font-weight: 700; text-align: center; }
.mfb-table tbody tr:hover { background: transparent; }
.mfb-table .mfb-yield { font-weight: 800; color: #1f4d8c; font-size: 20px; vertical-align: middle; text-align: center; background: #f6f9ff; }
.mfb-table .mfb-src { font-weight: 700; color: #333; text-align: left; }
.mfb-table .mfb-syield { color: #1f4d8c; font-weight: 700; }
.mfb-table .mfb-item { text-align: left; }
.mfb-table .mfb-bin { text-align: center; }
.mfb-table .mfb-rate { color: #d9480f; font-weight: 700; }

table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 8px; }
th, td { padding: 6px 10px; border-bottom: 1px solid #eef0f3; text-align: left; }
th { background: #f6f7f9; font-weight: 600; color: #555; font-size: 11px; }
td { color: #222; }
tbody tr:hover { background: #f9fbff; }

/* ── sheet-table (xlsx 텍스트 데이터 원형 재현) ────────────────────────── */
.sheet-wrap { overflow-x: auto; margin-bottom: 16px; }
.sheet-table {
  width: auto; border-collapse: collapse; font-size: 12px;
  background: #fff; margin-bottom: 0;
}
.sheet-table th {
  background: #e8eef4; font-weight: 700; padding: 5px 8px;
  border: 1px solid #b0bec5; white-space: nowrap; color: #1a3a5c;
  vertical-align: middle; text-align: left;
}
.sheet-table th.sheet-group-th { text-align: center; }
.sheet-table td {
  padding: 4px 8px; border: 1px solid #d0d7de;
  white-space: nowrap; vertical-align: middle; color: #222;
}
.sheet-table tbody tr:nth-child(even) td { background: #f7f9fb; }
.sheet-table tbody tr:hover td { background: #edf3fc; }
.sheet-table td.st-empty { color: #bbb; }
.sheet-table td.st-num { text-align: left; }
.sheet-table td.editing-cell {
  outline: none; cursor: text; background: #fffbe6 !important;
}
.sheet-table td.editing-cell:focus { box-shadow: inset 0 0 0 2px #4a90e2; }
.sheet-table td.dblclick-edit { cursor: pointer; }
.sheet-table td.dblclick-edit[contenteditable="true"] { cursor: text; }
.sheet-table td.sheet-subhead {
  background: #e8eef4 !important; font-weight: 700; color: #1a3a5c;
}
.sheet-table td.cpk-warn { background: #fff3bf !important; font-weight: 700; color: #5c4400; }

/* ── CPK 표: Excel 식 freeze panes(헤더 상단 고정 + subject 좌측 / cpk 우측 고정) + 페이저 ── */
.sheet-wrap.cpk-sheet {
  overflow: auto;
  max-height: calc(100vh - var(--sticky-head-h, 96px) - 150px);
  border: 1px solid #d0d7de; border-radius: 6px; margin-bottom: 6px;
}
.sheet-table.cpk-sheet thead th { position: sticky; top: 0; z-index: 3; }
.sheet-table.cpk-sheet th:first-child,
.sheet-table.cpk-sheet td:first-child { position: sticky; left: 0; z-index: 2; background: #fff; }
.sheet-table.cpk-sheet thead th:first-child { z-index: 4; background: #e8eef4; }
.sheet-table.cpk-sheet th:last-child,
.sheet-table.cpk-sheet td:last-child { position: sticky; right: 0; z-index: 2; background: #fff; }
.sheet-table.cpk-sheet thead th:last-child { z-index: 4; background: #e8eef4; }
.sheet-table.cpk-sheet tbody tr:nth-child(even) td:first-child,
.sheet-table.cpk-sheet tbody tr:nth-child(even) td:last-child { background: #f7f9fb; }
.sheet-table.cpk-sheet td.cpk-warn { background: #fff3bf !important; }
/* Limit 계산 모드: 체크박스 열(1번째)·subject 열(2번째)을 좌측 2단 고정 */
.sheet-table.cpk-sheet .cpk-sel-col { width: 34px; min-width: 34px; text-align: center; }
.sheet-table.cpk-sheet.has-select th:nth-child(2),
.sheet-table.cpk-sheet.has-select td:nth-child(2) { position: sticky; left: 34px; z-index: 2; background: #fff; }
.sheet-table.cpk-sheet.has-select thead th:nth-child(2) { z-index: 4; background: #e8eef4; }
.sheet-table.cpk-sheet.has-select tbody tr:nth-child(even) td:nth-child(2) { background: #f7f9fb; }
.sheet-table.cpk-sheet td.cpk-target { background: #e7f0ff; }
.cpk-pager {
  display: flex; align-items: center; gap: 12px; margin: 4px 0 18px;
  font-size: 12px; color: #555;
}
.cpk-pager-info { font-variant-numeric: tabular-nums; }

/* ── Issue Table: 섹션(Yield/CPK/ETC)별 2행 헤더 블록을 통째로 sticky 로 고정 ──
   각 섹션 헤더 블록(top=그룹행, bot=Avg/source행)을 top:0 에 sticky 로 붙이고, 뒤 섹션 헤더가
   불투명 배경 + DOM 순서로 앞 섹션 헤더를 덮게 스택 → 스크롤 시 헤더가 통째로 교체된다.
   좌측은 식별컬럼(Step/Bin/TNO/Item)까지 틀고정. wrap 은 sticky 로 뷰포트에 고정해 가로
   스크롤바가 세로 스크롤과 무관하게 항상 하단에 보이게 한다. */
.sheet-wrap.kind-issue {
  overflow: auto;
  position: sticky;
  top: calc(var(--sticky-head-h, 96px) + 40px);   /* 상단 issue-toolbar 높이만큼 내림 */
  max-height: calc(100vh - var(--sticky-head-h, 96px) - 40px - 24px);
  border: 1px solid #d0d7de; border-radius: 6px;
}
/* Win11 Chrome/Edge 오버레이 스크롤바는 스크롤 중에만 나타나 "가로 스크롤이 없는 것처럼"
   보인다 — wrap 내부 스크롤바를 커스텀으로 그려 항상 보이게 한다. */
.sheet-wrap.kind-issue::-webkit-scrollbar { height: 12px; width: 12px; }
.sheet-wrap.kind-issue::-webkit-scrollbar-track { background: #f0f2f5; border-radius: 6px; }
.sheet-wrap.kind-issue::-webkit-scrollbar-thumb {
  background: #9aa7b5; border-radius: 6px; border: 2px solid #f0f2f5; }
.sheet-wrap.kind-issue::-webkit-scrollbar-thumb:hover { background: #7b8a9b; }
/* 섹션 2행 헤더: 상단행 top:0, 하단행 top:상단행높이(--issue-shead-row1-h, JS 실측). */
.sheet-table.kind-issue tr.issue-shead-top > th {
  position: sticky; top: 0; z-index: 6; background: #e8eef4; }
.sheet-table.kind-issue tr.issue-shead-bot > th {
  position: sticky; top: var(--issue-shead-row1-h, 26px); z-index: 6; background: #e8eef4; }
/* 좌측 고정: 식별컬럼 4개(Step/Bin/TNO/Item) — 데이터 tbody td + 섹션 헤더 상단행 th. */
.sheet-table.kind-issue tbody td:nth-child(-n+4),
.sheet-table.kind-issue tr.issue-shead-top > th:nth-child(-n+4) { position: sticky; z-index: 3; background: #fff; }
/* 헤더 상단행의 식별컬럼은 상단+좌측 동시 고정(코너)이라 다른 sticky 위로 올린다. */
.sheet-table.kind-issue tr.issue-shead-top > th:nth-child(-n+4) { z-index: 7; background: #e8eef4; }
/* 좌측 고정 오프셋 = 앞 컬럼 폭 누적 (step 66 + bin 66 + tno 90, issue 1.5배). colWidth 와 동기. */
.sheet-table.kind-issue tbody td:nth-child(1), .sheet-table.kind-issue tr.issue-shead-top > th:nth-child(1) { left: 0; }
.sheet-table.kind-issue tbody td:nth-child(2), .sheet-table.kind-issue tr.issue-shead-top > th:nth-child(2) { left: 66px; }
.sheet-table.kind-issue tbody td:nth-child(3), .sheet-table.kind-issue tr.issue-shead-top > th:nth-child(3) { left: 132px; }
.sheet-table.kind-issue tbody td:nth-child(4), .sheet-table.kind-issue tr.issue-shead-top > th:nth-child(4) { left: 222px; }
.sheet-table.kind-issue td.sheet-subhead { background: #e8eef4 !important; }
/* Bin(2번째)/Item(4번째) 데이터 셀: 기본 12px 보다 3 크게 + Bold (사용자 요청). */
.sheet-table.kind-issue tbody td:nth-child(2),
.sheet-table.kind-issue tbody td:nth-child(4) { font-size: 15px; font-weight: 700; }
/* 공통 접두어를 뗀 source 헤더: hover 시 전체 이름(title) 확인 가능함을 점선 밑줄로 힌트. */
.sheet-table th.sheet-src-th[title] { cursor: help; text-decoration: underline dotted; text-underline-offset: 2px; }
/* 다중 source Issue Table: 문제 있는 소스 셀(cpk<1.33 / Yield≠0) 연빨강 강조. */
.sheet-table.kind-issue td.issue-cell-warn { background: #fde2e2 !important; }

/* ── Yield 시트: Bin 접기/펼치기 ── */
.yield-toggle, .issue-toggle {
  border: 1px solid #c7d2e0; background: #eef3fb; color: #1f4d8c;
  border-radius: 3px; font-size: 9px; line-height: 1; padding: 0 2px;
  cursor: pointer; margin-left: 3px; vertical-align: middle;
}
.yield-toggle:hover, .issue-toggle:hover { background: #dbe8fb; }
.sheet-table.kind-yield tbody tr.yield-bin-detail td { background: #fbfcfe; color: #55606c; }
.sheet-table.kind-yield tbody tr.yield-bin-rep td { font-weight: 600; }
.sheet-table.kind-issue tbody tr.issue-bin-detail td { background: #fbfcfe; color: #55606c; }
.sheet-table.kind-issue tbody tr.issue-bin-rep td { font-weight: 600; }
/* Issue Table 상단 sticky 툴바(전체 펼치기/접기) — sheet-wrap 위에 겹치지 않게 고정. */
.issue-toolbar {
  position: sticky; top: var(--sticky-head-h, 96px); z-index: 92;
  background: #fff; padding: 6px 0; display: flex; gap: 8px; align-items: center;
}

/* Yield 탭 전용 다듬기 (다른 sheet-table 은 영향 없음) */
.sheet-wrap.kind-yield { border: 1px solid #d9dfe6; border-radius: 8px; overflow: hidden; }
.sheet-wrap.kind-yield .sheet-table { margin-bottom: 0; }
.sheet-table.kind-yield th {
  background: #eef2f7; text-transform: uppercase; font-size: 10.5px;

}
.sheet-table.kind-yield td.st-num { text-align: right; font-variant-numeric: tabular-nums; }
.sheet-table.kind-yield tbody tr.yield-pass-row td {

}
.sheet-table.kind-yield tbody tr.yield-pass-row:hover td { background: #ddf3e5 !important; }
.sheet-block { margin-bottom: 24px; }
.sheet-block-title {
  font-size: 12px; font-weight: 700; color: #1f4d8c;
  margin: 0 0 6px; padding: 3px 8px;
  background: #eef3fb; border-left: 3px solid #4a90e2; border-radius: 0 4px 4px 0;
}

.text-lines {
  font-size: 13px; color: #333; line-height: 1.7;

}
.text-lines div { padding: 1px 0; }

.placeholder { font-size: 13px; color: #999; padding: 40px 20px; text-align: center; }

/* ── Distribution 산포 탭 (툴바/갤러리/상세) ─────────────────────────────── */
.dist-plot { width: 100%; height: 100%; }   /* Issue Table 미니분포 공용 */
/* Issue Table Bin 상세/미니 분포 셀 (renderDistCell / renderMiniDistCell 공용) */
.dist-cell { position: relative; height: 240px; background: #fff; border: 1px solid #e0e0e0;
  border-radius: 6px; overflow: hidden; }
/* Issue Table 미니 분포 셀: 폭은 td(colWidth issue 스케일)가, 높이는 여기서.
   (예전엔 아래쪽에서 42px 로 덮여 CDF 가 세로로 짤렸음 — 단일 정의로 통합)
   140px → 112px: 사용자 요청으로 0.8배 축소(폭도 colWidth 120→96 로 동시 축소). */
.dist-cell-mini { height: 112px; }
.dist-placeholder { position: absolute; inset: 0; display: flex; align-items: center;
  justify-content: center; color: #bbb; font-size: 12px; }

/* ── Issue Table Map 미니셀 (dist 미니셀과 동일 규격) + 소스별 펼치기 팝오버 ────── */
.map-plot { width: 100%; height: 100%; }
.map-cell-mini { position: relative; height: 112px; background: #fff; border: 1px solid #e0e0e0;
  border-radius: 6px; overflow: hidden; }
.btn-map-expand { position: absolute; top: 2px; right: 2px; z-index: 2;
  border: 1px solid #cbd2da; background: rgba(255,255,255,.85); color: #445;
  border-radius: 4px; font-size: 10px; line-height: 1; padding: 1px 3px; cursor: pointer; }
.btn-map-expand:hover { background: #eef2f7; }
.map-expand-pop { display: flex; gap: 8px; padding: 8px; z-index: 200;
  background: #fff; border: 1px solid #cbd2da; border-radius: 8px;
  box-shadow: 0 6px 20px rgba(0,0,0,.18); overflow-x: auto; }
.map-exp-item { flex: 0 0 auto; }
.map-exp-title { font-size: 11px; color: #475467; margin-bottom: 4px; text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
.map-exp-plot { width: 220px; height: 220px; }

.dist-toolbar { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; flex-wrap: wrap;
  position: sticky; top: var(--sticky-head-h, 96px); z-index: 90; background: #fff; padding: 6px 0; }
.distseg-group { display: inline-flex; border: 1px solid #d0d5dd; border-radius: 6px; overflow: hidden; }
.distseg { border: none; background: #eef1f6; padding: 6px 14px; font-size: 13px; cursor: pointer;
  color: #344054; border-right: 1px solid #cbd2dc; }
.distseg:last-child { border-right: none; }
.distseg.active { background: #5E6AD2; color: #fff; }
.dist-legend { display: inline-flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.dist-leg-item { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #444; }
.dist-leg-sw { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.dist-search-wrap { position: relative; }
.dist-search { padding: 6px 10px; border: 1px solid #d0d5dd; border-radius: 6px; font-size: 13px; width: 240px; }
.dist-suggest { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #e0e0e0;
  border-radius: 6px; margin-top: 4px; max-height: 320px; overflow-y: auto; z-index: 100;
  box-shadow: 0 6px 20px rgba(0,0,0,.12); }
.dist-sug-item { display: flex; gap: 8px; align-items: center; padding: 6px 10px; cursor: pointer; font-size: 12.5px; }
.dist-sug-item:hover { background: #f2f4ff; }
.dist-sug-item .sug-tno { color: #999; min-width: 34px; }
.dist-sug-item .sug-name { flex: 1; font-weight: 600; color: #222; }
.dist-sug-item .dist-sug-chk { margin: 0; }
.dist-count { font-size: 12px; color: #888; }
.distg-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1100px) { .distg-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.distg-card { border: 1px solid #e2e4e8; border-radius: 8px; overflow: hidden; height: 220px;
  display: flex; flex-direction: column; cursor: pointer; transition: box-shadow .12s; }
.distg-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.14); }
/* 검색 제안 클릭으로 이동한 카드 강조(잠깐 깜빡) */
.distg-flash { animation: distgFlash 1.6s ease-out; }
@keyframes distgFlash {
  0%   { box-shadow: 0 0 0 3px rgba(74,144,226,.9); }
  100% { box-shadow: 0 0 0 3px rgba(74,144,226,0); }
}
.distg-head { display: flex; flex-direction: column; gap: 2px; padding: 6px 9px; font-size: 12px;
  border-bottom: 1px solid rgba(0,0,0,.06); background: rgba(255,255,255,.45); }
.distg-line1 { display: flex; align-items: baseline; gap: 6px; }
.distg-line2 { display: flex; align-items: baseline; gap: 6px; }
.distg-tno { color: #999; }
.distg-name { flex: 1; font-weight: 600; color: #1A1A1F; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.distg-cpk { color: #555; font-size: 11.5px; white-space: nowrap; }
.distg-lim { color: #6b7280; font-size: 12px; font-weight: 700; white-space: nowrap; margin-right: 6px; }
.distg-plot { flex: 1; min-height: 0; }
.dist-detail-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap;
  position: sticky; top: var(--sticky-head-h, 96px); z-index: 90; background: #fff; padding: 6px 0; }
.dist-detail-head button { border: 1px solid #b6c0cc; background: #eef1f6; color: #344054; border-radius: 6px;
  padding: 5px 12px; cursor: pointer; font-size: 13px; }
.dist-detail-head button:hover { background: #e3ebfa; border-color: #4a90e2; }
.dist-navpos { font-size: 12px; color: #888; }
.dist-detail-title { margin-left: 8px; font-size: 14px; color: #1A1A1F; }
.dist-detail-body { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.dist-chart-block { border: 1px solid #e2e4e8; border-radius: 8px; padding: 8px 10px; }
.dist-chart-cap { font-size: 12.5px; color: #666; margin-bottom: 4px; }
.dist-chart { width: 100%; height: 420px; }
.dist-loading { font-size: 12px; color: #999; padding: 10px; }
@media (max-width: 900px) { .dist-detail-body { grid-template-columns: 1fr; } }

/* ── Item_detail (콘텐츠 상세 뷰: 헤더 + 통계 + CDF/히스토그램 + Fail rawdata) ── */
.idet-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap;
  position: sticky; top: var(--sticky-head-h, 96px); z-index: 90; background: #fff; padding: 6px 0; }
.idet-title { margin-left: 4px; font-size: 16px; color: #1A1A1F; display: inline-flex;
  align-items: baseline; gap: 8px; flex-wrap: wrap; }
.idet-tno { font-weight: 400; color: #6b7280; font-size: 14px; }
.idet-subject { font-weight: 700; }
.idet-cpk { color: #555; font-size: 13px; white-space: nowrap; }
.idet-lim { color: #1A1A1F; font-size: 18px; font-weight: 700; white-space: nowrap; }
.idet-stat { font-size: 14px; color: #344054; white-space: nowrap; }
.idet-stat b { font-weight: 700; color: #1A1A1F; }
.idet-stat-src { color: #6b7280; font-weight: 600; margin-right: 2px; }
.idet-badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 10px; }
.idet-badge.idet-fail { background: #FDECEC; color: #b42318; }
.idet-badge.idet-cpk_low { background: #FEF9E7; color: #8a6d00; }
.idet-badge.idet-ok { background: #E7F6EC; color: #14703d; }
.idet-navpos { font-size: 12px; color: #888; }
.idet-stats { margin: 0 0 16px; }
.idet-stats table { width: auto; }
.idet-charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 18px; }
.idet-legend { margin: 0 0 10px; }   /* 상세 상단 공용 legend (source 多일 때만 렌더) */
.idet-chart-block { border: 1px solid #e2e4e8; border-radius: 8px; padding: 8px 10px; }
.idet-fail-title { margin-top: 8px; }
/* 히스토그램 블록 Analysis/Report 세그먼트 토글 */
.idet-hist-cap { display: flex; align-items: center; justify-content: space-between; }
.idet-hist-tabs { display: inline-flex; }
.idet-hist-tabs .btn-sm { margin-top: 0; padding: 2px 10px; border-radius: 0; }
.idet-hist-tabs .btn-sm:first-child { border-radius: 8px 0 0 8px; }
.idet-hist-tabs .btn-sm:last-child { border-radius: 0 8px 8px 0; border-left: none; }
.idet-hist-tabs .btn-sm.active { background: #4a90e2; border-color: #4a90e2; color: #fff; }
@media (max-width: 900px) { .idet-charts { grid-template-columns: 1fr; } }
.item-detail-link { color: #2a5db0; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.item-detail-link:hover { color: #17417f; }
/* CDF 칩 편집(제외/강조) 툴바 — 임시(클라이언트), 새로고침/항목이동 시 초기화 */
.cdf-editbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; font-size: 12px; }
.cdf-editbar .cdf-eb-label { color: #6b7280; }
.cdf-editbar .btn-sm.active { background: #4a90e2; border-color: #4a90e2; color: #fff; }
.cdf-editbar .btn-sm.cdf-mode-highlight.active { background: #EF553B; border-color: #EF553B; }
.cdf-editbar .cdf-eb-count { color: #555; margin-left: 4px; }
.cdf-editbar .cdf-eb-hint { color: #9aa0aa; }
.idet-fail-chk-col { width: 34px; text-align: center; }

/* ── Raw Data (web_report lazy-load) ──────────────────────────────────────── */
/* 그리드가 페이지 자체 스크롤을 쓰므로(내부 height 없음), 검색/필터 바와 그 아래 그리드
   헤더(SOURCE/SERIAL/SHOT/DUT...)를 topbar 처럼 sticky 로 고정한다. --rawdata-filters-h 는
   JS(syncRawFiltersHeight)가 실측해 갱신 — 필터 바 높이가 반응형으로 바뀌기 때문. */
.rawdata-filters {
  display: flex; flex-direction: column; align-items: stretch; gap: 6px; margin-bottom: 12px;
  position: sticky; top: var(--sticky-head-h, 96px); z-index: 95; background: #fff; padding: 6px 0;
}
/* 세로 2칸: 위=항목검색/전체선택/source/재생성, 아래=serial·dut/bin/조회/failitem */
.rawdata-filters-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rawdata-filters input, .rawdata-filters select {
  padding: 5px 8px; border: 1px solid #d0d5dd; border-radius: 4px; font-size: 9px;
}
#rawItemSearch { width: 180px; }
.rawdata-filters .rawdata-regen { margin-left: auto; }
.rawdata-filters .btn-sm.active { background: #4a90e2; border-color: #4a90e2; color: #fff; }
/* Tabulator 가 #rawDataGridHost 안에 만드는 루트 .tabulator 는 벤더 CSS 에서 무조건
   overflow:hidden + transform:translateZ(0) 를 건다 — 이 둘은 각각 독립적으로 후손의
   position:sticky 를 무력화한다(overflow!=visible 은 sticky 후손을 그 조상 스크롤 박스
   안에 가두고, transform!=none 은 새 containing block 을 만들어 sticky/fixed 후손을 가둠).
   #rawDataGridHost 로 범위를 좁혀 무효화한다 — 전역 .tabulator 를 건드리면 height:62vh 로
   내부 스크롤을 쓰는 #yieldGridHost(Yield 탭)가 깨진다. position:relative 는 그대로 둔다 —
   sticky 를 막지 않고, Tabulator 내부 절대위치 요소(컬럼 리사이즈 핸들, selectableRange
   오버레이, 셀 에디터)의 containing block 으로 필요하다. */
/* Tabulator 는 이 루트 클래스를 별도 자식 div 가 아니라 #rawDataGridHost 자기 자신에
   직접 붙인다 — 자손 선택자(#rawDataGridHost .tabulator)는 매칭되지 않아 무효했다.
   같은 엘리먼트 선택자(#rawDataGridHost.tabulator)를 추가해 실제로 적용되게 한다. */
#rawDataGridHost.tabulator, #rawDataGridHost .tabulator {
  overflow: visible;
  transform: none;
  -webkit-transform: none;
  -moz-transform: none;
  -ms-transform: none;
  -o-transform: none;
}
:root { --rawdata-hscroll-h: 16px; }
/* 실제 가로 스크롤을 담당하는 .tabulator-tableholder(overflow:auto, 높이 무제한)의 네이티브
   스크롤바는 ~1000행짜리 표의 맨 아래에 생겨 접근하기 불편하므로, 아래 .rawdata-hscroll
   프록시 스크롤바로 대체하고 네이티브 것은 시각적으로 숨긴다(overflow-x:auto 자체는 유지되므로
   휠/트랙패드/프로그램적 scrollLeft 로 계속 스크롤 가능 — JS 는 report_view.html 스크립트 쪽
   syncRawHscrollSpacer/runRawDataQuery 참조). */
.rawdata-hscroll {
  position: sticky;
  top: calc(var(--sticky-head-h, 96px) + var(--rawdata-filters-h, 0px));
  z-index: 92;
  height: var(--rawdata-hscroll-h);
  overflow-x: auto;
  overflow-y: hidden;
  background: #fff;
}
.rawdata-hscroll-spacer { height: 1px; }  /* 폭만 JS 로 실제 스크롤 폭에 맞춰 갱신 */
#rawDataGridHost .tabulator-header {
  position: sticky;
  top: calc(var(--sticky-head-h, 96px) + var(--rawdata-filters-h, 0px) + var(--rawdata-hscroll-h));
  z-index: 90;
}
#rawDataGridHost .tabulator-tableholder {
  scrollbar-width: none;
  -ms-overflow-style: none;
}
#rawDataGridHost .tabulator-tableholder::-webkit-scrollbar { display: none; }
.rawdata-selcount { font-size: 9px; color: #666; margin-left: auto; }
.rawdata-body { display: flex; gap: 16px; align-items: flex-start; }
.rawdata-cols {
  flex: 0 0 240px; border: 1px solid #eef0f3; border-radius: 6px; padding: 8px; background: #fff;
  position: sticky; top: calc(var(--sticky-head-h, 96px) + var(--rawdata-filters-h, 0px));
  align-self: flex-start;
}
/* 항목검색/전체선택은 상단 sticky 필터바로 이동 — 여기 목록은 그 아래에서 독립 스크롤. */
.rawdata-cols-scroll {
  max-height: calc(100vh - var(--sticky-head-h, 96px) - var(--rawdata-filters-h, 0px) - 40px);
  overflow-y: auto;
}
/* 스크롤은 상위 .rawdata-cols-scroll 이 담당 — 목록 자체는 내부 스크롤을 두지 않는다. */
.rawdata-item {
  display: block; width: 100%; text-align: left; font-size: 9px; padding: 4px 8px;
  margin: 2px 0; cursor: pointer; border: 1px solid #d0d7de; border-radius: 4px;
  background: #fff; color: #222;
}
/* :not(.selected) 필수 — 없으면 이 규칙(클래스 3개 상당)이 .rawdata-item.selected(클래스 2개)
   보다 우선해 선택된 항목에 마우스를 올릴 때 배경만 밝게 덮어써 흰 글자가 안 보이게 된다. */

<script>
const SESSION_ID = location.pathname.split("/").pop();
const YIELD_COLS = ["item_name", "bin_number", "yield_percent", "fail_count",
                    "cpk_val", "mean_val", "stdev_val", "lsl", "usl", "unit"];

// ── 없는 sheet 용 기본 표 골격(frame) ──────────────────────────────────────────
// 업로드 xlsx 에 해당 sheet 가 없으면 헤더만 있는 빈 표(헤더 + 빈 행 1개)를 보여준다.
// 동적 source 열({src}_count/_yield)은 sheet 가 없으면 알 수 없으므로 정적 열만 포함.
// 헤더 값은 생성기 client/report_generator/xlsx_writer.py 레이아웃과 일치.
const YIELD_FRAME_COLS = ["step", "bin", "TNO", "Item", "avg", "comment"];
const ISSUE_FRAME_COLS = ["Step", "Bin", "TNO", "Item", "avg", "Distribution",
                          "PTE comment", "개발 comment"];
const SUMMARY_FRAME_BLOCKS = [
  { label: "1. Device Feature",
    headers: ["DEVICE", "Customer", "PKG_Type", "GrossDie", "Process Line", "EVT_Version"] },
  { label: "2. Yield",
    headers: ["Lot NO", "Yield", "Major Fail Bins", "Comment"] },
  { label: "3. Evaluation Summary",
    headers: ["Category", "Condition & Judge Limit", "Result"] },
];

// 헤더+빈 행 1개용 행 객체 (모든 열 빈 문자열)
function frameRow(cols) { const o = {}; cols.forEach(c => { o[c] = ""; }); return o; }
// summary blocks frame: 블록마다 빈 행 1개
function summaryFrameData() {
  return { blocks: SUMMARY_FRAME_BLOCKS.map(b => ({
    label: b.label, headers: b.headers, rows: [b.headers.map(() => "")] })) };
}

// legacy summary dict 에 표시할 의미있는 내용이 있는지 (title 단독은 제외)
function summaryDictHasContent(st) {
  if (!st || typeof st !== "object") return false;
  return !!((st.feature && Object.keys(st.feature).length) ||
            (Array.isArray(st.yield_summary_text) && st.yield_summary_text.length) ||
            (Array.isArray(st.major_fail_bins) && st.major_fail_bins.length) ||
            (st.evaluation && Object.keys(st.evaluation).length) ||
            (Array.isArray(st.raw_rows) && st.raw_rows.length));
}

// 표 3종이 "정말로 비었을 때"만 frame 구조로 시드 → 보기/수정/저장이 신규 포맷 경로를 탄다.
// 판정 조건은 각 render* 의 emptyPanel fall-through 와 동일.
function seedEmptyFrames() {
  if (!DATA) return;
  const summaryRows = DATA.summary;

  // summary: blocks/grid 아니고 legacy dict 내용도 summary_rows 도 없을 때
  if (!isSummaryBlocks(DATA.summary_text) && !isGrid(DATA.summary_text) &&
      !summaryDictHasContent(DATA.summary_text) &&
      !(Array.isArray(summaryRows) && summaryRows.length)) {
    DATA.summary_text = summaryFrameData();
  }

  // yield: yield_text(list/grid) 미사용 그리고 legacy summary_rows 도 없을 때
  if (!(Array.isArray(DATA.yield_text) && DATA.yield_text.length) &&
      !isGrid(DATA.yield_text) &&
      !(Array.isArray(summaryRows) && summaryRows.length)) {
    DATA.yield_text = [frameRow(YIELD_FRAME_COLS)];
  }

  // issue: issue_table_text(list/grid) 미사용일 때
  if (!(Array.isArray(DATA.issue_table_text) && DATA.issue_table_text.length) &&
      !isGrid(DATA.issue_table_text)) {
    DATA.issue_table_text = [frameRow(ISSUE_FRAME_COLS)];
  }
}

// CSRF: 서버가 /view 응답에 내려준 double-submit 쿠키를 읽어 변경요청 헤더로 되돌려준다.
function csrfToken() {
  const m = document.cookie.match(/(?:^|;\s*)report_csrf=([^;]+)/);
  return m ? decodeURIComponent(m[1]) : "";
}

let DATA = null;
function isWebReportSession() {
  return !!(DATA && DATA.session && DATA.session.source === "web_report");
}
// 세션 분석 모드(Normal/Compare/DUT/Commonality). 세션 DB 컬럼이 authoritative.
function webReportMode() {
  return (((DATA && DATA.session && DATA.session.mode) || "Normal") + "").trim();
}
// 편집 권한: 로그인 ID 가 세션 업로더와 같을 때만 "edit" (업로더 기록 없는 legacy 는
// 로그인만 하면 허용). 그 외에는 "view" — 흩어진 MODE==="edit" 분기가 읽기전용으로 렌더.
// 로그인은 검색결과 페이지에서 수행하고, 서버가 편집 라우트에서 같은 규칙으로 재검증한다.
let MODE = "view";
let LOGIN_USER = "";            // /api/auth/me 결과 (비로그인이면 "")
let verifiedPassword = "";      // (구 PIN 흐름 잔재 — 저장 payload 호환용, 항상 "")

async function loadAuth() {
  try {
    const res = await fetch("/pe/report/api/auth/me");
    if (res.ok) LOGIN_USER = (await res.json()).user_id || "";
  } catch (e) { LOGIN_USER = ""; }
}

// uploaded_by 는 'DOMAIN\user' 또는 'user' 형식이라 뒷부분만 비교.
function canEditSession() {
  if (!LOGIN_USER) return false;
  const ub = String((DATA && DATA.session && DATA.session.uploaded_by) || "");
  if (!ub) return true;
  return ub.split("\\").pop().trim().toLowerCase() === LOGIN_USER;
}
let yieldGrid = null;           // 수정 모드 Yield 편집 Tabulator 인스턴스 (없으면 null)


// & < > " ' 모두 이스케이프 → 텍스트/속성 양쪽에서 안전
function esc(v) {
  return String(v ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function fmtDate(unix) {
  if (!unix) return "-";
  const d = new Date(unix * 1000);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function showToast(msg, ms=2200) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), ms);
}

function splitLines(v) {
  const a = (v || "").split("\n");
  while (a.length && a[a.length - 1].trim() === "") a.pop();
  return a;
}

// ── 라이트/다크 테마 토글 (head 부트스트랩이 저장값을 먼저 적용해 둔 상태) ──
(function () {
  const btn = document.getElementById("themeToggle");
  if (!btn) return;
  const root = document.documentElement;
  function syncThemeBtn() {
    const dark = root.getAttribute("data-theme") === "dark";
    btn.textContent = dark ? "☀️" : "🌙";
    btn.title = dark ? "라이트 모드로 전환" : "다크 모드로 전환";
  }
  btn.addEventListener("click", () => {
    const toDark = root.getAttribute("data-theme") !== "dark";
    if (toDark) root.setAttribute("data-theme", "dark");
    else root.removeAttribute("data-theme");
    try {
      if (toDark) localStorage.setItem("report_theme", "dark");
      else localStorage.removeItem("report_theme");
    } catch (e) {}
    syncThemeBtn();
  });
  syncThemeBtn();
})();

// ── tab switching ──────────────────────────────────────────────────────────
document.getElementById("tabs").addEventListener("click", e => {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  const tab = btn.dataset.tab;
  hideItemDetail();   // Item_detail 열려 있으면 닫고 해당 탭으로
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b === btn));
  document.querySelectorAll(".panel").forEach(p =>
    p.classList.toggle("active", p.id === `panel-${tab}`));
  // lazy 렌더: 아직 안 그려진(dirty) 탭이면 이 시점에 렌더 (프리렌더가 이미 그렸으면 no-op)
  renderTab(tab);
  // 숨김 상태에서 그려진 Plotly 차트는 0px 로 렌더되므로 활성화 시 리사이즈
  const active = document.getElementById(`panel-${tab}`);
  if (active && window.Plotly) {
    active.querySelectorAll(".js-plotly-plot").forEach(d => { try { Plotly.Plots.resize(d); } catch (e) {} });
  }
  // 프리렌더가 숨김(display:none) 상태에서 그렸으면 헤더 상단행 높이가 0으로 측정되므로,
  // 보이는 시점에 다시 실측한다.
  if (tab === "issues" && active) syncIssueHeadRowHeight(active);
});

// ── topbar meta ──────────────────────────────────────────────────────────────
function renderMeta(session) {
  const pt = (session.product_type || "").trim();
  const ptCls = ["MDDI", "PDDI", "PMIC", "SECURITY", "TCON"].includes(pt) ? pt : "default";
  const sourceFiles = ((DATA && DATA.web_report && DATA.web_report.sources) || [])
    .map(s => s.file_name || s.name).filter(Boolean);
  const fname = sourceFiles[0] || session.file_name || "-";
  const fnameTitle = sourceFiles.length > 1 ? sourceFiles.join("\n") : fname;
  // 분석 모드 배지: web_report 세션이고 Normal 이 아닐 때만 표시 (Normal 은 기본이라 생략).
  const mode = (session.mode || "Normal").trim();
  const modeBadge = (isWebReportSession() && mode && mode !== "Normal")
    ? `<span class="mode-badge ${esc(mode)}" title="분석 모드">${esc(mode)}</span>` : "";
  const line1 = [
    `<span class="pt-badge ${ptCls}">${esc(pt || "-")}</span>`,
    modeBadge,
    `<span class="meta-inline"><span class="mk">Product</span>${esc(session.product || "-")}</span>`,
    `<span class="meta-inline"><span class="mk">Revision</span>${esc(session.revision || "-")}</span>`,
    `<span class="meta-inline"><span class="mk">Process</span>${esc(session.process || "-")}</span>`,
    `<span class="meta-inline"><span class="mk">LOT</span>${esc(session.lot_id || "-")}</span>`,
  ];
  const line2 = [
    `<span class="meta-inline-file" title="${esc(fnameTitle)}"><span class="mk">Filename</span>${esc(fname)}</span>`,
    `<span class="meta-inline" title="${esc(session.client_host || "")}"><span class="mk">Uploader</span>${esc(session.uploaded_by || "-")}</span>`,
    `<span class="meta-inline"><span class="mk">Uploaded</span>${esc(fmtDate(session.created_at))}</span>`,
    `<span class="meta-inline"><span class="mk">Status</span>${esc(session.status || "-")}</span>`,
  ];
  document.getElementById("topbarMeta").innerHTML =
    `<div class="meta-row">${line1.join("")}</div><div class="meta-row">${line2.join("")}</div>`;
  updateImportantBtn(session);
  updatePrivateBtn(session);
  syncTabVisibility();
  syncStickyHeadHeight();
}

function updateImportantBtn(session) {
  const btn = document.getElementById("btnImportant");
  if (!btn) return;
  const on = !!(session && session.is_important);
  btn.classList.toggle("active", on);
  btn.textContent = on ? "★" : "☆";
  btn.title = on
    ? "중요 표시됨 — 자동삭제 제외 (클릭 시 해제)"
    : "중요 표시(오래된 세션 자동삭제에서 제외)";
}

function updatePrivateBtn(session) {
  const btn = document.getElementById("btnPrivate");
  if (!btn) return;
  const on = !!(session && session.is_private);
  btn.classList.toggle("active", on);
  btn.textContent = on ? "🔒" : "🔓";
  btn.title = on ? "비공개 표시됨 (클릭 시 공개로)" : "비공개 표시(클릭 시 비공개로)";
}

// web_report 전용 데이터로만 채워지는 탭(CPK/Map Analysis)은 legacy(xlsx_upload)
// 세션에서 항상 빈 화면이므로 탭 버튼 자체를 숨긴다. 숨긴 탭이 활성 상태였으면 Summary 로 전환.
// (Raw Data 탭은 제거됨 — rawdata 편집은 Honey 사이드바 'Rawdata 수정'(Excel) 으로 이관.)
const WEB_REPORT_ONLY_TABS = ["cpk", "map-analysis"];

function syncTabVisibility() {
  const web = isWebReportSession();
  // 1) web_report 전용 탭: 비-web 세션에서 숨김
  WEB_REPORT_ONLY_TABS.forEach(name => {
    const btn = document.querySelector(`.tab[data-tab="${name}"]`);
    if (btn) btn.style.display = web ? "" : "none";
  });
  // 1b) 모드 전용 탭: Compare/Commonality 는 각 모드(web_report)에서만 표시.
  const modeNow = web ? webReportMode() : "Normal";
  const compareBtn = document.querySelector('.tab[data-tab="compare"]');
  if (compareBtn) compareBtn.style.display = (modeNow === "Compare") ? "" : "none";
  // 2) 활성 탭이 숨겨졌으면 첫 번째로 보이는 탭으로 전환
  const activeBtn = document.querySelector(".tab.active");
  if (activeBtn && activeBtn.style.display === "none") {
    const firstVisible = [...document.querySelectorAll(".tab")].find(b => b.style.display !== "none");
    if (firstVisible) {
      const name = firstVisible.dataset.tab;
      document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b === firstVisible));
      document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === `panel-${name}`));
      renderTab(name);   // lazy 렌더에서 강제 전환된 탭이 dirty 로 남지 않도록
    }
  }
}

// topbar 가 1줄/2줄로 실제 렌더 높이가 바뀌므로, 그 아래 붙는 sticky 요소(rawdata-cols 등)가
// 참조할 --sticky-head-h 를 매번 실측해 갱신한다 (매직넘버 고정값 대신).
function syncStickyHeadHeight() {
  const head = document.getElementById("stickyHead");
  if (head) document.documentElement.style.setProperty("--sticky-head-h", `${head.offsetHeight}px`);
}
window.addEventListener("resize", syncStickyHeadHeight);

// Raw Data 검색/필터 바(.rawdata-filters) 도 반응형으로 줄바꿈되어 높이가 바뀌므로,
// 그 아래 sticky 로 고정하는 그리드 헤더가 참조할 --rawdata-filters-h 를 실측해 갱신한다.
function syncRawFiltersHeight() {
  const bar = document.querySelector(".rawdata-filters");
  document.documentElement.style.setProperty("--rawdata-filters-h", `${bar ? bar.offsetHeight : 0}px`);
}
window.addEventListener("resize", syncRawFiltersHeight);

// Raw Data 그리드의 실제 가로 스크롤 폭(.tabulator-tableholder.scrollWidth)을 프록시
// 스크롤바(#rawDataHscroll 안의 스페이서)의 폭에 반영한다. 컬럼 리사이즈/윈도우 리사이즈/
// 그리드 재빌드 시마다 다시 불러야 한다 — 프록시 자체의 높이는 우리가 만든 고정 크기 UI라
// CSS 리터럴(--rawdata-hscroll-h)로 충분하고, 실측이 필요한 건 폭뿐이다.
function syncRawHscrollSpacer() {
  const spacer = document.getElementById("rawDataHscrollSpacer");
  const holder = document.querySelector("#rawDataGridHost .tabulator-tableholder");
  if (!spacer) return;
  spacer.style.width = holder ? `${holder.scrollWidth}px` : "0px";
}
window.addEventListener("resize", syncRawHscrollSpacer);

// ── read-only helpers ────────────────────────────────────────────────────────
function emptyPanel(panel, msg) {
  panel.innerHTML = `<div class="placeholder">${esc(msg)}</div>`;
}

function deriveCols(rows) {
  const seen = [];
  (rows || []).forEach(r => Object.keys(r || {}).forEach(k => { if (!seen.includes(k)) seen.push(k); }));
  return seen;
}

// ── grid model 렌더 (xlsx 원형 재현) ─────────────────────────────────────────
function isGrid(o) { return !!(o && typeof o === "object" && Array.isArray(o.cells)); }

// 편집된 grid DOM → 원본 grid 복제본에 셀 텍스트만 반영 (legacy 저장 경로 전용)
function collectGrid(panelEl, baseGrid) {
  if (!isGrid(baseGrid)) return baseGrid;
  const out = JSON.parse(JSON.stringify(baseGrid));
  panelEl.querySelectorAll("td[data-r]").forEach(td => {
    const r = +td.dataset.r, c = +td.dataset.c;
    if (out.cells[r] && out.cells[r][c]) out.cells[r][c].t = td.textContent;
  });
  return out;
}

// ── sheet-table 렌더 (xlsx 텍스트 데이터 원형 재현) ──────────────────────────

// 열 이름 → 고정 너비(px) — xlsx 실측 기준 패턴.
// kind==="issue" 이면 Issue Table 은 Distribution 셀을 크게 보여줘야 해 전체 컬럼을 1.5배로 키운다.
function colWidth(name, kind) {
  const n = String(name || "").toLowerCase().trim();
  const s = kind === "issue" ? 1.5 : 1;   // Issue Table 전체 1.5배 확대
  const px = base => `${Math.round(base * s)}px`;
  // Step/Bin 은 최대 3자리라 아주 좁게, TNO 는 조금 넓게, avg/yield 는 xx.xx 라 짧게.
  if (n === "step")                     return px(44);
  if (n === "bin")                      return px(44);
  if (n === "tno")                      return px(60);
  if (n === "map")                      return px(96);   // Distribution 과 동일 폭
  if (n === "distribution")             return px(96);   // 기존 120 의 0.8배
  if (n.endsWith("_count"))             return px(60);
  if (n.endsWith("_yield"))             return px(60);
  if (n === "avg")                      return px(48);
  if (n === "item")                     return px(150);
  if (n === "category")                 return "50px";
  if (n === "condition & judge limit")  return "185px";
  if (n === "result")                   return "80px";
  if (n.includes("comment"))            return px(220);
  return px(80);
}

// 값이 숫자인지 (td 정렬용)
function isNumVal(v) { return v !== null && v !== undefined && v !== "" && !isNaN(+v); }

function isDistCol(c) { return String(c || "").toLowerCase() === "distribution"; }
function isMapCol(c) { return String(c || "").toLowerCase() === "map"; }

// web_report Map Analysis 소스(웨이퍼) 개수 — 2개 이상일 때만 Map 셀 펼치기 버튼 노출.
function mapSourceCount() {
  const maps = (webReportSheets() || {})["Map Analysis"];
  return Array.isArray(maps) ? maps.length : 0;
}

// 열 순서 보정: 고정 prefix 컬럼(step/bin/tno/item, issue 는 category 포함 avg 까지)
// → 지정 순서로 맨 앞에 배치(대소문자 무시), comment 류 → 최우측. 나머지 상대순서 유지.
// yield: source 별 yield 값 → source 별 _cnt/_count → avg 순으로 그루핑.
function orderColumns(cols, kind) {
  const isComment = c => /comment/i.test(String(c));

  const comments = cols.filter(isComment);
  // Issue Table 은 Category 컬럼을 화면에 표시하지 않는다(섹션 구분은 상단 고정 헤더 라벨이 담당).
  // 단 rows 의 Category 데이터 필드는 섹션 판정(rowSection)에 그대로 쓰이므로 여기서 컬럼만 뺀다.
  let rest = cols.filter(c => !isComment(c)
    && !(kind === "issue" && String(c).trim().toLowerCase() === "category")
    && !/^_(grp|detail|ndetail)$/.test(String(c)));   // 토글 전용 내부 마킹 필드 제외

  // source(={src}_yield 컬럼 수)가 1개면 avg 는 그 source 값과 동일해 의미가 없으므로
  // Yield/Issue 표에서 avg 컬럼을 표시하지 않는다(행 데이터의 avg 값은 그대로 유지 —
  // Issue Table CPK subhead 감지가 avg 값에 의존). 2개 이상(compare/DUT 포함)이면 표시.
  const singleSource = rest.filter(c => /_yield$/i.test(String(c))).length <= 1;

  const PREFIX_ORDER = {
    yield: ["step", "bin", "tno", "item"],
    issue: ["step", "bin", "tno", "item"],
  };
  const prefix = PREFIX_ORDER[kind];
  if (prefix) {
    const lower = c => String(c).trim().toLowerCase();
    const front = [];
    prefix.forEach(p => {
      const idx = rest.findIndex(c => lower(c) === p);
      if (idx !== -1) front.push(rest.splice(idx, 1)[0]);
    });
    rest = front.concat(rest);
  }

  if (kind === "yield") {
    const isCntCol = c => /_(cnt|count)$/i.test(String(c));
    const isAvgCol = c => String(c).trim().toLowerCase() === "avg";
    const yieldVals = rest.filter(c => !isCntCol(c) && !isAvgCol(c));
    const cntVals = rest.filter(isCntCol);
    const avgVals = singleSource ? [] : rest.filter(isAvgCol);
    rest = yieldVals.concat(cntVals).concat(avgVals);
  }

  if (kind === "issue") {
    // 식별컬럼 뒤: Map → Distribution → Avg → source별 yield 순. (Avg 는 yield 그룹 헤더 아래로 묶임)
    const isMap = c => String(c).trim().toLowerCase() === "map";
    const isDist = c => String(c).trim().toLowerCase() === "distribution";
    const isAvgCol = c => String(c).trim().toLowerCase() === "avg";
    const isYieldCol = c => /_yield$/i.test(String(c));
    const map = rest.filter(isMap);
    const dist = rest.filter(isDist);
    const avg = singleSource ? [] : rest.filter(isAvgCol);
    const yields = rest.filter(isYieldCol);
    const others = rest.filter(c => !isMap(c) && !isDist(c) && !isAvgCol(c) && !isYieldCol(c));
    rest = others.concat(map).concat(dist).concat(avg).concat(yields);
  }

  return rest.concat(comments);
}

// 빈 헤더 placeholder(_colN)는 화면엔 빈칸으로
function headerLabel(c) { return /^_col\d+$/.test(String(c)) ? "" : c; }

// _yield/_count 처럼 소스별로 반복되는 컬럼이 연속 2개 이상 묶이면 상단에 "yield"/"count"
// 병합 헤더 + 하단에 접미사를 뗀 소스 짧은 이름을 보여주는 2행 헤더를 만든다.
// 그런 묶음이 없으면(소스 1개뿐이거나 다른 시트) 기존과 동일한 1행 헤더를 그대로 렌더.
const SHEET_HEADER_SUFFIX_GROUPS = [
  { re: /_yield$/i, label: "yield" },
  { re: /_(cnt|count)$/i, label: "count" },
];
function sheetHeaderShortLabel(c) {
  return headerLabel(c).replace(/_(yield|cnt|count)$/i, "");
}
// 화면 표시용 헤더 라벨 (avg → Avg 등).
function displayLabel(c) {
  const n = String(c).trim().toLowerCase();
  if (n === "avg") return "Avg";
  return headerLabel(c);
}
// 여러 source 이름을 "…" + 이름 끝 3글자로 축약한다 (사용자 요청 — 소스 이름은 보통
// 끝부분에서 달라지므로 구분 유지). 이름이 4글자 이하면 그대로 둔다. hover 로 전체이름 확인.
function abbrevSourceLabels(fulls) {
  if (!fulls || fulls.length < 2) return (fulls || []).map(f => ({ short: f, full: f }));
  return fulls.map(full =>
    (full.length <= 4) ? { short: full, full } : { short: "…" + full.slice(-3), full });
}
function buildSheetTableHead(cols) {
  const isAvgCol = c => String(c).trim().toLowerCase() === "avg";
  // avg 컬럼이 _yield 그룹 바로 앞에 오면 그 yield 그룹에 흡수(= "yield" 헤더 아래 "Avg" 열).
  const groupOf = c => SHEET_HEADER_SUFFIX_GROUPS.find(g => g.re.test(String(c)));
  const groupKeyAt = i =>
    groupOf(cols[i]) ||
    ((isAvgCol(cols[i]) && i + 1 < cols.length && /_yield$/i.test(String(cols[i + 1])))
      ? SHEET_HEADER_SUFFIX_GROUPS[0] : null);
  const runs = [];
  for (let i = 0; i < cols.length; ) {
    const g = groupKeyAt(i);
    let j = i + 1;
    if (g) { while (j < cols.length && groupKeyAt(j) === g) j++; }
    runs.push({ start: i, len: j - i, group: (g && (j - i) >= 2) ? g : null });
    i = j;
  }
  if (!runs.some(r => r.group)) {
    return "<thead><tr>" + cols.map(c => `<th>${esc(displayLabel(c))}</th>`).join("") + "</tr></thead>";
  }
  const topRow = runs.map(r => r.group
    ? `<th colspan="${r.len}" class="sheet-group-th">${esc(r.group.label)}</th>`
    : `<th rowspan="2">${esc(displayLabel(cols[r.start]))}</th>`
  ).join("");
  const botRow = runs.filter(r => r.group).map(r => {
    const runCols = cols.slice(r.start, r.start + r.len);
    // source 컬럼만 뽑아 공통 뒤글자로 축약(avg 는 "Avg" 고정 라벨).
    const srcCols = runCols.filter(c => !isAvgCol(c));
    const abbr = abbrevSourceLabels(srcCols.map(sheetHeaderShortLabel));
    const abbrByCol = {};
    srcCols.forEach((c, i) => { abbrByCol[c] = abbr[i]; });
    return runCols.map(c => {
      if (isAvgCol(c)) return `<th>Avg</th>`;
      const a = abbrByCol[c];
      const titleAttr = a.short !== a.full ? ` title="${esc(a.full)}"` : "";
      return `<th class="sheet-src-th"${titleAttr}>${esc(a.short)}</th>`;
    }).join("");
  }).join("");
  return `<thead><tr>${topRow}</tr><tr>${botRow}</tr></thead>`;
}

// 반복 섹션 헤더 행(yield의 P1/P2/P3 구간별 헤더) 감지: 셀 값이 자기 컬럼명과
// 동일한 비율이 높으면 "헤더가 데이터로 들어간" 행으로 판단.
function isHeaderLikeRow(r, cols) {
  if (!r) return false;
  let total = 0, matches = 0;
  for (const c of cols) {
    const name = String(c).trim().toLowerCase();
    if (!name || /^_col\d+$/.test(name)) continue;
    total++;
    const v = r[c];
    const txt = (v === null || v === undefined) ? "" : String(v).trim().toLowerCase();
    if (txt === name) matches++;
  }
  return total > 0 && (matches / total) >= 0.6;
}

// issue_table 의 CPK 카테고리 전환 행("item name" / "cpk" 서브헤더) 감지.
function isCpkSubheadRow(r) {
  if (!r) return false;
  const cat = String(r["Category"] ?? "").trim().toLowerCase();
  const avg = String(r["avg"] ?? "").trim().toLowerCase();
  return cat === "cpk" && avg === "cpk";
}

// yield 행 정렬(보기 전용): step 별 섹션(반복 헤더 행으로 구분) 안에서
// Bin1(PASS) 행을 맨 위에 두고, 나머지는 avg 내림차순. 합계(Sum) 행은 섹션 끝 유지.
function reorderYieldRows(rows, cols) {
  if (!rows || rows.length < 2) return rows || [];
  const binCol = cols.find(c => String(c).trim().toLowerCase() === "bin");
  const avgCol = cols.find(c => String(c).trim().toLowerCase() === "avg");
  if (!binCol || !avgCol) return rows;

  const firstCol = cols[0];
  const isPassBin = r => String((r ? r[binCol] : "") ?? "").trim() === "1";
  const isSumRow = r => String((r ? r[firstCol] : "") ?? "").trim().toLowerCase() === "sum";

  const out = [];
  let section = [];
  const flushSection = () => {
    if (!section.length) return;
    const sumRows = section.filter(isSumRow);
    const dataRows = section.filter(r => !isSumRow(r));
    const passRows = dataRows.filter(isPassBin);
    const restRows = dataRows.filter(r => !isPassBin(r))
      .slice()
      .sort((a, b) => (parseFloat(b[avgCol]) || 0) - (parseFloat(a[avgCol]) || 0));
    out.push(...passRows, ...restRows, ...sumRows);
    section = [];
  };

  rows.forEach(r => {
    if (isHeaderLikeRow(r, cols)) {
      flushSection();
      out.push(r);
    } else {
      section.push(r);
    }
  });
  flushSection();
  return out;
}

/**
 * rows(list of dict) → HTML sheet-table.
 * opts: { edit, kind:"yield"|"issue", columns:[...] }
 *  - columns: 명시적 열 목록(있으면 derive·정렬 생략, 순서 그대로).
 *    데이터행이 없어도 헤더는 항상 렌더 → 내용 없는 컬럼도 유지.
 *  - kind: comment 최우측 / (issue) category 최좌측 정렬.
 */
// Issue Table comment 저장용 행 식별 키 — 백엔드 web_report/tabs/issue_table.py 의
// manifest.issue_comments 키 규칙과 반드시 동일해야 한다:
// Yield 행 "Yield|<bin>|<item>", CPK 데이터 행 "CPK|<item>", ETC 데이터 행 "ETC|<item>".
function issueRowKey(r, section) {
  const item = String((r && r["Item"]) ?? "");
  if (!item.trim()) return "";
  if (section === "Yield") return `Yield|${String((r && r["Bin"]) ?? "")}|${item}`;
  if (section === "CPK") return `CPK|${item}`;
  if (section === "ETC") return `ETC|${item}`;
  return "";
}

// Issue Table 섹션별 2행 헤더 블록. 컬럼 구조(식별/Distribution/Avg+source/comment)는 세 섹션이
// 동일하고, 그룹 라벨(yield/cpk/etc)과 Avg 라벨(Avg↔cpk)만 섹션마다 다르다. buildSheetTableHead
// 의 run 로직을 그대로 따르되 라벨만 섹션값으로 채워 <tr.issue-shead-top>/<tr.issue-shead-bot>
// 두 줄을 만든다(둘 다 sticky top 으로 통째 고정).
const ISSUE_SECTION_LABELS = {
  Yield: { group: "yield", avg: "Avg" },
  CPK:   { group: "cpk",   avg: "cpk" },
  ETC:   { group: "etc",   avg: "Avg" },
};
function issueSectionHeadRowsHtml(cols, sec) {
  const lab = ISSUE_SECTION_LABELS[sec] || ISSUE_SECTION_LABELS.Yield;
  const isAvgCol = c => String(c).trim().toLowerCase() === "avg";
  const groupOf = c => SHEET_HEADER_SUFFIX_GROUPS.find(g => g.re.test(String(c)));
  const groupKeyAt = i =>
    groupOf(cols[i]) ||
    ((isAvgCol(cols[i]) && i + 1 < cols.length && /_yield$/i.test(String(cols[i + 1])))
      ? SHEET_HEADER_SUFFIX_GROUPS[0] : null);
  const runs = [];
  for (let i = 0; i < cols.length; ) {
    const g = groupKeyAt(i);
    let j = i + 1;
    if (g) { while (j < cols.length && groupKeyAt(j) === g) j++; }
    runs.push({ start: i, len: j - i, group: (g && (j - i) >= 2) ? g : null });
    i = j;
  }
  if (!runs.some(r => r.group)) {
    return `<tr class="issue-shead-top" data-sec="${esc(sec)}">` +
      cols.map(c => `<th>${esc(displayLabel(c))}</th>`).join("") + `</tr>`;
  }
  const topRow = runs.map(r => r.group
    ? `<th colspan="${r.len}" class="sheet-group-th">${esc(lab.group)}</th>`
    : `<th rowspan="2">${esc(displayLabel(cols[r.start]))}</th>`
  ).join("");
  const botRow = runs.filter(r => r.group).map(r => {
    const runCols = cols.slice(r.start, r.start + r.len);
    const srcCols = runCols.filter(c => !isAvgCol(c));
    const abbr = abbrevSourceLabels(srcCols.map(sheetHeaderShortLabel));
    const abbrByCol = {};
    srcCols.forEach((c, i) => { abbrByCol[c] = abbr[i]; });
    return runCols.map(c => {
      if (isAvgCol(c)) return `<th>${esc(lab.avg)}</th>`;
      const a = abbrByCol[c];
      const titleAttr = a.short !== a.full ? ` title="${esc(a.full)}"` : "";
      return `<th class="sheet-src-th"${titleAttr}>${esc(a.short)}</th>`;
    }).join("");
  }).join("");
  return `<tr class="issue-shead-top" data-sec="${esc(sec)}">${topRow}</tr><tr class="issue-shead-bot">${botRow}</tr>`;
}

function renderSheetTable(rows, opts) {
  opts = opts || {};
  let cols;
  if (opts.columns && opts.columns.length) {
    cols = opts.columns.slice();
  } else {
    if (!rows || !rows.length) return "";
    cols = [];
    rows.forEach(r => Object.keys(r || {}).forEach(k => { if (!cols.includes(k)) cols.push(k); }));
    if (opts.kind) cols = orderColumns(cols, opts.kind);
  }
  if (!cols.length) return "";

  let bodyRows = rows || [];
  if (opts.kind === "yield" && !opts.edit) bodyRows = reorderYieldRows(bodyRows, cols);
  const binCol = opts.kind === "yield" ? cols.find(c => String(c).trim().toLowerCase() === "bin") : null;

  const colgroup = "<colgroup>" + cols.map(c =>
    `<col style="width:${colWidth(c, opts.kind)}">`
  ).join("") + "</colgroup>";

  // Issue 는 persistent thead 대신 섹션(Yield/CPK/ETC)별 2행 헤더 블록을 tbody 안에 sticky 로
  // 심어 스크롤 시 헤더가 통째로 교체되게 한다 → 여기선 상단 thead 를 만들지 않는다.
  const head = (opts.kind === "issue") ? "" : buildSheetTableHead(cols);

  // Issue Table 의 Category 는 화면 컬럼으로 렌더하지 않는다(섹션 식별은 2행 헤더 블록이 담당).
  // 각 행이 속한 섹션(Yield/CPK/ETC) — Category 데이터 필드가 비어있는 상세 행은 바로 위
  // 헤더 행의 섹션을 상속한다. Distribution 자동표시(Yield/ETC/CPK) 판단, ETC 상세행 삭제버튼,
  // 섹션 경계에서의 헤더 블록 삽입 판단에 쓰인다. edit 모드에서도 필요해 조건 없이 계산.
  const rowSection = {};
  if (opts.kind === "issue") {
    let sec = "";
    for (let i = 0; i < bodyRows.length; i++) {
      const cat = (bodyRows[i] && bodyRows[i]["Category"]) || "";
      if (cat) sec = cat;
      rowSection[i] = sec;
    }
  }

  // Issue Table 다중 source(=_yield 소스 컬럼 2개 이상)일 때만 문제 셀 강조:
  // CPK 섹션 소스 셀은 cpk < 1.33, Yield/ETC 섹션 소스 셀은 값이 0 이 아닌 셀을 연빨강으로.
  const issueMultiSource = opts.kind === "issue"
    && cols.filter(c => /_yield$/i.test(String(c))).length > 1;

  const renderDataRowTr = (r, ri) => {
    const subhead = (opts.kind === "yield" && isHeaderLikeRow(r, cols))
      || (opts.kind === "issue" && isCpkSubheadRow(r));
    // 이 행이 속한 섹션(Issue Table 전용) — Map/Distribution 셀 표시 판단·셀 강조에 쓰인다.
    const issueRowSec = opts.kind === "issue" ? rowSection[ri] : "";
    const tds = cols.map((c, ci) => {
      const v = r ? r[c] : "";
      let txt = (v === null || v === undefined) ? "" : String(v);
      if (subhead && txt.trim().toLowerCase() === "cpk") txt = "CPK";
      const isEmpty = txt === "";
      const isNum = isNumVal(v);
      // Map 열: 해당 행 Bin 만 원색·나머지 회색·숫자 제거한 웨이퍼(있는 Yield/ETC 행). 없으면 빈 칸.
      if (isMapCol(c)) {
        const binv = r && (r["Bin"] ?? r["bin"]);
        const hasBin = String(binv ?? "").trim() !== "";
        if (opts.kind === "issue" && !subhead && hasBin
          && (issueRowSec === "Yield" || issueRowSec === "ETC")) {
          const expandBtn = (mapSourceCount() > 1)
            ? `<button type="button" class="btn-map-expand" title="전체 소스 맵 보기">⤢</button>` : "";
          return `<td data-r="${ri}" data-c="${ci}">` +
            `<div class="map-cell map-cell-mini" data-bin="${esc(String(binv))}"><div class="map-plot"></div>${expandBtn}</div></td>`;
        }
        return `<td class="st-empty${subhead ? " sheet-subhead" : ""}" data-r="${ri}" data-c="${ci}"></td>`;
      }
      // Distribution 열: web_report 분포(있는 Item)로 작은 산포 카드를 채운다. 없으면 빈 칸.
      if (isDistCol(c)) {
        const item = r && r["Item"];
        // 분포 데이터 로딩 중(distDataReady=false)엔 일단 셀을 만들어 두고, 도착 후
        // refreshDistConsumers 가 채운다 (데이터 없는 항목은 그때 빈 칸으로).
        // Yield/ETC/CPK 섹션의 데이터 행(서브헤더 제외)에 산포 카드 표시.
        if (opts.kind === "issue" && item && !subhead
          && (rowSection[ri] === "Yield" || rowSection[ri] === "ETC" || rowSection[ri] === "CPK")
          && (distDataReady ? !!distDataCache[item] : true)) {
          return `<td${subhead ? ` class="sheet-subhead"` : ""} data-r="${ri}" data-c="${ci}">` +
            `<div class="dist-cell dist-cell-mini" data-subject="${esc(item)}"><div class="dist-plot"></div></div></td>`;
        }
        return `<td class="st-empty${subhead ? " sheet-subhead" : ""}" data-r="${ri}" data-c="${ci}"></td>`;
      }
      // opts.editableCols 가 있으면 그 컬럼만 편집 가능(더블클릭으로 활성화), 나머지는 읽기전용으로
      // 아래 일반 렌더링을 그대로 탄다. 없으면 기존처럼 opts.edit 전체 컬럼이 즉시 편집 가능.
      if (opts.edit && (!opts.editableCols || opts.editableCols.has(c))) {
        if (opts.editableCols) {
          const cls = "editing-cell dblclick-edit" + (subhead ? " sheet-subhead" : "");
          // web_report comment 저장용 행 식별 키 — 없으면(서브헤더/placeholder 행) 저장 대상 아님.
          const rowKey = (opts.kind === "issue" && !subhead) ? issueRowKey(r, rowSection[ri]) : "";
          const keyAttr = rowKey ? ` data-key="${esc(rowKey)}"` : "";
          return `<td class="${cls}"${keyAttr} data-r="${ri}" data-c="${ci}" data-col="${esc(c)}">${esc(txt)}</td>`;
        }
        const cls = "editing-cell" + (isNum ? " st-num" : "") + (subhead ? " sheet-subhead" : "");
        return `<td class="${cls}" contenteditable="true" data-r="${ri}" data-c="${ci}" data-col="${esc(c)}">${esc(txt)}</td>`;
      }
      const clsParts = [];
      if (isEmpty) clsParts.push("st-empty");
      else if (isNum) clsParts.push("st-num");
      if (subhead) clsParts.push("sheet-subhead");
      // 다중 source 문제 셀 강조(소스별 _yield 컬럼 한정).
      if (issueMultiSource && !subhead && !isEmpty && /_yield$/i.test(String(c))) {
        const num = parseFloat(v);
        if (!isNaN(num)) {
          if (issueRowSec === "CPK") { if (num <= CPK_WARN_THRESHOLD) clsParts.push("issue-cell-warn"); }
          else if (num > 0) clsParts.push("issue-cell-warn");
        }
      }
      const cls = clsParts.join(" ");
      // Item 셀: 클릭 시 Item_detail 로 이동(항목명 = 측정항목). issue + yield(Bin 상세 구성표) 공용.
      // Pass(Bin 1) 행과 자유입력 Engr ETC 항목(TNO 없음 = 측정항목 아님)은 제외.
      const etcFreeform = opts.kind === "issue" && rowSection[ri] === "ETC"
        && String((r && r["TNO"]) ?? "").trim() === "";
      const itemClickable = (opts.kind === "issue" || opts.kind === "yield") && !subhead && !isEmpty
        && c === "Item" && String((r && (r["Bin"] ?? r["bin"])) ?? "").trim() !== "1" && !etcFreeform;
      // ETC 섹션의 상세 행(ENGR 가 수동 추가한 item) Item 셀: 수정 모드에서만 삭제(×) 버튼 노출.
      const etcDeletable = opts.kind === "issue" && opts.edit && !isEmpty && c === "Item"
        && rowSection[ri] === "ETC" && String(r["Category"] || "") === "";
      let cellHtml;
      if (itemClickable) {
        cellHtml = `<span class="item-detail-link" data-subject="${esc(txt)}">${esc(txt)}</span>`;
      } else {
        cellHtml = isEmpty ? "" : esc(txt);
      }
      if (etcDeletable) {
        cellHtml += ` <button type="button" class="btn-del-etc-item" data-item="${esc(txt)}" title="ETC 항목 제거">×</button>`;
      }
      // Issue Table Yield 대표행 STEP 셀 오른쪽에 접기/펼치기 토글(그 Bin 의 detail TNO 가 있을 때).
      if (opts.kind === "issue" && c === "Step" && r && r._grp && !r._detail && (Number(r._ndetail) || 0) > 0) {
        cellHtml += ` <button type="button" class="issue-toggle" data-grp="${esc(r._grp)}" aria-expanded="false">▼</button>`;
      }
      return `<td${cls ? ` class="${cls}"` : ""} data-r="${ri}" data-c="${ci}">${cellHtml}</td>`;
    }).join("");
    const isPassRow = !subhead && binCol && String((r ? r[binCol] : "") ?? "").trim() === "1";
    let trAttr = isPassRow ? ` class="yield-pass-row"` : "";
    if (!isPassRow && opts.kind === "issue" && r && r._grp) {
      trAttr = r._detail
        ? ` class="issue-bin-detail" data-grp="${esc(r._grp)}" style="display:none"`
        : ` class="issue-bin-rep" data-grp="${esc(r._grp)}"`;
    }
    return `<tr${trAttr}>${tds}</tr>`;
  };

  let body;
  if (opts.kind === "issue") {
    // 섹션이 바뀔 때마다 그 섹션 2행 헤더 블록을 먼저 심고, 헤더가 대체하는 divider 행
    // (CPK 서브헤더 / ETC 라벨행)은 데이터로 렌더하지 않는다.
    let out = "";
    let curSec = null;
    bodyRows.forEach((r, ri) => {
      const sec = rowSection[ri];
      if (sec && sec !== curSec) { curSec = sec; out += issueSectionHeadRowsHtml(cols, sec); }
      if (isCpkSubheadRow(r)) return;
      if (String((r && r["Category"]) || "").trim() === "ETC") return;
      out += renderDataRowTr(r, ri);
    });
    body = "<tbody>" + out + "</tbody>";
  } else {
    body = "<tbody>" + bodyRows.map(renderDataRowTr).join("") + "</tbody>";
  }

  const kindCls = opts.kind ? ` kind-${opts.kind}` : "";
  return `<div class="sheet-wrap${kindCls}"><table class="sheet-table${kindCls}">${colgroup}${head}${body}</table></div>`;
}

// 편집된 sheet-table DOM → rows 재구성
function collectSheetTable(panelEl, baseRows) {
  if (!baseRows || !baseRows.length) return baseRows;
  const cols = [];
  baseRows.forEach(r => Object.keys(r || {}).forEach(k => { if (!cols.includes(k)) cols.push(k); }));
  const tds = panelEl.querySelectorAll("td[data-r][data-col]");
  const out = JSON.parse(JSON.stringify(baseRows));
  tds.forEach(td => {
    const ri = +td.dataset.r, col = td.dataset.col;
    if (out[ri] && col in out[ri]) out[ri][col] = td.textContent;
  });
  return out;
}

// summary blocks 편집 수집
function collectSummaryBlocks(panelEl, baseData) {
  if (!baseData || !baseData.blocks) return baseData;
  const out = JSON.parse(JSON.stringify(baseData));
  const blockEls = panelEl.querySelectorAll(".sheet-block");
  out.blocks.forEach((blk, bi) => {
    const blockEl = blockEls[bi];
    if (!blockEl) return;
    const tds = blockEl.querySelectorAll("td[data-r][data-c]");
    tds.forEach(td => {
      const ri = +td.dataset.r, ci = +td.dataset.c;
      if (out.blocks[bi].rows[ri] !== undefined) {
        out.blocks[bi].rows[ri][ci] = td.textContent;
      }
    });
  });
  return out;
}

// isSummaryBlocks: {"blocks":[...]} 형태인지
function isSummaryBlocks(o) {
  return !!(o && typeof o === "object" && Array.isArray(o.blocks) && o.blocks.length > 0);
}

// Yield 상단 요약 박스 HTML (web_report 세션의 yield_summary 가 있을 때만).
function yieldOverviewHtml() {
  const ov = DATA.web_report && DATA.web_report.yield_summary;
  if (!ov) return "";
  const pct = (typeof ov.yield_pct === "number") ? ov.yield_pct.toFixed(2) : ov.yield_pct;
  // 소스가 2개 이상일 때만 소스별 수율을 따로 표시(단일 소스는 Total 과 동일하므로 생략).
  // yield% 내림차순(높은 순 위 → 아래) 정렬. 메인 Total Yield 오른쪽에 작은 테이블로 붙인다.
  const bySrc = (Array.isArray(ov.by_source) ? ov.by_source.slice() : [])
    .sort((a, b) => (Number(b.yield_pct) || 0) - (Number(a.yield_pct) || 0));
  const bySrcHtml = bySrc.length >= 2 ? `<div class="yield-by-source"><table class="ybs-table">
    <thead><tr><th>Source</th><th>Yield</th><th>Pass / Total</th></tr></thead>
    <tbody>` + bySrc.map(s => {
    const sp = (typeof s.yield_pct === "number") ? s.yield_pct.toFixed(2) : s.yield_pct;
    return `<tr>
      <td class="ybs-src">${esc(s.source)}</td>
      <td class="ybs-pct">${esc(sp)}%</td>
      <td class="ybs-cnt">${esc(s.pass)} / ${esc(s.total)}</td>
    </tr>`;
  }).join("") + `</tbody></table></div>` : "";
  return `<div class="yield-overview">
    <div class="yo-pct">${esc(pct)}%</div>
    <div class="yo-stats">
      <div class="yo-stat"><span class="yo-num">${esc(ov.pass)}</span><span class="yo-label">Pass</span></div>
      <div class="yo-stat"><span class="yo-num">${esc(ov.total)}</span><span class="yo-label">Total</span></div>
      <div class="yo-stat yo-fail"><span class="yo-num">${esc(ov.fail)}</span><span class="yo-label">Fail</span></div>
    </div>
    ${bySrcHtml}
  </div>`;
}

// ── Yield: Bin 접기/펼치기 그룹 렌더 (web_report) ───────────────────────────────
// Pass 행 + Bin 당 most-fail TNO 대표 행(접힘). 대표 행에 ▶ 토글 → 그 Bin 의 나머지
// fail TNO 행을 펼쳐 보여준다(대표 + 펼침 = 그 Bin 의 모든 fail TNO).
let yieldPanelBound = false;
function renderYieldGrouped(passRow, groups, allRows) {
  let cols = [];
  (allRows || []).forEach(r => Object.keys(r || {}).forEach(k => { if (!cols.includes(k)) cols.push(k); }));
  cols = orderColumns(cols, "yield");
  if (!cols.length) return "";

  const colgroup = "<colgroup>" + cols.map(c => `<col style="width:${colWidth(c)}">`).join("") + "</colgroup>";
  const head = buildSheetTableHead(cols);

  // 게이지 정규화 기준: Pass(bin1) 제외한 fail bin 대표행 avg 중 최댓값. Pass 행은 게이지를
  // 그리지 않고, fail 행 게이지는 이 최댓값을 100%로 상대 표시(사용자 요청 — fail 간 비교가 보이게).
  const maxFailAvg = Math.max(0, ...(groups || [])
    .map(g => parseFloat(g && g.rep && g.rep.avg)).filter(v => !isNaN(v)));

  const cellTds = (r, toggleHtml) => cols.map(c => {
    const v = r ? r[c] : "";
    const txt = (v === null || v === undefined) ? "" : String(v);
    const isEmpty = txt === "";
    const cLower = String(c).trim().toLowerCase();
    const cls = [];
    if (isEmpty) cls.push("st-empty"); else if (isNumVal(v)) cls.push("st-num");
    let inner = isEmpty ? "" : esc(txt);
    // Item 셀(Pass 행 제외) → Item_detail 링크
    if (cLower === "item" && !isEmpty && String((r && r.bin) ?? "").trim() !== "1") {
      inner = `<span class="item-detail-link" data-subject="${esc(txt)}">${esc(txt)}</span>`;
    }
    // avg(수율) 셀: Pass(bin1) 행은 게이지 없이 값만. fail 행은 fail bin 최댓값 기준 상대 게이지.
    if (cLower === "avg" && !isEmpty) {
      const isPass = String((r && r.bin) ?? "").trim() === "1";
      if (!isPass) {
        const val = parseFloat(v) || 0;
        const pct = maxFailAvg > 0 ? Math.max(0, Math.min(100, val / maxFailAvg * 100)) : 0;
        inner = `<span class="yield-avg-cell"><span class="yield-avg-val">${esc(txt)}</span>` +
          `<span class="yield-gauge"><span class="yield-gauge-fill" style="width:${pct}%"></span></span></span>`;
      }
    }
    // 접기/펼치기 토글은 STEP 셀 오른쪽에 배치(우측 정렬).
    if (toggleHtml && cLower === "step") inner = inner + toggleHtml;
    return `<td${cls.length ? ` class="${cls.join(" ")}"` : ""}>${inner}</td>`;
  }).join("");

  let body = "";
  if (passRow) body += `<tr class="yield-pass-row">${cellTds(passRow, "")}</tr>`;
  (groups || []).forEach((g, gi) => {
    const detail = (g.rows || []).slice(1);   // 대표(most-fail) 제외 나머지 fail TNO
    const toggle = detail.length
      ? ` <button type="button" class="yield-toggle" data-grp="${gi}" aria-expanded="false">▼</button>` : "";
    body += `<tr class="yield-bin-rep" data-grp="${gi}">${cellTds(g.rep, toggle)}</tr>`;
    detail.forEach(r => {
      body += `<tr class="yield-bin-detail" data-grp="${gi}" style="display:none">${cellTds(r, "")}</tr>`;
    });
  });

  return `<div class="sheet-wrap kind-yield"><table class="sheet-table kind-yield">${colgroup}${head}<tbody>${body}</tbody></table></div>`;
}

function bindYieldPanel() {
  if (yieldPanelBound) return;
  const panel = document.getElementById("panel-yield");
  if (!panel) return;
  panel.addEventListener("click", e => {
    const btn = e.target.closest(".yield-toggle");
    if (!btn) return;
    const gi = btn.dataset.grp;
    const expanded = btn.getAttribute("aria-expanded") === "true";
    btn.setAttribute("aria-expanded", expanded ? "false" : "true");
    btn.textContent = expanded ? "▼" : "▲";
    panel.querySelectorAll(`tr.yield-bin-detail[data-grp="${gi}"]`).forEach(tr => {
      tr.style.display = expanded ? "none" : "";
    });
  });
  yieldPanelBound = true;
}
