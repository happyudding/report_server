  const info = distDataCache[subject];
  const div = cell.querySelector(".dist-plot");
  const placeholder = cell.querySelector(".dist-placeholder");
  if (!info || !div || typeof Plotly === "undefined") return;

  const idx = distIndex.find(x => x.subject === subject);
  const status = (idx && idx.status) || "ok";
  const lo = info.lower_limit, hi = info.upper_limit;
  const traces = Object.keys(info.bySource).map(source => {
    const ds = distDownsampleForDisplay(info.bySource[source].xs, info.bySource[source].ys);
    return { type: "scatter", mode: "markers", cliponaxis: false, name: source,
      x: ds.xs, y: ds.ys, marker: { color: distColorFor(source), size: 4 } };
  });
  const layout = { ...DIST_PLOT_BG, plot_bgcolor: DIST_STATUS_BG[status] || "#FFFFFF",
    title: {
      text: `<b>${esc(subject)}</b><br><span style="font-size:10px">` +
        `(${esc(distFmtLimit(lo))} ~ ${esc(distFmtLimit(hi))} ${esc(info.units)})</span>`,
      font: { size: 12 }, x: 0.5, xanchor: "center" },
    xaxis: { showgrid: true, gridcolor: "#eee", zeroline: false, ticks: "outside",
      tickcolor: "#bbb", tickfont: { size: 10 } },
    yaxis: { range: [0, 100], ticksuffix: "%", showgrid: true, gridcolor: "#eee",
      zeroline: false, tickfont: { size: 10 } },
    shapes: distSpecShapes(lo, hi, false), annotations: distSpecAnnos(lo, hi, false),
    margin: { l: 46, r: 14, t: 46, b: 28 }, showlegend: false };

  Plotly.newPlot(div, traces, layout, DIST_CFG_STATIC);
  cell.dataset.distLoaded = "1";
  if (placeholder) placeholder.style.display = "none";
}

// ── 세그먼트 / 타입어헤드 필터 ─────────────────────────────────────────────────
function distApplySegment(rows) {
  let out = rows.slice();
  if (distCpkOnly) {
    out = out.filter(r => r.cpk != null && r.cpk < DIST.CPK_GOOD
      && !DIST.EXCLUDE.some(k => String(r.subject).toLowerCase().includes(k)));
  }
  if (distFailOnly) out = out.filter(r => r.is_fail);
  return out;
}
function distSuggestions(q) {
  const kws = String(q || "").split("%").map(s => s.trim().toLowerCase()).filter(Boolean);
  if (!kws.length) return [];
  const out = [];
  for (const r of distApplySegment(distIndex)) {
    if (kws.every(k => String(r.subject).toLowerCase().includes(k))) {
      out.push(r);
      if (out.length >= 30) break;
    }
  }
  return out;
}

// ── 기준선(shapes) / 라벨(annotations): LSL·USL 세로 점선 + y=50% 가로 점선 ─────
function distSpecShapes(lo, hi, withMid) {
  const sh = [];
  [lo, hi].forEach(v => { if (v !== null && v !== undefined) sh.push({
    type: "line", x0: v, x1: v, yref: "paper", y0: 0, y1: 1,
    line: { color: "#DC2626", width: 1.2, dash: "dash" } }); });
  if (withMid) sh.push({ type: "line", xref: "paper", x0: 0, x1: 1, y0: 50, y1: 50,
    line: { color: "#888", width: 1, dash: "dashdot" } });
  return sh;
}
function distSpecAnnos(lo, hi, mini) {
  const fs = mini ? 9.2 : 11.5;
  const mk = (v, label) => ({ x: v, yref: "paper", y: 1, text: `${label} ${v}`,
    showarrow: false, textangle: -90, font: { size: fs, color: "#DC2626" },
    bgcolor: "rgba(255,255,255,.72)", borderpad: 1, xanchor: "left", yanchor: "top" });
  const a = [];
  if (hi !== null && hi !== undefined) a.push(mk(hi, "USL"));
  if (lo !== null && lo !== undefined) a.push(mk(lo, "LSL"));
  return a;
}

// ── 미니셀 표시용 다운샘플 (ECDF 전제: x 오름차순, y 누적%) ────────────────────
// 단순 stride 는 꼬리 outlier·고질량 계단(Δy 큰 점)·x축 고립점을 눈멀고 떨어뜨려
// 누적산포를 왜곡한다. 규칙: (1) 첫/마지막 + 누적% 상·하위 7% 전량 보존,
// (2) Δy ≥ 0.2%p(질량 큰 고유값)·x갭 ≥ range×1%(갭 양끝) 강제 보존,
// (3) 나머지만 잔여 budget 으로 균등 stride. 강제 보존 때문에 총점이 1000 을
// 다소 넘는 것은 허용(소프트 상한) — 왜곡 없음이 우선.
function distDownsampleForDisplay(xs, ys) {
  const n = xs.length;
  if (n <= DIST.DOWNSAMPLE) return { xs, ys };
  const keep = new Uint8Array(n);
  keep[0] = 1; keep[n - 1] = 1;
  const range = xs[n - 1] - xs[0];
  const gap = range > 0 ? range * 0.01 : Infinity;
  for (let i = 0; i < n; i++) {
    if (ys[i] <= 7 || ys[i] >= 93) { keep[i] = 1; continue; }             // 꼬리 전량
    if (ys[i] - ys[i - 1] >= 0.2) keep[i] = 1;                            // Δy 질량
    if (xs[i] - xs[i - 1] >= gap) { keep[i] = 1; keep[i - 1] = 1; }       // x갭 양끝
  }
  let kept = 0;
  for (let i = 0; i < n; i++) kept += keep[i];
  const rest = [];
  for (let i = 0; i < n; i++) if (!keep[i]) rest.push(i);
  // 꼬리에 고유값이 많아 budget 이 소진되어도 중간 몸통이 비지 않도록 최소 200점 보장
  const budget = Math.max(DIST.DOWNSAMPLE - kept, 200);
  if (budget > 0 && rest.length > budget) {
    const st = Math.ceil(rest.length / budget);
    for (let j = 0; j < rest.length; j += st) keep[rest[j]] = 1;
  } else if (budget > 0) {
    for (const i of rest) keep[i] = 1;
  }
  const ox = [], oy = [];
  for (let i = 0; i < n; i++) if (keep[i]) { ox.push(xs[i]); oy.push(ys[i]); }
  return { xs: ox, ys: oy };
}

// ── 갤러리 미니셀(정적 CDF, distDataCache 재사용, 표시용만 1000점 다운샘플) ─────
function distRenderGalleryCell(cell) {
  if (cell.dataset.rendered === "1") return;
  // 분포 데이터 도착 전 — rendered 플래그를 세우지 않고 리턴해야 도착 후
  // refreshDistConsumers 의 재큐잉으로 다시 그려진다 (빈 차트 고정 방지).
  if (!distDataReady) return;
  const subject = cell.dataset.subject;
  const status = cell.dataset.status || "ok";
  const info = distDataCache[subject];
  const plot = cell.querySelector(".distg-plot");
  if (!plot || typeof Plotly === "undefined") return;
  const lo = info ? info.lower_limit : null;
  const hi = info ? info.upper_limit : null;
  const traces = [];
  if (info) Object.keys(info.bySource).forEach(src => {
    // 미니셀 표시용만 다운샘플(통계·상세는 전체점) — 꼬리/계단/갭 보존 규칙 적용
    const ds = distDownsampleForDisplay(info.bySource[src].xs, info.bySource[src].ys);
    traces.push({ type: "scatter", mode: "markers", cliponaxis: false, x: ds.xs, y: ds.ys,
      marker: { color: distColorFor(src), size: 3 } });
  });
  const layout = { ...DIST_PLOT_BG, plot_bgcolor: DIST_STATUS_BG[status] || "#FFFFFF",
    xaxis: { showgrid: true, gridcolor: "#eee", zeroline: false, ticks: "outside",
      tickcolor: "#bbb", tickfont: { size: 9 } },
    yaxis: { range: [0, 100], ticksuffix: "%", showgrid: true, gridcolor: "#eee",
      zeroline: false, tickfont: { size: 9 } },
    shapes: distSpecShapes(lo, hi, false), annotations: distSpecAnnos(lo, hi, true),
    margin: { l: 34, r: 10, t: 8, b: 20 }, showlegend: false };
  Plotly.newPlot(plot, traces, layout, DIST_CFG_STATIC);
  cell.dataset.rendered = "1";
}
function distPurgeGalleryCell(cell) {
  if (cell.dataset.rendered !== "1") return;
  const plot = cell.querySelector(".distg-plot");
  try { if (plot && window.Plotly) Plotly.purge(plot); } catch (e) {}
  cell.dataset.rendered = "";
}

// ── rAF 분할 렌더(프레임당 PER_FRAME 개) ──────────────────────────────────────
function distQueueRender(cell) {
  if (cell.dataset.rendered === "1" || distRenderQueue.includes(cell)) return;
  distRenderQueue.push(cell);
  if (!distRafScheduled) { distRafScheduled = true; requestAnimationFrame(distFlushRender); }
}
function distFlushRender() {
  distRafScheduled = false;
  let n = 0;
  while (distRenderQueue.length && n < DIST.PER_FRAME) {
    const cell = distRenderQueue.shift();
    if (cell.isConnected && cell.dataset.visible === "1") { distRenderGalleryCell(cell); n++; }
  }
  if (distRenderQueue.length) { distRafScheduled = true; requestAnimationFrame(distFlushRender); }
}

// ── 툴바 + 갤러리 ─────────────────────────────────────────────────────────────
function distToolbarHtml() {
  // cpk<1.33 / Fail Only 독립 토글(둘 다 켜면 교집합). 둘 다 끄면 전체.
  const seg = (on, key, label) => `<button class="distseg${on ? " active" : ""}" data-seg="${key}">${esc(label)}</button>`;
  // 검색창 오른쪽 범례: 소스별 색상(distColorMap) 을 스와치로 표시(갤러리 미니셀 색과 동일).
  const sources = (DATA.web_report && DATA.web_report.sources) || [];
  const legend = sources.length ? `<div class="dist-legend">` + sources.map(s =>
    `<span class="dist-leg-item"><span class="dist-leg-sw" style="background:${distColorFor(s.name)}"></span>${esc(s.name)}</span>`
  ).join("") + `</div>` : "";
  return `<div class="dist-toolbar">
    <div class="distseg-group">${seg(distCpkOnly, "cpk", "cpk < 1.33")}${seg(distFailOnly, "fail", "Fail Only")}</div>
    <div class="dist-search-wrap">
      <input id="distSearch" class="dist-search" type="text" autocomplete="off" placeholder="검색 ( % 로 다중 AND )">
      <div id="distSuggest" class="dist-suggest" style="display:none"></div>
    </div>
    ${legend}
    <span class="dist-count"></span>
  </div>`;
}
function distUpdateCount() {
  const el = document.querySelector("#panel-distribution .dist-count");
  if (el) el.textContent = `${distFiltered.length} 개`;
}
function distRenderGallery() {
  const panel = document.getElementById("panel-distribution");
  distView = "gallery";
  if (distGalleryObserver) { try { distGalleryObserver.disconnect(); } catch (e) {} distGalleryObserver = null; }
  distRenderQueue = []; distRafScheduled = false;
  distFiltered = distApplySegment(distIndex);
  const cards = distFiltered.map(r => {
    const cpk = r.cpk == null ? "-" : r.cpk;
    const lim = `(${distFmtLimit(r.lower_limit)} ~ ${distFmtLimit(r.upper_limit)})${r.units ? " [" + r.units + "]" : ""}`;
    return `<div class="distg-card" data-subject="${esc(r.subject)}" data-status="${esc(r.status)}" style="background:${DIST_STATUS_BG[r.status] || "#fff"}">
      <div class="distg-head">
        <span class="distg-tno">${esc(r.test_num || "")}</span>
        <span class="distg-name" title="${esc(r.subject)}">${esc(r.subject)}</span>
        <span class="distg-lim">${esc(lim)}</span>
        <span class="distg-cpk">cpk ${esc(cpk)}</span>
      </div>
      <div class="distg-plot"></div>
    </div>`;
  }).join("");
  panel.innerHTML = distToolbarHtml() +
    (distFiltered.length ? `<div class="distg-grid">${cards}</div>`
                         : `<div class="placeholder">해당 조건의 항목이 없습니다</div>`);
  distUpdateCount();
  if (typeof Plotly === "undefined" || typeof IntersectionObserver === "undefined") return;
  distGalleryObserver = new IntersectionObserver(entries => {
    entries.forEach(en => {
      const cell = en.target;
      if (en.isIntersecting) { cell.dataset.visible = "1"; distQueueRender(cell); }
      else {
        cell.dataset.visible = "";
        distPurgeGalleryCell(cell);
        const i = distRenderQueue.indexOf(cell);
        if (i >= 0) distRenderQueue.splice(i, 1);
      }
    });
  }, { rootMargin: DIST.ROOT_MARGIN, threshold: 0 });
  panel.querySelectorAll(".distg-card").forEach(c => distGalleryObserver.observe(c));
}

// ── 상세(검색뷰): CDF + 히스토그램 (전체점 지연 로드) ─────────────────────────
// ── Item_detail (콘텐츠 상세 뷰) ────────────────────────────────────────────────
// sticky-head(topbar+tabs)는 그대로 두고 #panel-item-detail 만 활성화한다. Back(또는 Esc)으로
// 원래 탭 패널 복원. Distribution 카드/Yield/CPK/IssueTable item 클릭 모두 이 화면으로 온다.
const ITEM_FAIL_PAGE_SIZE = 30;
let _itemDetailReturnId = null;   // 복귀할 탭 패널 id
let _itemDetailSubject = null;
let _itemDetailNav = [];          // prev/next 이동 목록(subject 배열)
let _itemDetailFailRows = [];
let _itemDetailFailPage = 1;
let _itemDetailReq = 0;           // 경합 가드(진행 중 fetch 무효화)
let _itemDetailBound = false;

function openItemDetail(subject, navList) {
  const dp = document.getElementById("panel-item-detail");
  if (!dp) return;
  bindItemDetailPanel();
  // 상세가 아직 안 열려 있으면 현재 활성 탭 패널을 복귀 대상으로 기억하고 숨긴다.
  if (!dp.classList.contains("active")) {
    const cur = document.querySelector(".content > .panel.active");
    _itemDetailReturnId = cur ? cur.id : "panel-summary";
    if (cur) cur.classList.remove("active");
    dp.classList.add("active");
  }
  _itemDetailSubject = subject;
  _itemDetailNav = Array.isArray(navList) && navList.length ? navList : [subject];
  _itemDetailFailPage = 1;
  const reqId = ++_itemDetailReq;
  window.scrollTo(0, 0);
  dp.innerHTML = `<div class="idet"><div class="idet-head"><button class="btn-sm idet-back">← Back</button>` +
    `<span class="idet-title"><b>${esc(subject)}</b></span></div><div class="placeholder">로드 중…</div></div>`;
  fetch(`/pe/report/session/${SESSION_ID}/web_report/scatter/${encodeURIComponent(subject)}`, { cache: "no-store" })
    .then(res => { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
    .then(data => { if (reqId === _itemDetailReq) renderItemDetail(data); })
    .catch(e => {
      if (reqId !== _itemDetailReq) return;
      dp.innerHTML = `<div class="idet"><div class="idet-head"><button class="btn-sm idet-back">← Back</button></div>` +
        `<div class="placeholder">상세 로드 실패 (${esc(e.message)})</div></div>`;
    });
}

function renderItemDetail(data) {
  const dp = document.getElementById("panel-item-detail");
  if (!dp) return;
  const subject = data.subject;
  const navLen = _itemDetailNav.length;
  const pos = _itemDetailNav.indexOf(subject);
  const navHtml = navLen > 1
    ? `<button class="btn-sm idet-prev" title="이전 (Alt+↑)">‹</button>` +
      `<button class="btn-sm idet-next" title="다음 (Alt+↓)">›</button>` +
      `<span class="idet-navpos">${pos + 1} / ${navLen}</span>` : "";
  const statusLabel = { fail: "FAIL", cpk_low: "CPK LOW", ok: "OK" }[data.status] || data.status || "";
  _itemDetailFailRows = data.fail_rows || [];
  const failTitle = data.is_fail
    ? `<div class="section-title small idet-fail-title">이 항목으로 Fail 된 die — ${data.fail_total}개` +
      `${data.fail_truncated ? ` (앞 ${_itemDetailFailRows.length}개만 표시)` : ""}</div><div id="idetFailHost"></div>`
    : "";
  dp.innerHTML = `<div class="idet">
    <div class="idet-head">
      <button class="btn-sm idet-back">← Back</button>
      ${navHtml}
      <span class="idet-title" data-status="${esc(data.status || "ok")}">
        ${data.test_num ? `<span class="idet-tno">#${esc(data.test_num)}</span>` : ""}
        <b class="idet-subject">${esc(subject)}</b>
        <span class="idet-badge idet-${esc(data.status || "ok")}">${esc(statusLabel)}</span>
        <span class="idet-cpk">cpk ${esc(data.cpk == null ? "-" : data.cpk)}</span>
        <span class="idet-lim">(${esc(distFmtLimit(data.lower_limit))} ~ ${esc(distFmtLimit(data.upper_limit))}${data.units ? " " + esc(data.units) : ""})</span>
      </span>
    </div>
    <div class="idet-charts">
      <div class="idet-chart-block"><div class="dist-chart-cap">누적분포 CDF</div><div id="distCdf" class="dist-chart"></div></div>
      <div class="idet-chart-block"><div class="dist-chart-cap">분포 히스토그램</div><div id="distHist" class="dist-chart"></div></div>
    </div>
    ${itemStatsTableHtml(data.stats)}
    ${failTitle}
  </div>`;
  distRenderDetailCharts(data);   // #distCdf / #distHist (기존 함수 재사용)
  if (data.is_fail) renderItemFailRows();
}

const ITEM_STAT_COLS = ["n", "min", "median", "max", "average", "stdev", "cp", "cpl", "cpu", "cpk"];
function itemStatsTableHtml(stats) {
  if (!stats || !stats.length) return "";
  const multi = stats.length > 1;
  const head = "<thead><tr>" + (multi ? "<th>source</th>" : "") +
    ITEM_STAT_COLS.map(c => `<th>${esc(c)}</th>`).join("") + "</tr></thead>";
  const body = "<tbody>" + stats.map(s => {
    const warn = (s.cpk != null && parseFloat(s.cpk) < CPK_WARN_THRESHOLD);
    const tds = ITEM_STAT_COLS.map(c => {
      const v = s[c]; const t = (v === null || v === undefined) ? "" : String(v);
      const cls = "st-num" + (c === "cpk" && warn ? " cpk-warn" : "");
      return `<td class="${cls}">${esc(t)}</td>`;
    }).join("");
    return "<tr>" + (multi ? `<td>${esc(s.source)}</td>` : "") + tds + "</tr>";
  }).join("") + "</tbody>";
  return `<div class="idet-stats sheet-wrap"><table class="sheet-table">${head}${body}</table></div>`;
}

function renderItemFailRows() {
  const host = document.getElementById("idetFailHost");
  if (!host) return;
  const rows = _itemDetailFailRows;
  if (!rows.length) { host.innerHTML = `<div class="placeholder">Fail 행 없음</div>`; return; }
  const multi = !!(DATA.web_report && (DATA.web_report.sources || []).length > 1);
  const cols = (multi ? ["SOURCE"] : []).concat(["SERIAL", "SHOT", "DUT", "XPOS", "YPOS", "BIN", "FAILTNO", "value"]);
  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total / ITEM_FAIL_PAGE_SIZE));
  if (_itemDetailFailPage > pages) _itemDetailFailPage = pages;
  if (_itemDetailFailPage < 1) _itemDetailFailPage = 1;
  const start = (_itemDetailFailPage - 1) * ITEM_FAIL_PAGE_SIZE;
  const page = rows.slice(start, start + ITEM_FAIL_PAGE_SIZE);
  const head = "<thead><tr>" + cols.map(c => `<th>${esc(c)}</th>`).join("") + "</tr></thead>";
  const body = "<tbody>" + page.map(r => "<tr>" + cols.map(c => {
    const v = r[c]; const t = (v === null || v === undefined) ? "" : String(v);
    return `<td>${esc(t)}</td>`;
  }).join("") + "</tr>").join("") + "</tbody>";
  const end = Math.min(start + ITEM_FAIL_PAGE_SIZE, total);
  const pager = pages > 1
    ? `<div class="cpk-pager">` +
      `<button type="button" class="btn-sm" data-idet-page="${_itemDetailFailPage - 1}"${_itemDetailFailPage <= 1 ? " disabled" : ""}>‹ 이전</button>` +
      `<span class="cpk-pager-info">${start + 1}–${end} / ${total} (page ${_itemDetailFailPage}/${pages})</span>` +
      `<button type="button" class="btn-sm" data-idet-page="${_itemDetailFailPage + 1}"${_itemDetailFailPage >= pages ? " disabled" : ""}>다음 ›</button></div>`
    : "";
  host.innerHTML = `<div class="sheet-wrap"><table class="sheet-table">${head}${body}</table></div>` + pager;
}

function itemDetailNav(delta) {
  if (_itemDetailNav.length < 2) return;
  let p = _itemDetailNav.indexOf(_itemDetailSubject) + delta;
  if (p < 0) p = 0;
  if (p >= _itemDetailNav.length) p = _itemDetailNav.length - 1;
  const next = _itemDetailNav[p];
  if (next && next !== _itemDetailSubject) openItemDetail(next, _itemDetailNav);
}

function closeItemDetail() {
  const dp = document.getElementById("panel-item-detail");
  if (!dp) return;
  _itemDetailReq++;   // 진행 중 fetch 무효화
  dp.classList.remove("active");
  dp.innerHTML = "";
  const back = document.getElementById(_itemDetailReturnId || "panel-summary");
  if (back) back.classList.add("active");
  _itemDetailReturnId = null;
}

// 탭 버튼 클릭 시: 복원 없이 상세만 닫는다(해당 탭 패널이 이어서 활성화됨).
function hideItemDetail() {
  const dp = document.getElementById("panel-item-detail");
  if (dp && dp.classList.contains("active")) { _itemDetailReq++; dp.classList.remove("active"); dp.innerHTML = ""; }
  _itemDetailReturnId = null;
}

function bindItemDetailPanel() {
  if (_itemDetailBound) return;
  const dp = document.getElementById("panel-item-detail");
  if (!dp) return;
  dp.addEventListener("click", e => {
    if (e.target.closest(".idet-back")) { closeItemDetail(); return; }
    if (e.target.closest(".idet-prev")) { itemDetailNav(-1); return; }
    if (e.target.closest(".idet-next")) { itemDetailNav(1); return; }
    const pg = e.target.closest("[data-idet-page]");
    if (pg && !pg.disabled) { _itemDetailFailPage = parseInt(pg.dataset.idetPage, 10) || 1; renderItemFailRows(); return; }
  });
  document.addEventListener("keydown", e => {
    if (!dp.classList.contains("active")) return;
    if (e.key === "Escape") { closeItemDetail(); return; }
    if (e.altKey && e.key === "ArrowUp") { e.preventDefault(); itemDetailNav(-1); }
    else if (e.altKey && e.key === "ArrowDown") { e.preventDefault(); itemDetailNav(1); }
  });
  _itemDetailBound = true;
}
// values 를 오름차순 정렬하며 원래 index 순서를 함께 반환 — serial/xpos/ypos 를 같은 순서로
// 재배열해 CDF hover(customdata)에 붙이는 데 쓴다.
function distCdfFromValues(values) {
  const order = values.map((_, i) => i).sort((a, b) => values[a] - values[b]);
  const n = order.length;
  return { x: order.map(i => values[i]), y: order.map((_, k) => (k + 1) / n * 100), order };
}
// 빈도 폴리곤: subject 의 모든 source 를 21 균등구간으로 빈닝해 중심점-빈도 곡선을 만든다.
// 서버가 보낸 원본 values 재사용(재계산 최소화, 다운샘플 없음). 반환 곡선은 양끝 0 패딩 포함 23점.
function distHistPolygon(sources, lo, hi) {
  // 3-1 hist_range(소스 공용): 전체값 min/max + LSL/USL 확장. 대용량이라 스프레드 대신 for 루프.
  let rlo = Infinity, rhi = -Infinity;
  (sources || []).forEach(s => {
    for (const v of s.values) { if (v < rlo) rlo = v; if (v > rhi) rhi = v; }
  });
  [lo, hi].forEach(v => { if (v !== null && v !== undefined) {
    if (v < rlo) rlo = v; if (v > rhi) rhi = v; } });
  if (!isFinite(rlo) || !isFinite(rhi)) { rlo = 0; rhi = 1; }   // 값이 전무한 경우 가드
  if (rhi === rlo) rhi = rlo + 1;                                // 축퇴(단일값) 가드
  const B = 21, step = (rhi - rlo) / B;
  // 3-3 중심점(21) → 3-4 양끝 0 패딩(bw=step)으로 23점 (곡선이 바닥에서 시작·종료)
  const centers = [rlo - step * 0.5];                            // padded left
  for (let k = 0; k < B; k++) centers.push(rlo + step * (k + 0.5));
  centers.push(rlo + step * (B + 0.5));                          // padded right
  return (sources || []).map(s => {
    // 3-2 균등 21구간 누적 (오른쪽 끝값은 마지막 bin 에 포함). 3-5 빈 source 는 자연히 전부 0.
    const counts = new Array(B).fill(0);
    for (const v of s.values) {
      let idx = Math.floor((v - rlo) / step);
      if (idx === B) idx = B - 1;
      if (idx >= 0 && idx < B) counts[idx]++;
    }
    return { source: s.name, centers, counts: [0, ...counts, 0] };  // 패딩 0 앞뒤 → 23
  });
}
// 스펙 4장 x축 표시범위(히스토그램 전용): 소스 합친 data min/max·median 기준 4분기 규칙.
// 가드밴드 5% 기준은 USL-LSL span, median 은 소스 합친 전체값 기준.
function distHistXRange(sources, lo, hi, isFail) {
  const all = [];
  (sources || []).forEach(s => { for (const v of s.values) all.push(v); });
  const hasLo = lo !== null && lo !== undefined, hasHi = hi !== null && hi !== undefined;
  if (hasLo && hasHi) {
    if (!isFail) return [lo, hi];
    const span = hi - lo, gb = span * 0.05;
    let dmin = Infinity, dmax = -Infinity;
    for (const v of all) { if (v < dmin) dmin = v; if (v > dmax) dmax = v; }
    let x0 = lo, x1 = hi;
    if (dmin < lo) x0 = dmin - gb;      // 아래로 벗어난 쪽만 확장
    if (dmax > hi) x1 = dmax + gb;      // 위로 벗어난 쪽만 확장
    return [x0, x1];
  }
  // median (소스 합친 전체값)
  let med = 0;
  if (all.length) {
    const sorted = all.slice().sort((a, b) => a - b), m = sorted.length >> 1;
    med = sorted.length % 2 ? sorted[m] : (sorted[m - 1] + sorted[m]) / 2;
  }
  if (hasLo) return [lo, 2 * med - lo];        // USL 없음 → 위쪽을 median 대칭 확장
  if (hasHi) return [2 * med - hi, hi];        // LSL 없음 → 아래쪽을 median 대칭 확장
  // Limit 없음 → data min/max
  let dmin = Infinity, dmax = -Infinity;
  for (const v of all) { if (v < dmin) dmin = v; if (v > dmax) dmax = v; }
  if (!isFinite(dmin) || !isFinite(dmax)) return undefined;   // 값 전무 → Plotly 자동
  return [dmin, dmax];
}
function distRenderDetailCharts(data) {
  const lo = data.lower_limit, hi = data.upper_limit;
  const bg = DIST_STATUS_BG[data.status] || "#FFFFFF";
  const multi = (data.sources || []).length > 1;
  const unit = data.units || "";
  const xtitle = `측정값${unit ? " (" + unit + ")" : ""}`;
  const cdfDiv = document.getElementById("distCdf");
  if (cdfDiv) {
    const traces = (data.sources || []).map(s => {
      const c = distCdfFromValues(s.values);
      const trace = { type: "scatter", mode: "markers", cliponaxis: false, name: s.name, x: c.x, y: c.y,
        marker: { color: distColorFor(s.name), size: 5 } };
      // CDF hover 전용: die 식별 metadata(serial/xpos/ypos, values 와 동일 순서로 백엔드가 정렬해 보냄).
      // histogram 은 die 단위 정보가 의미 없어 붙이지 않는다.
      if (Array.isArray(s.serial) && s.serial.length === s.values.length) {
        trace.customdata = c.order.map(i => [s.serial[i], s.xpos[i], s.ypos[i]]);
        trace.hovertemplate = "측정값 %{x}<br>누적 %{y:.1f}%<br>SERIAL %{customdata[0]} · X %{customdata[1]} / Y %{customdata[2]}<extra></extra>";
      } else {
        trace.hovertemplate = "측정값 %{x}<br>누적 %{y:.1f}%<extra></extra>";
      }
      return trace;
    });
    Plotly.newPlot(cdfDiv, traces, { ...DIST_PLOT_BG, plot_bgcolor: bg,
      xaxis: { title: { text: xtitle }, showgrid: true, gridcolor: "#eee", zeroline: false },
      yaxis: { title: { text: "누적 %" }, range: [0, 100], ticksuffix: "%", showgrid: true, gridcolor: "#eee", zeroline: false },
      shapes: distSpecShapes(lo, hi, true), annotations: distSpecAnnos(lo, hi, false),
      margin: { l: 60, r: 22, t: 16, b: 46 }, showlegend: multi }, DIST_CFG);
  }
  const hDiv = document.getElementById("distHist");
  if (hDiv) {
    // 막대 대신 빈도 폴리곤: 21bin 중심점-빈도 곡선(양끝 0 패딩), CDF 와 동일한 원본 values 재사용.
    const polys = distHistPolygon(data.sources || [], lo, hi);
    let ymax = 0;
    polys.forEach(p => p.counts.forEach(c => { if (c > ymax) ymax = c; }));
    const traces = polys.map(p => ({ type: "scatter", mode: "lines", name: p.source,
      x: p.centers, y: p.counts, line: { color: distColorFor(p.source), shape: "spline" },
      hovertemplate: "측정값 %{x}<br>빈도 %{y:d}<extra></extra>" }));
    Plotly.newPlot(hDiv, traces, { ...DIST_PLOT_BG, plot_bgcolor: bg,
      xaxis: { title: { text: xtitle }, range: distHistXRange(data.sources || [], lo, hi, data.is_fail),
        showgrid: true, gridcolor: "#eee", zeroline: false },
      yaxis: { title: { text: "빈도" }, range: [0, (ymax || 1) * 1.1], tickformat: "d",
        showgrid: true, gridcolor: "#eee", zeroline: false },
      shapes: distSpecShapes(lo, hi, false), annotations: distSpecAnnos(lo, hi, false),
      margin: { l: 60, r: 22, t: 16, b: 46 }, showlegend: multi }, DIST_CFG);
  }
}
// 검색 제안 클릭 시: 상세(item_detail)로 바로 가지 않고 갤러리의 해당 svg 카드로 스크롤·강조.

// 표 셀 안에 들어가는 작은 미리보기 차트(정적, 상호작용 없음) — Issue Table
// Distribution/CPK 열에서 해당 행 Item 의 ECDF 를 산포탭 갤러리 카드와 같은 포맷(표시용
// 다운샘플 static CDF + LSL/USL 점선)으로 축소해 보여주는 용도. 전체점은 데이터에 그대로 유지.
function renderMiniDistCell(cell) {
  if (cell.dataset.distLoaded === "1") return;
  const subject = cell.dataset.subject;
  const div = cell.querySelector(".dist-plot");
  if (!div || typeof Plotly === "undefined") return;
  // 분포 데이터 도착 전 — 플래그를 세우지 않고 리턴해야 도착 후 재큐잉으로 그려진다.
  if (!distDataReady) return;
  const info = distDataCache[subject];
  // 데이터 없는 항목: 빈 칸으로 확정 (loaded 마킹해 재큐잉 no-op 방지)
  if (!info) { cell.innerHTML = ""; cell.dataset.distLoaded = "1"; return; }

  const lo = info.lower_limit, hi = info.upper_limit;
  const traces = Object.keys(info.bySource).map(source => {
    const ds = distDownsampleForDisplay(info.bySource[source].xs, info.bySource[source].ys);
    return { type: "scatter", mode: "markers", cliponaxis: false, name: source,
      x: ds.xs, y: ds.ys, marker: { color: distColorFor(source), size: 3 } };
  });
  const layout = {
    xaxis: { visible: false }, yaxis: { visible: false, range: [0, 100] },
    shapes: distSpecShapes(lo, hi, false), margin: { l: 1, r: 1, t: 1, b: 1 },
    paper_bgcolor: "transparent", plot_bgcolor: "transparent", showlegend: false,
  };
  Plotly.newPlot(div, traces, layout, DIST_CFG_STATIC);
  cell.dataset.distLoaded = "1";
}

// Issue Table 미니셀은 수천 개(항목 수 규모)라 전량 동기 렌더 시 메인스레드가 분 단위로
// 얼어붙는다 — 갤러리와 같은 IntersectionObserver + rAF 분할(프레임당 3개) lazy 렌더를 쓰고,
// 화면 밖으로 나가면 purge 해 plot DOM 상주를 막는다. 큐는 갤러리(distRenderQueue)와
// 분리 — 갤러리 재렌더가 큐를 초기화해도 issue 셀이 유실되지 않도록.
let issueDistObserver = null;
let issueDistQueue = [];
let issueDistRafScheduled = false;

function issueDistQueueRender(cell) {
  if (cell.dataset.distLoaded === "1" || issueDistQueue.includes(cell)) return;
  issueDistQueue.push(cell);
  if (!issueDistRafScheduled) { issueDistRafScheduled = true; requestAnimationFrame(issueDistFlush); }
}
function issueDistFlush() {
  issueDistRafScheduled = false;
  let n = 0;
  while (issueDistQueue.length && n < DIST.PER_FRAME) {
    const cell = issueDistQueue.shift();
    if (cell.isConnected && cell.dataset.visible === "1") { renderMiniDistCell(cell); n++; }
  }
  if (issueDistQueue.length) { issueDistRafScheduled = true; requestAnimationFrame(issueDistFlush); }
}
function issueDistPurge(cell) {
  if (cell.dataset.distLoaded !== "1") return;
  const div = cell.querySelector(".dist-plot");
  if (!div) return;   // 데이터 없음으로 비워진 셀 — 확정 상태 유지
  try { if (window.Plotly) Plotly.purge(div); } catch (e) {}
  cell.dataset.distLoaded = "";
}

function renderIssueMiniDist(panel) {
  if (issueDistObserver) { try { issueDistObserver.disconnect(); } catch (e) {} issueDistObserver = null; }
  issueDistQueue = []; issueDistRafScheduled = false;
  const cells = panel.querySelectorAll(".dist-cell-mini");
  if (!cells.length) return;
  if (typeof IntersectionObserver === "undefined") {
    cells.forEach(cell => renderMiniDistCell(cell));   // 구형 브라우저 폴백: 기존 동작
    return;
  }
  issueDistObserver = new IntersectionObserver(entries => {
    entries.forEach(en => {
      const cell = en.target;
      if (en.isIntersecting) { cell.dataset.visible = "1"; issueDistQueueRender(cell); }
      else {
        cell.dataset.visible = "";
        issueDistPurge(cell);
        const i = issueDistQueue.indexOf(cell);
        if (i >= 0) issueDistQueue.splice(i, 1);
      }
    });
  }, { rootMargin: "600px 0px", threshold: 0 });
  cells.forEach(c => issueDistObserver.observe(c));
}

  if (!host || !rawDataMeta) return;
  const q = String(filterText || "").trim().toLowerCase();
  const items = (rawDataMeta.items || []).filter(it => !q || it.name.toLowerCase().includes(q));
  host.innerHTML = items.length ? items.map(it => {
    const selected = rawDataSelected.has(it.name);
    const disabled = (!selected && rawDataSelected.size >= RAW_DATA_COLUMN_CAP) ? "disabled" : "";
    const hasLim = it.unit || it.lolim !== null || it.hilim !== null;
    const limTxt = hasLim
      ? ` <span class="rawdata-item-meta">${esc(it.lolim ?? "-")}~${esc(it.hilim ?? "-")}[${esc(it.unit || "")}]</span>`
      : "";
    return `<button type="button" class="rawdata-item${selected ? " selected" : ""}" ` +
      `data-name="${esc(it.name)}" ${disabled}>${esc(it.name)}${limTxt}</button>`;
  }).join("") : `<div class="placeholder" style="padding:12px;">일치하는 항목 없음</div>`;
  updateRawSelCount();
}

function selectAllVisibleRawItems() {
  if (!rawDataMeta) return;
  const q = (document.getElementById("rawItemSearch")?.value || "").trim().toLowerCase();
  const items = (rawDataMeta.items || []).filter(it => !q || it.name.toLowerCase().includes(q));
  for (const it of items) {
    if (rawDataSelected.size >= RAW_DATA_COLUMN_CAP) break;
    rawDataSelected.add(it.name);
  }
  renderRawItemList(document.getElementById("rawItemSearch")?.value || "");
}

function renderRawDataControls() {
  const panel = document.getElementById("panel-raw-data");
  const sources = (rawDataMeta && rawDataMeta.sources) || [];
  if (sources.length && !sources.includes(rawDataSource)) rawDataSource = sources[0];
  destroyRawDataGrid();
  panel.classList.remove("placeholder");
  panel.innerHTML = rawDataControlsHtml(rawDataMeta);
  renderRawItemList("");
  updateRawEditBtn();
  syncRawFiltersHeight();
  // 프록시 가로 스크롤바 → 실제 그리드 tableholder 동기화(반대 방향은 runRawDataQuery 에서
  // Tabulator 의 scrollHorizontal 이벤트로 처리). #rawDataHscroll 은 panel 이 다시 그려질
  // 때만 새로 생기므로 여기서 1회만 바인딩하면 된다.
  const hscroll = document.getElementById("rawDataHscroll");
  if (hscroll) {
    hscroll.addEventListener("scroll", () => {
      if (_rawHscrollSyncing || !rawDataGrid) return;
      const holder = document.querySelector("#rawDataGridHost .tabulator-tableholder");
      if (!holder) return;
      _rawHscrollSyncing = true;
      holder.scrollLeft = hscroll.scrollLeft;
      _rawHscrollSyncing = false;
    });
  }
}

async function renderRawDataTab() {
  const panel = document.getElementById("panel-raw-data");
  if (!panel) return;
  if (!isWebReportSession()) { destroyRawDataGrid(); emptyPanel(panel, "Raw Data 데이터 없음"); return; }
  if (rawDataMeta) { renderRawDataControls(); return; }
  panel.innerHTML = `<div class="placeholder">불러오는 중...</div>`;
  try {
    rawDataMeta = await fetchRawDataMeta();
  } catch (e) {
    emptyPanel(panel, `Raw Data 메타 조회 실패: ${e.message}`);
    return;
  }
  renderRawDataControls();
}

async function runRawDataQuery() {
  const banner = document.getElementById("rawDataBanner");
  const host = document.getElementById("rawDataGridHost");
  if (!banner || !host) return;
  if (!rawDataSelected.size) {
    banner.innerHTML = `<div class="rawdata-banner">항목을 1개 이상 선택하세요.</div>`;
    return;
  }
  const params = new URLSearchParams();
  params.set("columns", [...rawDataSelected].join(","));
  const search = (document.getElementById("rawSearch")?.value || "").trim();
  const bin = (document.getElementById("rawBin")?.value || "").trim();
  const source = rawDataSource;
  if (search) params.set("search", search);
  if (bin) params.set("bin", bin);
  if (source) params.set("source", source);

  banner.innerHTML = `<div class="rawdata-banner">조회 중...</div>`;
  destroyRawDataGrid();
  host.innerHTML = "";
  let data;
  try {
    const res = await fetch(`/pe/report/session/${SESSION_ID}/web_report/raw_data?${params}`, { cache: "no-store" });
    data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  } catch (e) {
    banner.innerHTML = `<div class="rawdata-banner">조회 실패: ${esc(e.message)}</div>`;
    return;
  }
  // 응답이 res.ok 지만 본문이 기대 형태가 아니면(프록시 오류 페이지 등) 여기서 멈춘다 —
  // 아래 data.rows.length / toLocaleString() 이 TypeError 로 "조회 중..." 상태에 갇히는 것 방지.
  if (!Array.isArray(data.rows) || typeof data.total_matched !== "number") {
    banner.innerHTML = `<div class="rawdata-banner">조회 실패: 응답 형식 오류</div>`;
    return;
  }
  banner.innerHTML = data.truncated
    ? `<div class="rawdata-banner">결과가 많아 앞 ${data.rows.length.toLocaleString()}행만 표시합니다 — 필터를 좁혀주세요.</div>`
    : "";
  if (!data.rows.length) { host.innerHTML = `<div class="placeholder">조회 결과 없음</div>`; return; }
  // jsonify(sort_keys=True) 가 응답 키를 알파벳순으로 재정렬하므로 deriveCols(Object.keys
  // 순서 의존) 대신 컬럼 순서를 여기서 명시적으로 고정한다: 고정 메타 컬럼 → 선택한 순서의
  // item 컬럼. _row_idx 는 이 목록에 없으므로 자연히 제외된다 (편집 저장용 내부 필드).
  // SOURCE 는 항상 단일 source 조회라 화면에 표시하지 않는다(값은 row 데이터에 남아
  // cellEdited 핸들러의 row.SOURCE 참조용으로만 쓰인다).
  const present = new Set();
  data.rows.forEach(r => Object.keys(r || {}).forEach(k => present.add(k)));
  const editable = MODE === "edit";
  // 식별 컬럼: #(행번호) + SHOT/DUT/X/Y/BIN/TNO. field 는 기존값 유지(편집/데이터 경로 불변),
  // 화면 라벨(title)만 X/Y/TNO 로 바꾸고 SERIAL 은 표시에서 제외한다.
  const IDENTITY = [
    { field: "_rownum", label: "#", rownum: true },
    { field: "SHOT", label: "SHOT" },
    { field: "DUT", label: "DUT" },
    { field: "XPOS", label: "X" },
    { field: "YPOS", label: "Y" },
    { field: "BIN", label: "BIN" },
    { field: "FAILTNO", label: "TNO" },
  ];
  // 항목 메타(unit/lolim/hilim)는 rawDataMeta 재사용 — 추가 fetch 없음.
  const metaByName = {};
  ((rawDataMeta && rawDataMeta.items) || []).forEach(it => { metaByName[it.name] = it; });
  const rdLine = v => `<span class="rd-meta">${(v === null || v === undefined || v === "") ? "&nbsp;" : esc(String(v))}</span>`;
  // 다중행 헤더: 1행=이름, 2~4행=UNIT/LOLIM/HILIM. 세로 스크롤 시 헤더째 고정된다.
  const metaHead = (label, l1, l2, l3) => `<span class="rd-name">${esc(label)}</span>${rdLine(l1)}${rdLine(l2)}${rdLine(l3)}`;

  // # 컬럼 헤더에만 UNIT/LOLIM/HILIM 라벨을 세로로 쌓아 좌측 라벨 정렬(값은 각 item 컬럼에 표시).
  const idCols = IDENTITY
    .filter(d => d.rownum || present.has(d.field))
    .map(d => ({
      title: d.rownum ? metaHead("#", "UNIT", "LOLIM", "HILIM") : metaHead(d.label, "", "", ""),
      field: d.field, resizable: true, headerSort: false, frozen: true,
      formatter: d.rownum ? "rownum" : undefined,
      editor: (editable && !d.rownum) ? "input" : false,
    }));
  const itemCols = [...rawDataSelected].filter(c => present.has(c)).map(c => {
    const m = metaByName[c] || {};
    const unit = m.unit ? `[${m.unit}]` : "";
    return {
      title: metaHead(c, unit, m.lolim, m.hilim), field: c,
      resizable: true, headerSort: false, frozen: false,
      editor: editable ? "input" : false,
    };
  });
  rawDataGrid = new Tabulator("#rawDataGridHost", {
    data: data.rows,
    columns: [...idCols, ...itemCols],
    layout: "fitDataStretch",
    pagination: true, paginationSize: 100, paginationSizeSelector: [50, 100, 200, 500],
    selectableRange: true,      // 셀 클릭 후 화살표 키로 이동(Excel 형) + Shift+화살표 범위 선택
    selectableRangeColumns: true,
    selectableRangeRows: true,
    // 더블클릭으로만 편집 진입 — 단일 클릭은 selectableRange 의 범위 선택 전용으로 남겨둬야
    // 편집기 진입/커밋이 range 선택 제스처와 충돌하지 않고, 편집 중 Enter 로 정상 확정된다.
    editTriggerEvent: "dblclick",
  });
  if (rawDataFailOnly) rawDataGrid.setFilter("BIN", "!=", "1");
  if (editable) {
    rawDataGrid.on("cellEdited", cell => {
      const row = cell.getData();
      const key = `${row.SOURCE}|${row._row_idx}|${cell.getField()}`;
      const prev = rawDataPendingEdits.get(key);
      rawDataPendingEdits.set(key, {
        source: row.SOURCE, row_idx: row._row_idx,
        column: cell.getField(), value: cell.getValue(),
        // diff 표시용(서버 전송 안 함): 같은 셀을 여러 번 고쳐도 최초 기존값을 유지한다.
        old: prev ? prev.old : cell.getOldValue(),
        where: rawRowLabel(row),
      });
      updateRawEditBtn();
    });
  }
  // 실제 그리드 → 프록시 가로 스크롤바 동기화(반대 방향은 renderRawDataControls 에서 처리).
  // 그리드는 조회할 때마다 파괴/재생성되므로 이 등록도 매번 다시 필요하다.
  rawDataGrid.on("scrollHorizontal", left => {
    const hscroll = document.getElementById("rawDataHscroll");
    if (!hscroll || _rawHscrollSyncing) return;
    _rawHscrollSyncing = true;
    hscroll.scrollLeft = left;
    _rawHscrollSyncing = false;
  });
  // 프록시 스크롤바 폭(스페이서)은 실제 스크롤 가능 폭에 맞아야 하므로, 그리드 최초 빌드/재렌더/
  // 컬럼 리사이즈 시마다 다시 잰다.
  rawDataGrid.on("tableBuilt", syncRawHscrollSpacer);
  rawDataGrid.on("renderComplete", syncRawHscrollSpacer);
  rawDataGrid.on("columnResized", syncRawHscrollSpacer);
}

// Raw Data 편집 행을 사람이 읽을 수 있는 위치 문자열로 (diff 표 "위치" 컬럼용).
function rawRowLabel(row) {
  const parts = [];
  if (row.SOURCE) parts.push(String(row.SOURCE));
  if (row.SHOT !== undefined && row.SHOT !== "") parts.push(`SHOT ${row.SHOT}`);
  if (row.DUT !== undefined && row.DUT !== "") parts.push(`DUT ${row.DUT}`);
  if (row.XPOS !== undefined && row.YPOS !== undefined) parts.push(`(X,Y)=(${row.XPOS},${row.YPOS})`);
  if (row.BIN !== undefined && row.BIN !== "") parts.push(`BIN ${row.BIN}`);
  return parts.join(" · ");
}

// "Report 재생성" 클릭 시: 즉시 저장하지 않고 변경 diff 를 모달로 보여준 뒤 예/아니요 확인.
function openRawRegenConfirm() {
  if (!rawDataPendingEdits.size) return;
  const edits = [...rawDataPendingEdits.values()];
  const rows = edits.map(e => {
    const oldTxt = (e.old === null || e.old === undefined || e.old === "") ? "(빈값)" : String(e.old);
    const newTxt = (e.value === null || e.value === undefined || e.value === "") ? "(빈값)" : String(e.value);
    return `<tr>` +
      `<td>${esc(e.where || e.source || "")}</td>` +
      `<td>${esc(e.column)}</td>` +
      `<td class="rd-old">${esc(oldTxt)}</td>` +
      `<td class="rd-arrow">→</td>` +
      `<td class="rd-new">${esc(newTxt)}</td>` +
    `</tr>`;
  }).join("");
  const host = document.getElementById("rawRegenDiff");
  if (host) {
    host.innerHTML =
      `<table><thead><tr><th>위치</th><th>항목</th><th>기존값</th><th></th><th>바뀐값</th></tr></thead>` +
      `<tbody>${rows}</tbody></table>`;
  }
  const modal = document.getElementById("rawRegenModal");
  if (modal) modal.classList.add("show");
}

function closeRawRegenConfirm() {
  const modal = document.getElementById("rawRegenModal");
  if (modal) modal.classList.remove("show");
}

async function saveRawDataEdits() {
  if (!rawDataPendingEdits.size) return;
  const banner = document.getElementById("rawDataBanner");
  // 서버에는 기존처럼 source/row_idx/column/value 4필드만 전송 (old/where 는 diff 표시 전용).
  const edits = [...rawDataPendingEdits.values()].map(e => ({
    source: e.source, row_idx: e.row_idx, column: e.column, value: e.value,
  }));
  if (banner) banner.innerHTML = `<div class="rawdata-banner">저장 중...</div>`;
  try {
    const res = await fetch(`/pe/report/session/${SESSION_ID}/web_report/raw_data/edit`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken() },
      body: JSON.stringify({ password: verifiedPassword, edits }),
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error || `HTTP ${res.status}`);
    rawDataPendingEdits.clear();
    showToast(`Raw Data ${edits.length}개 셀 저장 완료 — 수정된 rawdata 로 Report(yield·cpk·distribution) 및 parquet 을 재생성합니다.`);
    await load(false);
    // 세션 재로드 후 Raw Data 그리드는 비워지므로, 방금 저장한 항목/필터로 재조회해
    // 저장된 값이 화면에 바로 보이게 한다.
    if (rawDataSelected.size && document.getElementById("rawDataGridHost")) {
      await runRawDataQuery();
    }
  } catch (e) {
    hideLoadOverlay();
    if (banner) banner.innerHTML = `<div class="rawdata-banner">저장 실패: ${esc(e.message)}</div>`;
  }
}

// Raw Data 전용 이벤트 위임 — panel 자체는 고정 요소(#panel-raw-data), 내부만 매번 다시 그려짐.
// input 이벤트는 stopPropagation 로 .content 의 전역 dirty-마킹 리스너로 안 새게 막는다
// (Raw Data 는 조회 전용이라 편집 dirty 상태와 무관해야 함).
const _rawDataPanel = document.getElementById("panel-raw-data");
if (_rawDataPanel) {
  _rawDataPanel.addEventListener("input", e => {
    e.stopPropagation();
    if (e.target.id === "rawItemSearch") renderRawItemList(e.target.value);
  });
  _rawDataPanel.addEventListener("click", e => {
    if (e.target.closest("#rawQueryBtn")) { runRawDataQuery(); return; }
    if (e.target.closest("#rawSaveBtn")) { openRawRegenConfirm(); return; }
    if (e.target.closest("#rawItemSelectAllBtn")) { selectAllVisibleRawItems(); return; }
    if (e.target.closest("#rawFailOnlyBtn")) {
      rawDataFailOnly = !rawDataFailOnly;
      e.target.closest("#rawFailOnlyBtn").classList.toggle("active", rawDataFailOnly);
      if (rawDataGrid) {
        if (rawDataFailOnly) rawDataGrid.setFilter("BIN", "!=", "1");
        else rawDataGrid.clearFilter();
      }
      return;
    }
    const sourceBtn = e.target.closest(".rawdata-source-btn");
    if (sourceBtn) {
      rawDataSource = sourceBtn.dataset.source || "";
      document.querySelectorAll(".rawdata-source-btn").forEach(b =>
        b.classList.toggle("active", b.dataset.source === rawDataSource));
      runRawDataQuery();
      return;
    }
    const itemBtn = e.target.closest("#rawItemList .rawdata-item");
    if (itemBtn) {
      const name = itemBtn.dataset.name;
      if (rawDataSelected.has(name)) {
        rawDataSelected.delete(name);
      } else {
        if (rawDataSelected.size >= RAW_DATA_COLUMN_CAP) return;
        rawDataSelected.add(name);
      }
      renderRawItemList(document.getElementById("rawItemSearch")?.value || "");
    }
  });
}

// ── 편집용 위젯 ────────────────────────────────────────────────────────────
function editRowHtml(r, cols) {
  return `<tr>` + cols.map(c =>
    `<td><input class="cell-input" data-col="${esc(c)}" value="${esc(r ? r[c] : "")}"></td>`
  ).join("") + `<td><button type="button" class="btn-del-row" title="행 삭제">×</button></td></tr>`;
}

function editTableHtml(rows, cols, tableId) {
  const head = cols.map(c => `<th data-col="${esc(c)}">${esc(c)}</th>`).join("") + `<th></th>`;
  const body = (rows || []).map(r => editRowHtml(r, cols)).join("");
  return `<table class="edit-table" id="${tableId}"><thead><tr>${head}</tr></thead>` +
         `<tbody>${body}</tbody></table>` +
         `<button type="button" class="btn-sm add-row" data-table="${tableId}">+ 행 추가</button>`;
}

function readEditTable(tableEl) {
  if (!tableEl) return null;
  const cols = [...tableEl.querySelectorAll("thead th[data-col]")].map(th => th.dataset.col);
  const rows = [];
  tableEl.querySelectorAll("tbody tr").forEach(tr => {
    const obj = {};
    tr.querySelectorAll("input.cell-input").forEach(inp => { obj[inp.dataset.col] = inp.value; });
    if (cols.some(c => String(obj[c] ?? "").trim() !== "")) rows.push(obj);
  });
  return rows;
}

function kvEditHtml(obj, group) {
  const entries = Object.entries(obj || {}).filter(([k]) => k);
  if (!entries.length) return "";
  return `<div class="kv-edit">` + entries.map(([k, v]) => {
    const val = (v && typeof v === "object") ? JSON.stringify(v) : (v ?? "");
    return `<label title="${esc(k)}">${esc(k)}</label>` +
      `<input class="field-input" data-f="${esc(group)}" data-key="${esc(k)}" value="${esc(val)}">`;
  }).join("") + `</div>`;
}

// ── Summary (edit) ────────────────────────────────────────────────────────────
function collectSummaryText() {
  const panel = document.getElementById("panel-summary");
  const out = DATA.summary_text ? JSON.parse(JSON.stringify(DATA.summary_text)) : {};

  const titleInp = panel.querySelector('[data-f="title"]');
  if (titleInp) out.title = titleInp.value;

  const featInputs = panel.querySelectorAll('[data-f="feature"]');
  if (featInputs.length) {
    out.feature = {};
    featInputs.forEach(i => { out.feature[i.dataset.key] = i.value; });
  }

  const yst = panel.querySelector('[data-f="yield_summary_text"]');
  if (yst) out.yield_summary_text = splitLines(yst.value);

  const mfb = readEditTable(document.getElementById("tbl-mfb"));
  if (mfb !== null) out.major_fail_bins = mfb;

  const evalInputs = panel.querySelectorAll('[data-f="evaluation"]');
  if (evalInputs.length) {
    out.evaluation = {};
    evalInputs.forEach(i => { out.evaluation[i.dataset.key] = i.value; });
  }

  const rr = panel.querySelector('[data-f="raw_rows"]');
  if (rr) out.raw_rows = splitLines(rr.value).map(line => line.split("\t"));

  return out;
}

// ── Yield 편집: Tabulator 인스턴스 정리 (buildPayload 의 yieldGrid.getData() 폴백 대상) ──
function destroyYieldGrid() {
  if (yieldGrid) { try { yieldGrid.destroy(); } catch (e) {} yieldGrid = null; }
}

// ── Issue Table (edit) ──────────────────────────────────────────────────────
// 수정모드에서도 PTE comment / 개발 comment 두 열만 편집 가능(더블클릭으로 활성화), 나머지

// ── 모드 전환 ──────────────────────────────────────────────────────────────
// ── 탭별 lazy 렌더 ────────────────────────────────────────────────────────────
// 활성 탭(보통 Summary)만 즉시 그려 첫 화면을 빨리 띄우고, 나머지는 dirty 플래그를
// 세워뒀다가 탭 클릭 시 또는 백그라운드 프리렌더(schedulePrerender)에서 그린다.
// Issue Table 의 comment 두 열, Raw Data 외에는 수정모드에서도 조회 화면과 동일하게
// 읽기전용으로 둔다 (Summary/Yield 는 편집 UI 자체를 렌더하지 않음).
const TAB_RENDERERS = {
  "summary": () => { renderWebSummary(); },
  "yield": () => {
    destroyYieldGrid();   // 재렌더 전 이전 Tabulator 인스턴스 정리
    renderYield(DATA.yield_text, DATA.summary);
    if (isWebReportSession()) renderYieldFailBins();
  },
  "issues": () => {
    if (MODE === "edit") renderIssuesEdit();
    else renderIssues(DATA.issue_table_text);
  },
  "cpk": renderCpk,
  "distribution": renderDistribution,
  "map-analysis": renderMapAnalysis,
  "raw-data": renderRawDataTab,
  "trim-analysis": renderPlaceholderTabs,
};
const tabDirty = {};

function activeTabName() {
  const btn = document.querySelector(".tab.active");
  return (btn && btn.dataset.tab) || "summary";
}

function renderTab(name) {
  if (!tabDirty[name] || !TAB_RENDERERS[name]) return;
  tabDirty[name] = false;
  TAB_RENDERERS[name]();
}

// 백그라운드 프리렌더: 첫 페인트를 막지 않도록 idle 타임에 한 탭씩 미리 그려둔다.
// raw-data 는 사용자 조작(항목 선택) 기반 lazy 조회라 첫 클릭 시 렌더가 자연스럽고,
// distribution 은 카드 셸만 미리 만들어도 실제 차트는 가시성+데이터 도착 후 그려진다.
let _prerenderToken = 0;
function schedulePrerender() {
  const token = ++_prerenderToken;
  const queue = ["yield", "issues", "cpk", "map-analysis", "distribution",
                 "trim-analysis"];
  const idle = window.requestIdleCallback
    ? (fn => window.requestIdleCallback(fn, { timeout: 1000 }))
    : (fn => setTimeout(fn, 200));
  function next() {
    if (token !== _prerenderToken) return;   // 새 renderActive 가 돌면 이전 체인 중단
    const name = queue.shift();
    if (name === undefined) return;
    const btn = document.querySelector(`.tab[data-tab="${name}"]`);
    if ((!btn || btn.style.display !== "none") && tabDirty[name]) renderTab(name);
    idle(next);
  }
  idle(next);
}

function renderActive() {
  Object.keys(TAB_RENDERERS).forEach(n => { tabDirty[n] = true; });
  renderTab(activeTabName());
  schedulePrerender();
}

// 모드 개념은 제거됐지만(항상 편집), 렌더 재실행 진입점으로 남겨둔다.

    flushPendingComments().then(ok => { if (ok && subject) openItemDetail(subject, [subject]); });
    return;

  // Issue Table Yield 대표행 토글 → 그 Bin 의 detail TNO 행 펼치기/접기.
  const issueToggle = e.target.closest(".issue-toggle");
  if (issueToggle) { toggleIssueGroup(issueToggle); return; }
  if (e.target.id === "issueExpandAll") { setAllIssueGroups(true); return; }
  if (e.target.id === "issueCollapseAll") { setAllIssueGroups(false); return; }
  const etcAddBtn = e.target.closest("#etcAddItemBtn");
  if (etcAddBtn) { openEtcItemModal(); return; }
  const etcDelBtn = e.target.closest(".btn-del-etc-item");
  if (etcDelBtn) { removeEtcItem(etcDelBtn.dataset.item); return; }

// ── save / cancel ─────────────────────────────────────────────────────────────
let _dirty = false;        // 수정 모드에서 셀이 변경되면 true
let _autoSaving = false;   // 자동저장 진행 중 중복 방지

// edit bar 상태표시 dot
function _setDot(state) {
  const dot = document.getElementById("autosaveDot");
  if (!dot) return;
  dot.className = "autosave-dot" + (state ? " " + state : "");
}

// dirty 마킹: 수정 모드에서 contenteditable 또는 input 변경 시
document.querySelector(".content").addEventListener("input", () => {
  if (MODE !== "edit") return;
  _dirty = true;
  _setDot("dirty");
});

// payload 조립 (saveEdits / autoSave 공용)
function buildPayload() {
  const payload = { password: verifiedPassword };

  if (isSummaryBlocks(DATA.summary_text)) {
    payload.summary_text = collectSummaryBlocks(document.getElementById("panel-summary"), DATA.summary_text);
  } else if (isGrid(DATA.summary_text)) {
    payload.summary_text = collectGrid(document.getElementById("panel-summary"), DATA.summary_text);
  } else {
    payload.summary_text = collectSummaryText();
  }

  if (Array.isArray(DATA.yield_text) && DATA.yield_text.length) {
    // Tabulator 그리드 편집 → 동일 구조(list-of-dicts)로 회수. (행 순서·서브헤더 보존)
    payload.yield_text = yieldGrid
      ? yieldGrid.getData()
      : collectSheetTable(document.getElementById("panel-yield"), DATA.yield_text);
  } else if (isGrid(DATA.yield_text)) {
    payload.yield_text = collectGrid(document.getElementById("panel-yield"), DATA.yield_text);
  } else {
    payload.yield_rows = readEditTable(document.getElementById("tbl-yield")) || [];
  }

  if (Array.isArray(DATA.issue_table_text) && DATA.issue_table_text.length) {
    payload.issue_table_text = collectSheetTable(document.getElementById("panel-issues"), DATA.issue_table_text);
  } else if (isGrid(DATA.issue_table_text)) {
    payload.issue_table_text = collectGrid(document.getElementById("panel-issues"), DATA.issue_table_text);
  } else {
    const issueTbl = document.getElementById("tbl-issue");
    if (issueTbl) payload.issue_rows = readEditTable(issueTbl);
  }

  return payload;
}

// web_report 세션 전용 저장: Issue Table comment(PTE/개발) 변경분만 모아
// manifest.issue_comments 로 보낸다 (PATCH /content 는 web_report 를 지원하지 않음).
// 변경 없으면 요청을 보내지 않는다. 실패 시 throw — 호출부가 dirty 복원.
async function saveIssueComments(opts) {
  opts = opts || {};
  const panel = document.getElementById("panel-issues");
  const rows = Array.isArray(DATA && DATA.issue_table_text) ? DATA.issue_table_text : [];
  const comments = [];
  const applied = [];   // 성공 시 DATA.issue_table_text 에도 반영해 재렌더 시 옛 값으로 되돌지 않게 함
  if (panel) {
    panel.querySelectorAll("td[data-key][data-col]").forEach(td => {
      const col = td.dataset.col;
      const ri = parseInt(td.dataset.r, 10);
      const orig = String(((rows[ri] || {})[col]) ?? "").trim();
      const value = (td.textContent || "").trim();
      if (value !== orig) {
        comments.push({ key: td.dataset.key, col, value });
        applied.push({ ri, col, value });
      }
    });
  }
  if (!comments.length) return { ok: true, updated: 0 };
  const res = await fetch(`/pe/report/session/${SESSION_ID}/web_report/issue_table/comments`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken() },
    body: JSON.stringify({ password: verifiedPassword, comments }),
    keepalive: !!opts.keepalive,
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || `comment 저장 실패 (HTTP ${res.status})`);
  applied.forEach(({ ri, col, value }) => { if (rows[ri]) rows[ri][col] = value; });
  return j;
}

// 자동저장: 페이지가 숨겨질 때(탭 전환·창 최소화 등) 변경사항 자동 저장.
// keepalive:true 로 페이지 언로드 중에도 요청이 완료된다.
async function autoSave() {
  if (!DATA || MODE !== "edit" || !_dirty || _autoSaving) return;
  _autoSaving = true;
  _setDot("saving");
  if (isWebReportSession()) {
    _dirty = false;  // optimistic
    try {
      await saveIssueComments({ keepalive: true });
      _setDot("saved");
    } catch (_) {
      _dirty = true;
      _setDot("dirty");
    } finally {
      _autoSaving = false;
    }
    return;
  }
  const payload = buildPayload();
  _dirty = false;  // optimistic
  try {
    const res = await fetch(`/pe/report/session/${SESSION_ID}/content`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken() },
      body: JSON.stringify(payload),
      keepalive: true,
    });
    if (!res.ok) { _dirty = true; _setDot("dirty"); }
    else _setDot("saved");
  } catch (_) {
    _dirty = true;
    _setDot("dirty");
  } finally {
    _autoSaving = false;
  }
}

// 탭이 백그라운드로 가거나 창이 최소화될 때 자동저장
document.addEventListener("visibilitychange", () => {
  if (document.hidden) autoSave();
});

// 페이지를 떠날 때: dirty 상태면 브라우저 경고 + keepalive 저장 시도
window.addEventListener("beforeunload", e => {
  if (MODE === "edit" && _dirty) {
    autoSave();            // keepalive 요청 발사 (비동기, 브라우저가 완료 보장)
    e.preventDefault();
    e.returnValue = "";    // 브라우저 "변경사항이 저장되지 않을 수 있습니다" 경고
  }
});

let _pinPurpose = null;   // "edit" | "delete"
const PIN_IDS = ["pin0", "pin1", "pin2", "pin3"];

function openPin(purpose) {
  _pinPurpose = purpose;
  document.getElementById("pinTitle").textContent =
    purpose === "delete" ? "세션 삭제" : "수정 모드 진입";
  document.getElementById("pinDesc").textContent =
    purpose === "delete" ? "삭제하려면 비밀번호를 입력하세요." : "수정하려면 비밀번호를 입력하세요.";
  const confirmBtn = document.getElementById("pinConfirm");
  confirmBtn.textContent = purpose === "delete" ? "삭제" : "확인";
  confirmBtn.classList.toggle("danger", purpose === "delete");
  confirmBtn.classList.toggle("primary", purpose !== "delete");
  PIN_IDS.forEach(id => document.getElementById(id).value = "");
  document.getElementById("pinModal").classList.add("show");
  document.getElementById("pin0").focus();
}

function closePin() { document.getElementById("pinModal").classList.remove("show"); }
function readPin() { return PIN_IDS.map(id => document.getElementById(id).value).join(""); }

document.getElementById("pinCancel").addEventListener("click", closePin);
document.getElementById("pinConfirm").addEventListener("click", async () => {
  const pin = readPin();
  if (pin.length !== 4) { showToast("비밀번호 4자리를 입력하세요."); return; }
  if (_pinPurpose === "delete") {
    closePin();
    doDelete(pin);
  } else {
    // 수정: 먼저 검증 후 진입
    try {
      const res = await fetch(`/pe/report/session/${SESSION_ID}/verify_password`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken() },
        body: JSON.stringify({ password: pin }),
      });
      if (!res.ok) {
        const j = await res.json().catch(() => ({}));
        showToast(j.error || "비밀번호가 일치하지 않습니다.");
        return;
      }
      verifiedPassword = pin;
      closePin();
      setMode("edit");
    } catch (e) {
      showToast("확인 실패: " + e.message);
    }
  }
});

async function doDelete(pin) {
  try {
    const res = await fetch(`/pe/report/session/${SESSION_ID}`, {
      method: "DELETE",
      headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken() },
      body: JSON.stringify({ password: pin }),

    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      showToast(j.error || "삭제 실패");

    showToast("삭제되었습니다. 검색결과로 이동합니다.");
    setTimeout(() => { location.href = "/pe/report/"; }, 700);

// ── Issue Table ETC 항목 추가/삭제 (web_report 전용) ─────────────────────────
// item 명만 서버(manifest.etc_items)에 저장하고, Bin/TNO/Distribution 은 항상
// 조회 시점에 tables/yield_rows/distDataCache 에서 자동으로 다시 채워진다.
let etcItemMeta = null;  // 전체 item 목록 캐시(rawDataMeta 있으면 그걸 재사용)

function currentEtcItems() {
  const rows = DATA && DATA.issue_table_text;
  if (!Array.isArray(rows)) return [];
  const idx = rows.findIndex(r => r && r["Category"] === "ETC");
  if (idx === -1) return [];
  return rows.slice(idx + 1).map(r => r && r["Item"]).filter(Boolean);
}

function closeEtcItemModal() { document.getElementById("etcItemModal").classList.remove("show"); }

async function openEtcItemModal() {
  document.getElementById("etcItemModal").classList.add("show");
  document.getElementById("etcItemSearch").value = "";
  const host = document.getElementById("etcItemList");
  host.innerHTML = `<div class="placeholder" style="padding:12px;">불러오는 중...</div>`;
  try {
    if (!etcItemMeta) etcItemMeta = rawDataMeta || await fetchRawDataMeta();
  } catch (e) {
    host.innerHTML = `<div class="placeholder" style="padding:12px;">항목 조회 실패: ${esc(e.message)}</div>`;
    return;
  }
  renderEtcItemList("");
}

function renderEtcItemList(filterText) {
  const host = document.getElementById("etcItemList");
  if (!host || !etcItemMeta) return;
  const q = String(filterText || "").trim().toLowerCase();
  const already = new Set(currentEtcItems());
  const items = (etcItemMeta.items || []).filter(it => !q || it.name.toLowerCase().includes(q));
  host.innerHTML = items.length ? items.map(it => {
    const added = already.has(it.name);
    return `<button type="button" class="rawdata-item${added ? " selected" : ""}" ` +
      `data-name="${esc(it.name)}" ${added ? "disabled" : ""}>${esc(it.name)}` +
      `${added ? ` <span class="rawdata-item-meta">(추가됨)</span>` : ""}</button>`;
  }).join("") : `<div class="placeholder" style="padding:12px;">일치하는 항목 없음</div>`;
}

// ETC 추가/삭제·Bin 상세 전환은 panel-issues 를 재렌더하므로, 아직 저장 안 된 comment
// 편집이 있으면 먼저 저장해 유실을 막는다. 저장 실패 시 false 를 반환해 조작을 중단시킨다.
async function flushPendingComments() {
  if (MODE !== "edit" || !_dirty || !isWebReportSession()) return true;
  try {
    await saveIssueComments();
    _dirty = false;
    _setDot("saved");
    return true;
  } catch (e) {
    showToast("저장되지 않은 comment 저장 실패 — 화면 전환을 중단합니다: " + e.message);
    return false;
  }
}

async function addEtcItem(item) {
  if (!(await flushPendingComments())) return;
  try {
    const res = await fetch(`/pe/report/session/${SESSION_ID}/web_report/issue_table/etc`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken() },
      body: JSON.stringify({ password: verifiedPassword, action: "add", item }),
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error || `HTTP ${res.status}`);
    showToast(`${item} 추가되었습니다.`);
    await load(false);
  } catch (e) {
    showToast("추가 실패: " + e.message);
  }
}

async function removeEtcItem(item) {
  if (!confirm(`"${item}" 항목을 Issue Table 에서 제거할까요?`)) return;
  if (!(await flushPendingComments())) return;
  try {
    const res = await fetch(`/pe/report/session/${SESSION_ID}/web_report/issue_table/etc`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken() },
      body: JSON.stringify({ password: verifiedPassword, action: "remove", item }),
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error || `HTTP ${res.status}`);
    showToast(`${item} 제거되었습니다.`);
    await load(false);
  } catch (e) {
    showToast("제거 실패: " + e.message);
  }
}

// ── load 오버레이 진행바 (0→100% + 단계 메시지) ────────────────────────────────
let _loadCreep = null;
function setLoadProgress(pct, msg) {
  pct = Math.max(0, Math.min(100, pct));
  const fill = document.getElementById("loadFill");
  const pc = document.getElementById("loadPct");
  const st = document.getElementById("loadStatus");
  if (fill) fill.style.width = pct + "%";
  if (pc) pc.textContent = Math.round(pct) + "%";
  if (st && msg != null) st.textContent = msg;
}
function stopLoadCreep() { if (_loadCreep) { clearInterval(_loadCreep); _loadCreep = null; } }
// 서버 재계산 대기(첫 바이트 전)엔 실제 진척을 알 수 없어 from→to 로 ease-out 천천히 채운다.
function startLoadCreep(from, to, ms, msg) {
  stopLoadCreep();
  setLoadProgress(from, msg);
  const t0 = performance.now();
  _loadCreep = setInterval(() => {
    const k = Math.min(1, (performance.now() - t0) / ms);
    setLoadProgress(from + (to - from) * (1 - Math.pow(1 - k, 2)));
    if (k >= 1) stopLoadCreep();
  }, 90);
}
function showLoadOverlay() {
  const ov = document.getElementById("loadOverlay");
  if (ov) ov.classList.add("show");
  setLoadProgress(0, "준비 중…");
}
function hideLoadOverlay() {
  stopLoadCreep();
  setLoadProgress(100, "완료");
  const ov = document.getElementById("loadOverlay");
  if (ov) setTimeout(() => ov.classList.remove("show"), 200);
}
async function load(resetMode=true) {
  try {
    showLoadOverlay();
    // 서버가 parquet 재계산(수 초)을 마칠 때까지 첫 바이트가 없어 실제 %를 알 수 없으므로
    // 대기 동안 62% 까지 천천히 채운다.
    startLoadCreep(6, 62, 4500, "리포트 계산·수신 중…");
    const res = await fetch(`/pe/report/session/${SESSION_ID}/full`, { cache: "no-store" });
    if (!res.ok) {
      const box = document.getElementById("errorBox");
      box.style.display = "";
      box.textContent = `세션을 불러올 수 없습니다 (${res.status})`;
      hideLoadOverlay();
      return;
    }
    stopLoadCreep();
    setLoadProgress(70, "데이터 파싱 중…");
    DATA = await res.json();
    // web_report 전용 뷰어 — xlsx 업로드(legacy) 세션 렌더링은 더 이상 지원하지 않는다.
    if (!isWebReportSession()) {
      document.querySelectorAll(".content .panel").forEach(p => {
        p.innerHTML = `<div class="placeholder" style="padding:24px;">이 세션은 web_report 형식이 아니어서 더 이상 표시할 수 없습니다.<br>(xlsx 업로드 흐름은 추후 재작업 예정)</div>`;
      });
      document.getElementById("topbarActions").style.display = "none";
      renderMeta(DATA.session || {});
      hideLoadOverlay();   // 이 분기가 오버레이를 안 걷으면 안내문까지 가려진다
      return;
    }
    setLoadProgress(80, "화면 구성 중…");
    _globalBinColors = null;   // 새 데이터 → bin 색상 매핑 재계산
    seedEmptyFrames();
    // Issue Table 의 미니 분포 차트가 renderDistribution() 보다 먼저 그려질 수 있으므로
    // distDataCache/distColorMap 은 렌더 순서와 무관하게 데이터 로드 직후 미리 준비해둔다.
    // distribution_deferred 응답이면 대용량 ECDF 를 백그라운드로 지연 로드하고
    // (첫 페인트를 막지 않음), 구형 embed 응답이면 기존 경로 그대로 (하위호환).
    const webPre = DATA.web_report || {};
    // Distribution ECDF 는 항상 지연 로드 (GET .../web_report/distribution 컴팩트 columnar).
    // 도착 전 그려진 미니셀/갤러리는 refreshDistConsumers 가 다시 채운다.
    setLoadProgress(92, "분포 데이터 준비 중…");
    ensureDistData();
    buildDistColorMap(webPre.sources || []);
    renderMeta(DATA.session || {});
    renderActive();   // 항상 편집 가능 화면 (모드 개념 없음)
    hideLoadOverlay();
  } catch (e) {
    const box = document.getElementById("errorBox");
    box.style.display = "";
    box.textContent = "로드 실패: " + e.message;
    hideLoadOverlay();
  }
}

load();
</script>
</body>
</html>
