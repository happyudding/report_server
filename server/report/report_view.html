<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Report</title>
<link rel="stylesheet" href="/pe/report/vendor/tabulator.min.css">
<script src="/pe/report/vendor/tabulator.min.js"></script>
<script src="/pe/report/vendor/plotly.min.js"></script>
<style>
@font-face {
  font-family: "Pretendard Variable";
  src: url("/pe/report/vendor/pretendard/PretendardVariable.woff2") format("woff2");
  font-weight: 45 920;
  font-display: swap;
}
* { box-sizing: border-box; }
body {
  font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
    "Segoe UI", "Malgun Gothic", sans-serif;
  background: #fafafa; margin: 0; color: #222;
}

/* ── sticky-head: topbar + tabs 를 한 덩어리로 고정 (topbar 가 1~2줄로 높이가
   바뀌어도 tabs 가 항상 그 바로 아래 붙도록 top:49px 같은 매직넘버 대신 부모째 sticky) ── */
.sticky-head { position: sticky; top: 0; z-index: 100; background: #fff; }

/* ── topbar: 제목 + 세션 정보 인라인 ─────────────────────────────────────── */
.topbar {
  background: #fff; border-bottom: 1px solid #ddd;
  padding: 8px 16px; display: flex; gap: 10px; align-items: center;
  flex-wrap: wrap; box-shadow: 0 1px 3px rgba(0,0,0,.06);
}
.back-btn {
  padding: 5px 12px; border-radius: 8px; border: 1px solid #d0d5dd;
  background: #fff; cursor: pointer; font-size: 12px; color: #555;
  text-decoration: none; box-shadow: 0 1px 2px rgba(0,0,0,.05);
  transition: all .15s ease;
}
.back-btn:hover {
  background: #f0f6ff; border-color: #4a90e2; color: #4a90e2;
  box-shadow: 0 2px 6px rgba(0,0,0,.08); transform: translateY(-1px);
}

.topbar-meta { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.meta-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.meta-inline {
  font-size: 12px; color: #444; background: #f3f5f8;
  padding: 3px 9px; border-radius: 4px; white-space: nowrap;
}
.meta-inline .mk { color: #999; margin-right: 4px; font-size: 11px; }
.meta-inline-file {
  font-size: 12px; color: #444; max-width: 480px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pt-badge {
  display: inline-block; padding: 3px 11px; border-radius: 4px;
  font-size: 12px; font-weight: 700; color: #fff;
}
.pt-badge.MDDI { background: #4a90e2; }
.pt-badge.PDDI { background: #1e3a8a; }
.pt-badge.PMIC { background: #16a34a; }
.pt-badge.SECURITY { background: #9333ea; }
.pt-badge.TCON { background: #0d9488; }
.pt-badge.default { background: #64748b; }
/* ── tabs ──────────────────────────────────────────────────────────────── */
.tabs {
  display: flex; gap: 2px; background: #fff;
  border-bottom: 1px solid #ddd; padding: 0 16px;
}
.tab {
  padding: 9px 18px; font-size: 13px; font-weight: 700; color: #777;
  background: transparent; border: none; border-bottom: 2px solid transparent;
  cursor: pointer; transition: color .1s;
}
.tab:hover { color: #4a90e2; }
.tab.active { color: #1f4d8c; border-bottom-color: #4a90e2; }

/* ── content ───────────────────────────────────────────────────────────── */
.content { padding: 18px 20px 90px; max-width: 1200px; margin: 0 auto; }
.panel { display: none; }
.panel.active { display: block; }

.section-title {
  font-size: 13px; font-weight: 700; color: #333;
  margin: 0 0 8px; padding-bottom: 6px; border-bottom: 1px solid #eef0f3;
}
.section-title.small { margin-top: 24px; }

.yield-overview {
  display: flex; align-items: center; gap: 28px; flex-wrap: wrap;
  background: #f6f9ff; border: 1px solid #dbe6f7; border-radius: 10px;
  padding: 14px 22px; margin-bottom: 14px;
}
.yield-overview .yo-pct { font-size: 30px; font-weight: 800; color: #1f4d8c; }
.yield-overview .yo-stats { display: flex; gap: 24px; flex-wrap: wrap; }
.yield-overview .yo-stat { display: flex; flex-direction: column; }
.yield-overview .yo-num { font-size: 17px; font-weight: 700; color: #222; }
.yield-overview .yo-label { font-size: 11px; color: #888; margin-top: 2px; }
.yield-overview .yo-stat.yo-fail .yo-num { color: #d9480f; }
.yield-by-source { display: flex; gap: 10px; flex-wrap: wrap; margin: -4px 0 14px; }
.ybs-chip {
  display: flex; flex-direction: column; gap: 2px; background: #fff;
  border: 1px solid #dbe6f7; border-radius: 8px; padding: 8px 14px; min-width: 96px;
}
.ybs-src { font-size: 11px; color: #1f4d8c; font-weight: 700; }
.ybs-pct { font-size: 18px; font-weight: 800; color: #222; }
.ybs-cnt { font-size: 11px; color: #888; }

table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 8px; }
th, td { padding: 6px 10px; border-bottom: 1px solid #eef0f3; text-align: left; }
th { background: #f6f7f9; font-weight: 600; color: #555; font-size: 11px; }
td { color: #222; }
tbody tr:hover { background: #f9fbff; }

/* ── sheet-table (xlsx 텍스트 데이터 원형 재현) ────────────────────────── */
.sheet-wrap { overflow-x: auto; margin-bottom: 16px; }
.sheet-table {
  width: auto; border-collapse: collapse; font-size: 12px;
  background: #fff; margin-bottom: 0;
}
.sheet-table th {
  background: #e8eef4; font-weight: 700; padding: 5px 8px;
  border: 1px solid #b0bec5; white-space: nowrap; color: #1a3a5c;
  vertical-align: middle; text-align: left;
}
.sheet-table th.sheet-group-th { text-align: center; }
.sheet-table td {
  padding: 4px 8px; border: 1px solid #d0d7de;
  white-space: nowrap; vertical-align: middle; color: #222;
}
.sheet-table tbody tr:nth-child(even) td { background: #f7f9fb; }
.sheet-table tbody tr:hover td { background: #edf3fc; }
.sheet-table td.st-empty { color: #bbb; }
.sheet-table td.st-num { text-align: left; }
.sheet-table td.editing-cell {
  outline: none; cursor: text; background: #fffbe6 !important;
}
.sheet-table td.editing-cell:focus { box-shadow: inset 0 0 0 2px #4a90e2; }
.sheet-table td.dblclick-edit { cursor: pointer; }
.sheet-table td.dblclick-edit[contenteditable="true"] { cursor: text; }
.sheet-table td.sheet-subhead {
  background: #e8eef4 !important; font-weight: 700; color: #1a3a5c;
}
.sheet-table td.cell-selected {
  background: #cfe3fb !important; outline: 1px solid #4a90e2; outline-offset: -1px;
}
.sheet-table td.cpk-warn { background: #fff3bf !important; font-weight: 700; color: #5c4400; }

/* ── CPK 표: Excel 식 freeze panes(헤더 상단 고정 + subject 좌측 / cpk 우측 고정) + 페이저 ── */
.sheet-wrap.cpk-sheet {
  overflow: auto;
  max-height: calc(100vh - var(--sticky-head-h, 96px) - 150px);
  border: 1px solid #d0d7de; border-radius: 6px; margin-bottom: 6px;
}
.sheet-table.cpk-sheet thead th { position: sticky; top: 0; z-index: 3; }
.sheet-table.cpk-sheet th:first-child,
.sheet-table.cpk-sheet td:first-child { position: sticky; left: 0; z-index: 2; background: #fff; }
.sheet-table.cpk-sheet thead th:first-child { z-index: 4; background: #e8eef4; }
.sheet-table.cpk-sheet th:last-child,
.sheet-table.cpk-sheet td:last-child { position: sticky; right: 0; z-index: 2; background: #fff; }
.sheet-table.cpk-sheet thead th:last-child { z-index: 4; background: #e8eef4; }
.sheet-table.cpk-sheet tbody tr:nth-child(even) td:first-child,
.sheet-table.cpk-sheet tbody tr:nth-child(even) td:last-child { background: #f7f9fb; }
.sheet-table.cpk-sheet td.cpk-warn { background: #fff3bf !important; }
.cpk-pager {
  display: flex; align-items: center; gap: 12px; margin: 4px 0 18px;
  font-size: 12px; color: #555;
}
.cpk-pager-info { font-variant-numeric: tabular-nums; }

/* ── Issue Table: Excel 식 freeze panes(헤더 상단 고정 + 좌측 식별 컬럼 category~item 고정) ── */
.sheet-wrap.kind-issue {
  overflow: auto;
  max-height: calc(100vh - var(--sticky-head-h, 96px) - 90px);
  border: 1px solid #d0d7de; border-radius: 6px;
}
.sheet-table.kind-issue thead th { position: sticky; top: 0; z-index: 4; }
.sheet-table.kind-issue th:nth-child(-n+5),
.sheet-table.kind-issue td:nth-child(-n+5) { position: sticky; z-index: 3; background: #fff; }
.sheet-table.kind-issue th:nth-child(1), .sheet-table.kind-issue td:nth-child(1) { left: 0; }
.sheet-table.kind-issue th:nth-child(2), .sheet-table.kind-issue td:nth-child(2) { left: 90px; }
.sheet-table.kind-issue th:nth-child(3), .sheet-table.kind-issue td:nth-child(3) { left: 170px; }
.sheet-table.kind-issue th:nth-child(4), .sheet-table.kind-issue td:nth-child(4) { left: 220px; }
.sheet-table.kind-issue th:nth-child(5), .sheet-table.kind-issue td:nth-child(5) { left: 300px; }
.sheet-table.kind-issue thead th:nth-child(-n+5) { z-index: 5; background: #e8eef4; }
.sheet-table.kind-issue td.sheet-subhead { background: #e8eef4 !important; }

/* ── Yield 시트: Bin 접기/펼치기 ── */
.yield-toggle {
  border: 1px solid #c7d2e0; background: #eef3fb; color: #1f4d8c;
  border-radius: 4px; font-size: 10px; line-height: 1; padding: 1px 4px;
  cursor: pointer; margin-right: 4px;
}
.yield-toggle:hover { background: #dbe8fb; }
.sheet-table.kind-yield tbody tr.yield-bin-detail td { background: #fbfcfe; color: #55606c; }
.sheet-table.kind-yield tbody tr.yield-bin-rep td { font-weight: 600; }

/* Yield 탭 전용 다듬기 (다른 sheet-table 은 영향 없음) */
.sheet-wrap.kind-yield { border: 1px solid #d9dfe6; border-radius: 8px; overflow: hidden; }
.sheet-wrap.kind-yield .sheet-table { margin-bottom: 0; }
.sheet-table.kind-yield th {
  background: #eef2f7; text-transform: uppercase; font-size: 10.5px;
  letter-spacing: .02em; color: #47607d;
}
.sheet-table.kind-yield td.st-num { text-align: right; font-variant-numeric: tabular-nums; }
.sheet-table.kind-yield tbody tr.yield-pass-row td {
  background: #e9f8ef !important; color: #14703d; font-weight: 700;
}
.sheet-table.kind-yield tbody tr.yield-pass-row:hover td { background: #ddf3e5 !important; }
.sheet-block { margin-bottom: 24px; }
.sheet-block-title {
  font-size: 12px; font-weight: 700; color: #1f4d8c;
  margin: 0 0 6px; padding: 3px 8px;
  background: #eef3fb; border-left: 3px solid #4a90e2; border-radius: 0 4px 4px 0;
}

.text-lines {
  font-size: 13px; color: #333; line-height: 1.7;
  background: #fff; border: 1px solid #eef0f3; border-radius: 6px;
  padding: 12px 16px; margin-bottom: 8px;
}
.text-lines div { padding: 1px 0; }

.placeholder { font-size: 13px; color: #999; padding: 40px 20px; text-align: center; }

/* ── Distribution 산포 탭 (툴바/갤러리/상세) ─────────────────────────────── */
.dist-plot { width: 100%; height: 100%; }   /* Issue Table 미니분포 공용 */
/* Issue Table Bin 상세/미니 분포 셀 (renderDistCell / renderMiniDistCell 공용) */
.dist-cell { position: relative; height: 240px; background: #fff; border: 1px solid #e0e0e0;
  border-radius: 6px; overflow: hidden; }
.dist-placeholder { position: absolute; inset: 0; display: flex; align-items: center;
  justify-content: center; color: #bbb; font-size: 12px; }
.dist-toolbar { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; flex-wrap: wrap;
  position: sticky; top: var(--sticky-head-h, 96px); z-index: 90; background: #fff; padding: 6px 0; }
.distseg-group { display: inline-flex; border: 1px solid #d0d5dd; border-radius: 6px; overflow: hidden; }
.distseg { border: none; background: #fff; padding: 6px 14px; font-size: 13px; cursor: pointer;
  color: #444; border-right: 1px solid #e5e7eb; }
.distseg:last-child { border-right: none; }
.distseg.active { background: #5E6AD2; color: #fff; }
.dist-legend { display: inline-flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.dist-leg-item { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #444; }
.dist-leg-sw { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.dist-search-wrap { position: relative; }
.dist-search { padding: 6px 10px; border: 1px solid #d0d5dd; border-radius: 6px; font-size: 13px; width: 240px; }
.dist-suggest { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #e0e0e0;
  border-radius: 6px; margin-top: 4px; max-height: 320px; overflow-y: auto; z-index: 100;
  box-shadow: 0 6px 20px rgba(0,0,0,.12); }
.dist-sug-item { display: flex; gap: 8px; align-items: center; padding: 6px 10px; cursor: pointer; font-size: 12.5px; }
.dist-sug-item:hover { background: #f2f4ff; }
.dist-sug-item .sug-tno { color: #999; min-width: 34px; }
.dist-sug-item .sug-name { flex: 1; font-weight: 600; color: #222; }
.dist-sug-item .sug-cpk { color: #666; }
.dist-count { font-size: 12px; color: #888; }
.distg-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1100px) { .distg-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.distg-card { border: 1px solid #e2e4e8; border-radius: 8px; overflow: hidden; height: 220px;
  display: flex; flex-direction: column; cursor: pointer; transition: box-shadow .12s; }
.distg-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.14); }
.distg-head { display: flex; align-items: baseline; gap: 6px; padding: 6px 9px; font-size: 12px;
  border-bottom: 1px solid rgba(0,0,0,.06); background: rgba(255,255,255,.45); }
.distg-tno { color: #999; }
.distg-name { flex: 1; font-weight: 600; color: #1A1A1F; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.distg-cpk { color: #555; font-size: 11.5px; white-space: nowrap; }
.distg-lim { color: #6b7280; font-size: 10px; white-space: nowrap; margin: 0 6px; }
.distg-plot { flex: 1; min-height: 0; }
.dist-detail-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap;
  position: sticky; top: var(--sticky-head-h, 96px); z-index: 90; background: #fff; padding: 6px 0; }
.dist-detail-head button { border: 1px solid #d0d5dd; background: #fff; border-radius: 6px;
  padding: 5px 12px; cursor: pointer; font-size: 13px; }
.dist-detail-head button:hover { background: #f2f4ff; }
.dist-navpos { font-size: 12px; color: #888; }
.dist-detail-title { margin-left: 8px; font-size: 14px; color: #1A1A1F; }
.dist-detail-body { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.dist-chart-block { border: 1px solid #e2e4e8; border-radius: 8px; padding: 8px 10px; }
.dist-chart-cap { font-size: 12.5px; color: #666; margin-bottom: 4px; }
.dist-chart { width: 100%; height: 420px; }
.dist-loading { font-size: 12px; color: #999; padding: 10px; }
@media (max-width: 900px) { .dist-detail-body { grid-template-columns: 1fr; } }

/* ── Raw Data (web_report lazy-load) ──────────────────────────────────────── */
/* 그리드가 페이지 자체 스크롤을 쓰므로(내부 height 없음), 검색/필터 바와 그 아래 그리드
   헤더(SOURCE/SERIAL/SHOT/DUT...)를 topbar 처럼 sticky 로 고정한다. --rawdata-filters-h 는
   JS(syncRawFiltersHeight)가 실측해 갱신 — 필터 바 높이가 반응형으로 바뀌기 때문. */
.rawdata-filters {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px;
  position: sticky; top: var(--sticky-head-h, 96px); z-index: 95; background: #fff; padding: 6px 0;
}
.rawdata-filters input, .rawdata-filters select {
  padding: 5px 8px; border: 1px solid #d0d5dd; border-radius: 4px; font-size: 9px;
}
.rawdata-filters .btn-sm.active { background: #4a90e2; border-color: #4a90e2; color: #fff; }
/* Tabulator 가 #rawDataGridHost 안에 만드는 루트 .tabulator 는 벤더 CSS 에서 무조건
   overflow:hidden + transform:translateZ(0) 를 건다 — 이 둘은 각각 독립적으로 후손의
   position:sticky 를 무력화한다(overflow!=visible 은 sticky 후손을 그 조상 스크롤 박스
   안에 가두고, transform!=none 은 새 containing block 을 만들어 sticky/fixed 후손을 가둠).
   #rawDataGridHost 로 범위를 좁혀 무효화한다 — 전역 .tabulator 를 건드리면 height:62vh 로
   내부 스크롤을 쓰는 #yieldGridHost(Yield 탭)가 깨진다. position:relative 는 그대로 둔다 —
   sticky 를 막지 않고, Tabulator 내부 절대위치 요소(컬럼 리사이즈 핸들, selectableRange
   오버레이, 셀 에디터)의 containing block 으로 필요하다. */
/* Tabulator 는 이 루트 클래스를 별도 자식 div 가 아니라 #rawDataGridHost 자기 자신에
   직접 붙인다 — 자손 선택자(#rawDataGridHost .tabulator)는 매칭되지 않아 무효했다.
   같은 엘리먼트 선택자(#rawDataGridHost.tabulator)를 추가해 실제로 적용되게 한다. */
#rawDataGridHost.tabulator, #rawDataGridHost .tabulator {
  overflow: visible;
  transform: none;
  -webkit-transform: none;
  -moz-transform: none;
  -ms-transform: none;
  -o-transform: none;
}
:root { --rawdata-hscroll-h: 16px; }
/* 실제 가로 스크롤을 담당하는 .tabulator-tableholder(overflow:auto, 높이 무제한)의 네이티브
   스크롤바는 ~1000행짜리 표의 맨 아래에 생겨 접근하기 불편하므로, 아래 .rawdata-hscroll
   프록시 스크롤바로 대체하고 네이티브 것은 시각적으로 숨긴다(overflow-x:auto 자체는 유지되므로
   휠/트랙패드/프로그램적 scrollLeft 로 계속 스크롤 가능 — JS 는 report_view.html 스크립트 쪽
   syncRawHscrollSpacer/runRawDataQuery 참조). */
.rawdata-hscroll {
  position: sticky;
  top: calc(var(--sticky-head-h, 96px) + var(--rawdata-filters-h, 0px));
  z-index: 92;
  height: var(--rawdata-hscroll-h);
  overflow-x: auto;
  overflow-y: hidden;
  background: #fff;
}
.rawdata-hscroll-spacer { height: 1px; }  /* 폭만 JS 로 실제 스크롤 폭에 맞춰 갱신 */
#rawDataGridHost .tabulator-header {
  position: sticky;
  top: calc(var(--sticky-head-h, 96px) + var(--rawdata-filters-h, 0px) + var(--rawdata-hscroll-h));
  z-index: 90;
}
#rawDataGridHost .tabulator-tableholder {
  scrollbar-width: none;
  -ms-overflow-style: none;
}
#rawDataGridHost .tabulator-tableholder::-webkit-scrollbar { display: none; }
.rawdata-selcount { font-size: 9px; color: #666; margin-left: auto; }
.rawdata-body { display: flex; gap: 16px; align-items: flex-start; }
.rawdata-cols {
  flex: 0 0 240px; border: 1px solid #eef0f3; border-radius: 6px; padding: 8px; background: #fff;
  position: sticky; top: var(--sticky-head-h, 96px); align-self: flex-start;
}
.rawdata-cols-head { display: flex; gap: 6px; margin-bottom: 8px; }
.rawdata-cols-head input {
  width: 100%; padding: 5px 8px; border: 1px solid #d0d5dd; border-radius: 4px; font-size: 9px;
}
.rawdata-cols-head .btn-sm { margin-top: 0; white-space: nowrap; }
.rawdata-item-list { max-height: 50vh; overflow-y: auto; }
.rawdata-item {
  display: block; width: 100%; text-align: left; font-size: 9px; padding: 4px 8px;
  margin: 2px 0; cursor: pointer; border: 1px solid #d0d7de; border-radius: 4px;
  background: #fff; color: #222;
}
/* :not(.selected) 필수 — 없으면 이 규칙(클래스 3개 상당)이 .rawdata-item.selected(클래스 2개)
   보다 우선해 선택된 항목에 마우스를 올릴 때 배경만 밝게 덮어써 흰 글자가 안 보이게 된다. */
.rawdata-item:hover:not(:disabled):not(.selected) { background: #f0f4f9; }
.rawdata-item.selected { background: #4a90e2; border-color: #4a90e2; color: #fff; }
.rawdata-item.selected:hover { background: #3f82cc; }
.rawdata-item.selected .rawdata-item-meta { color: #eaf2ff; }
/* cap(60개) 도달 시 미선택 항목 비활성 표시 — opacity 로 흐리게 하면 흰 배경 위에서
   글자가 거의 안 보이므로(#222 @ 0.4 는 거의 흰색) opacity 대신 색상으로만 구분한다. */
.rawdata-item:disabled { opacity: 1; color: #aaa; background: #f5f5f5; cursor: not-allowed; }
.rawdata-item-meta { color: #999; font-size: 8px; }
.rawdata-grid-wrap { flex: 1; min-width: 0; }
.rawdata-banner { font-size: 9px; color: #666; margin-bottom: 8px; }
.rawdata-source-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.rawdata-source-btns .btn-sm { margin-top: 0; }
.rawdata-source-btns .btn-sm.active { background: #4a90e2; border-color: #4a90e2; color: #fff; }
#panel-raw-data .edit-hint { font-size: 8px; }
#rawDataGridHost .tabulator { font-size: 11px; }
#rawDataGridHost .tabulator-cell,
#rawDataGridHost .tabulator-col {
  border-bottom: 1px solid #d8dee6 !important;
}
/* Raw Data 다중행 헤더: 항목명 아래 UNIT/LOLIM/HILIM 메타를 세로로 쌓아 고정 표시 */
#rawDataGridHost .tabulator-col-title { white-space: normal; overflow: visible; text-overflow: clip; }
#rawDataGridHost .rd-name { display: block; font-weight: 700; }
#rawDataGridHost .rd-meta { display: block; font-weight: 400; font-size: 10px; color: #8a8f98; line-height: 1.4; }

/* ── wafer map / fail-bin 차트 (web_report) ──────────────────────────────── */

  --text-secondary: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;

.wafer-analysis-layout { display: flex; gap: 24px; align-items: flex-start; }

.chart-box { width: 100%; max-width: 760px; margin-bottom: 8px; }
.summary-cards { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 24px; }

<script>
const SESSION_ID = location.pathname.split("/").pop();
const YIELD_COLS = ["item_name", "bin_number", "yield_percent", "fail_count",
                    "cpk_val", "mean_val", "stdev_val", "lsl", "usl", "unit"];

// ── 없는 sheet 용 기본 표 골격(frame) ──────────────────────────────────────────
// 업로드 xlsx 에 해당 sheet 가 없으면 헤더만 있는 빈 표(헤더 + 빈 행 1개)를 보여준다.
// 동적 source 열({src}_count/_yield)은 sheet 가 없으면 알 수 없으므로 정적 열만 포함.
// 헤더 값은 생성기 client/report_generator/xlsx_writer.py 레이아웃과 일치.
const YIELD_FRAME_COLS = ["step", "bin", "TNO", "Item", "avg", "comment"];
const ISSUE_FRAME_COLS = ["Category", "Step", "Bin", "TNO", "Item", "avg", "Distribution",
                          "PTE comment", "개발 comment"];
const SUMMARY_FRAME_BLOCKS = [
  { label: "1. Device Feature",
    headers: ["DEVICE", "Customer", "PKG_Type", "GrossDie", "Process Line", "EVT_Version"] },
  { label: "2. Yield",
    headers: ["Lot NO", "Yield", "Major Fail Bins", "Comment"] },
  { label: "3. Evaluation Summary",
    headers: ["Category", "Condition & Judge Limit", "Result"] },
];

// 헤더+빈 행 1개용 행 객체 (모든 열 빈 문자열)
function frameRow(cols) { const o = {}; cols.forEach(c => { o[c] = ""; }); return o; }
// summary blocks frame: 블록마다 빈 행 1개
function summaryFrameData() {
  return { blocks: SUMMARY_FRAME_BLOCKS.map(b => ({
    label: b.label, headers: b.headers, rows: [b.headers.map(() => "")] })) };
}

// legacy summary dict 에 표시할 의미있는 내용이 있는지 (title 단독은 제외)
function summaryDictHasContent(st) {
  if (!st || typeof st !== "object") return false;
  return !!((st.feature && Object.keys(st.feature).length) ||
            (Array.isArray(st.yield_summary_text) && st.yield_summary_text.length) ||
            (Array.isArray(st.major_fail_bins) && st.major_fail_bins.length) ||
            (st.evaluation && Object.keys(st.evaluation).length) ||
            (Array.isArray(st.raw_rows) && st.raw_rows.length));
}

// 표 3종이 "정말로 비었을 때"만 frame 구조로 시드 → 보기/수정/저장이 신규 포맷 경로를 탄다.
// 판정 조건은 각 render* 의 emptyPanel fall-through 와 동일.
function seedEmptyFrames() {
  if (!DATA) return;
  const summaryRows = DATA.summary;

  // summary: blocks/grid 아니고 legacy dict 내용도 summary_rows 도 없을 때
  if (!isSummaryBlocks(DATA.summary_text) && !isGrid(DATA.summary_text) &&
      !summaryDictHasContent(DATA.summary_text) &&
      !(Array.isArray(summaryRows) && summaryRows.length)) {
    DATA.summary_text = summaryFrameData();
  }

  // yield: yield_text(list/grid) 미사용 그리고 legacy summary_rows 도 없을 때
  if (!(Array.isArray(DATA.yield_text) && DATA.yield_text.length) &&
      !isGrid(DATA.yield_text) &&
      !(Array.isArray(summaryRows) && summaryRows.length)) {
    DATA.yield_text = [frameRow(YIELD_FRAME_COLS)];
  }

  // issue: issue_table_text(list/grid) 미사용일 때
  if (!(Array.isArray(DATA.issue_table_text) && DATA.issue_table_text.length) &&
      !isGrid(DATA.issue_table_text)) {
    DATA.issue_table_text = [frameRow(ISSUE_FRAME_COLS)];
  }
}

// CSRF: 서버가 /view 응답에 내려준 double-submit 쿠키를 읽어 변경요청 헤더로 되돌려준다.
function csrfToken() {
  const m = document.cookie.match(/(?:^|;\s*)report_csrf=([^;]+)/);
  return m ? decodeURIComponent(m[1]) : "";
}

let DATA = null;
function isWebReportSession() {
  return !!(DATA && DATA.session && DATA.session.source === "web_report");
}
let MODE = "view";              // "view" | "edit"
let verifiedPassword = "";      // 수정 모드 진입 시 검증된 PIN (저장에 재사용)
let yieldGrid = null;           // 수정 모드 Yield 편집 Tabulator 인스턴스 (없으면 null)


// & < > " ' 모두 이스케이프 → 텍스트/속성 양쪽에서 안전
function esc(v) {
  return String(v ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function fmtDate(unix) {
  if (!unix) return "-";
  const d = new Date(unix * 1000);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function showToast(msg, ms=2200) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), ms);
}

function splitLines(v) {
  const a = (v || "").split("\n");
  while (a.length && a[a.length - 1].trim() === "") a.pop();
  return a;
}

// ── tab switching ──────────────────────────────────────────────────────────
document.getElementById("tabs").addEventListener("click", e => {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  const tab = btn.dataset.tab;
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b === btn));
  document.querySelectorAll(".panel").forEach(p =>
    p.classList.toggle("active", p.id === `panel-${tab}`));
  // lazy 렌더: 아직 안 그려진(dirty) 탭이면 이 시점에 렌더 (프리렌더가 이미 그렸으면 no-op)
  renderTab(tab);
  // 숨김 상태에서 그려진 Plotly 차트는 0px 로 렌더되므로 활성화 시 리사이즈
  const active = document.getElementById(`panel-${tab}`);
  if (active && window.Plotly) {
    active.querySelectorAll(".js-plotly-plot").forEach(d => { try { Plotly.Plots.resize(d); } catch (e) {} });
  }
});

// ── topbar meta ──────────────────────────────────────────────────────────────
function renderMeta(session) {
  const pt = (session.product_type || "").trim();
  const ptCls = ["MDDI", "PDDI", "PMIC", "SECURITY", "TCON"].includes(pt) ? pt : "default";
  const sourceFiles = ((DATA && DATA.web_report && DATA.web_report.sources) || [])
    .map(s => s.file_name || s.name).filter(Boolean);
  const fname = sourceFiles[0] || session.file_name || "-";
  const fnameTitle = sourceFiles.length > 1 ? sourceFiles.join("\n") : fname;
  const line1 = [
    `<span class="pt-badge ${ptCls}">${esc(pt || "-")}</span>`,
    `<span class="meta-inline"><span class="mk">Product</span>${esc(session.product || "-")}</span>`,
    `<span class="meta-inline"><span class="mk">Revision</span>${esc(session.revision || "-")}</span>`,
    `<span class="meta-inline"><span class="mk">Process</span>${esc(session.process || "-")}</span>`,
    `<span class="meta-inline"><span class="mk">LOT</span>${esc(session.lot_id || "-")}</span>`,
  ];
  const line2 = [
    `<span class="meta-inline-file" title="${esc(fnameTitle)}"><span class="mk">Filename</span>${esc(fname)}</span>`,
    `<span class="meta-inline"><span class="mk">Uploaded</span>${esc(fmtDate(session.created_at))}</span>`,
    `<span class="meta-inline"><span class="mk">Status</span>${esc(session.status || "-")}</span>`,
  ];
  document.getElementById("topbarMeta").innerHTML =
    `<div class="meta-row">${line1.join("")}</div><div class="meta-row">${line2.join("")}</div>`;
  syncTabVisibility();
  syncStickyHeadHeight();
}

// web_report 전용 데이터로만 채워지는 탭(Raw Data/CPK/Map Analysis)은 legacy(xlsx_upload)
// 세션에서 항상 빈 화면이므로 탭 버튼 자체를 숨긴다. 숨긴 탭이 활성 상태였으면 Summary 로 전환.
const WEB_REPORT_ONLY_TABS = ["raw-data", "cpk", "map-analysis"];
function syncTabVisibility() {
  const web = isWebReportSession();
  let hidActive = false;
  WEB_REPORT_ONLY_TABS.forEach(name => {
    const btn = document.querySelector(`.tab[data-tab="${name}"]`);
    if (!btn) return;
    btn.style.display = web ? "" : "none";
    if (!web && btn.classList.contains("active")) hidActive = true;
  });
  if (hidActive) {
    document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.tab === "summary"));
    document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "panel-summary"));
    renderTab("summary");   // lazy 렌더에서 강제 전환된 summary 가 dirty 로 남지 않도록
  }
}

// ── read-only helpers ────────────────────────────────────────────────────────
function emptyPanel(panel, msg) {
  panel.innerHTML = `<div class="placeholder">${esc(msg)}</div>`;
}

function deriveCols(rows) {
  const seen = [];
  (rows || []).forEach(r => Object.keys(r || {}).forEach(k => { if (!seen.includes(k)) seen.push(k); }));
  return seen;
}

// ── grid model 렌더 (xlsx 원형 재현) ─────────────────────────────────────────
function isGrid(o) { return !!(o && typeof o === "object" && Array.isArray(o.cells)); }

// 편집된 grid DOM → 원본 grid 복제본에 셀 텍스트만 반영 (legacy 저장 경로 전용)
function collectGrid(panelEl, baseGrid) {
  if (!isGrid(baseGrid)) return baseGrid;
  const out = JSON.parse(JSON.stringify(baseGrid));
  panelEl.querySelectorAll("td[data-r]").forEach(td => {
    const r = +td.dataset.r, c = +td.dataset.c;
    if (out.cells[r] && out.cells[r][c]) out.cells[r][c].t = td.textContent;
  });
  return out;
}

// ── sheet-table 렌더 (xlsx 텍스트 데이터 원형 재현) ──────────────────────────

// 열 이름 → 고정 너비(px) — xlsx 실측 기준 패턴
function colWidth(name) {
  const n = String(name || "").toLowerCase().trim();
  if (n === "bin")                      return "50px";
  if (n === "distribution")             return "120px";
  if (n.endsWith("_count"))             return "54px";
  if (n.endsWith("_yield"))             return "60px";
  if (n === "avg")                      return "56px";
  if (n === "item")                     return "150px";
  if (n === "category")                 return "90px";
  if (n === "condition & judge limit")  return "185px";
  if (n === "result")                   return "80px";
  if (n.includes("comment"))            return "220px";
  return "80px";
}

// 값이 숫자인지 (td 정렬용)
function isNumVal(v) { return v !== null && v !== undefined && v !== "" && !isNaN(+v); }

function isDistCol(c) { return String(c || "").toLowerCase() === "distribution"; }

// 열 순서 보정: 고정 prefix 컬럼(step/bin/tno/item, issue 는 category 포함 avg 까지)
// → 지정 순서로 맨 앞에 배치(대소문자 무시), comment 류 → 최우측. 나머지 상대순서 유지.
// yield: source 별 yield 값 → source 별 _cnt/_count → avg 순으로 그루핑.
function orderColumns(cols, kind) {
  const isComment = c => /comment/i.test(String(c));

  const comments = cols.filter(isComment);
  let rest = cols.filter(c => !isComment(c));

  const PREFIX_ORDER = {
    yield: ["step", "bin", "tno", "item"],
    issue: ["category", "step", "bin", "tno", "item", "avg"],
  };
  const prefix = PREFIX_ORDER[kind];
  if (prefix) {
    const lower = c => String(c).trim().toLowerCase();
    const front = [];
    prefix.forEach(p => {
      const idx = rest.findIndex(c => lower(c) === p);
      if (idx !== -1) front.push(rest.splice(idx, 1)[0]);
    });
    rest = front.concat(rest);
  }

  if (kind === "yield") {
    const isCntCol = c => /_(cnt|count)$/i.test(String(c));
    const isAvgCol = c => String(c).trim().toLowerCase() === "avg";
    const yieldVals = rest.filter(c => !isCntCol(c) && !isAvgCol(c));
    const cntVals = rest.filter(isCntCol);
    const avgVals = rest.filter(isAvgCol);
    rest = yieldVals.concat(cntVals).concat(avgVals);
  }

  return rest.concat(comments);
}

// 빈 헤더 placeholder(_colN)는 화면엔 빈칸으로
function headerLabel(c) { return /^_col\d+$/.test(String(c)) ? "" : c; }

// _yield/_count 처럼 소스별로 반복되는 컬럼이 연속 2개 이상 묶이면 상단에 "yield"/"count"
// 병합 헤더 + 하단에 접미사를 뗀 소스 짧은 이름을 보여주는 2행 헤더를 만든다.
// 그런 묶음이 없으면(소스 1개뿐이거나 다른 시트) 기존과 동일한 1행 헤더를 그대로 렌더.
const SHEET_HEADER_SUFFIX_GROUPS = [
  { re: /_yield$/i, label: "yield" },
  { re: /_(cnt|count)$/i, label: "count" },
];
function sheetHeaderShortLabel(c) {
  return headerLabel(c).replace(/_(yield|cnt|count)$/i, "");
}
function buildSheetTableHead(cols) {
  const groupOf = c => SHEET_HEADER_SUFFIX_GROUPS.find(g => g.re.test(String(c)));
  const runs = [];
  for (let i = 0; i < cols.length; ) {
    const g = groupOf(cols[i]);
    let j = i + 1;
    if (g) { while (j < cols.length && groupOf(cols[j]) === g) j++; }
    runs.push({ start: i, len: j - i, group: (g && (j - i) >= 2) ? g : null });
    i = j;
  }
  if (!runs.some(r => r.group)) {
    return "<thead><tr>" + cols.map(c => `<th>${esc(headerLabel(c))}</th>`).join("") + "</tr></thead>";
  }
  const topRow = runs.map(r => r.group
    ? `<th colspan="${r.len}" class="sheet-group-th">${esc(r.group.label)}</th>`
    : `<th rowspan="2">${esc(headerLabel(cols[r.start]))}</th>`
  ).join("");
  const botRow = runs.filter(r => r.group).map(r =>
    cols.slice(r.start, r.start + r.len).map(c => `<th>${esc(sheetHeaderShortLabel(c))}</th>`).join("")
  ).join("");
  return `<thead><tr>${topRow}</tr><tr>${botRow}</tr></thead>`;
}

// 반복 섹션 헤더 행(yield의 P1/P2/P3 구간별 헤더) 감지: 셀 값이 자기 컬럼명과
// 동일한 비율이 높으면 "헤더가 데이터로 들어간" 행으로 판단.
function isHeaderLikeRow(r, cols) {
  if (!r) return false;
  let total = 0, matches = 0;
  for (const c of cols) {
    const name = String(c).trim().toLowerCase();
    if (!name || /^_col\d+$/.test(name)) continue;
    total++;
    const v = r[c];
    const txt = (v === null || v === undefined) ? "" : String(v).trim().toLowerCase();
    if (txt === name) matches++;
  }
  return total > 0 && (matches / total) >= 0.6;
}

// issue_table 의 CPK 카테고리 전환 행("item name" / "cpk" 서브헤더) 감지.
function isCpkSubheadRow(r) {
  if (!r) return false;
  const cat = String(r["Category"] ?? "").trim().toLowerCase();
  const avg = String(r["avg"] ?? "").trim().toLowerCase();
  return cat === "cpk" && avg === "cpk";
}

// yield 행 정렬(보기 전용): step 별 섹션(반복 헤더 행으로 구분) 안에서
// Bin1(PASS) 행을 맨 위에 두고, 나머지는 avg 내림차순. 합계(Sum) 행은 섹션 끝 유지.
function reorderYieldRows(rows, cols) {
  if (!rows || rows.length < 2) return rows || [];
  const binCol = cols.find(c => String(c).trim().toLowerCase() === "bin");
  const avgCol = cols.find(c => String(c).trim().toLowerCase() === "avg");
  if (!binCol || !avgCol) return rows;

  const firstCol = cols[0];
  const isPassBin = r => String((r ? r[binCol] : "") ?? "").trim() === "1";
  const isSumRow = r => String((r ? r[firstCol] : "") ?? "").trim().toLowerCase() === "sum";

  const out = [];
  let section = [];
  const flushSection = () => {
    if (!section.length) return;
    const sumRows = section.filter(isSumRow);
    const dataRows = section.filter(r => !isSumRow(r));
    const passRows = dataRows.filter(isPassBin);
    const restRows = dataRows.filter(r => !isPassBin(r))
      .slice()
      .sort((a, b) => (parseFloat(b[avgCol]) || 0) - (parseFloat(a[avgCol]) || 0));
    out.push(...passRows, ...restRows, ...sumRows);
    section = [];
  };

  rows.forEach(r => {
    if (isHeaderLikeRow(r, cols)) {
      flushSection();
      out.push(r);
    } else {
      section.push(r);
    }
  });
  flushSection();
  return out;
}

/**
 * rows(list of dict) → HTML sheet-table.
 * opts: { edit, kind:"yield"|"issue", columns:[...] }
 *  - columns: 명시적 열 목록(있으면 derive·정렬 생략, 순서 그대로).
 *    데이터행이 없어도 헤더는 항상 렌더 → 내용 없는 컬럼도 유지.
 *  - kind: comment 최우측 / (issue) category 최좌측 정렬.
 */
// Issue Table comment 저장용 행 식별 키 — 백엔드 web_report/tabs/issue_table.py 의
// manifest.issue_comments 키 규칙과 반드시 동일해야 한다:
// Yield 행 "Yield|<bin>|<item>", CPK 데이터 행 "CPK|<item>", ETC 데이터 행 "ETC|<item>".
function issueRowKey(r, section) {
  const item = String((r && r["Item"]) ?? "");
  if (!item.trim()) return "";
  if (section === "Yield") return `Yield|${String((r && r["Bin"]) ?? "")}|${item}`;
  if (section === "CPK") return `CPK|${item}`;
  if (section === "ETC") return `ETC|${item}`;
  return "";
}

function renderSheetTable(rows, opts) {
  opts = opts || {};
  let cols;
  if (opts.columns && opts.columns.length) {
    cols = opts.columns.slice();
  } else {
    if (!rows || !rows.length) return "";
    cols = [];
    rows.forEach(r => Object.keys(r || {}).forEach(k => { if (!cols.includes(k)) cols.push(k); }));
    if (opts.kind) cols = orderColumns(cols, opts.kind);
  }
  if (!cols.length) return "";

  let bodyRows = rows || [];
  if (opts.kind === "yield" && !opts.edit) bodyRows = reorderYieldRows(bodyRows, cols);
  const binCol = opts.kind === "yield" ? cols.find(c => String(c).trim().toLowerCase() === "bin") : null;

  const colgroup = "<colgroup>" + cols.map(c =>
    `<col style="width:${colWidth(c)}">`
  ).join("") + "</colgroup>";

  const head = buildSheetTableHead(cols);

  // Issue Table 의 Category 열은 rowspan 으로 병합하지 않는다(각 행이 셀을 모두 가져야
  // nth-child 기반 컬럼 틀고정이 어긋나지 않는다). Category 값이 있는 행은 굵게 표시된다.
  const catSpans = {};
  if (opts.kind === "issue" && !opts.edit) {
    for (let i = 0; i < bodyRows.length; i++) catSpans[i] = 1;
  }

  // 각 행이 속한 섹션(Yield/CPK/ETC) — Category 가 비어있는 상세 행은 바로 위 헤더 행의
  // 섹션을 상속한다. Distribution 자동표시(Yield/ETC) 판단과 ETC 상세행의 삭제버튼 표시
  // (edit 모드) 판단에 쓰인다. edit 모드에서도 필요하므로 !opts.edit 조건 없이 계산한다.
  const rowSection = {};
  if (opts.kind === "issue") {
    let sec = "";
    for (let i = 0; i < bodyRows.length; i++) {
      const cat = (bodyRows[i] && bodyRows[i]["Category"]) || "";
      if (cat) sec = cat;
      rowSection[i] = sec;
    }
  }

  const body = "<tbody>" + bodyRows.map((r, ri) => {
    const subhead = (opts.kind === "yield" && isHeaderLikeRow(r, cols))
      || (opts.kind === "issue" && isCpkSubheadRow(r));
    const tds = cols.map((c, ci) => {
      if (c === "Category" && opts.kind === "issue" && !opts.edit) {
        if (catSpans[ri] === 0) return "";  // 위 행의 rowspan 에 병합됨 — 셀 생략
        const catTxt = (r && r["Category"]) || "";
        const catCls = catTxt ? "sheet-subhead" : "st-empty";
        return `<td class="${catCls}" rowspan="${catSpans[ri] || 1}" data-r="${ri}" data-c="${ci}">${esc(catTxt)}</td>`;
      }
      const v = r ? r[c] : "";
      let txt = (v === null || v === undefined) ? "" : String(v);
      if (subhead && txt.trim().toLowerCase() === "cpk") txt = "CPK";
      const isEmpty = txt === "";
      const isNum = isNumVal(v);
      // Distribution 열: web_report 분포(있는 Item)로 작은 산포 카드를 채운다. 없으면 빈 칸.
      if (isDistCol(c)) {
        const item = r && r["Item"];
        // 분포 데이터 로딩 중(distDataReady=false)엔 일단 셀을 만들어 두고, 도착 후
        // refreshDistConsumers 가 채운다 (데이터 없는 항목은 그때 빈 칸으로).
        // Yield/ETC/CPK 섹션의 데이터 행(서브헤더 제외)에 산포 카드 표시.
        if (opts.kind === "issue" && item && !subhead
          && (rowSection[ri] === "Yield" || rowSection[ri] === "ETC" || rowSection[ri] === "CPK")
          && (distDataReady ? !!distDataCache[item] : true)) {
          return `<td${subhead ? ` class="sheet-subhead"` : ""} data-r="${ri}" data-c="${ci}">` +
            `<div class="dist-cell dist-cell-mini" data-subject="${esc(item)}"><div class="dist-plot"></div></div></td>`;
        }
        return `<td class="st-empty${subhead ? " sheet-subhead" : ""}" data-r="${ri}" data-c="${ci}"></td>`;
      }
      // opts.editableCols 가 있으면 그 컬럼만 편집 가능(더블클릭으로 활성화), 나머지는 읽기전용으로
      // 아래 일반 렌더링을 그대로 탄다. 없으면 기존처럼 opts.edit 전체 컬럼이 즉시 편집 가능.
      if (opts.edit && (!opts.editableCols || opts.editableCols.has(c))) {
        if (opts.editableCols) {
          const cls = "editing-cell dblclick-edit" + (subhead ? " sheet-subhead" : "");
          // web_report comment 저장용 행 식별 키 — 없으면(서브헤더/placeholder 행) 저장 대상 아님.
          const rowKey = (opts.kind === "issue" && !subhead) ? issueRowKey(r, rowSection[ri]) : "";
          const keyAttr = rowKey ? ` data-key="${esc(rowKey)}"` : "";
          return `<td class="${cls}"${keyAttr} data-r="${ri}" data-c="${ci}" data-col="${esc(c)}">${esc(txt)}</td>`;
        }
        const cls = "editing-cell" + (isNum ? " st-num" : "") + (subhead ? " sheet-subhead" : "");
        return `<td class="${cls}" contenteditable="true" data-r="${ri}" data-c="${ci}" data-col="${esc(c)}">${esc(txt)}</td>`;
      }
      const clsParts = [];
      if (isEmpty) clsParts.push("st-empty");
      else if (isNum) clsParts.push("st-num");
      if (subhead) clsParts.push("sheet-subhead");
      const cls = clsParts.join(" ");
      // Issue Table 의 Yield 구간 Item 셀: 클릭 시 panel-issues 를 Bin 상세 화면으로 전환
      // (Bin 1/Pass 행은 FailTNO 구성이랄 게 없으므로 클릭 대상에서 제외)
      const clickable = opts.kind === "issue" && !subhead && !isEmpty && c === "Item"
        && r && String(r["Category"] || "") === "Yield" && String(r["Bin"] ?? "").trim() !== "1";
      // ETC 섹션의 상세 행(ENGR 가 수동 추가한 item) Item 셀: 수정 모드에서만 삭제(×) 버튼 노출.
      const etcDeletable = opts.kind === "issue" && opts.edit && !isEmpty && c === "Item"
        && rowSection[ri] === "ETC" && String(r["Category"] || "") === "";
      let cellHtml = clickable
        ? `<span class="issue-item-link" data-bin="${esc(r["Bin"])}" data-item="${esc(txt)}">${esc(txt)}</span>`
        : (isEmpty ? "" : esc(txt));
      if (etcDeletable) {
        cellHtml += ` <button type="button" class="btn-del-etc-item" data-item="${esc(txt)}" title="ETC 항목 제거">×</button>`;
      }
      return `<td${cls ? ` class="${cls}"` : ""} data-r="${ri}" data-c="${ci}">${cellHtml}</td>`;
    }).join("");
    const isPassRow = !subhead && binCol && String((r ? r[binCol] : "") ?? "").trim() === "1";
    return `<tr${isPassRow ? ` class="yield-pass-row"` : ""}>${tds}</tr>`;
  }).join("") + "</tbody>";

  const kindCls = opts.kind ? ` kind-${opts.kind}` : "";
  return `<div class="sheet-wrap${kindCls}"><table class="sheet-table${kindCls}">${colgroup}${head}${body}</table></div>`;
}

// 편집된 sheet-table DOM → rows 재구성
function collectSheetTable(panelEl, baseRows) {
  if (!baseRows || !baseRows.length) return baseRows;
  const cols = [];
  baseRows.forEach(r => Object.keys(r || {}).forEach(k => { if (!cols.includes(k)) cols.push(k); }));
  const tds = panelEl.querySelectorAll("td[data-r][data-col]");
  const out = JSON.parse(JSON.stringify(baseRows));
  tds.forEach(td => {
    const ri = +td.dataset.r, col = td.dataset.col;
    if (out[ri] && col in out[ri]) out[ri][col] = td.textContent;
  });
  return out;
}

// summary blocks 편집 수집
function collectSummaryBlocks(panelEl, baseData) {
  if (!baseData || !baseData.blocks) return baseData;
  const out = JSON.parse(JSON.stringify(baseData));
  const blockEls = panelEl.querySelectorAll(".sheet-block");
  out.blocks.forEach((blk, bi) => {
    const blockEl = blockEls[bi];
    if (!blockEl) return;
    const tds = blockEl.querySelectorAll("td[data-r][data-c]");
    tds.forEach(td => {
      const ri = +td.dataset.r, ci = +td.dataset.c;
      if (out.blocks[bi].rows[ri] !== undefined) {
        out.blocks[bi].rows[ri][ci] = td.textContent;
      }
    });
  });
  return out;
}

// isSummaryBlocks: {"blocks":[...]} 형태인지
function isSummaryBlocks(o) {
  return !!(o && typeof o === "object" && Array.isArray(o.blocks) && o.blocks.length > 0);
}

// Yield 상단 요약 박스 HTML (web_report 세션의 yield_summary 가 있을 때만).

// ── Yield: Bin 접기/펼치기 그룹 렌더 (web_report) ───────────────────────────────
// Pass 행 + Bin 당 most-fail TNO 대표 행(접힘). 대표 행에 ▶ 토글 → 그 Bin 의 나머지
// fail TNO 행을 펼쳐 보여준다(대표 + 펼침 = 그 Bin 의 모든 fail TNO).
let yieldPanelBound = false;
function renderYieldGrouped(passRow, groups, allRows) {
  let cols = [];
  (allRows || []).forEach(r => Object.keys(r || {}).forEach(k => { if (!cols.includes(k)) cols.push(k); }));
  cols = orderColumns(cols, "yield");
  if (!cols.length) return "";

  const colgroup = "<colgroup>" + cols.map(c => `<col style="width:${colWidth(c)}">`).join("") + "</colgroup>";
  const head = buildSheetTableHead(cols);

  const cellTds = (r, toggleHtml) => cols.map(c => {
    const v = r ? r[c] : "";
    const txt = (v === null || v === undefined) ? "" : String(v);
    const isEmpty = txt === "";
    const cls = [];
    if (isEmpty) cls.push("st-empty"); else if (isNumVal(v)) cls.push("st-num");
    let inner = isEmpty ? "" : esc(txt);
    if (toggleHtml && String(c).trim().toLowerCase() === "bin") inner = toggleHtml + inner;
    return `<td${cls.length ? ` class="${cls.join(" ")}"` : ""}>${inner}</td>`;
  }).join("");

  let body = "";
  if (passRow) body += `<tr class="yield-pass-row">${cellTds(passRow, "")}</tr>`;
  (groups || []).forEach((g, gi) => {
    const detail = (g.rows || []).slice(1);   // 대표(most-fail) 제외 나머지 fail TNO
    const toggle = detail.length
      ? `<button type="button" class="yield-toggle" data-grp="${gi}" aria-expanded="false">▶</button> ` : "";
    body += `<tr class="yield-bin-rep" data-grp="${gi}">${cellTds(g.rep, toggle)}</tr>`;
    detail.forEach(r => {
      body += `<tr class="yield-bin-detail" data-grp="${gi}" style="display:none">${cellTds(r, "")}</tr>`;
    });
  });

  return `<div class="sheet-wrap kind-yield"><table class="sheet-table kind-yield">${colgroup}${head}<tbody>${body}</tbody></table></div>`;
}

function bindYieldPanel() {
  if (yieldPanelBound) return;
  const panel = document.getElementById("panel-yield");
  if (!panel) return;
  panel.addEventListener("click", e => {
    const btn = e.target.closest(".yield-toggle");
    if (!btn) return;
    const gi = btn.dataset.grp;
    const expanded = btn.getAttribute("aria-expanded") === "true";
    btn.setAttribute("aria-expanded", expanded ? "false" : "true");
    btn.textContent = expanded ? "▶" : "▼";
    panel.querySelectorAll(`tr.yield-bin-detail[data-grp="${gi}"]`).forEach(tr => {
      tr.style.display = expanded ? "none" : "";
    });
  });
  yieldPanelBound = true;
}

// ── web_report: wafer map + fail-bin 차트 (Plotly) ─────────────────────────
// Pass 는 초록 고정, Fail 은 등장 순서대로 팔레트(dataviz 검증 팔레트에서 초록 제외).
// 색이 넘치면 순환하지만 Fail 셀의 bin 번호 텍스트가 2차 식별자 역할을 한다.
const FAIL_PALETTE = ["#2a78d6","#eda100","#e34948","#4a3aa7","#eb6834","#e87ba4","#1baf7a"];
const PASS_COLOR = "#0ca30c";
const PLOTLY_FONT = { family: 'system-ui, -apple-system, "Segoe UI", sans-serif', size: 11, color: "#52514e" };

function webReportSheets() {
  return (DATA && DATA.web_report && DATA.web_report.sheets) ? DATA.web_report.sheets : null;
}

function makeBinColorMap(binList) {
  const map = {}; let fi = 0;
  binList.forEach(b => {
    if (b === "1") map[b] = PASS_COLOR;
    else { map[b] = FAIL_PALETTE[fi % FAIL_PALETTE.length]; fi++; }
  });
  return map;
}

// 세션 전체에서 같은 bin 은 어느 차트(Summary 미니 웨이퍼/Fail Bin 막대/Yield Pareto/
// Map Analysis 범례)에서든 같은 색이 되도록, Map Analysis 전역 범례 순서를 기준으로
// 색상 매핑을 한 번만 만든다. load() 가 DATA 갱신 시 _globalBinColors 를 초기화한다.
let _globalBinColors = null;
function globalBinColorMap() {
  if (_globalBinColors) return _globalBinColors;
  const sheets = webReportSheets() || {};
  const bins = [];
  buildGlobalBinLegend(sheets["Map Analysis"] || []).forEach(r => {
    const b = String(r.bin);
    if (!bins.includes(b)) bins.push(b);
  });
  (sheets["Fail Bin"] || []).forEach(r => {
    const b = String(r.bin);
    if (!bins.includes(b)) bins.push(b);
  });
  _globalBinColors = makeBinColorMap(bins);
  return _globalBinColors;
}

// 전역 매핑에 없던 bin(좌표 없는 die 등)도 안정적으로 이어서 색을 배정.
function binColor(bin) {
  const map = globalBinColorMap();
  const b = String(bin);
  if (!(b in map)) {
    const failCount = Object.values(map).filter(c => c !== PASS_COLOR).length;
    map[b] = (b === "1") ? PASS_COLOR : FAIL_PALETTE[failCount % FAIL_PALETTE.length];
  }
  return map[b];
}

// 소스 map dict → { trace } (die → bin 이산 heatmap). opts.showText: Fail 셀에 bin 번호.
// opts.binOrder/opts.colorMap 을 넘기면 그 값을 그대로 쓴다 (여러 맵 간 동일 bin 색상 통일용).
function waferHeatmap(m, opts) {
  opts = opts || {};
  const xMin = m.x_min, xMax = m.x_max, yMin = m.y_min, yMax = m.y_max;
  if (xMin == null || yMin == null) return null;
  const W = xMax - xMin + 1, H = yMax - yMin + 1;
  const binOrder = opts.binOrder || (m.bin_counts || []).map(bc => bc.bin);
  const colorMap = opts.colorMap || makeBinColorMap(binOrder);
  const binIndex = {}; binOrder.forEach((b, i) => { binIndex[b] = i; });
  const N = binOrder.length || 1;

  const z = Array.from({ length: H }, () => Array(W).fill(null));
  const text = Array.from({ length: H }, () => Array(W).fill(""));
  const cbin = Array.from({ length: H }, () => Array(W).fill(""));
  (m.dies || []).forEach(d => {
    const c = d.x - xMin, r = d.y - yMin;
    if (r < 0 || r >= H || c < 0 || c >= W) return;
    const idx = binIndex[d.bin] != null ? binIndex[d.bin] : 0;
    z[r][c] = idx + 0.5;
    cbin[r][c] = d.bin;
    if (d.bin !== "1") text[r][c] = d.bin;   // Fail 셀만 bin 번호, Pass 는 빈칸
  });

  const colorscale = [];
  binOrder.forEach((b, i) => {
    colorscale.push([i / N, colorMap[b]]);
    colorscale.push([(i + 1) / N, colorMap[b]]);
  });

  const trace = {
    type: "heatmap", z, zmin: 0, zmax: N,
    x0: xMin, dx: 1, y0: yMin, dy: 1,
    colorscale: colorscale.length ? colorscale : [[0, PASS_COLOR], [1, PASS_COLOR]],
    showscale: false, xgap: 0.5, ygap: 0.5, hoverongaps: false,
    customdata: cbin,
  };
  if (opts.showText) {
    trace.text = text;
    trace.texttemplate = "%{text}";
    trace.textfont = { size: opts.textSize || 8, color: "#0b0b0b" };
  }
  if (opts.mini) trace.hoverinfo = "skip";
  else trace.hovertemplate = "(%{x}, %{y})<br>Bin %{customdata}<extra></extra>";
  return { trace, colorMap, binOrder };
}

function waferLayout(m, opts) {
  opts = opts || {};
  const layout = {
    margin: opts.mini ? { l: 2, r: 2, t: 2, b: 2 } : { l: 42, r: 10, t: 8, b: 36 },
    paper_bgcolor: "#ffffff", plot_bgcolor: "#ffffff", font: PLOTLY_FONT,
    showlegend: false,
    // 셀 정사각(y축 scale 을 x 에 1:1 고정) → 웨이퍼 원형 비율 유지
    xaxis: { zeroline: false, showgrid: false, constrain: "domain",
             title: opts.mini ? "" : "X", visible: !opts.mini },
    yaxis: { zeroline: false, showgrid: false, constrain: "domain",
             scaleanchor: "x", scaleratio: 1,
             title: opts.mini ? "" : "Y", visible: !opts.mini },
  };
  return layout;
}

// 모든 소스의 bin_counts 를 합산해 하나의 공통 범례 순서/집계를 만든다.
// Pass 항상 최상단, 나머지는 전체 합산 count 내림차순.
function buildGlobalBinLegend(maps) {
  const totals = {};
  const order = [];
  (maps || []).forEach(m => {
    (m.bin_counts || []).forEach(bc => {
      if (!(bc.bin in totals)) { order.push(bc.bin); totals[bc.bin] = { count: 0, is_pass: bc.is_pass }; }
      totals[bc.bin].count += bc.count;
    });
  });
  order.sort((a, b) => {
    const pa = totals[a].is_pass, pb = totals[b].is_pass;
    if (pa !== pb) return pa ? -1 : 1;
    return totals[b].count - totals[a].count;
  });
  const grandTotal = order.reduce((s, b) => s + totals[b].count, 0);
  return order.map(b => ({
    bin: b, count: totals[b].count, is_pass: totals[b].is_pass,
    pct: grandTotal ? Math.round((totals[b].count / grandTotal) * 10000) / 100 : 0,
  }));
}

// selectedBin 이 있으면 해당 행에 is-selected 클래스 + data-bin 부여(클릭 하이라이트용).
function binLegendHtml(legendRows, colorMap, selectedBin) {
  const body = legendRows.map(bc => {
    const cls = [bc.is_pass ? "is-pass" : "", bc.bin === selectedBin ? "is-selected" : ""]
      .filter(Boolean).join(" ");
    return `<tr${cls ? ` class="${cls}"` : ""} data-bin="${esc(bc.bin)}">` +
      `<td><span class="bin-swatch" style="background:${colorMap[bc.bin]}"></span>${esc(bc.bin)}${bc.is_pass ? " (Pass)" : ""}</td>` +
      `<td>${bc.count}</td><td>${bc.pct}%</td></tr>`;
  }).join("");
  return `<table class="bin-table"><thead><tr><th>Bin</th><th>Count</th><th>비율</th></tr></thead>` +
         `<tbody>${body}</tbody></table>`;
}

// 선택된 bin만 원색 유지, 나머지는 회색으로 dim 처리한 colorMap 생성(Map Analysis 하이라이트).
const MAP_BIN_DIM_COLOR = "#d9d9d9";
function dimColorMap(colorMap, binOrder, selectedBin) {
  if (!selectedBin) return colorMap;
  const out = {};
  binOrder.forEach(b => { out[b] = (b === selectedBin) ? colorMap[b] : MAP_BIN_DIM_COLOR; });
  return out;
}

// source 가 여럿이면 가로 2칸 그리드로 wafer map 을 나열하고, bin 범례는 전체 소스
// 합산 기준으로 한 번만 만들어 오른쪽에 고정(sticky)한다. 모든 맵이 같은 색상 매핑을 쓴다.
function renderMapAnalysis() {
  const panel = document.getElementById("panel-map-analysis");
  const sheets = webReportSheets();
  const maps = sheets ? sheets["Map Analysis"] : null;
  if (!window.Plotly || !maps || !maps.length) {
    emptyPanel(panel, "Map Analysis 데이터 없음"); return;
  }
  panel.classList.add("viz-root");

  const legendRows = buildGlobalBinLegend(maps);
  const binOrder = legendRows.map(r => r.bin);
  const colorMap = globalBinColorMap();   // 세션 전체 공통 색상 (Summary/Fail Bin 과 일치)
  let mapBinFilter = null;   // 범례 클릭으로 선택된 bin (재클릭 시 해제)

  panel.innerHTML = `<div class="wafer-analysis-layout">` +
    `<div class="wafer-grid">` +
    maps.map((m, i) =>
      `<div class="wafer-card">
        <div class="wafer-card-title">${esc(m.source)} — ${esc(String(m.total))} dies</div>
        <div id="wafer-full-${i}" style="width:100%;height:360px;"></div>
      </div>`).join("") +
    `</div>` +
    `<div class="wafer-legend-fixed">` +
    `<div class="wafer-legend-title">Bin Legend</div>` +
    `<div class="wafer-legend-body"></div>` +
    `</div>` +
    `</div>`;

  // colorMap 만 dim 처리해서 다시 넘기면 되므로 waferHeatmap 구조는 그대로 재사용.
  function redraw() {
    const activeColorMap = dimColorMap(colorMap, binOrder, mapBinFilter);
    maps.forEach((m, i) => {
      const built = waferHeatmap(m, { showText: true, textSize: 8, colorMap: activeColorMap, binOrder });
      if (!built) return;
      Plotly.react(`wafer-full-${i}`, [built.trace], waferLayout(m, {}),
        { responsive: true, displayModeBar: false });
    });
    const legendBody = panel.querySelector(".wafer-legend-body");
    legendBody.innerHTML = binLegendHtml(legendRows, colorMap, mapBinFilter);
    legendBody.querySelectorAll("tbody tr[data-bin]").forEach(tr => {
      tr.addEventListener("click", () => {
        const bin = tr.dataset.bin;
        mapBinFilter = (mapBinFilter === bin) ? null : bin;
        redraw();
      });
    });
  }
  redraw();
}

function renderWebSummary() {
  const panel = document.getElementById("panel-summary");
  const sheets = webReportSheets();
  if (!window.Plotly || !sheets) { emptyPanel(panel, "Summary 데이터 없음"); return; }
  const maps = sheets["Map Analysis"] || [];
  const failBins = sheets["Fail Bin"] || [];
  panel.classList.add("viz-root");
  panel.innerHTML =
    `<div class="section-title small">Total Yield</div>` + yieldOverviewHtml() +
    `<div class="section-title small">Fail Bin — 상위 5</div>` +
    `<div class="chart-box"><div id="summary-failbin" style="width:100%;height:300px;"></div></div>` +
    `<div class="section-title">Wafer Map</div><div class="summary-cards">` +
    maps.map((m, i) =>
      `<div class="summary-card"><div class="summary-card-title">${esc(m.source)}</div>` +
      `<div id="mini-wafer-${i}" style="width:170px;height:170px;"></div></div>`).join("") +
    `</div>`;
  // 미니 웨이퍼도 전역 색상 매핑을 써서 Map Analysis/Fail Bin 차트와 같은 bin=같은 색 유지.
  const gColorMap = globalBinColorMap();
  maps.forEach((m, i) => {
    const binOrder = (m.bin_counts || []).map(bc => String(bc.bin));
    const built = waferHeatmap(m, { mini: true, colorMap: gColorMap, binOrder });
    if (!built) return;
    Plotly.newPlot(`mini-wafer-${i}`, [built.trace], waferLayout(m, { mini: true }),
      { responsive: true, displayModeBar: false, staticPlot: true });

// ── CPK ──────────────────────────────────────────────────────────────────
const CPK_COLUMNS = ["subject", "lower_limit", "upper_limit", "units", "source",
  "n", "min", "median", "max", "average", "stdev", "cpl", "cpu", "cp", "cpk"];
const CPK_NUMERIC = new Set(["lower_limit", "upper_limit", "n", "min", "median", "max",
  "average", "stdev", "cpl", "cpu", "cp", "cpk"]);
const CPK_WARN_THRESHOLD = 1.33;
const CPK_PAGE_SIZE = 50;     // 페이지당 표시 행 수

let cpkShowLowOnly = true;    // 기본값: CPK < 1.33 항목만 오름차순(최악 우선) 정렬해 보여줌
let cpkSearchTerm = "";       // subject/source 검색어 (실시간 필터)
let cpkPage = 1;              // 현재 페이지 (1-base)
let cpkPanelBound = false;    // panel-cpk 페이저 클릭 위임 1회 바인딩 플래그

function cpkFilterRows(rows) {
  const term = cpkSearchTerm.trim().toLowerCase();
  if (!term) return rows;
  return rows.filter(r => String(r.subject || "").toLowerCase().includes(term)
    || String(r.source || "").toLowerCase().includes(term));
}

function cpkTableHtml(rows) {
  let bodyRows;
  if (cpkShowLowOnly) {
    bodyRows = rows
      .filter(r => { const v = parseFloat(r.cpk); return !isNaN(v) && v < CPK_WARN_THRESHOLD; })
      .slice()
      .sort((a, b) => parseFloat(a.cpk) - parseFloat(b.cpk));
  } else {
    // subject 가 연속으로 반복되면(같은 item, source 별 행) 2번째 행부터 subject/limit/units 를 비움
    let prevSubject = null;
    bodyRows = rows.map(r => {
      const row = { ...r };
      if (row.subject === prevSubject) {
        row.subject = ""; row.lower_limit = ""; row.upper_limit = ""; row.units = "";
      } else {
        prevSubject = row.subject;
      }
      return row;
    });
  }

  if (!bodyRows.length) {
    const msg = cpkSearchTerm.trim() ? "검색 결과 없음"
      : `CPK &lt; ${CPK_WARN_THRESHOLD} 항목 없음`;
    return `<div class="placeholder">${msg}</div>`;
  }

  // 50개씩 페이지네이션 (subject/source 컬럼 좌측 고정, cpk 컬럼 우측 고정, 헤더 상단 고정).
  const totalPages = Math.max(1, Math.ceil(bodyRows.length / CPK_PAGE_SIZE));
  if (cpkPage > totalPages) cpkPage = totalPages;
  if (cpkPage < 1) cpkPage = 1;
  const start = (cpkPage - 1) * CPK_PAGE_SIZE;
  const pageRows = bodyRows.slice(start, start + CPK_PAGE_SIZE);

  const head = "<thead><tr>" + CPK_COLUMNS.map(c => `<th>${esc(c)}</th>`).join("") + "</tr></thead>";
  const body = "<tbody>" + pageRows.map(row => {
    const cpkVal = parseFloat(row.cpk);
    const isWarn = !isNaN(cpkVal) && cpkVal < CPK_WARN_THRESHOLD;
    const tds = CPK_COLUMNS.map(c => {
      const v = row[c];
      const txt = (v === null || v === undefined) ? "" : String(v);
      const cls = [];
      if (txt === "") cls.push("st-empty");
      else if (CPK_NUMERIC.has(c)) cls.push("st-num");
      if (c === "cpk" && isWarn) cls.push("cpk-warn");
      return `<td${cls.length ? ` class="${cls.join(" ")}"` : ""}>${esc(txt)}</td>`;
    }).join("");
    return `<tr>${tds}</tr>`;
  }).join("") + "</tbody>";

  const table = `<div class="sheet-wrap cpk-sheet"><table class="sheet-table cpk-sheet">${head}${body}</table></div>`;
  const end = Math.min(start + CPK_PAGE_SIZE, bodyRows.length);
  const pager = `<div class="cpk-pager">` +
    `<button type="button" class="btn-sm" data-cpk-page="${cpkPage - 1}"${cpkPage <= 1 ? " disabled" : ""}>‹ 이전</button>` +
    `<span class="cpk-pager-info">${start + 1}–${end} / ${bodyRows.length} (page ${cpkPage}/${totalPages})</span>` +
    `<button type="button" class="btn-sm" data-cpk-page="${cpkPage + 1}"${cpkPage >= totalPages ? " disabled" : ""}>다음 ›</button>` +
    `</div>`;
  return table + pager;
}

// 검색어/토글 상태만 바뀌었을 때 테이블만 다시 그림 (검색창 포커스 유지).
function renderCpkTable() {
  const sheets = webReportSheets();
  const rows = sheets ? (sheets["CPK"] || []) : [];
  const host = document.getElementById("cpkTableHost");
  if (host) host.innerHTML = cpkTableHtml(cpkFilterRows(rows));
}

function renderCpk() {
  const panel = document.getElementById("panel-cpk");
  const sheets = webReportSheets();
  const rows = sheets ? (sheets["CPK"] || []) : [];
  if (!rows.length) { emptyPanel(panel, "CPK 데이터 없음"); return; }

  panel.innerHTML =
    `<div class="cpk-toolbar">` +
    `<input type="text" id="cpkSearchInput" placeholder="항목/source 검색" value="${esc(cpkSearchTerm)}">` +
    `<button type="button" id="cpkLowBtn" class="btn-sm">` +
    `${cpkShowLowOnly ? "전체 보기" : `CPK &lt; ${CPK_WARN_THRESHOLD}`}</button></div>` +
    `<div id="cpkTableHost"></div>`;
  renderCpkTable();
  document.getElementById("cpkLowBtn").addEventListener("click", () => {
    cpkShowLowOnly = !cpkShowLowOnly;
    cpkPage = 1;
    renderCpk();
  });
  document.getElementById("cpkSearchInput").addEventListener("input", (e) => {
    cpkSearchTerm = e.target.value;
    cpkPage = 1;
    renderCpkTable();
  });
  // panel-cpk 는 재렌더돼도 요소 자체는 유지되므로 페이저 클릭 위임은 1회만 바인딩한다.
  if (!cpkPanelBound) {
    panel.addEventListener("click", (e) => {
      const pb = e.target.closest("[data-cpk-page]");
      if (!pb || pb.disabled) return;
      cpkPage = parseInt(pb.dataset.cpkPage, 10) || 1;
      renderCpkTable();
    });
    cpkPanelBound = true;
  }
}

// ── Distribution (ECDF, small-multiples grid) ─────────────────────────────
// F:\COINAPI\report_webserver\plotly_core_code (figure_builder.py/page_builder.py) 참고:
// item(subject)별 산점(scattergl, value vs 누적%) + spec 상/하한 점선. 데이터는
// web_report/tabs/distribution.py 가 이미 전량(다운샘플링 없음) 계산해 sheets["Distribution"]
// 로 내려준다. item 이 많을 때 WebGL 컨텍스트가 한꺼번에 수십 개 살아있으면 브라우저가
// 느려지거나 깨질 수 있어 IntersectionObserver 로 화면에 보이는 칸만 그리고, 화면 밖으로
// 나가면 일정 시간 후 Plotly.purge 로 해제한다.
const DIST_PALETTE = ["#636EFA", "#EF553B", "#00CC96", "#AB63FA", "#FFA15A",
  "#19D3F3", "#FF6692", "#B6E880", "#FF97FF", "#FECB52"];
let distDataCache = {};       // subject → {lower_limit, upper_limit, units, bySource:{source:{xs,ys}}} (ECDF, Issue Table 미니분포와 공용)
let distColorMap = {};        // source → color

// ── Distribution 산포 탭 (툴바/갤러리/상세) 상태·규격 ─────────────────────────
const DIST = { CPK_GOOD: 1.33, DOWNSAMPLE: 1000, PER_FRAME: 3,
  ROOT_MARGIN: "1200px 0px", EXCLUDE: ["chipid", "gpib", "otp", "code"] };
const DIST_STATUS_BG = { fail: "#FDECEC", cpk_low: "#FEF9E7", ok: "#FFFFFF" };  // 연빨강 / 연노랑 / 흰
const DIST_PLOT_BG = {
  paper_bgcolor: "#FFFFFF", plot_bgcolor: "#FFFFFF",
  font: { color: "#1A1A1F", size: 13, family: "Malgun Gothic, 'IBM Plex Sans KR', sans-serif" },
  hoverlabel: { bgcolor: "#FFFFFF", bordercolor: "#E7E7EA",
    font: { color: "#1A1A1F", size: 14, family: "JetBrains Mono, monospace" } },
  hovermode: "closest",
};
const DIST_CFG = { responsive: true, displaylogo: false, displayModeBar: false };
const DIST_CFG_STATIC = { responsive: true, displaylogo: false, displayModeBar: false, staticPlot: true };
let distIndex = [];            // DATA.web_report.distribution_index
let distSegment = "cpk";       // "all" | "cpk" | "fail" (기본 진입 cpk<1.33)
let distFiltered = [];         // 현재 세그먼트 필터 결과 (갤러리 표시/네비 범위)

let distRenderQueue = [];

// ── Distribution 지연 로드 (distribution_deferred 응답용) ─────────────────────
// /full 은 대용량 ECDF 를 내려주지 않고, 첫 페인트 후 백그라운드로
// GET .../web_report/distribution (컴팩트 columnar, 전 포인트) 을 받아 distDataCache 를
// 채운다. 도착 전에 그려진 미니셀/갤러리는 refreshDistConsumers 가 다시 채운다.
let distDataReady = false;     // distDataCache 사용 가능 여부 (구형 embed 응답이면 로드 직후 true)
let distDataPromise = null;    // 진행 중/완료된 fetch (중복 요청 방지)
let _distContentHash = "";     // 마지막 fetch 시점의 content_hash — 동일하면 재fetch 안 함

function buildDistDataFromCompact(payload) {
  // 컴팩트 columnar → 기존 distDataCache 스키마 그대로 (소비자 코드 무수정)
  const out = {};
  const items = (payload && payload.items) || {};
  Object.keys(items).forEach(subj => {
    const it = items[subj], bySource = {};
    Object.keys(it.sources || {}).forEach(src => {
      bySource[src] = { xs: it.sources[src].x || [], ys: it.sources[src].y || [] };
    });
    out[subj] = { lower_limit: it.lo, upper_limit: it.hi, units: it.units || "", bySource };
  });
  return out;
}

function ensureDistData() {
  const ch = (DATA && DATA.session && DATA.session.content_hash) || "";
  if (distDataPromise && ch === _distContentHash) return distDataPromise;   // 로딩 중/완료 재사용
  _distContentHash = ch;
  distDataReady = false;
  distDataPromise = fetch(`/pe/report/session/${SESSION_ID}/web_report/distribution`, { cache: "no-cache" })
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(j => {
      distDataCache = buildDistDataFromCompact(j);
      distDataReady = true;
      refreshDistConsumers();
    })
    .catch(e => {
      distDataPromise = null;   // 실패 시 다음 호출에서 재시도
      showToast("분포 데이터 로드 실패: " + e.message);
    });
  return distDataPromise;
}

// 데이터 도착 전에 만들어진 분포 소비처들을 다시 채운다.
function refreshDistConsumers() {
  // Issue Table 목록의 미니 분포 셀
  document.querySelectorAll("#panel-issues .dist-cell-mini").forEach(cell => {
    if (cell.dataset.distLoaded === "1") return;
    if (distDataCache[cell.dataset.subject]) renderMiniDistCell(cell);
    else cell.innerHTML = "";   // 이 항목엔 분포 데이터 없음 — 빈 칸
  });
  // Issue Table Bin 상세의 단일 분포 셀
  const detail = document.getElementById("issueDetailDistCell");
  if (detail && detail.dataset.distLoaded !== "1") {
    if (distDataCache[detail.dataset.subject]) renderDistCell(detail);
    else detail.outerHTML = `<div class="placeholder">분포 데이터 없음</div>`;
  }
  // Distribution 갤러리 — 화면에 보이는(관측 중) 카드 재큐잉
  document.querySelectorAll('#panel-distribution .distg-card[data-visible="1"]')
    .forEach(distQueueRender);
}

function buildDistColorMap(sources) {
  distColorMap = {};
  (sources || []).forEach((s, i) => { distColorMap[s.name] = DIST_PALETTE[i % DIST_PALETTE.length]; });
}

function distColorFor(source) { return distColorMap[source] || "#888"; }

function distFmtLimit(v) { return (v === null || v === undefined) ? "?" : String(v); }

// Issue Table Bin 상세의 단일 분포 셀 — 산포탭 갤러리 카드와 동일한 포맷(표시용 다운샘플 static
// CDF + LSL/USL 점선 + status 배경). distDataCache 재사용(전체점은 데이터에 그대로 유지).
function renderDistCell(cell) {
  if (!cell || cell.dataset.distLoaded === "1") return;
  const subject = cell.dataset.subject;
  const info = distDataCache[subject];
  const div = cell.querySelector(".dist-plot");
  const placeholder = cell.querySelector(".dist-placeholder");
  if (!info || !div || typeof Plotly === "undefined") return;

  const idx = distIndex.find(x => x.subject === subject);
  const status = (idx && idx.status) || "ok";
  const lo = info.lower_limit, hi = info.upper_limit;
  const traces = Object.keys(info.bySource).map(source => {
    const ds = distDownsampleForDisplay(info.bySource[source].xs, info.bySource[source].ys);
    return { type: "scatter", mode: "markers", cliponaxis: false, name: source,
      x: ds.xs, y: ds.ys, marker: { color: distColorFor(source), size: 4 } };
  });
  const layout = { ...DIST_PLOT_BG, plot_bgcolor: DIST_STATUS_BG[status] || "#FFFFFF",
    title: {
      text: `<b>${esc(subject)}</b><br><span style="font-size:10px">` +
        `(${esc(distFmtLimit(lo))} ~ ${esc(distFmtLimit(hi))} ${esc(info.units)})</span>`,
      font: { size: 12 }, x: 0.5, xanchor: "center" },
    xaxis: { showgrid: true, gridcolor: "#eee", zeroline: false, ticks: "outside",
      tickcolor: "#bbb", tickfont: { size: 10 } },
    yaxis: { range: [0, 100], ticksuffix: "%", showgrid: true, gridcolor: "#eee",
      zeroline: false, tickfont: { size: 10 } },
    shapes: distSpecShapes(lo, hi, false), annotations: distSpecAnnos(lo, hi, false),
    margin: { l: 46, r: 14, t: 46, b: 28 }, showlegend: false };

  Plotly.newPlot(div, traces, layout, DIST_CFG_STATIC);
  cell.dataset.distLoaded = "1";
  if (placeholder) placeholder.style.display = "none";
}

// ── 세그먼트 / 타입어헤드 필터 ─────────────────────────────────────────────────
function distApplySegment(rows) {
  if (distSegment === "fail") return rows.filter(r => r.is_fail);
  if (distSegment === "cpk") {
    return rows.filter(r => r.cpk != null && r.cpk < DIST.CPK_GOOD
      && !DIST.EXCLUDE.some(k => String(r.subject).toLowerCase().includes(k)));
  }
  return rows.slice();
}
function distSuggestions(q) {
  const kws = String(q || "").split("%").map(s => s.trim().toLowerCase()).filter(Boolean);
  if (!kws.length) return [];
  const out = [];
  for (const r of distApplySegment(distIndex)) {
    if (kws.every(k => String(r.subject).toLowerCase().includes(k))) {
      out.push(r);
      if (out.length >= 30) break;
    }
  }
  return out;
}

// ── 기준선(shapes) / 라벨(annotations): LSL·USL 세로 점선 + y=50% 가로 점선 ─────
function distSpecShapes(lo, hi, withMid) {
  const sh = [];
  [lo, hi].forEach(v => { if (v !== null && v !== undefined) sh.push({
    type: "line", x0: v, x1: v, yref: "paper", y0: 0, y1: 1,
    line: { color: "#DC2626", width: 1.2, dash: "dash" } }); });
  if (withMid) sh.push({ type: "line", xref: "paper", x0: 0, x1: 1, y0: 50, y1: 50,
    line: { color: "#888", width: 1, dash: "dashdot" } });
  return sh;
}
function distSpecAnnos(lo, hi, mini) {
  const fs = mini ? 9.2 : 11.5;
  const mk = (v, label) => ({ x: v, yref: "paper", y: 1, text: `${label} ${v}`,
    showarrow: false, textangle: -90, font: { size: fs, color: "#DC2626" },
    bgcolor: "rgba(255,255,255,.72)", borderpad: 1, xanchor: "left", yanchor: "top" });
  const a = [];
  if (hi !== null && hi !== undefined) a.push(mk(hi, "USL"));
  if (lo !== null && lo !== undefined) a.push(mk(lo, "LSL"));
  return a;
}

// ── 미니셀 표시용 다운샘플 (ECDF 전제: x 오름차순, y 누적%) ────────────────────
// 단순 stride 는 꼬리 outlier·고질량 계단(Δy 큰 점)·x축 고립점을 눈멀고 떨어뜨려
// 누적산포를 왜곡한다. 규칙: (1) 첫/마지막 + 누적% 상·하위 7% 전량 보존,
// (2) Δy ≥ 0.2%p(질량 큰 고유값)·x갭 ≥ range×1%(갭 양끝) 강제 보존,
// (3) 나머지만 잔여 budget 으로 균등 stride. 강제 보존 때문에 총점이 1000 을
// 다소 넘는 것은 허용(소프트 상한) — 왜곡 없음이 우선.
function distDownsampleForDisplay(xs, ys) {
  const n = xs.length;
  if (n <= DIST.DOWNSAMPLE) return { xs, ys };
  const keep = new Uint8Array(n);
  keep[0] = 1; keep[n - 1] = 1;
  const range = xs[n - 1] - xs[0];
  const gap = range > 0 ? range * 0.01 : Infinity;
  for (let i = 0; i < n; i++) {
    if (ys[i] <= 7 || ys[i] >= 93) { keep[i] = 1; continue; }             // 꼬리 전량
    if (ys[i] - ys[i - 1] >= 0.2) keep[i] = 1;                            // Δy 질량
    if (xs[i] - xs[i - 1] >= gap) { keep[i] = 1; keep[i - 1] = 1; }       // x갭 양끝
  }
  let kept = 0;
  for (let i = 0; i < n; i++) kept += keep[i];
  const rest = [];
  for (let i = 0; i < n; i++) if (!keep[i]) rest.push(i);
  // 꼬리에 고유값이 많아 budget 이 소진되어도 중간 몸통이 비지 않도록 최소 200점 보장
  const budget = Math.max(DIST.DOWNSAMPLE - kept, 200);
  if (budget > 0 && rest.length > budget) {
    const st = Math.ceil(rest.length / budget);
    for (let j = 0; j < rest.length; j += st) keep[rest[j]] = 1;
  } else if (budget > 0) {
    for (const i of rest) keep[i] = 1;
  }
  const ox = [], oy = [];
  for (let i = 0; i < n; i++) if (keep[i]) { ox.push(xs[i]); oy.push(ys[i]); }
  return { xs: ox, ys: oy };
}

// ── 갤러리 미니셀(정적 CDF, distDataCache 재사용, 표시용만 1000점 다운샘플) ─────
function distRenderGalleryCell(cell) {
  if (cell.dataset.rendered === "1") return;
  // 분포 데이터 도착 전 — rendered 플래그를 세우지 않고 리턴해야 도착 후
  // refreshDistConsumers 의 재큐잉으로 다시 그려진다 (빈 차트 고정 방지).
  if (!distDataReady) return;
  const subject = cell.dataset.subject;
  const status = cell.dataset.status || "ok";
  const info = distDataCache[subject];
  const plot = cell.querySelector(".distg-plot");
  if (!plot || typeof Plotly === "undefined") return;
  const lo = info ? info.lower_limit : null;
  const hi = info ? info.upper_limit : null;
  const traces = [];
  if (info) Object.keys(info.bySource).forEach(src => {
    // 미니셀 표시용만 다운샘플(통계·상세는 전체점) — 꼬리/계단/갭 보존 규칙 적용
    const ds = distDownsampleForDisplay(info.bySource[src].xs, info.bySource[src].ys);
    traces.push({ type: "scatter", mode: "markers", cliponaxis: false, x: ds.xs, y: ds.ys,
      marker: { color: distColorFor(src), size: 3 } });
  });
  const layout = { ...DIST_PLOT_BG, plot_bgcolor: DIST_STATUS_BG[status] || "#FFFFFF",
    xaxis: { showgrid: true, gridcolor: "#eee", zeroline: false, ticks: "outside",
      tickcolor: "#bbb", tickfont: { size: 9 } },
    yaxis: { range: [0, 100], ticksuffix: "%", showgrid: true, gridcolor: "#eee",
      zeroline: false, tickfont: { size: 9 } },
    shapes: distSpecShapes(lo, hi, false), annotations: distSpecAnnos(lo, hi, true),
    margin: { l: 34, r: 10, t: 8, b: 20 }, showlegend: false };
  Plotly.newPlot(plot, traces, layout, DIST_CFG_STATIC);
  cell.dataset.rendered = "1";
}
function distPurgeGalleryCell(cell) {
  if (cell.dataset.rendered !== "1") return;
  const plot = cell.querySelector(".distg-plot");
  try { if (plot && window.Plotly) Plotly.purge(plot); } catch (e) {}
  cell.dataset.rendered = "";
}

// ── rAF 분할 렌더(프레임당 PER_FRAME 개) ──────────────────────────────────────
function distQueueRender(cell) {
  if (cell.dataset.rendered === "1" || distRenderQueue.includes(cell)) return;
  distRenderQueue.push(cell);
  if (!distRafScheduled) { distRafScheduled = true; requestAnimationFrame(distFlushRender); }
}
function distFlushRender() {
  distRafScheduled = false;
  let n = 0;
  while (distRenderQueue.length && n < DIST.PER_FRAME) {
    const cell = distRenderQueue.shift();
    if (cell.isConnected && cell.dataset.visible === "1") { distRenderGalleryCell(cell); n++; }
  }
  if (distRenderQueue.length) { distRafScheduled = true; requestAnimationFrame(distFlushRender); }
}

function distToolbarHtml() {
  const seg = (v, label) => `<button class="distseg${distSegment === v ? " active" : ""}" data-seg="${v}">${esc(label)}</button>`;
  // 검색창 오른쪽 범례: 소스별 색상(distColorMap) 을 스와치로 표시(갤러리 미니셀 색과 동일).
  const sources = (DATA.web_report && DATA.web_report.sources) || [];
  const legend = sources.length ? `<div class="dist-legend">` + sources.map(s =>
    `<span class="dist-leg-item"><span class="dist-leg-sw" style="background:${distColorFor(s.name)}"></span>${esc(s.name)}</span>`
  ).join("") + `</div>` : "";
  return `<div class="dist-toolbar">
    <div class="distseg-group">${seg("all", "전체")}${seg("cpk", "cpk < 1.33")}${seg("fail", "Fail Only")}</div>
    <div class="dist-search-wrap">
      <input id="distSearch" class="dist-search" type="text" autocomplete="off" placeholder="검색 ( % 로 다중 AND )">
      <div id="distSuggest" class="dist-suggest" style="display:none"></div>
    </div>
    ${legend}
    <span class="dist-count"></span>
  </div>`;
}
function distUpdateCount() {
  const el = document.querySelector("#panel-distribution .dist-count");
  if (el) el.textContent = `${distFiltered.length} 개`;
}
function distRenderGallery() {
  const panel = document.getElementById("panel-distribution");
  distView = "gallery";
  if (distGalleryObserver) { try { distGalleryObserver.disconnect(); } catch (e) {} distGalleryObserver = null; }
  distRenderQueue = []; distRafScheduled = false;
  distFiltered = distApplySegment(distIndex);
  const cards = distFiltered.map(r => {
    const cpk = r.cpk == null ? "-" : r.cpk;
    const lim = `(${distFmtLimit(r.lower_limit)} ~ ${distFmtLimit(r.upper_limit)})${r.units ? " [" + r.units + "]" : ""}`;
    return `<div class="distg-card" data-subject="${esc(r.subject)}" data-status="${esc(r.status)}" style="background:${DIST_STATUS_BG[r.status] || "#fff"}">
      <div class="distg-head">
        <span class="distg-tno">${esc(r.test_num || "")}</span>
        <span class="distg-name" title="${esc(r.subject)}">${esc(r.subject)}</span>
        <span class="distg-lim">${esc(lim)}</span>
        <span class="distg-cpk">cpk ${esc(cpk)}</span>
      </div>
      <div class="distg-plot"></div>
    </div>`;
  }).join("");
  panel.innerHTML = distToolbarHtml() +
    (distFiltered.length ? `<div class="distg-grid">${cards}</div>`
                         : `<div class="placeholder">해당 조건의 항목이 없습니다</div>`);
  distUpdateCount();
  if (typeof Plotly === "undefined" || typeof IntersectionObserver === "undefined") return;
  distGalleryObserver = new IntersectionObserver(entries => {
    entries.forEach(en => {
      const cell = en.target;
      if (en.isIntersecting) { cell.dataset.visible = "1"; distQueueRender(cell); }
      else {
        cell.dataset.visible = "";
        distPurgeGalleryCell(cell);
        const i = distRenderQueue.indexOf(cell);
        if (i >= 0) distRenderQueue.splice(i, 1);
      }
    });
  }, { rootMargin: DIST.ROOT_MARGIN, threshold: 0 });
  panel.querySelectorAll(".distg-card").forEach(c => distGalleryObserver.observe(c));
}

    </div>
    <div class="dist-loading" id="distLoading">로드 중...</div>
  </div>`;
}
async function distShowDetail(subject, navList) {
  const panel = document.getElementById("panel-distribution");
  // 갤러리 관측/차트 정리 후 상세로 전환
  if (distGalleryObserver) { try { distGalleryObserver.disconnect(); } catch (e) {} distGalleryObserver = null; }
  panel.querySelectorAll(".distg-card").forEach(distPurgeGalleryCell);
  distRenderQueue = []; distRafScheduled = false;
  distView = "detail";
  if (Array.isArray(navList)) distNavList = navList;
  distNavPos = distNavList.indexOf(subject);
  panel.innerHTML = distDetailShellHtml(subject);
  window.scrollTo(0, 0);
  let data;
  try {
    const res = await fetch(`/pe/report/session/${SESSION_ID}/web_report/scatter/${encodeURIComponent(subject)}`, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    data = await res.json();
  } catch (e) {
    const body = panel.querySelector(".dist-detail-body");
    if (body) body.innerHTML = `<div class="placeholder">상세 로드 실패 (${esc(e.message)})</div>`;
    const ld = document.getElementById("distLoading"); if (ld) ld.style.display = "none";
    return;
  }
  // 로딩 중 다른 항목으로 이동했으면(경합) 최신 요청만 반영
  if (distView !== "detail" || distNavList[distNavPos] !== subject) return;
  distRenderDetailCharts(data);
  const ld = document.getElementById("distLoading"); if (ld) ld.style.display = "none";
}
function distCdfFromValues(values) {
  const sorted = [...values].sort((a, b) => a - b);
  const n = sorted.length;
  return { x: sorted, y: sorted.map((_, i) => (i + 1) / n * 100) };
}
function distRenderDetailCharts(data) {
  const lo = data.lower_limit, hi = data.upper_limit;
  const bg = DIST_STATUS_BG[data.status] || "#FFFFFF";
  const multi = (data.sources || []).length > 1;
  const unit = data.units || "";
  const xtitle = `측정값${unit ? " (" + unit + ")" : ""}`;
  const cdfDiv = document.getElementById("distCdf");
  if (cdfDiv) {
    const traces = (data.sources || []).map(s => {
      const c = distCdfFromValues(s.values);
      return { type: "scatter", mode: "markers", cliponaxis: false, name: s.name, x: c.x, y: c.y,
        marker: { color: distColorFor(s.name), size: 5 },
        hovertemplate: "측정값 %{x}<br>누적 %{y:.1f}%<extra></extra>" };
    });
    Plotly.newPlot(cdfDiv, traces, { ...DIST_PLOT_BG, plot_bgcolor: bg,
      xaxis: { title: { text: xtitle }, showgrid: true, gridcolor: "#eee", zeroline: false },
      yaxis: { title: { text: "누적 %" }, range: [0, 100], ticksuffix: "%", showgrid: true, gridcolor: "#eee", zeroline: false },
      shapes: distSpecShapes(lo, hi, true), annotations: distSpecAnnos(lo, hi, false),
      margin: { l: 60, r: 22, t: 16, b: 46 }, showlegend: multi }, DIST_CFG);
  }
  const hDiv = document.getElementById("distHist");
  if (hDiv) {
    const traces = (data.sources || []).map(s => ({ type: "histogram", name: s.name, x: s.values,
      marker: { color: multi ? distColorFor(s.name) : "#5E6AD2" }, nbinsx: 40, opacity: multi ? 0.7 : 1 }));
    Plotly.newPlot(hDiv, traces, { ...DIST_PLOT_BG, plot_bgcolor: bg, barmode: "overlay",
      xaxis: { title: { text: xtitle }, showgrid: true, gridcolor: "#eee", zeroline: false },
      yaxis: { title: { text: "빈도" }, showgrid: true, gridcolor: "#eee", zeroline: false },
      shapes: distSpecShapes(lo, hi, false), annotations: distSpecAnnos(lo, hi, false),
      margin: { l: 60, r: 22, t: 16, b: 46 }, showlegend: multi }, DIST_CFG);
  }
}
function distNav(delta) {
  if (distView !== "detail" || !distNavList.length) return;
  let p = distNavPos + delta;
  if (p < 0) p = 0;
  if (p >= distNavList.length) p = distNavList.length - 1;
  if (p === distNavPos) return;
  distShowDetail(distNavList[p]);
}
function distRenderSuggest(q) {
  const box = document.getElementById("distSuggest");
  if (!box) return;
  const items = distSuggestions(q);
  if (!String(q).trim() || !items.length) { box.innerHTML = ""; box.style.display = "none"; return; }
  box.innerHTML = items.map(r =>
    `<div class="dist-sug-item" data-subject="${esc(r.subject)}">
      <span class="sug-tno">${esc(r.test_num || "")}</span>
