      <span class="sug-cpk">cpk ${esc(r.cpk == null ? "-" : r.cpk)}</span>
    </div>`).join("");
  box.style.display = "block";
}

// ── 패널 이벤트 위임(1회 바인딩) ──────────────────────────────────────────────
function distBindPanel() {
  if (distPanelBound) return;
  const panel = document.getElementById("panel-distribution");
  if (!panel) return;
  panel.addEventListener("click", e => {
    const seg = e.target.closest(".distseg");
    if (seg) { distSegment = seg.dataset.seg; distRenderGallery(); return; }
    const sug = e.target.closest(".dist-sug-item");
    if (sug) { distShowDetail(sug.dataset.subject, distApplySegment(distIndex).map(r => r.subject)); return; }
    const card = e.target.closest(".distg-card");
    if (card) { distShowDetail(card.dataset.subject, distFiltered.map(r => r.subject)); return; }
    if (e.target.closest(".dist-back")) { distRenderGallery(); return; }
    if (e.target.closest(".dist-prev")) { distNav(-1); return; }
    if (e.target.closest(".dist-next")) { distNav(1); return; }
  });
  panel.addEventListener("input", e => {
    if (e.target.id === "distSearch") distRenderSuggest(e.target.value);
  });
  document.addEventListener("keydown", e => {
    if (!e.altKey || distView !== "detail") return;
    if (!panel.classList.contains("active")) return;
    if (e.key === "ArrowUp") { e.preventDefault(); distNav(-1); }
    else if (e.key === "ArrowDown") { e.preventDefault(); distNav(1); }
  });
  distPanelBound = true;
}

function renderDistribution() {
  const panel = document.getElementById("panel-distribution");
  distIndex = (DATA.web_report && DATA.web_report.distribution_index) || [];
  buildDistColorMap((DATA.web_report && DATA.web_report.sources) || []);
  if (!distIndex.length) {
    if (distGalleryObserver) { try { distGalleryObserver.disconnect(); } catch (e) {} distGalleryObserver = null; }
    emptyPanel(panel, "Distribution 데이터 없음");
    return;
  }
  distBindPanel();
  distRenderGallery();
}

function renderMiniDistCell(cell) {
  if (cell.dataset.distLoaded === "1") return;
  const subject = cell.dataset.subject;
  const info = distDataCache[subject];
  const div = cell.querySelector(".dist-plot");
  if (!info || !div || typeof Plotly === "undefined") return;

  const lo = info.lower_limit, hi = info.upper_limit;
  const traces = Object.keys(info.bySource).map(source => {
    const ds = distDownsampleForDisplay(info.bySource[source].xs, info.bySource[source].ys);
    return { type: "scatter", mode: "markers", cliponaxis: false, name: source,
      x: ds.xs, y: ds.ys, marker: { color: distColorFor(source), size: 3 } };
  });
  const layout = {
    xaxis: { visible: false }, yaxis: { visible: false, range: [0, 100] },
    shapes: distSpecShapes(lo, hi, false), margin: { l: 1, r: 1, t: 1, b: 1 },
    paper_bgcolor: "transparent", plot_bgcolor: "transparent", showlegend: false,
  };
  Plotly.newPlot(div, traces, layout, DIST_CFG_STATIC);
  cell.dataset.distLoaded = "1";
}

      <button type="button" id="rawFailOnlyBtn" class="btn-sm${rawDataFailOnly ? " active" : ""}">FailItem만 보기</button>
      <span id="rawSelCount" class="rawdata-selcount"></span>
      ${MODE === "edit" ? `<button type="button" id="rawSaveBtn" class="btn-sm btn-report-regen" disabled>` +
        `Report 재생성 (<span id="rawEditCount">0</span>)</button>` : ""}
    </div>
    ${MODE === "edit" ? `<div class="edit-hint">셀을 더블클릭해 값을 고치세요. 저장 버튼을 누르면
      즉시 원본 parquet 에 반영되고(되돌리기 불가) 전체 탭을 새 데이터로 다시 불러옵니다.</div>` : ""}
    <div class="rawdata-body">
      <div class="rawdata-cols">
        <div class="rawdata-cols-head">
          <input type="text" id="rawItemSearch" placeholder="항목 검색">
          <button type="button" id="rawItemSelectAllBtn" class="btn-sm">전체선택</button>
        </div>
        <div id="rawItemList" class="rawdata-item-list"></div>
      </div>
      <div class="rawdata-grid-wrap">
        <div id="rawDataBanner"></div>
        <div class="rawdata-source-btns">${sourceBtns}</div>
        <div id="rawDataHscroll" class="rawdata-hscroll"><div id="rawDataHscrollSpacer" class="rawdata-hscroll-spacer"></div></div>
        <div id="rawDataGridHost"></div>
      </div>
    </div>`;
}

function updateRawSelCount() {
  const el = document.getElementById("rawSelCount");
  if (el) el.textContent = `선택 ${rawDataSelected.size}/${RAW_DATA_COLUMN_CAP}`;
}

function updateRawEditBtn() {
  const btn = document.getElementById("rawSaveBtn");
  const cnt = document.getElementById("rawEditCount");
  if (cnt) cnt.textContent = String(rawDataPendingEdits.size);
  if (btn) btn.disabled = rawDataPendingEdits.size === 0;
}

function renderRawItemList(filterText) {
  const host = document.getElementById("rawItemList");
  if (!host || !rawDataMeta) return;
  const q = String(filterText || "").trim().toLowerCase();
  const items = (rawDataMeta.items || []).filter(it => !q || it.name.toLowerCase().includes(q));
  host.innerHTML = items.length ? items.map(it => {
    const selected = rawDataSelected.has(it.name);
    const disabled = (!selected && rawDataSelected.size >= RAW_DATA_COLUMN_CAP) ? "disabled" : "";
    const hasLim = it.unit || it.lolim !== null || it.hilim !== null;
    const limTxt = hasLim
      ? ` <span class="rawdata-item-meta">${esc(it.lolim ?? "-")}~${esc(it.hilim ?? "-")}[${esc(it.unit || "")}]</span>`
      : "";
    return `<button type="button" class="rawdata-item${selected ? " selected" : ""}" ` +
      `data-name="${esc(it.name)}" ${disabled}>${esc(it.name)}${limTxt}</button>`;
  }).join("") : `<div class="placeholder" style="padding:12px;">일치하는 항목 없음</div>`;
  updateRawSelCount();
}

function selectAllVisibleRawItems() {
  if (!rawDataMeta) return;
  const q = (document.getElementById("rawItemSearch")?.value || "").trim().toLowerCase();
  const items = (rawDataMeta.items || []).filter(it => !q || it.name.toLowerCase().includes(q));
  for (const it of items) {
    if (rawDataSelected.size >= RAW_DATA_COLUMN_CAP) break;
    rawDataSelected.add(it.name);
  }
  renderRawItemList(document.getElementById("rawItemSearch")?.value || "");
}

function renderRawDataControls() {
  const panel = document.getElementById("panel-raw-data");
  const sources = (rawDataMeta && rawDataMeta.sources) || [];
  if (sources.length && !sources.includes(rawDataSource)) rawDataSource = sources[0];
  destroyRawDataGrid();
  panel.classList.remove("placeholder");
  panel.innerHTML = rawDataControlsHtml(rawDataMeta);
  renderRawItemList("");
  updateRawEditBtn();
  syncRawFiltersHeight();
  // 프록시 가로 스크롤바 → 실제 그리드 tableholder 동기화(반대 방향은 runRawDataQuery 에서
  // Tabulator 의 scrollHorizontal 이벤트로 처리). #rawDataHscroll 은 panel 이 다시 그려질
  // 때만 새로 생기므로 여기서 1회만 바인딩하면 된다.
  const hscroll = document.getElementById("rawDataHscroll");
  if (hscroll) {
    hscroll.addEventListener("scroll", () => {
      if (_rawHscrollSyncing || !rawDataGrid) return;
      const holder = document.querySelector("#rawDataGridHost .tabulator-tableholder");
      if (!holder) return;
      _rawHscrollSyncing = true;
      holder.scrollLeft = hscroll.scrollLeft;
      _rawHscrollSyncing = false;
    });
  }
}

async function renderRawDataTab() {
  const panel = document.getElementById("panel-raw-data");
  if (!panel) return;
  if (!isWebReportSession()) { destroyRawDataGrid(); emptyPanel(panel, "Raw Data 데이터 없음"); return; }
  if (rawDataMeta) { renderRawDataControls(); return; }
  panel.innerHTML = `<div class="placeholder">불러오는 중...</div>`;
  try {
    rawDataMeta = await fetchRawDataMeta();
  } catch (e) {
    emptyPanel(panel, `Raw Data 메타 조회 실패: ${e.message}`);
    return;
  }
  renderRawDataControls();
}

async function runRawDataQuery() {
  const banner = document.getElementById("rawDataBanner");
  const host = document.getElementById("rawDataGridHost");
  if (!banner || !host) return;
  if (!rawDataSelected.size) {
    banner.innerHTML = `<div class="rawdata-banner">항목을 1개 이상 선택하세요.</div>`;
    return;
  }
  const params = new URLSearchParams();
  params.set("columns", [...rawDataSelected].join(","));
  const search = (document.getElementById("rawSearch")?.value || "").trim();
  const bin = (document.getElementById("rawBin")?.value || "").trim();
  const source = rawDataSource;
  if (search) params.set("search", search);
  if (bin) params.set("bin", bin);
  if (source) params.set("source", source);

  banner.innerHTML = `<div class="rawdata-banner">조회 중...</div>`;
  destroyRawDataGrid();
  host.innerHTML = "";
  let data;
  try {
    const res = await fetch(`/pe/report/session/${SESSION_ID}/web_report/raw_data?${params}`, { cache: "no-store" });
    data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  } catch (e) {
    banner.innerHTML = `<div class="rawdata-banner">조회 실패: ${esc(e.message)}</div>`;
    return;
  }
  // 응답이 res.ok 지만 본문이 기대 형태가 아니면(프록시 오류 페이지 등) 여기서 멈춘다 —
  // 아래 data.rows.length / toLocaleString() 이 TypeError 로 "조회 중..." 상태에 갇히는 것 방지.
  if (!Array.isArray(data.rows) || typeof data.total_matched !== "number") {
    banner.innerHTML = `<div class="rawdata-banner">조회 실패: 응답 형식 오류</div>`;
    return;
  }
  banner.innerHTML = data.truncated
    ? `<div class="rawdata-banner">결과가 많아 앞 ${data.rows.length.toLocaleString()}행만 표시합니다 ` +
      `(일치 ${data.total_matched.toLocaleString()}행) — 필터를 좁혀주세요.</div>`
    : `<div class="rawdata-banner">일치 ${data.total_matched.toLocaleString()}행</div>`;
  if (!data.rows.length) { host.innerHTML = `<div class="placeholder">조회 결과 없음</div>`; return; }
  // jsonify(sort_keys=True) 가 응답 키를 알파벳순으로 재정렬하므로 deriveCols(Object.keys
  // 순서 의존) 대신 컬럼 순서를 여기서 명시적으로 고정한다: 고정 메타 컬럼 → 선택한 순서의
  // item 컬럼. _row_idx 는 이 목록에 없으므로 자연히 제외된다 (편집 저장용 내부 필드).
  // SOURCE 는 항상 단일 source 조회라 화면에 표시하지 않는다(값은 row 데이터에 남아
  // cellEdited 핸들러의 row.SOURCE 참조용으로만 쓰인다).
  const present = new Set();
  data.rows.forEach(r => Object.keys(r || {}).forEach(k => present.add(k)));
  const editable = MODE === "edit";
  // 식별 컬럼: #(행번호) + SHOT/DUT/X/Y/BIN/TNO. field 는 기존값 유지(편집/데이터 경로 불변),
  // 화면 라벨(title)만 X/Y/TNO 로 바꾸고 SERIAL 은 표시에서 제외한다.
  const IDENTITY = [
    { field: "_rownum", label: "#", rownum: true },
    { field: "SHOT", label: "SHOT" },
    { field: "DUT", label: "DUT" },
    { field: "XPOS", label: "X" },
    { field: "YPOS", label: "Y" },
    { field: "BIN", label: "BIN" },
    { field: "FAILTNO", label: "TNO" },
  ];
  // 항목 메타(unit/lolim/hilim)는 rawDataMeta 재사용 — 추가 fetch 없음.
  const metaByName = {};
  ((rawDataMeta && rawDataMeta.items) || []).forEach(it => { metaByName[it.name] = it; });
  const rdLine = v => `<span class="rd-meta">${(v === null || v === undefined || v === "") ? "&nbsp;" : esc(String(v))}</span>`;
  // 다중행 헤더: 1행=이름, 2~4행=UNIT/LOLIM/HILIM. 세로 스크롤 시 헤더째 고정된다.
  const metaHead = (label, l1, l2, l3) => `<span class="rd-name">${esc(label)}</span>${rdLine(l1)}${rdLine(l2)}${rdLine(l3)}`;

  // # 컬럼 헤더에만 UNIT/LOLIM/HILIM 라벨을 세로로 쌓아 좌측 라벨 정렬(값은 각 item 컬럼에 표시).
  const idCols = IDENTITY
    .filter(d => d.rownum || present.has(d.field))
    .map(d => ({
      title: d.rownum ? metaHead("#", "UNIT", "LOLIM", "HILIM") : metaHead(d.label, "", "", ""),
      field: d.field, resizable: true, headerSort: false, frozen: true,
      formatter: d.rownum ? "rownum" : undefined,
      editor: (editable && !d.rownum) ? "input" : false,
    }));
  const itemCols = [...rawDataSelected].filter(c => present.has(c)).map(c => {
    const m = metaByName[c] || {};
    const unit = m.unit ? `[${m.unit}]` : "";
    return {
      title: metaHead(c, unit, m.lolim, m.hilim), field: c,
      resizable: true, headerSort: false, frozen: false,
      editor: editable ? "input" : false,
    };
  });
  rawDataGrid = new Tabulator("#rawDataGridHost", {
    data: data.rows,
    columns: [...idCols, ...itemCols],
    layout: "fitDataStretch",
    pagination: true, paginationSize: 100, paginationSizeSelector: [50, 100, 200, 500],
    selectableRange: true,      // 셀 클릭 후 화살표 키로 이동(Excel 형) + Shift+화살표 범위 선택
    selectableRangeColumns: true,
    selectableRangeRows: true,
    // 더블클릭으로만 편집 진입 — 단일 클릭은 selectableRange 의 범위 선택 전용으로 남겨둬야
    // 편집기 진입/커밋이 range 선택 제스처와 충돌하지 않고, 편집 중 Enter 로 정상 확정된다.
    editTriggerEvent: "dblclick",
  });
  if (rawDataFailOnly) rawDataGrid.setFilter("BIN", "!=", "1");
  if (editable) {
    rawDataGrid.on("cellEdited", cell => {
      const row = cell.getData();
      const key = `${row.SOURCE}|${row._row_idx}|${cell.getField()}`;
      rawDataPendingEdits.set(key, {
        source: row.SOURCE, row_idx: row._row_idx,
        column: cell.getField(), value: cell.getValue(),
      });
      updateRawEditBtn();
    });
  }
  // 실제 그리드 → 프록시 가로 스크롤바 동기화(반대 방향은 renderRawDataControls 에서 처리).
  // 그리드는 조회할 때마다 파괴/재생성되므로 이 등록도 매번 다시 필요하다.
  rawDataGrid.on("scrollHorizontal", left => {
    const hscroll = document.getElementById("rawDataHscroll");
    if (!hscroll || _rawHscrollSyncing) return;
    _rawHscrollSyncing = true;
    hscroll.scrollLeft = left;
    _rawHscrollSyncing = false;
  });
  // 프록시 스크롤바 폭(스페이서)은 실제 스크롤 가능 폭에 맞아야 하므로, 그리드 최초 빌드/재렌더/
  // 컬럼 리사이즈 시마다 다시 잰다.
  rawDataGrid.on("tableBuilt", syncRawHscrollSpacer);
  rawDataGrid.on("renderComplete", syncRawHscrollSpacer);
  rawDataGrid.on("columnResized", syncRawHscrollSpacer);
}

async function saveRawDataEdits() {
  if (!rawDataPendingEdits.size) return;
  const banner = document.getElementById("rawDataBanner");
  const edits = [...rawDataPendingEdits.values()];
  if (banner) banner.innerHTML = `<div class="rawdata-banner">저장 중...</div>`;
  try {
    const res = await fetch(`/pe/report/session/${SESSION_ID}/web_report/raw_data/edit`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken() },
      body: JSON.stringify({ password: verifiedPassword, edits }),
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error || `HTTP ${res.status}`);
    rawDataPendingEdits.clear();
    showToast(`Raw Data ${edits.length}개 셀 저장 완료 — 수정된 rawdata 로 Report(yield·cpk·distribution) 및 parquet 을 재생성합니다.`);
    await load(false);
  } catch (e) {
    if (banner) banner.innerHTML = `<div class="rawdata-banner">저장 실패: ${esc(e.message)}</div>`;
  }
}

// Raw Data 전용 이벤트 위임 — panel 자체는 고정 요소(#panel-raw-data), 내부만 매번 다시 그려짐.
// input 이벤트는 stopPropagation 로 .content 의 전역 dirty-마킹 리스너로 안 새게 막는다
// (Raw Data 는 조회 전용이라 편집 dirty 상태와 무관해야 함).
const _rawDataPanel = document.getElementById("panel-raw-data");
if (_rawDataPanel) {
  _rawDataPanel.addEventListener("input", e => {
    e.stopPropagation();
    if (e.target.id === "rawItemSearch") renderRawItemList(e.target.value);
  });
  _rawDataPanel.addEventListener("click", e => {
    if (e.target.closest("#rawQueryBtn")) { runRawDataQuery(); return; }
    if (e.target.closest("#rawSaveBtn")) { saveRawDataEdits(); return; }
    if (e.target.closest("#rawItemSelectAllBtn")) { selectAllVisibleRawItems(); return; }
    if (e.target.closest("#rawFailOnlyBtn")) {
      rawDataFailOnly = !rawDataFailOnly;
      e.target.closest("#rawFailOnlyBtn").classList.toggle("active", rawDataFailOnly);
      if (rawDataGrid) {
        if (rawDataFailOnly) rawDataGrid.setFilter("BIN", "!=", "1");
        else rawDataGrid.clearFilter();
      }
      return;
    }
    const sourceBtn = e.target.closest(".rawdata-source-btn");
    if (sourceBtn) {
      rawDataSource = sourceBtn.dataset.source || "";
      document.querySelectorAll(".rawdata-source-btn").forEach(b =>
        b.classList.toggle("active", b.dataset.source === rawDataSource));
      runRawDataQuery();
      return;
    }
    const itemBtn = e.target.closest("#rawItemList .rawdata-item");
    if (itemBtn) {
      const name = itemBtn.dataset.name;
      if (rawDataSelected.has(name)) {
        rawDataSelected.delete(name);
      } else {
        if (rawDataSelected.size >= RAW_DATA_COLUMN_CAP) return;
        rawDataSelected.add(name);
      }
      renderRawItemList(document.getElementById("rawItemSearch")?.value || "");
    }
  });
}

// ── 편집용 위젯 ────────────────────────────────────────────────────────────
function editRowHtml(r, cols) {
  return `<tr>` + cols.map(c =>
    `<td><input class="cell-input" data-col="${esc(c)}" value="${esc(r ? r[c] : "")}"></td>`
  ).join("") + `<td><button type="button" class="btn-del-row" title="행 삭제">×</button></td></tr>`;
}

function editTableHtml(rows, cols, tableId) {
  const head = cols.map(c => `<th data-col="${esc(c)}">${esc(c)}</th>`).join("") + `<th></th>`;
  const body = (rows || []).map(r => editRowHtml(r, cols)).join("");
  return `<table class="edit-table" id="${tableId}"><thead><tr>${head}</tr></thead>` +
         `<tbody>${body}</tbody></table>` +
         `<button type="button" class="btn-sm add-row" data-table="${tableId}">+ 행 추가</button>`;
}

function readEditTable(tableEl) {
  if (!tableEl) return null;
  const cols = [...tableEl.querySelectorAll("thead th[data-col]")].map(th => th.dataset.col);
  const rows = [];
  tableEl.querySelectorAll("tbody tr").forEach(tr => {
    const obj = {};
    tr.querySelectorAll("input.cell-input").forEach(inp => { obj[inp.dataset.col] = inp.value; });
    if (cols.some(c => String(obj[c] ?? "").trim() !== "")) rows.push(obj);
  });
  return rows;
}

function kvEditHtml(obj, group) {
  const entries = Object.entries(obj || {}).filter(([k]) => k);
  if (!entries.length) return "";
  return `<div class="kv-edit">` + entries.map(([k, v]) => {
    const val = (v && typeof v === "object") ? JSON.stringify(v) : (v ?? "");
    return `<label title="${esc(k)}">${esc(k)}</label>` +
      `<input class="field-input" data-f="${esc(group)}" data-key="${esc(k)}" value="${esc(val)}">`;
  }).join("") + `</div>`;
}

// ── Summary (edit) ────────────────────────────────────────────────────────────
function collectSummaryText() {
  const panel = document.getElementById("panel-summary");
  const out = DATA.summary_text ? JSON.parse(JSON.stringify(DATA.summary_text)) : {};

  const titleInp = panel.querySelector('[data-f="title"]');
  if (titleInp) out.title = titleInp.value;

  const featInputs = panel.querySelectorAll('[data-f="feature"]');
  if (featInputs.length) {
    out.feature = {};
    featInputs.forEach(i => { out.feature[i.dataset.key] = i.value; });
  }

  const yst = panel.querySelector('[data-f="yield_summary_text"]');
  if (yst) out.yield_summary_text = splitLines(yst.value);

  const mfb = readEditTable(document.getElementById("tbl-mfb"));
  if (mfb !== null) out.major_fail_bins = mfb;

  const evalInputs = panel.querySelectorAll('[data-f="evaluation"]');
  if (evalInputs.length) {
    out.evaluation = {};
    evalInputs.forEach(i => { out.evaluation[i.dataset.key] = i.value; });
  }

  const rr = panel.querySelector('[data-f="raw_rows"]');
  if (rr) out.raw_rows = splitLines(rr.value).map(line => line.split("\t"));

  return out;
}

// ── Yield 편집: Tabulator 인스턴스 정리 (buildPayload 의 yieldGrid.getData() 폴백 대상) ──
function destroyYieldGrid() {
  if (yieldGrid) { try { yieldGrid.destroy(); } catch (e) {} yieldGrid = null; }
}

// ── Issue Table (edit) ──────────────────────────────────────────────────────
// 수정모드에서도 PTE comment / 개발 comment 두 열만 편집 가능(더블클릭으로 활성화), 나머지
// 열(Category/Bin/TNO/Item/avg/{source}_yield/Distribution 등)은 읽기전용으로 유지한다.
const ISSUE_COMMENT_COLS = new Set(["PTE comment", "개발 comment"]);

function renderIssuesEdit() {
  const panel = document.getElementById("panel-issues");
  if (Array.isArray(DATA.issue_table_text) && DATA.issue_table_text.length) {
    panel.innerHTML =
      `<div class="edit-hint">PTE comment / 개발 comment 셀을 더블클릭해 수정하세요. 나머지 열은 읽기전용입니다.</div>` +
      `<div class="edit-hint">ETC 섹션에 표에 없는 항목을 추가하려면 ` +
      `<button type="button" class="btn-sm" id="etcAddItemBtn">+ 항목 추가</button></div>` +
      renderSheetTable(DATA.issue_table_text, { edit: true, kind: "issue", editableCols: ISSUE_COMMENT_COLS });
    renderIssueMiniDist(panel);
    return;
  }
  emptyPanel(panel, "Issue Table 데이터 없음");
}

// ── 모드 전환 ──────────────────────────────────────────────────────────────
// ── 탭별 lazy 렌더 ────────────────────────────────────────────────────────────
// 활성 탭(보통 Summary)만 즉시 그려 첫 화면을 빨리 띄우고, 나머지는 dirty 플래그를
// 세워뒀다가 탭 클릭 시 또는 백그라운드 프리렌더(schedulePrerender)에서 그린다.
// Issue Table 의 comment 두 열, Raw Data 외에는 수정모드에서도 조회 화면과 동일하게
// 읽기전용으로 둔다 (Summary/Yield 는 편집 UI 자체를 렌더하지 않음).
const TAB_RENDERERS = {
  "summary": () => { renderWebSummary(); },
  "yield": () => {
    destroyYieldGrid();   // 재렌더 전 이전 Tabulator 인스턴스 정리
    renderYield(DATA.yield_text, DATA.summary);
    if (isWebReportSession()) renderYieldFailBins();
  },
  "issues": () => {
    if (MODE === "edit") renderIssuesEdit();
    else renderIssues(DATA.issue_table_text);
  },
  "cpk": renderCpk,
  "distribution": renderDistribution,
  "map-analysis": renderMapAnalysis,
  "raw-data": renderRawDataTab,
  "trim-analysis": renderPlaceholderTabs,
};
const tabDirty = {};

function activeTabName() {
  const btn = document.querySelector(".tab.active");
  return (btn && btn.dataset.tab) || "summary";
}

function renderTab(name) {
  if (!tabDirty[name] || !TAB_RENDERERS[name]) return;
  tabDirty[name] = false;
  TAB_RENDERERS[name]();
}

// 백그라운드 프리렌더: 첫 페인트를 막지 않도록 idle 타임에 한 탭씩 미리 그려둔다.
// raw-data 는 사용자 조작(항목 선택) 기반 lazy 조회라 첫 클릭 시 렌더가 자연스럽고,
// distribution 은 카드 셸만 미리 만들어도 실제 차트는 가시성+데이터 도착 후 그려진다.
let _prerenderToken = 0;
function schedulePrerender() {
  const token = ++_prerenderToken;
  const queue = ["yield", "issues", "cpk", "map-analysis", "distribution",
                 "trim-analysis"];
  const idle = window.requestIdleCallback
    ? (fn => window.requestIdleCallback(fn, { timeout: 1000 }))
    : (fn => setTimeout(fn, 200));
  function next() {
    if (token !== _prerenderToken) return;   // 새 renderActive 가 돌면 이전 체인 중단
    const name = queue.shift();
    if (name === undefined) return;
    const btn = document.querySelector(`.tab[data-tab="${name}"]`);
    if ((!btn || btn.style.display !== "none") && tabDirty[name]) renderTab(name);
    idle(next);
  }
  idle(next);
}

function renderActive() {
  clearCellSel();
  Object.keys(TAB_RENDERERS).forEach(n => { tabDirty[n] = true; });
  renderTab(activeTabName());
  schedulePrerender();
}

function setMode(m) {

  document.getElementById("editBar").classList.toggle("show", m === "edit");

// payload 조립 (saveEdits / autoSave 공용)
function buildPayload() {
  const payload = { password: verifiedPassword };

  if (isSummaryBlocks(DATA.summary_text)) {
    payload.summary_text = collectSummaryBlocks(document.getElementById("panel-summary"), DATA.summary_text);
  } else if (isGrid(DATA.summary_text)) {
    payload.summary_text = collectGrid(document.getElementById("panel-summary"), DATA.summary_text);
  } else {
    payload.summary_text = collectSummaryText();
  }

  if (Array.isArray(DATA.yield_text) && DATA.yield_text.length) {
    // Tabulator 그리드 편집 → 동일 구조(list-of-dicts)로 회수. (행 순서·서브헤더 보존)
    payload.yield_text = yieldGrid
      ? yieldGrid.getData()
      : collectSheetTable(document.getElementById("panel-yield"), DATA.yield_text);
  } else if (isGrid(DATA.yield_text)) {
    payload.yield_text = collectGrid(document.getElementById("panel-yield"), DATA.yield_text);
  } else {
    payload.yield_rows = readEditTable(document.getElementById("tbl-yield")) || [];
  }

  if (Array.isArray(DATA.issue_table_text) && DATA.issue_table_text.length) {
    payload.issue_table_text = collectSheetTable(document.getElementById("panel-issues"), DATA.issue_table_text);
  } else if (isGrid(DATA.issue_table_text)) {
    payload.issue_table_text = collectGrid(document.getElementById("panel-issues"), DATA.issue_table_text);
  } else {
    const issueTbl = document.getElementById("tbl-issue");
    if (issueTbl) payload.issue_rows = readEditTable(issueTbl);
  }

  return payload;
}

// web_report 세션 전용 저장: Issue Table comment(PTE/개발) 변경분만 모아
// manifest.issue_comments 로 보낸다 (PATCH /content 는 web_report 를 지원하지 않음).
// 변경 없으면 요청을 보내지 않는다. 실패 시 throw — 호출부가 dirty 복원.
async function saveIssueComments(opts) {
  opts = opts || {};
  const panel = document.getElementById("panel-issues");
  const rows = Array.isArray(DATA && DATA.issue_table_text) ? DATA.issue_table_text : [];
  const comments = [];
  const applied = [];   // 성공 시 DATA.issue_table_text 에도 반영해 재렌더 시 옛 값으로 되돌지 않게 함
  if (panel) {
    panel.querySelectorAll("td[data-key][data-col]").forEach(td => {
      const col = td.dataset.col;
      const ri = parseInt(td.dataset.r, 10);
      const orig = String(((rows[ri] || {})[col]) ?? "").trim();
      const value = (td.textContent || "").trim();
      if (value !== orig) {
        comments.push({ key: td.dataset.key, col, value });
        applied.push({ ri, col, value });
      }
    });
  }
  if (!comments.length) return { ok: true, updated: 0 };
  const res = await fetch(`/pe/report/session/${SESSION_ID}/web_report/issue_table/comments`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken() },
    body: JSON.stringify({ password: verifiedPassword, comments }),
    keepalive: !!opts.keepalive,
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || `comment 저장 실패 (HTTP ${res.status})`);
  applied.forEach(({ ri, col, value }) => { if (rows[ri]) rows[ri][col] = value; });
  return j;
}

async function saveEdits() {
  if (!DATA) return;
  if (isWebReportSession()) {
    // web_report: comment 저장만 지원 (Summary/Yield 등은 읽기전용, Raw Data 는 별도 버튼).
    const saveBtn = document.getElementById("editSave");
    saveBtn.disabled = true;
    _setDot("saving");
    try {
      await saveIssueComments();
      _dirty = false;
      _setDot("saved");
      showToast("저장되었습니다.");
      await load(false);
      setMode("view");
    } catch (e) {
      showToast("저장 실패: " + e.message);
      _setDot("dirty");
    } finally {
      saveBtn.disabled = false;
    }
    return;
  }
  const payload = buildPayload();
  const saveBtn = document.getElementById("editSave");
  saveBtn.disabled = true;
  _setDot("saving");
  try {
    const res = await fetch(`/pe/report/session/${SESSION_ID}/content`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken() },
      body: JSON.stringify(payload),
    });
    const j = await res.json().catch(() => ({}));
    if (res.status === 403) { showToast(j.error || "비밀번호가 일치하지 않습니다."); _setDot("dirty"); return; }
    if (!res.ok && res.status !== 207) { showToast(j.error || "저장 실패"); _setDot("dirty"); return; }
    if (res.status === 207) {
      showToast("일부만 저장됨: " + Object.keys(j.errors || {}).join(", "));
    } else {
      showToast("저장되었습니다.");
    }
    _dirty = false;
    _setDot("saved");
    await load(false);
    setMode("view");
  } catch (e) {
    showToast("저장 실패: " + e.message);
    _setDot("dirty");
  } finally {
    saveBtn.disabled = false;
  }
}

// 자동저장: 페이지가 숨겨질 때(탭 전환·창 최소화 등) 변경사항 자동 저장.
// keepalive:true 로 페이지 언로드 중에도 요청이 완료된다.
async function autoSave() {
  if (!DATA || MODE !== "edit" || !_dirty || _autoSaving) return;
  _autoSaving = true;
  _setDot("saving");
  if (isWebReportSession()) {
    _dirty = false;  // optimistic
    try {
      await saveIssueComments({ keepalive: true });
      _setDot("saved");
    } catch (_) {
      _dirty = true;
      _setDot("dirty");
    } finally {
      _autoSaving = false;
    }
    return;
  }
  const payload = buildPayload();
  _dirty = false;  // optimistic
  try {
    const res = await fetch(`/pe/report/session/${SESSION_ID}/content`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken() },
      body: JSON.stringify(payload),
      keepalive: true,
    });
    if (!res.ok) { _dirty = true; _setDot("dirty"); }
    else _setDot("saved");
  } catch (_) {
    _dirty = true;
    _setDot("dirty");
  } finally {
    _autoSaving = false;
  }
}

// 탭이 백그라운드로 가거나 창이 최소화될 때 자동저장
document.addEventListener("visibilitychange", () => {
  if (document.hidden) autoSave();
});

// 페이지를 떠날 때: dirty 상태면 브라우저 경고 + keepalive 저장 시도
window.addEventListener("beforeunload", e => {
  if (MODE === "edit" && _dirty) {
    autoSave();            // keepalive 요청 발사 (비동기, 브라우저가 완료 보장)
    e.preventDefault();
    e.returnValue = "";    // 브라우저 "변경사항이 저장되지 않을 수 있습니다" 경고
  }
});

// ── Issue Table ETC 항목 추가/삭제 (web_report 전용) ─────────────────────────
// item 명만 서버(manifest.etc_items)에 저장하고, Bin/TNO/Distribution 은 항상
// 조회 시점에 tables/yield_rows/distDataCache 에서 자동으로 다시 채워진다.
let etcItemMeta = null;  // 전체 item 목록 캐시(rawDataMeta 있으면 그걸 재사용)

function currentEtcItems() {
  const rows = DATA && DATA.issue_table_text;
  if (!Array.isArray(rows)) return [];
  const idx = rows.findIndex(r => r && r["Category"] === "ETC");
  if (idx === -1) return [];
  return rows.slice(idx + 1).map(r => r && r["Item"]).filter(Boolean);
}

function closeEtcItemModal() { document.getElementById("etcItemModal").classList.remove("show"); }

async function openEtcItemModal() {
  document.getElementById("etcItemModal").classList.add("show");
  document.getElementById("etcItemSearch").value = "";
  const host = document.getElementById("etcItemList");
  host.innerHTML = `<div class="placeholder" style="padding:12px;">불러오는 중...</div>`;
  try {
    if (!etcItemMeta) etcItemMeta = rawDataMeta || await fetchRawDataMeta();
  } catch (e) {
    host.innerHTML = `<div class="placeholder" style="padding:12px;">항목 조회 실패: ${esc(e.message)}</div>`;
    return;
  }
  renderEtcItemList("");
}

function renderEtcItemList(filterText) {
  const host = document.getElementById("etcItemList");
  if (!host || !etcItemMeta) return;
  const q = String(filterText || "").trim().toLowerCase();
  const already = new Set(currentEtcItems());
  const items = (etcItemMeta.items || []).filter(it => !q || it.name.toLowerCase().includes(q));
  host.innerHTML = items.length ? items.map(it => {
    const added = already.has(it.name);
    return `<button type="button" class="rawdata-item${added ? " selected" : ""}" ` +
      `data-name="${esc(it.name)}" ${added ? "disabled" : ""}>${esc(it.name)}` +
      `${added ? ` <span class="rawdata-item-meta">(추가됨)</span>` : ""}</button>`;
  }).join("") : `<div class="placeholder" style="padding:12px;">일치하는 항목 없음</div>`;
}

// ETC 추가/삭제·Bin 상세 전환은 panel-issues 를 재렌더하므로, 아직 저장 안 된 comment
// 편집이 있으면 먼저 저장해 유실을 막는다. 저장 실패 시 false 를 반환해 조작을 중단시킨다.
async function flushPendingComments() {
  if (MODE !== "edit" || !_dirty || !isWebReportSession()) return true;
  try {
    await saveIssueComments();
    _dirty = false;
    _setDot("saved");
    return true;
  } catch (e) {

// ── load ──────────────────────────────────────────────────────────────────────
function hideLoadOverlay() {
  const ov = document.getElementById("loadOverlay");
  if (ov) ov.classList.remove("show");
}
async function load(resetMode=true) {
  try {
    const res = await fetch(`/pe/report/session/${SESSION_ID}/full`, { cache: "no-store" });
    if (!res.ok) {
      const box = document.getElementById("errorBox");
      box.style.display = "";
      box.textContent = `세션을 불러올 수 없습니다 (${res.status})`;
      hideLoadOverlay();
      return;
    }
    DATA = await res.json();
    // web_report 전용 뷰어 — xlsx 업로드(legacy) 세션 렌더링은 더 이상 지원하지 않는다.
    if (!isWebReportSession()) {
      document.querySelectorAll(".content .panel").forEach(p => {
        p.innerHTML = `<div class="placeholder" style="padding:24px;">이 세션은 web_report 형식이 아니어서 더 이상 표시할 수 없습니다.<br>(xlsx 업로드 흐름은 추후 재작업 예정)</div>`;
      });
      document.getElementById("topbarActions").style.display = "none";
      renderMeta(DATA.session || {});
      return;
    }
    _globalBinColors = null;   // 새 데이터 → bin 색상 매핑 재계산
    seedEmptyFrames();
    // Issue Table 의 미니 분포 차트가 renderDistribution() 보다 먼저 그려질 수 있으므로
    // distDataCache/distColorMap 은 렌더 순서와 무관하게 데이터 로드 직후 미리 준비해둔다.
    // distribution_deferred 응답이면 대용량 ECDF 를 백그라운드로 지연 로드하고
    // (첫 페인트를 막지 않음), 구형 embed 응답이면 기존 경로 그대로 (하위호환).
    const webPre = DATA.web_report || {};
    // Distribution ECDF 는 항상 지연 로드 (GET .../web_report/distribution 컴팩트 columnar).
    // 도착 전 그려진 미니셀/갤러리는 refreshDistConsumers 가 다시 채운다.
    ensureDistData();
    buildDistColorMap(webPre.sources || []);
    renderMeta(DATA.session || {});
    if (resetMode) {
      setMode("view");
      if (new URLSearchParams(location.search).get("mode") === "edit") {
        history.replaceState({}, "", location.pathname);  // 새로고침 시 재진입 방지
        enterEdit();
      }
    } else {
      renderActive();
    }
    hideLoadOverlay();
  } catch (e) {
    const box = document.getElementById("errorBox");
    box.style.display = "";
    box.textContent = "로드 실패: " + e.message;
    hideLoadOverlay();
  }
}

// ── 선택 셀 합계/평균 (엑셀 상태바) ───────────────────────────────────────────
function fmtNum(n) {
  const r = Math.round(n * 1e6) / 1e6;
  if (Number.isInteger(r)) return String(r);
  return r.toFixed(4).replace(/0+$/, "").replace(/\.$/, "");
}

// 수정 모드: 셀 텍스트 드래그 선택 → 숫자 토큰 합계/평균 (기존 동작 유지).
function updateCalc() {
  if (MODE !== "edit") return;
  const bar = document.getElementById("calcBar");
  const sel = window.getSelection ? window.getSelection() : null;
  const text = sel ? String(sel.toString()) : "";
  // 천단위 콤마 제거 후 숫자 토큰 추출
  const nums = (text.match(/-?\d[\d,]*\.?\d*/g) || [])
    .map(s => parseFloat(s.replace(/,/g, "")))
    .filter(n => !isNaN(n));
  if (nums.length < 2) { bar.classList.remove("show"); return; }
  const sum = nums.reduce((a, b) => a + b, 0);
  const avg = sum / nums.length;
  bar.innerHTML =
    `<span><span class="ci">개수</span><span class="cv">${nums.length}</span></span>` +
    `<span><span class="ci">합계</span><span class="cv">${fmtNum(sum)}</span></span>` +
    `<span><span class="ci">평균</span><span class="cv">${fmtNum(avg)}</span></span>`;
  bar.classList.toggle("lift", MODE === "edit");
  bar.classList.add("show");
}
document.addEventListener("selectionchange", updateCalc);
document.addEventListener("mouseup", updateCalc);

// 보기 모드: Ctrl/Shift 로 셀 단위 다중 선택 → 선택 셀의 합계/평균 표시.
let cellSelTable = null;
let cellSelCells = new Set();
let cellSelAnchor = null;

function cellKey(r, c) { return r + "," + c; }

function clearCellSel() {
  if (cellSelTable) {
    cellSelTable.querySelectorAll("td.cell-selected").forEach(td => td.classList.remove("cell-selected"));
  }
  cellSelTable = null;
  cellSelCells.clear();
  cellSelAnchor = null;
  const bar = document.getElementById("calcBar");
  if (MODE !== "edit") bar.classList.remove("show");
}

function applyCellSel() {
  if (!cellSelTable) return;
  cellSelTable.querySelectorAll("td[data-r]").forEach(td => {
    td.classList.toggle("cell-selected", cellSelCells.has(cellKey(td.dataset.r, td.dataset.c)));
  });
}

function selectRange(r1, c1, r2, c2) {
  const rMin = Math.min(r1, r2), rMax = Math.max(r1, r2);
  const cMin = Math.min(c1, c2), cMax = Math.max(c1, c2);
  cellSelCells.clear();
  for (let r = rMin; r <= rMax; r++) {
    for (let c = cMin; c <= cMax; c++) cellSelCells.add(cellKey(r, c));
  }
}

function updateCellCalc() {
  const bar = document.getElementById("calcBar");
  if (!cellSelTable || !cellSelCells.size) { bar.classList.remove("show"); return; }
  const nums = [];
  cellSelTable.querySelectorAll("td[data-r]").forEach(td => {
    if (!cellSelCells.has(cellKey(td.dataset.r, td.dataset.c))) return;
    const txt = td.textContent.replace(/,/g, "").trim();
    if (txt !== "" && !isNaN(+txt)) nums.push(+txt);
  });
  if (!nums.length) { bar.classList.remove("show"); return; }
  const sum = nums.reduce((a, b) => a + b, 0);
  const avg = sum / nums.length;
  bar.innerHTML =
    `<span><span class="ci">개수</span><span class="cv">${nums.length}</span></span>` +
    `<span><span class="ci">합계</span><span class="cv">${fmtNum(sum)}</span></span>` +
    `<span><span class="ci">평균</span><span class="cv">${fmtNum(avg)}</span></span>`;
  bar.classList.remove("lift");
  bar.classList.add("show");
}

document.addEventListener("click", e => {
  if (MODE !== "view") return;
  const td = e.target.closest("td[data-r]");
  if (!td) return;
  const table = td.closest("table.sheet-table");
  if (!table) return;
  const r = +td.dataset.r, c = +td.dataset.c;

  if (table !== cellSelTable) {
    clearCellSel();
    cellSelTable = table;
  }

  if (e.shiftKey && cellSelAnchor) {
    selectRange(cellSelAnchor.r, cellSelAnchor.c, r, c);
  } else if (e.ctrlKey || e.metaKey) {
    const key = cellKey(r, c);
    if (cellSelCells.has(key)) cellSelCells.delete(key);
    else cellSelCells.add(key);
    cellSelAnchor = { r, c };
  } else {
    cellSelCells.clear();
    cellSelCells.add(cellKey(r, c));
    cellSelAnchor = { r, c };
  }

  applyCellSel();
  updateCellCalc();
});

load();
</script>
</body>
