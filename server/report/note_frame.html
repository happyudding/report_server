<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Note</title>
<link rel="stylesheet" href="/pe/report/vendor/luckysheet/plugins/css/pluginsCss.css">
<link rel="stylesheet" href="/pe/report/vendor/luckysheet/plugins/plugins.css">
<link rel="stylesheet" href="/pe/report/vendor/luckysheet/css/luckysheet.css">
<link rel="stylesheet" href="/pe/report/vendor/luckysheet/assets/iconfont/iconfont.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #fff; }
  #luckysheetHost { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="luckysheetHost"></div>
<script src="/pe/report/vendor/luckysheet/plugins/js/plugin.js"></script>
<script src="/pe/report/vendor/luckysheet/luckysheet.umd.js"></script>
<script>
// Note 탭 격리 프레임 — Luckysheet 를 깨끗한 풀페이지 문서에서 실행한다.
// Luckysheet 2.0.6 은 풀윈도우 앱 설계라, 전역 CSS(*{box-sizing})·sticky header·페이지 스크롤·
// 중앙정렬 여백이 있는 부모 페이지에 직접 임베드하면 클릭좌표($s=컨테이너 offset 기준)와
// 캔버스 배율(Math.ceil(dpr))이 어긋나 셀 밀림/격자 떨림이 머신(dpr)마다 재발한다. 그래서
// 여기 iframe 안에서 origin(0,0) 풀페이지로 돌려 그 오염을 원천 차단한다.
// 부모(note.js)와는 postMessage 로만 통신: init(생성)·getSheets(저장직렬화)·insertImage·resize
// 를 받고 ready·dirty·sheets·error 를 보낸다. 서버 I/O·세션·CSRF 는 전부 부모 담당(순수 뷰).
(() => {
  "use strict";
  const ORIGIN = window.location.origin;   // same-origin iframe
  const post = (type, extra) =>
    window.parent.postMessage(Object.assign({ type }, extra || {}), ORIGIN);

  const defaultSheets = () => [{
    name: "Note", color: "", index: "note_sheet_1", status: 1, order: 0,
    celldata: [], config: {}, row: 84, column: 26,
  }];

  function createSheet(canEdit, sheets) {
    if (!Array.isArray(sheets) || !sheets.length) sheets = defaultSheets();
    if (!sheets.some(s => s.status === 1)) sheets[0].status = 1;
    try { window.luckysheet.destroy(); } catch (e) {}
    // 배율 정책: 정수 dpr(100/200%)→실제값(선명). 소수 dpr(125/150%)은 캔버스가 소수 배율로
    // 재샘플링되며 클릭 redraw 마다 떨리므로 1 로 고정(약간 흐리지만 떨림 원천 제거).
    const dpr = Number.isInteger(window.devicePixelRatio) ? window.devicePixelRatio : 1;
    window.luckysheet.create({
      container: "luckysheetHost",
      lang: "en",
      data: sheets,
      showinfobar: false,
      allowEdit: canEdit,
      showtoolbar: canEdit,
      showsheetbar: true,
      showstatisticBar: canEdit,
      enableAddRow: canEdit,
      enableAddBackTop: false,
      sheetFormulaBar: canEdit,
      devicePixelRatio: dpr,
      hook: { updated: () => { if (canEdit) post("note:dirty"); } },
    });
    requestAnimationFrame(() => requestAnimationFrame(() => {
      try { window.luckysheet.resize(); } catch (e) {}
    }));
  }

  // getAllSheets 의 2D data 행렬을 celldata 로 슬림해 payload 축소 (부모가 그대로 POST).
  function collectSheets() {
    const sheets = JSON.parse(JSON.stringify(window.luckysheet.getAllSheets()));
    sheets.forEach(s => {
      if (Array.isArray(s.data)) { s.celldata = window.luckysheet.transToCellData(s.data); delete s.data; }
      delete s.load;
    });
    return sheets;
  }

  window.addEventListener("message", ev => {
    if (ev.origin !== ORIGIN) return;
    const msg = ev.data || {};
    if (typeof msg.type !== "string") return;
    switch (msg.type) {
      case "note:init":
        createSheet(!!msg.canEdit, msg.sheets);
        break;
      case "note:getSheets":
        try { post("note:sheets", { reqId: msg.reqId, sheets: collectSheets() }); }
        catch (e) { post("note:error", { reqId: msg.reqId, message: String((e && e.message) || e) }); }
        break;
      case "note:insertImage":
        try { window.luckysheet.insertImage(msg.url, { rowIndex: 1, colIndex: 1 }); post("note:dirty"); }
        catch (e) { post("note:error", { message: "이미지 삽입 실패: " + ((e && e.message) || e) }); }
        break;
      case "note:resize":
        try { window.luckysheet.resize(); } catch (e) {}
        break;
    }
  });

  // iframe 자체 크기 변화(탭 표시·창 리사이즈) → 캔버스 재계산.
  window.addEventListener("resize", () => {
    try { if (window.luckysheet) window.luckysheet.resize(); } catch (e) {}
  });

  if (window.luckysheet) post("note:ready");
  else post("note:error", { message: "Luckysheet 로드 실패" });
})();
</script>
</body>
</html>
