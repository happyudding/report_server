<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>VOC — PTE REPORT</title>
<script src="/pe/report/static/webreport/error_beacon.js"></script>
<script>
/* 테마 부트스트랩: 첫 페인트 전에 저장된 다크 테마 적용 (FOUC 방지).
   localStorage "report_theme" 는 검색결과/세션 상세/VOC 페이지가 공유한다. */
try {
  if (localStorage.getItem("report_theme") === "dark")
    document.documentElement.setAttribute("data-theme", "dark");
} catch (e) {}
</script>
<style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }   /* display:flex 가 hidden 을 덮지 않게 */
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #fdf6e3; margin: 0; padding: 0 20px 24px;   /* Honey 톤 연노랑 기본 배경 */
  color: #222;
}
/* 상단 Bar 는 검색결과 페이지(report_analysis_index.html)와 동일 마크업·스타일을 쓴다.
   유일한 차이는 BACK TO MAIN 링크가 /pe/report/ 로 간다는 점. */
.page-header {
  margin: 0 -20px 8px; padding: 5px 20px;
  background: #000; color: #fff;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.page-title { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 0; }
.back-main-btn {
  border: 0; background: transparent; color: #fff;
  font-size: 19px; font-weight: 700; cursor: pointer;
  text-decoration: none;
  padding: 8px 0; white-space: nowrap;
}
.help-btn {
  border: 0; background: transparent; color: #fff;
  font-size: 19px; font-weight: 700; cursor: pointer;
  text-decoration: none;
  padding: 8px 0; white-space: nowrap;
}
.honey-dl-btn {
  flex: 0 0 auto; height: 34px; padding: 0 16px;
  display: inline-flex; align-items: center; gap: 6px;
  border-radius: 8px; border: 1px solid #16a34a;
  background: #16a34a; color: #fff; font-size: 19px; font-weight: 600;
  text-decoration: none; cursor: pointer; transition: all .15s;
  white-space: nowrap;
}
.honey-dl-btn:hover { background: #15803d; border-color: #15803d; }
.honey-dl-btn.disabled {
  background: #e5e7eb; border-color: #d1d5db; color: #9ca3af;
  cursor: not-allowed; pointer-events: none;
}
.theme-toggle {
  flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,.35); background: transparent;
  font-size: 21px; line-height: 1; padding: 0; cursor: pointer;
}
.theme-toggle:hover { background: rgba(255,255,255,.15); }

.card {
  background: #fff; border-radius: 10px; padding: 14px 18px;
  box-shadow: 0 1px 6px rgba(0,0,0,.07); margin-bottom: 12px;
  max-width: 1100px;
}
.card h2 { margin: 0 0 12px; font-size: 22px; }

/* ── 목록 툴바 (검색 + 등록) ─────────────────────────────────────────────── */
.list-toolbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 12px;
}
.list-toolbar .spacer { flex: 1 1 auto; }
#searchInput { flex: 0 1 320px; min-width: 180px; }
.list-count { font-size: 16px; color: #64748b; white-space: nowrap; }

select, input[type="text"], textarea {
  font: inherit; font-size: 17px; padding: 7px 10px;
  border: 1px solid #d0d5dd; border-radius: 8px; background: #fff; color: #222;
}
textarea { width: 100%; min-height: 110px; resize: vertical; }
.char-count { font-size: 14px; color: #94a3b8; text-align: right; }
.form-notice {
  padding: 10px 12px; border-radius: 8px; background: #f1f5f9; color: #64748b;
  font-size: 17px; margin-bottom: 8px;
}
.form-row { display: flex; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.form-row label { display: flex; flex-direction: column; gap: 4px; font-size: 16px; color: #555; }
.form-row .grow { flex: 1 1 300px; }
.form-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.submit-btn {
  height: 38px; padding: 0 22px; border-radius: 8px; border: 1px solid #4a90e2;
  background: #4a90e2; color: #fff; font-size: 18px; font-weight: 700; cursor: pointer;
}
.submit-btn:hover { background: #3a7bc8; }
.submit-btn:disabled { background: #cbd5e1; border-color: #cbd5e1; cursor: not-allowed; }
.file-btn {
  height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid #d0d5dd;
  background: #fff; color: #475569; font-size: 16px; font-weight: 600; cursor: pointer;
}
.file-btn:hover { border-color: #4a90e2; color: #4a90e2; }
.file-btn:disabled { opacity: .5; cursor: not-allowed; }
.file-hint { font-size: 14px; color: #94a3b8; }
.del-btn {
  height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid #fca5a5;
  background: #fff; color: #dc2626; font-size: 15px; font-weight: 600; cursor: pointer;
}
.del-btn:hover { background: #fef2f2; border-color: #dc2626; }

/* 선택 즉시 미리보기 + 개별 취소 */
.preview-row { display: flex; gap: 10px; margin: 8px 0 12px; flex-wrap: wrap; }
.preview-item { position: relative; }
.preview-item img {
  width: 120px; height: 90px; object-fit: cover;
  border: 1px solid #d0d5dd; border-radius: 8px; display: block;
}
.preview-remove {
  position: absolute; top: -8px; right: -8px; width: 24px; height: 24px;
  border-radius: 50%; border: 0; background: #dc2626; color: #fff;
  font-size: 14px; font-weight: 700; line-height: 1; cursor: pointer;
}
.preview-remove:hover { background: #b91c1c; }

/* ── 목록 테이블 ─────────────────────────────────────────────────────────── */
.table-wrap { overflow-x: auto; }
/* table-layout:fixed — 아래 폭 지정이 그대로 먹고, 폭을 안 준 제목이 남는 자리를 전부 갖는다 */
.voc-table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 720px; }
.voc-table th {
  font-size: 15px; color: #64748b; font-weight: 700; text-align: left;
  padding: 8px 8px; border-bottom: 2px solid #e5e7eb; white-space: nowrap;
}
.voc-table td {
  padding: 10px 8px; border-bottom: 1px solid #e5e7eb; font-size: 17px;
  vertical-align: middle;
}
.voc-table tbody tr { cursor: pointer; }
.voc-table tbody tr:hover { background: #f8fafc; }
.col-no { width: 52px; color: #94a3b8; font-size: 15px; }
/* 분류/Status/등록자/등록일 폭 = 기존 값의 1.3배 (사용자 요청 — 값 잘림 완화) */
.col-cat { width: 107px; }
.col-status { width: 88px; }
.col-user { width: 125px; font-size: 15px; color: #475569; }
.col-date { width: 114px; font-size: 14px; color: #94a3b8; }
.col-cat, .col-status, .col-user, .col-date { white-space: nowrap; overflow: hidden; }
/* 제목: 남는 폭 전부. 길면 말줄임하고 전체는 툴팁(title 속성)으로 본다 */
.col-title { overflow: hidden; }
.title-cell { display: flex; align-items: center; gap: 6px; min-width: 0; }
.row-title {
  font-weight: 600; flex: 1 1 auto; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.row-title.is-close { color: #94a3b8; font-weight: 500; }
.comment-count { flex: 0 0 auto; font-size: 15px; color: #4a90e2; white-space: nowrap; }
/* 게스트(이름만 적고 쓴 글) 표시 — Honey 계정 글과 구분해 이름 사칭을 드러낸다 */
.guest-badge {
  display: inline-block; margin-left: 4px; padding: 0 5px; border-radius: 4px;
  background: #e2e8f0; color: #64748b; font-size: 12px; font-weight: 700;
  vertical-align: middle;
}

.cat-badge {
  display: inline-block; padding: 2px 10px; border-radius: 4px;
  font-size: 15px; font-weight: 700; color: #fff; white-space: nowrap;
}
.cat-badge.버그 { background: #dc2626; }
.cat-badge.개선 { background: #16a34a; }
.cat-badge.문의 { background: #4a90e2; }
.cat-badge.기타 { background: #64748b; }

.status-badge {
  display: inline-block; padding: 2px 12px; border-radius: 999px;
  font-size: 15px; font-weight: 700; white-space: nowrap; border: 1px solid transparent;
}
.status-badge.open { background: #dcfce7; color: #15803d; border-color: #86efac; }
.status-badge.close { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; }

.empty-note { padding: 22px 4px; color: #94a3b8; font-size: 17px; text-align: center; }

/* ── 상세 ────────────────────────────────────────────────────────────────── */
.detail-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.detail-title { font-size: 22px; font-weight: 800; word-break: break-word; }
.detail-meta {
  margin: 8px 0 14px; font-size: 15px; color: #94a3b8;
  padding-bottom: 12px; border-bottom: 1px solid #e5e7eb;
}
.voc-content { font-size: 17px; white-space: pre-wrap; word-break: break-word; min-height: 60px; }
.thumb-row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.thumb-row img {
  width: 150px; height: 100px; object-fit: cover; cursor: zoom-in;
  border: 1px solid #d0d5dd; border-radius: 8px; display: block;
}
.thumb-row img:hover { border-color: #4a90e2; }
.detail-actions {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-top: 18px; padding-top: 14px; border-top: 1px solid #e5e7eb;
}
.detail-actions .spacer { flex: 1 1 auto; }
.close-btn {
  height: 34px; padding: 0 14px; border-radius: 8px; cursor: pointer;
  font-size: 16px; font-weight: 600;
  border: 1px solid #cbd5e1; background: #f1f5f9; color: #475569;
}
.close-btn:hover { border-color: #64748b; }
.reopen-btn {
  height: 34px; padding: 0 14px; border-radius: 8px; cursor: pointer;
  font-size: 16px; font-weight: 600;
  border: 1px solid #86efac; background: #dcfce7; color: #15803d;
}
.reopen-btn:hover { border-color: #16a34a; }

/* ── 댓글 ────────────────────────────────────────────────────────────────── */
.comment-section { margin-top: 22px; padding-top: 14px; border-top: 2px solid #e5e7eb; }
.comment-section h3 { margin: 0 0 10px; font-size: 19px; }
.comment-item { padding: 10px 2px; border-bottom: 1px solid #eef1f5; }
.comment-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.comment-user { font-size: 16px; font-weight: 700; }
.comment-time { font-size: 14px; color: #94a3b8; }
.comment-head .spacer { flex: 1 1 auto; }
.comment-body { margin-top: 4px; font-size: 17px; white-space: pre-wrap; word-break: break-word; }
.comment-form { margin-top: 12px; }
.comment-form textarea { min-height: 70px; }
.comment-empty { padding: 14px 4px; color: #94a3b8; font-size: 16px; }

/* ── 페이지네이션 ───────────────────────────────────────────────────────── */
.pager { display: flex; gap: 6px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
.pg-btn {
  min-width: 34px; height: 32px; padding: 0 10px; border-radius: 6px;
  border: 1px solid #d0d5dd; background: #fff; color: #475569;
  font-size: 16px; cursor: pointer;
}
.pg-btn:hover { border-color: #4a90e2; color: #4a90e2; }
.pg-btn.active { background: #4a90e2; border-color: #4a90e2; color: #fff; }
.pg-btn:disabled { opacity: .4; cursor: not-allowed; }

/* ── 라이트박스 (원본 확대) ──────────────────────────────────────────────── */
dialog.lightbox {
  border: 0; padding: 0; background: transparent; max-width: 96vw; max-height: 96vh;
}
dialog.lightbox::backdrop { background: rgba(0,0,0,.75); }
dialog.lightbox img {
  max-width: 96vw; max-height: 92vh; display: block;
  border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,.6); cursor: zoom-out;
}

/* 토스트 */
.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
  background: #111827; color: #fff; padding: 10px 18px; border-radius: 8px;
  font-size: 16px; opacity: 0; pointer-events: none; transition: opacity .25s;
  z-index: 60;
}
.toast.show { opacity: .95; }
</style>
<style>
/* ══ 라이트/다크 테마 (추가 전용 override) — 검색결과 페이지와 동일 방식 ══ */
html[data-theme="dark"] body { background: #14161a; color: #d7dbe2; }
html[data-theme="dark"] .card { background: #1e2128; box-shadow: 0 1px 6px rgba(0,0,0,.45); }
html[data-theme="dark"] .form-row label { color: #9aa3b0; }
html[data-theme="dark"] select,
html[data-theme="dark"] input[type="text"],
html[data-theme="dark"] textarea { background: #14161a; border-color: #3a3f4b; color: #d7dbe2; }
html[data-theme="dark"] .form-notice { background: #262a33; color: #9aa3b0; }
html[data-theme="dark"] .file-btn { background: #262a33; border-color: #3a3f4b; color: #c6ccd6; }
html[data-theme="dark"] .file-btn:hover { border-color: #4a90e2; color: #7fb3ef; }
html[data-theme="dark"] .preview-item img,
html[data-theme="dark"] .thumb-row img { border-color: #3a3f4b; }
html[data-theme="dark"] .voc-table th { color: #9aa3b0; border-bottom-color: #2a2e37; }
html[data-theme="dark"] .voc-table td { border-bottom-color: #2a2e37; }
html[data-theme="dark"] .voc-table tbody tr:hover { background: #262a33; }
html[data-theme="dark"] .col-user { color: #c6ccd6; }
html[data-theme="dark"] .col-no,
html[data-theme="dark"] .col-date { color: #8b94a3; }
html[data-theme="dark"] .row-title.is-close { color: #767f8c; }
html[data-theme="dark"] .guest-badge { background: #2f343e; color: #9aa3b0; }
html[data-theme="dark"] .status-badge.open { background: #123420; color: #4ade80; border-color: #1d5c36; }
html[data-theme="dark"] .status-badge.close { background: #262a33; color: #8b94a3; border-color: #3a3f4b; }
html[data-theme="dark"] .detail-meta { color: #8b94a3; border-bottom-color: #2a2e37; }
html[data-theme="dark"] .detail-actions { border-top-color: #2a2e37; }
html[data-theme="dark"] .close-btn { background: #262a33; border-color: #3a3f4b; color: #c6ccd6; }
html[data-theme="dark"] .reopen-btn { background: #123420; border-color: #1d5c36; color: #4ade80; }
html[data-theme="dark"] .comment-section { border-top-color: #2a2e37; }
html[data-theme="dark"] .comment-item { border-bottom-color: #23262e; }
html[data-theme="dark"] .comment-time,
html[data-theme="dark"] .comment-empty { color: #8b94a3; }
html[data-theme="dark"] .list-count { color: #9aa3b0; }
html[data-theme="dark"] .del-btn { background: #262a33; border-color: #6e3030; color: #f28b8b; }
html[data-theme="dark"] .del-btn:hover { background: #3a2222; border-color: #dc2626; }
html[data-theme="dark"] .pg-btn { background: #262a33; border-color: #3a3f4b; color: #c6ccd6; }
html[data-theme="dark"] .pg-btn.active { background: #4a90e2; border-color: #4a90e2; color: #fff; }
html[data-theme="dark"] .empty-note { color: #767f8c; }
</style>
</head>
<body>

<header class="page-header">
  <h1 class="page-title">LSI PTE REPORT SERVER</h1>
  <div style="display:flex; align-items:center; gap:14px;">
    <a class="help-btn" href="/pe/report/help">HELP</a>
    <a class="help-btn" href="https://confluence.samsungds.net/pages/editpage.action?pageId=3473285336" target="_blank" rel="noopener">VOC</a>
    <a id="honeyDlBtn" class="honey-dl-btn" href="/honey/download">⬇ HONEY 다운로드</a>
    <!-- 검색결과 페이지와 달리 여기서는 검색결과 페이지로 되돌아간다(사용자 요청).
         같은 출처에서 왔으면 히스토리 복귀(BFCache 즉시 복원), 직접 진입은 앵커 폴백. -->
    <a class="back-main-btn" href="/pe/report/"
       onclick="try { if (history.length > 1 && document.referrer && new URL(document.referrer).origin === location.origin) { history.back(); return false; } } catch (e) {} return true;">BACK TO MAIN</a>
    <button class="theme-toggle" id="themeToggle" title="다크 모드로 전환">🌙</button>
  </div>
</header>

<!-- ═══ 목록 ═══════════════════════════════════════════════════════════════ -->
<div class="card" id="viewList" hidden>
  <div class="list-toolbar">
    <input type="text" id="searchInput" maxlength="120" placeholder="제목 또는 번호 검색">
    <button type="button" class="file-btn" id="searchBtn">🔍 검색</button>
    <button type="button" class="file-btn" id="clearSearchBtn" hidden>전체 보기</button>
    <span class="list-count" id="listCount"></span>
    <span class="spacer"></span>
    <button type="button" class="submit-btn" id="newBtn">✏️ VOC 등록</button>
  </div>
  <div class="form-notice" id="anonNotice" hidden>
    Honey 로 접속하면 PC 계정으로 자동 등록됩니다. 일반 브라우저는 등록할 때 이름을 입력해주세요.
  </div>
  <div class="table-wrap">
    <table class="voc-table">
      <thead>
        <tr>
          <th class="col-no">번호</th>
          <th class="col-cat">분류</th>
          <th>제목</th>
          <th class="col-status">Status</th>
          <th class="col-user">등록자</th>
          <th class="col-date">등록일</th>
        </tr>
      </thead>
      <tbody id="vocTbody"></tbody>
    </table>
  </div>
  <div class="empty-note" id="listEmpty" hidden></div>
  <div class="pager" id="pager"></div>
</div>

<!-- ═══ 등록 / 수정 ════════════════════════════════════════════════════════ -->
<div class="card" id="viewForm" hidden>
  <h2 id="formTitle">VOC 등록</h2>
  <div class="form-notice" id="formAnonNotice" hidden>
    이름을 입력하면 등록할 수 있습니다. 등록한 글은 <b>이 브라우저에서만</b> 수정·삭제됩니다.
  </div>
  <div class="form-row">
    <label id="guestNameLabel" hidden>이름
      <input type="text" id="guestName" maxlength="20" placeholder="이름 (1~20자)">
    </label>
    <label>분류
      <select id="vocCategory">
        <option>버그</option>
        <option>개선 제안</option>
        <option>문의</option>
        <option>기타</option>
      </select>
    </label>
    <label class="grow">제목
      <input type="text" id="vocTitle" maxlength="120" placeholder="제목 (1~120자)">
    </label>
  </div>
  <div class="form-row" style="flex-direction:column;">
    <label style="width:100%;">내용
      <textarea id="vocContent" maxlength="4000" placeholder="본문 입력해주세요"></textarea>
    </label>
    <div class="char-count" id="charCount">0 / 4000</div>
  </div>
  <div class="form-actions" id="attachRow">
    <button type="button" class="file-btn" id="fileBtn">📷 스크린샷 첨부</button>
    <span class="file-hint">PNG/JPEG · 최대 3장 · 장당 2MB</span>
    <input type="file" id="fileInput" accept="image/png,image/jpeg" multiple hidden>
  </div>
  <div class="preview-row" id="previewRow"></div>
  <div class="form-notice" id="editAttachNotice" hidden>
    스크린샷은 수정할 수 없습니다. (변경하려면 삭제 후 다시 등록해주세요)
  </div>
  <div class="form-actions">
    <button type="button" class="submit-btn" id="submitBtn">등록</button>
    <button type="button" class="file-btn" id="cancelBtn">취소</button>
  </div>
</div>

<!-- ═══ 상세 ═══════════════════════════════════════════════════════════════ -->
<div class="card" id="viewDetail" hidden>
  <div class="detail-head">
    <span class="cat-badge" id="detailCat"></span>
    <span class="status-badge" id="detailStatus"></span>
    <span class="detail-title" id="detailTitle"></span>
  </div>
  <div class="detail-meta" id="detailMeta"></div>
  <div class="voc-content" id="detailContent"></div>
  <div class="thumb-row" id="detailThumbs"></div>
  <div class="detail-actions">
    <button type="button" class="file-btn" id="backBtn">← 목록</button>
    <span class="spacer"></span>
    <button type="button" class="close-btn" id="statusBtn" hidden></button>
    <button type="button" class="file-btn" id="editBtn" hidden>✏️ 수정</button>
    <button type="button" class="del-btn" id="deleteBtn" hidden>삭제</button>
  </div>

  <div class="comment-section">
    <h3 id="commentTitle">댓글</h3>
    <div id="commentList"></div>
    <div class="comment-form">
      <input type="text" id="commentGuestName" maxlength="20"
             placeholder="이름 (1~20자)" style="margin-bottom:8px;" hidden>
      <textarea id="commentInput" maxlength="1000" placeholder="댓글을 입력해주세요"></textarea>
      <div class="form-actions" style="margin-top:8px;">
        <button type="button" class="submit-btn" id="commentBtn">댓글 등록</button>
      </div>
    </div>
  </div>
</div>

<dialog class="lightbox" id="lightbox"><img id="lightboxImg" alt="screenshot"></dialog>
<div class="toast" id="toast"></div>

<script>
"use strict";
const PAGE_SIZE = 20;
const API = "/pe/report/api/voc";

// 목록 상태는 메모리에 유지한다 — 상세에서 뒤로가기 시 같은 페이지·검색으로 복귀.
const state = { page: 0, q: "", user: "", isAdmin: false, identityLoaded: false };
let selectedFiles = [];   // {file, url} — FileList 는 불변이라 배열로 상태 관리
let editingId = null;     // null = 등록 모드, 숫자 = 수정 모드
let detail = null;        // 현재 상세 응답

// ── 공용 ──────────────────────────────────────────────────────────────────
function $(id) { return document.getElementById(id); }
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;   // XSS-안전: 항상 textContent
  return n;
}
function csrfToken() {
  const m = document.cookie.match(/(?:^|;\s*)report_csrf=([^;]+)/);
  return m ? decodeURIComponent(m[1]) : "";
}
let toastTimer = null;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3000);
}
function fmtTime(epoch) {
  try { return new Date(epoch * 1000).toLocaleString("ko-KR"); }
  catch (e) { return ""; }
}
function fmtDate(epoch) {
  try { return new Date(epoch * 1000).toLocaleDateString("ko-KR"); }
  catch (e) { return ""; }
}
function catClass(category) {
  // 분류명 첫 토큰("버그"/"개선"/"문의"/"기타")을 색상 클래스로 사용
  return "cat-badge " + String(category || "기타").split(" ")[0];
}
async function api(path, options) {
  const opt = Object.assign({ headers: {} }, options || {});
  if (opt.method && opt.method !== "GET") opt.headers["X-CSRF-Token"] = csrfToken();
  if (opt.json !== undefined) {
    opt.headers["Content-Type"] = "application/json";
    opt.body = JSON.stringify(opt.json);
    delete opt.json;
  }
  const r = await fetch(path, opt);
  let body = null;
  try { body = await r.json(); } catch (e) {}
  return { ok: r.ok, status: r.status, body: body || {} };
}
function applyIdentity(data) {
  state.user = data.user || "";
  state.isAdmin = !!data.is_admin;
  state.identityLoaded = true;
}
// 게스트(일반 브라우저) 이름은 다음 등록 때 다시 치지 않게 브라우저에 기억해둔다.
// 소유권 증표는 이 값이 아니라 서버가 심는 httponly 쿠키다 — 여기 값을 고쳐도 권한은 안 바뀐다.
function savedGuestName() {
  try { return localStorage.getItem("voc_guest_name") || ""; } catch (e) { return ""; }
}
function saveGuestName(name) {
  try { localStorage.setItem("voc_guest_name", name); } catch (e) {}
}

// ── 테마 토글 (검색결과 페이지와 동일 동작·localStorage 키 공유) ──────────
(function () {
  const btn = $("themeToggle");
  const root = document.documentElement;
  function syncThemeBtn() {
    const dark = root.getAttribute("data-theme") === "dark";
    btn.textContent = dark ? "☀️" : "🌙";
    btn.title = dark ? "라이트 모드로 전환" : "다크 모드로 전환";
  }
  btn.addEventListener("click", () => {
    const toDark = root.getAttribute("data-theme") !== "dark";
    if (toDark) root.setAttribute("data-theme", "dark");
    else root.removeAttribute("data-theme");
    try {
      if (toDark) localStorage.setItem("report_theme", "dark");
      else localStorage.removeItem("report_theme");
    } catch (e) {}
    syncThemeBtn();
  });
  syncThemeBtn();
})();

// HONEY 설치본 다운로드 버튼 — 검색결과 페이지와 동일 동작(/honey/version 으로 링크 보정,
// 배포본이 없으면 비활성). 상단 Bar 를 그 페이지와 동일하게 맞추면서 함께 옮겨왔다.
(async () => {
  const btn = $("honeyDlBtn");
  if (!btn) return;
  try {
    const res = await fetch("/honey/version");
    if (!res.ok) throw new Error("no release");
    const m = await res.json();
    if (!m.version) throw new Error("no version");
    if (m.url) btn.href = m.url;
    if (m.file) btn.setAttribute("download", m.file);
    btn.textContent = "⬇ HONEY 다운로드";
  } catch (e) {
    btn.classList.add("disabled");
    btn.removeAttribute("href");
    btn.title = "배포된 설치본이 없습니다";
    btn.textContent = "HONEY 다운로드 (없음)";
  }
})();

// ── 라이트박스 ────────────────────────────────────────────────────────────
const lightbox = $("lightbox");
const lightboxImg = $("lightboxImg");
lightbox.addEventListener("click", () => lightbox.close());
lightbox.addEventListener("close", () => { lightboxImg.src = ""; });
function openLightbox(url) {
  lightboxImg.src = url;
  lightbox.showModal();
}

// ══ 해시 라우팅 ═══════════════════════════════════════════════════════════
// "" → 목록 / "new" → 등록 / "voc/<id>" → 상세 / "voc/<id>/edit" → 수정
function showView(id) {
  for (const v of ["viewList", "viewForm", "viewDetail"]) $(v).hidden = (v !== id);
  window.scrollTo(0, 0);
}
function go(hash) { location.hash = hash; }

async function route() {
  const h = (location.hash || "").replace(/^#/, "");
  if (h === "new") return openForm(null);
  const m = h.match(/^voc\/(\d+)(\/edit)?$/);
  if (m) return m[2] ? openForm(Number(m[1])) : openDetail(Number(m[1]));
  showView("viewList");
  await loadList(state.page);
}
window.addEventListener("hashchange", route);

// ══ 목록 ═══════════════════════════════════════════════════════════════════
async function loadList(page) {
  const params = new URLSearchParams({ limit: PAGE_SIZE, offset: page * PAGE_SIZE });
  if (state.q) params.set("q", state.q);
  const r = await api(`${API}?${params}`);
  if (!r.ok) { toast("VOC 목록을 불러오지 못했습니다."); return; }
  const data = r.body;
  // 삭제로 마지막 페이지가 비면 앞 페이지로 되돌린다
  if (page > 0 && !data.items.length && data.total > 0) return loadList(page - 1);
  state.page = page;
  applyIdentity(data);
  renderList(data);
}

function renderList(data) {
  $("anonNotice").hidden = !!state.user;   // 등록은 게스트도 가능 — 안내만 다르다
  $("clearSearchBtn").hidden = !state.q;
  $("listCount").textContent = state.q
    ? `검색 ${data.total}건` : `전체 ${data.total}건`;

  const tbody = $("vocTbody");
  tbody.replaceChildren();
  const empty = $("listEmpty");
  empty.hidden = data.items.length > 0;
  if (!data.items.length) {
    empty.textContent = state.q
      ? `"${state.q}" 검색 결과가 없습니다.` : "등록된 VOC 가 없습니다.";
  }

  for (const it of data.items) {
    const tr = el("tr");
    tr.appendChild(el("td", "col-no", String(it.id)));

    const catTd = el("td", "col-cat");
    catTd.appendChild(el("span", catClass(it.category), it.category));
    tr.appendChild(catTd);

    const isClose = it.status === "close";
    const titleTd = el("td", "col-title");
    const cell = el("div", "title-cell");
    const titleSpan = el("span", "row-title" + (isClose ? " is-close" : ""), it.title);
    titleSpan.title = it.title;                 // 말줄임된 긴 제목은 툴팁으로 전체 확인
    cell.appendChild(titleSpan);
    if (it.comment_count > 0)
      cell.appendChild(el("span", "comment-count", `💬 ${it.comment_count}`));
    titleTd.appendChild(cell);
    tr.appendChild(titleTd);

    const stTd = el("td", "col-status");
    stTd.appendChild(el("span", `status-badge ${isClose ? "close" : "open"}`,
                        isClose ? "Close" : "Open"));
    tr.appendChild(stTd);

    const userTd = el("td", "col-user");
    userTd.appendChild(document.createTextNode(it.user_id));
    userTd.title = it.user_id + (it.is_guest ? " (게스트)" : "");
    if (it.is_guest) userTd.appendChild(el("span", "guest-badge", "guest"));
    tr.appendChild(userTd);
    tr.appendChild(el("td", "col-date", fmtDate(it.created_at)));
    tr.addEventListener("click", () => go(`#voc/${it.id}`));
    tbody.appendChild(tr);
  }
  renderPager(data.total);
}

function renderPager(total) {
  const pager = $("pager");
  pager.replaceChildren();
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (pages <= 1) return;
  const mk = (label, page, opts = {}) => {
    const b = el("button", "pg-btn" + (opts.active ? " active" : ""), label);
    b.type = "button";
    b.disabled = !!opts.disabled;
    if (!opts.disabled && !opts.active) b.addEventListener("click", () => loadList(page));
    return b;
  };
  pager.appendChild(mk("◀", state.page - 1, { disabled: state.page === 0 }));
  const start = Math.max(0, Math.min(state.page - 3, pages - 7));
  const end = Math.min(pages, start + 7);
  for (let p = start; p < end; p++)
    pager.appendChild(mk(String(p + 1), p, { active: p === state.page }));
  pager.appendChild(mk("▶", state.page + 1, { disabled: state.page >= pages - 1 }));
}

function runSearch() {
  state.q = $("searchInput").value.trim();
  loadList(0);
}
$("searchBtn").addEventListener("click", runSearch);
$("searchInput").addEventListener("keydown", (e) => { if (e.key === "Enter") runSearch(); });
$("clearSearchBtn").addEventListener("click", () => {
  $("searchInput").value = "";
  state.q = "";
  loadList(0);
});
$("newBtn").addEventListener("click", () => go("#new"));

// ══ 등록 / 수정 ════════════════════════════════════════════════════════════
const contentEl = $("vocContent");
contentEl.addEventListener("input", () => {
  $("charCount").textContent = `${contentEl.value.length} / 4000`;
});

function clearFiles() {
  selectedFiles.forEach(sf => URL.revokeObjectURL(sf.url));
  selectedFiles = [];
  renderPreviews();
}

async function ensureIdentity() {
  if (state.identityLoaded) return;
  const r = await api(`${API}?limit=1`);
  if (r.ok) applyIdentity(r.body);
}

async function openForm(vocId) {
  editingId = vocId;
  clearFiles();
  showView("viewForm");
  const editing = vocId !== null;
  $("formTitle").textContent = editing ? "VOC 수정" : "VOC 등록";
  $("submitBtn").textContent = editing ? "저장" : "등록";
  $("attachRow").hidden = editing;              // 스크린샷은 등록 시에만
  $("editAttachNotice").hidden = !editing;

  if (editing) {
    const r = await api(`${API}/${vocId}`);
    if (!r.ok) { toast("삭제되었거나 없는 VOC 입니다."); go("#"); return; }
    applyIdentity(r.body);
    if (!r.body.can_edit) { toast("본인이 등록한 VOC 만 수정할 수 있습니다."); go(`#voc/${vocId}`); return; }
    $("vocCategory").value = r.body.voc.category;
    $("vocTitle").value = r.body.voc.title;
    contentEl.value = r.body.voc.content;
  } else {
    await ensureIdentity();
    $("vocCategory").selectedIndex = 0;
    $("vocTitle").value = "";
    contentEl.value = "";
  }
  $("charCount").textContent = `${contentEl.value.length} / 4000`;
  // Honey 신원이 없으면 이름을 직접 받는다 (등록 자체는 게스트도 가능)
  const guest = !state.user;
  $("formAnonNotice").hidden = !guest;
  $("guestNameLabel").hidden = !guest;
  if (guest && !$("guestName").value) $("guestName").value = savedGuestName();
}

const fileInput = $("fileInput");
$("fileBtn").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => {
  for (const f of fileInput.files) {
    if (selectedFiles.length >= 3) { toast("스크린샷은 최대 3장입니다."); break; }
    if (f.type !== "image/png" && f.type !== "image/jpeg") {
      toast(`PNG/JPEG 만 첨부할 수 있습니다: ${f.name}`); continue;
    }
    if (f.size > 2 * 1024 * 1024) {
      toast(`2MB 를 넘는 파일은 첨부할 수 없습니다: ${f.name}`); continue;
    }
    selectedFiles.push({ file: f, url: URL.createObjectURL(f) });
  }
  fileInput.value = "";   // 같은 파일 재선택 허용
  renderPreviews();
});
function renderPreviews() {
  const row = $("previewRow");
  row.replaceChildren();
  selectedFiles.forEach((sf, idx) => {
    const item = el("div", "preview-item");
    const img = el("img");
    img.src = sf.url;
    img.alt = "preview";
    const rm = el("button", "preview-remove", "✕");
    rm.type = "button";
    rm.title = "이 스크린샷 제거";
    rm.addEventListener("click", () => {
      URL.revokeObjectURL(sf.url);
      selectedFiles.splice(idx, 1);
      renderPreviews();
    });
    item.append(img, rm);
    row.appendChild(item);
  });
}

$("cancelBtn").addEventListener("click", () => {
  go(editingId === null ? "#" : `#voc/${editingId}`);
});

$("submitBtn").addEventListener("click", async () => {
  const title = $("vocTitle").value.trim();
  const content = contentEl.value.trim();
  const category = $("vocCategory").value;
  const guestName = state.user ? "" : $("guestName").value.trim();
  if (!state.user && !guestName) { toast("이름을 입력해주세요."); return; }
  if (!title) { toast("제목을 입력해주세요."); return; }
  if (!content) { toast("본문을 입력해주세요."); return; }
  const btn = $("submitBtn");
  btn.disabled = true;
  try {
    if (editingId !== null) {
      const r = await api(`${API}/${editingId}`, {
        method: "PATCH", json: { category, title, content },
      });
      if (r.ok) { toast("수정되었습니다."); go(`#voc/${editingId}`); }
      else toast(r.body.error || `수정에 실패했습니다 (HTTP ${r.status}).`);
      return;
    }
    const fd = new FormData();
    fd.append("category", category);
    fd.append("title", title);
    fd.append("content", content);
    if (guestName) fd.append("guest_name", guestName);
    selectedFiles.forEach(sf => fd.append("screenshots", sf.file));
    // Content-Type 은 브라우저가 boundary 포함 자동 설정 — 수동 지정 금지
    const r = await fetch(API, {
      method: "POST", headers: { "X-CSRF-Token": csrfToken() }, body: fd,
    });
    if (r.status === 201) {
      const body = await r.json();
      clearFiles();
      if (guestName) saveGuestName(guestName);
      toast("VOC 가 등록되었습니다.");
      go(`#voc/${body.id}`);
    } else {
      const body = await r.json().catch(() => ({}));
      toast(body.error || `등록에 실패했습니다 (HTTP ${r.status}).`);
    }
  } catch (e) {
    toast("요청에 실패했습니다 — 네트워크를 확인해주세요.");
  } finally {
    btn.disabled = false;
  }
});

// ══ 상세 ═══════════════════════════════════════════════════════════════════
async function openDetail(vocId) {
  const r = await api(`${API}/${vocId}`);
  if (!r.ok) { toast("삭제되었거나 없는 VOC 입니다."); go("#"); return; }
  detail = r.body;
  applyIdentity(detail);
  showView("viewDetail");
  renderDetail();
}

function renderDetail() {
  const voc = detail.voc;
  const isClose = voc.status === "close";
  $("detailCat").className = catClass(voc.category);
  $("detailCat").textContent = voc.category;
  $("detailStatus").className = `status-badge ${isClose ? "close" : "open"}`;
  $("detailStatus").textContent = isClose ? "Close" : "Open";
  $("detailTitle").textContent = voc.title;
  $("detailMeta").textContent = `#${voc.id} · ${voc.user_id}`
    + (voc.is_guest ? " (게스트)" : "") + ` · ${fmtTime(voc.created_at)}`;
  $("detailContent").textContent = voc.content;

  const thumbs = $("detailThumbs");
  thumbs.replaceChildren();
  for (const s of detail.screenshots) {
    const img = el("img");
    img.src = s.url;
    img.alt = "screenshot";
    img.loading = "lazy";
    img.addEventListener("click", () => openLightbox(s.url));
    thumbs.appendChild(img);
  }

  $("editBtn").hidden = !detail.can_edit;
  $("deleteBtn").hidden = !detail.can_delete;
  const statusBtn = $("statusBtn");
  statusBtn.hidden = !detail.is_admin;
  statusBtn.textContent = isClose ? "다시 열기" : "Close 처리";
  statusBtn.className = isClose ? "reopen-btn" : "close-btn";

  renderComments();
}

function renderComments() {
  const list = $("commentList");
  list.replaceChildren();
  $("commentTitle").textContent = `댓글 ${detail.comments.length}`;
  if (!detail.comments.length) {
    list.appendChild(el("div", "comment-empty",
                        "아직 댓글이 없습니다 — 첫 댓글을 남겨보세요."));
  }
  for (const c of detail.comments) {
    const item = el("div", "comment-item");
    const head = el("div", "comment-head");
    head.appendChild(el("span", "comment-user", c.user_id));
    if (c.is_guest) head.appendChild(el("span", "guest-badge", "guest"));
    head.appendChild(el("span", "comment-time", fmtTime(c.created_at)));
    head.appendChild(el("span", "spacer"));
    if (c.can_delete) {
      const del = el("button", "del-btn", "삭제");
      del.type = "button";
      del.addEventListener("click", () => deleteComment(c.id));
      head.appendChild(del);
    }
    item.append(head, el("div", "comment-body", c.content));
    list.appendChild(item);
  }
  // 댓글도 게스트 허용 — Honey 신원이 없으면 이름 칸을 띄운다
  const guest = !state.user;
  const nameEl = $("commentGuestName");
  nameEl.hidden = !guest;
  if (guest && !nameEl.value) nameEl.value = savedGuestName();
}

$("backBtn").addEventListener("click", () => go("#"));
$("editBtn").addEventListener("click", () => go(`#voc/${detail.voc.id}/edit`));

$("deleteBtn").addEventListener("click", async () => {
  if (!confirm(`이 VOC 를 삭제할까요?\n\n"${detail.voc.title}"`)) return;
  const r = await api(`${API}/${detail.voc.id}`, { method: "DELETE" });
  if (r.ok) { toast("삭제되었습니다."); go("#"); }
  else toast(r.body.error || `삭제에 실패했습니다 (HTTP ${r.status}).`);
});

$("statusBtn").addEventListener("click", async () => {
  const next = detail.voc.status === "close" ? "open" : "close";
  const r = await api(`${API}/${detail.voc.id}/status`, { method: "POST", json: { status: next } });
  if (!r.ok) { toast(r.body.error || `상태 변경에 실패했습니다 (HTTP ${r.status}).`); return; }
  toast(next === "close" ? "Close 처리했습니다." : "다시 열었습니다.");
  await openDetail(detail.voc.id);
});

$("commentBtn").addEventListener("click", async () => {
  const input = $("commentInput");
  const content = input.value.trim();
  const guestName = state.user ? "" : $("commentGuestName").value.trim();
  if (!state.user && !guestName) { toast("이름을 입력해주세요."); return; }
  if (!content) { toast("댓글을 입력해주세요."); return; }
  const btn = $("commentBtn");
  btn.disabled = true;
  try {
    const body = guestName ? { content, guest_name: guestName } : { content };
    const r = await api(`${API}/${detail.voc.id}/comments`, { method: "POST", json: body });
    if (r.ok) {
      input.value = "";
      if (guestName) saveGuestName(guestName);
      toast("댓글이 등록되었습니다.");
      await openDetail(detail.voc.id);
    } else {
      toast(r.body.error || `댓글 등록에 실패했습니다 (HTTP ${r.status}).`);
    }
  } finally {
    btn.disabled = false;
  }
});

async function deleteComment(commentId) {
  if (!confirm("이 댓글을 삭제할까요?")) return;
  const r = await api(`${API}/${detail.voc.id}/comments/${commentId}`, { method: "DELETE" });
  if (r.ok) { toast("댓글이 삭제되었습니다."); await openDetail(detail.voc.id); }
  else toast(r.body.error || `댓글 삭제에 실패했습니다 (HTTP ${r.status}).`);
}

route();
</script>
</body>
</html>
