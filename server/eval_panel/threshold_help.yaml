# /pe/eval Thresholds 탭 "자세히" 설명 — 통계를 처음 보는 사람이 읽어도 이해할 수 있게.
#
# 한 줄 요약의 정본은 thresholds.yaml 의 주석이다(rules_io.threshold_descriptions).
# 이 파일은 그 한 줄로는 부족한 **긴 설명**만 담는다 — 화면에서 접었다 펼 수 있다.
# 키가 여기 없으면 한 줄 요약만 보인다(빠져도 화면은 정상 동작).
#
# 각 항목 구조:
#   what   : 이 숫자가 무엇을 재는가 (비유 포함)
#   how    : 어떻게 계산되는가 (수식은 말로 풀어서)
#   effect : 값을 올리면 / 내리면 판정이 어떻게 달라지는가
#   tip    : 실무에서 만지는 요령·주의

cpk_warn:
  what: |
    Cpk 는 "이 측정이 규격(LSL~USL) 안에 얼마나 여유 있게 들어가 있나"를 하나의 숫자로 만든 값입니다.
    규격 폭이 도로 폭이고 측정 산포가 자동차 폭이라면, Cpk 는 "차가 차선 안에서 좌우로 얼마나 여유가
    있는가"에 해당합니다. 클수록 안전하고, 1.33 은 업계에서 오래 쓰인 "합격선" 관례값입니다.
  how: |
    평균에서 아래쪽 규격까지의 거리와 위쪽 규격까지의 거리를 각각 표준편차의 3배로 나눈 뒤,
    둘 중 **더 나쁜(작은) 쪽**을 씁니다. 즉 한쪽이라도 규격에 붙어 있으면 Cpk 는 작아집니다.
    Cpk = 1.33 이면 가까운 쪽 규격까지 표준편차 4개만큼 여유가 있다는 뜻입니다.
  effect: |
    이 값보다 Cpk 가 작으면 "공정능력 부족"으로 봅니다. 값을 **올리면**(예 1.5) 더 엄격해져
    이슈로 잡히는 항목이 늘고, **내리면**(예 1.0) 어지간해선 넘어가 이슈가 줄어듭니다.
  tip: |
    이 값은 코멘트 생성 여부(L6 저장 게이트)에도 함께 쓰입니다 — 낮추면 Issue Table 에 올라오는
    항목 자체가 줄어듭니다. 이론값/업계 관례라서 자동 보정(calibration) 대상이 아닙니다.

cpk_bad:
  what: |
    "여유가 없다" 를 넘어 **명백히 부적합**이라고 보는 Cpk 절대 하한선입니다. 1.0 은 가까운 쪽
    규격까지 표준편차 3개, 즉 이론상 불량률이 눈에 띄게 나오기 시작하는 지점입니다.
  how: |
    계산은 cpk_warn 과 같습니다. 다른 건 쓰임새뿐입니다 — 이 값 아래이면서 수율까지 낮으면
    다른 판정을 모두 제치고 CRITICAL 로 확정합니다(아래 cpk_trump_yield_floor 와 짝).
  effect: |
    올리면 CRITICAL 강제 조건이 헐거워져 CRITICAL 이 늘고, 내리면 정말 심한 것만 CRITICAL 이 됩니다.
  tip: |
    단독으로는 아무 일도 하지 않습니다. 반드시 cpk_trump_yield_floor 와 **둘 다** 만족해야
    CRITICAL 이 강제됩니다.

cpk_trump_yield_floor:
  what: |
    "Cpk 도 나쁜데 수율까지 이 정도로 낮으면 두말할 것 없다"고 볼 수율 기준선입니다(0.7 = 70%).
  how: |
    수율 = 1 − (그 항목·그 bin 의 fail 개수 ÷ 전체 측정 die 수).
  effect: |
    올리면(예 0.9) 웬만큼 수율이 빠져도 CRITICAL 로 확정되어 CRITICAL 이 늘고, 내리면 아주 심한
    경우만 확정됩니다.
  tip: |
    Cpk 조건(cpk_bad)과 **AND** 입니다. 둘 중 하나만 만족하면 강제 CRITICAL 은 걸리지 않고
    일반 판정 경로를 따릅니다.

gross_yield_bad:
  what: |
    "이 정도면 대량 불량"이라고 볼 수율 선입니다(0.5 = 50%).
  how: |
    수율 계산은 위와 같습니다. 이 선 아래면 GROSS_FAIL 룰이 발화합니다. 또한 측정값이 없는
    양불(PF) 항목은 Cpk 를 계산할 수 없으므로, 이 값 하나만으로 CRITICAL 로 올립니다.
  effect: |
    올리면 대량 불량 판정 범위가 넓어지고, 내리면 정말 반 이상 죽은 경우만 잡습니다.
  tip: |
    PF(양불) 항목에는 이 값이 사실상 유일한 심각도 판단 근거입니다.

outlier_sigma:
  what: |
    어떤 값을 "튀는 값(outlier)"으로 볼지 정하는 **감도 손잡이**입니다 — 중앙값에서 robust
    표준편차(σ)의 몇 배 밖이면 outlier 로 셀지의 배수입니다. 통계 교과서(Iglewicz-Hoaglin)의
    원 권장값은 3.5 이고, 현재 기본값은 **2.5** 입니다(2026-08-19 사용자 지시로 4.5 → 2.5).
    낮출수록 "조금만 벗어나도 튄 값" 으로 세므로 outlier 비율이 전반적으로 올라갑니다.
  how: |
    평균·표준편차 대신 중앙값과 중앙값 절대편차(MAD)를 쓰는 robust 방식입니다. 몇 개의 극단값이
    기준 자체를 흔들지 못하게 하려는 것입니다. 값이 중앙에서 robust σ 의 이 배수만큼 떨어지면
    outlier 로 봅니다.
  effect: |
    내리면 outlier 로 세는 점이 많아져 outlier 비율이 전반적으로 올라가고, 올리면 줄어듭니다.
  tip: |
    이 값은 signature 조건식에 직접 쓰이지 않고 **L2 feature 계산 단계**에서 쓰입니다. 즉 이 값을
    건드리면 outlier 관련 룰 전체의 입력이 한꺼번에 바뀝니다.
    종전에는 **BIMODALITY 게이트**와도 물려 있어서, 이 값을 낮추면 이봉 판정이 조용히
    죽는 부작용이 있었습니다(실제로 4.5 → 2.5 로 내렸을 때 발생). 2026-08-19 에 게이트가
    쓰는 컷을 `subpop_outlier_sigma` 로 **분리**해 그 결합을 끊었습니다 — 이제 이 값은
    화면·근거에 보이는 outlier 비율 전용이라 마음 놓고 조절해도 됩니다.

spec_margin_warn:
  what: |
    분포의 끝이 규격에 얼마나 가까운지를 표준편차 단위로 잰 여유입니다. 1.0 = 표준편차 1개만큼만
    남았다는 뜻으로, 사실상 규격에 붙어 있는 상태입니다.
  how: |
    (규격까지의 거리) ÷ (표준편차). 아래쪽·위쪽을 따로 계산합니다.
  effect: |
    올리면 "규격 근접" 판정이 넉넉하게 잡히고(경보 증가), 내리면 정말 붙은 것만 잡습니다.
  tip: |
    Cpk 와 재는 것이 비슷하지만, Cpk 는 양쪽 중 나쁜 쪽 하나로 접는 반면 이 값은 위/아래를
    따로 봅니다. 그래서 "한쪽 꼬리만 위험" 같은 방향성 판정에 씁니다.

mean_shift_warn:
  what: |
    분포의 중심이 규격 한가운데에서 한쪽으로 얼마나 치우쳤는지에 대한 기준입니다(0.30).
  how: |
    위쪽 여유와 아래쪽 여유의 차이를 두 여유의 합으로 나눈 값(−1 ~ +1, 0 이면 정확히 가운데).
    0.30 이면 한쪽으로 30% 쏠렸다는 뜻입니다.
  effect: |
    올리면 웬만한 쏠림은 넘어가고, 내리면 조금만 쏠려도 "센터링 필요" 코멘트가 붙습니다.
  tip: |
    위·아래 규격이 **둘 다 있어야** 계산됩니다. 한쪽만 있는 항목에서는 결측이 되어 이 룰이 발화하지
    않습니다(결측을 양호로 읽지 않기 위한 설계입니다).

skew_warn:
  what: |
    분포가 좌우 대칭이 아니라 한쪽으로 꼬리를 끌고 있는 정도(비대칭도)의 기준입니다.
  how: |
    좌우가 완전히 대칭이면 0, 오른쪽으로 꼬리가 길면 양수, 왼쪽이면 음수입니다. 부호를 무시하고
    크기만 비교합니다(조건식의 `abs`).
  effect: |
    내리면 조금만 비대칭해도 잡히고, 올리면 심하게 기울어야 잡힙니다.
  tip: |
    표본이 적으면 비대칭도는 매우 불안정합니다. 그래서 n_min 미만인 항목에서는 이 계열 룰이
    아예 비활성화됩니다.

kurtosis_warn:
  what: |
    분포의 꼬리가 정규분포보다 얼마나 두꺼운지(간헐적으로 크게 튀는 값이 얼마나 잦은지)의 기준입니다(10.0).
  how: |
    정규분포를 0 으로 놓은 초과첨도(excess kurtosis). 클수록 "평소엔 얌전한데 가끔 크게 튄다"는 뜻입니다.
  effect: |
    내리면 간헐 spike 경보가 늘고, 올리면 줄어듭니다.
  tip: |
    **이 값만으로는 발화하지 않습니다** — 아래 heavy_tail_mass_min/max 밴드와 AND 입니다.
    쓰는 룰은 USL_TAIL(상한 쪽 꼬리)과 LSL_TAIL(하한 쪽 꼬리) 둘이며 임계를 공유합니다.
    초과첨도는 4제곱이라 점 몇 개만 튀어도 치솟고(그건 outlier), 몸통이 갈라진 다봉에서도
    커집니다(그건 이봉). 2.0 → 8.0 → 10.0 으로 두 번 올렸습니다.

heavy_tail_mass_min:
  what: |
    "꼬리가 두껍다"고 부르려면 **꼬리에 최소 이만큼은 값이 있어야 한다**는 하한입니다(0.01 = 1%).
  how: |
    중앙값에서 robust 표준편차의 3배 밖에 있는 값의 비율(꼬리 질량)입니다.
    **방향별로 따로 셉니다**(2026-08-19) — 위쪽만 세면 USL_TAIL, 아래쪽만 세면 LSL_TAIL 의
    판정값이 됩니다. 양쪽이 모두 밴드에 들면 두 발화가 BIDIR_TAIL 하나로 합쳐집니다.
  effect: |
    올리면 "점 몇 개만 튄" 항목이 걸러지고, 내리면 그런 항목까지 heavy tail 로 잡힙니다.
  tip: |
    실측에서 꼬리 질량이 0.9% 뿐인데 초과첨도가 21.5 인 항목이 있었습니다 — 그건 꼬리가
    아니라 튄 점 몇 개(outlier)입니다. 진짜 heavy tail 항목의 질량은 1.55~1.89% 였습니다.

heavy_tail_mass_max:
  what: |
    반대로 **이보다 많으면 꼬리가 아니다**는 상한입니다(0.05 = 5%).
  how: |
    계산은 heavy_tail_mass_min 과 같습니다.
  effect: |
    내리면 "몸통이 벌어진" 항목이 heavy tail 에서 빠지고, 올리면 그런 것까지 포함됩니다.
  tip: |
    질량이 17% 인 항목이 초과첨도 112 로 잡힌 적이 있습니다 — 그건 꼬리가 아니라 분포가
    두 무리로 갈라진 것(이봉)이라 BIMODALITY·LOW_CPK 가 받아야 할 사례입니다.

tail_side_share_min:
  what: |
    두꺼운 꼬리가 **어느 쪽에 실렸는지** 가르는 기준입니다(0.2 = 20%).
    USL_TAIL(상한 쪽)과 LSL_TAIL(하한 쪽)을 나누는 손잡이입니다.
  how: |
    3σ 밖 값의 비율을 위/아래로 나눠 세고, 그중 그 방향이 가진 몫을 봅니다.
    한쪽으로만 뻗은 꼬리는 1.0/0.0, 위아래가 비슷하면 0.5/0.5 입니다.
    **얼마나 두꺼운가**(발화 여부)는 이 값이 아니라 heavy_tail_mass_min/max 밴드가 정합니다.
    밴드가 방향별 질량에 걸리게 된 뒤로(2026-08-19) 이 값은 **보조 조건**입니다 — 반대쪽에
    점 한둘이 섞였을 뿐인 경우를 여전히 한쪽 꼬리로 읽게 해 줍니다.
  effect: |
    내리면 반대쪽에 값이 조금만 있어도 "양쪽 꼬리"로 보아 BIDIR_TAIL 로 합쳐지고,
    올리면 어지간히 대칭이 아닌 한 한쪽 꼬리 룰만 뜹니다.
  tip: |
    두 방향이 **모두** 이 기준을 넘으면 USL_TAIL·LSL_TAIL 이 사라지고 BIDIR_TAIL 하나만
    남습니다 — 양방향으로 퍼진 분포는 한쪽 방향 조치로 해결되지 않기 때문입니다.

spot_fail_spread_max:
  what: |
    불량이 wafer 의 **좁은 한 곳에 뭉쳤는지** 판단하는 기준입니다(0.25).
    영역(가장자리·중앙 등)으로 설명되지 않는 국부 뭉침을 잡습니다.
    (2026-08-19 `spot_cluster_spread_max` 에서 개명 — 룰 SPOT_CLUSTER → SPOT_FAIL 과 함께)
  how: |
    불량 die 들의 무게중심에서 각 die 까지 거리의 평균(RMS)을 wafer 반경으로 나눈 값입니다.
    wafer 전면에 고루 흩어지면 약 0.6, 한 곳에 모여 있으면 0 에 가깝습니다.
  effect: |
    올리면 느슨하게 퍼진 것도 "뭉침"으로 잡히고, 내리면 아주 빽빽한 것만 잡습니다.
  tip: |
    위치·모양을 가리지 않습니다 — wafer 어디든, 동그랗든 길쭉하든 붙어 있으면 걸립니다.
    불량이 spatial_fail_count_min 개보다 적으면 우연히 몰릴 수 있어 판정하지 않습니다.
    RING_FAIL 이 **같은 값의 반대쪽 조건**(이 값보다 크게 퍼졌을 때만)을 함께 쓰므로,
    이 값을 옮기면 두 룰의 경계가 같이 움직입니다.
    ⚠ 중심부 뭉침에서는 CENTER_FAIL 과 함께 뜨는데, 그럴 때 SPOT_FAIL 은 목록에서 빠지고
    CENTER_FAIL 만 보입니다(같은 사실을 두 번 말하지 않기 위한 장치).

outlier_fail_mad_min:
  what: |
    fail 한 die 가 정상 무리의 중심에서 **얼마나 멀리** 떨어져 있어야 outlier 로 볼지의
    기준입니다(4 = MAD 의 4배). OUTLIER 두 조건 중 첫째입니다.
  how: |
    fail 들 중 **중심에 가장 가까운 것**이 중앙값에서 MAD(중앙값 절대편차)의 몇 배 밖에
    있는지를 봅니다. 보통의 표준편차를 쓰지 않는 이유는, 멀리 튄 값이 스스로 표준편차를
    키워 자기 자신을 가려버리기 때문입니다(중앙값·MAD 는 표본 절반이 오염돼도 안 흔들립니다).
  effect: |
    내리면 규격 근처에서 떨어진 fail 까지 후보가 되고, 올리면 정말 멀리 나간 것만 남습니다.
  tip: |
    이 값만으로는 판정하지 않습니다 — 아래 outlier_fail_gap_sigma_min 과 **둘 다** 넘어야
    발화합니다. 거리만 보면 "꼬리가 길어 규격을 넘은 것"(HEAVY_TAIL)까지 outlier 로 잡힙니다.

outlier_fail_gap_sigma_min:
  what: |
    정상 무리의 끝과 첫 fail 사이가 **얼마나 비어 있어야** outlier 로 볼지의 기준입니다(1.5).
    OUTLIER 두 조건 중 둘째이며, 이것이 "꼬리"와 "따로 논 die"를 가릅니다.
  how: |
    (중심에서 가장 가까운 fail 까지의 거리) − (가장 먼 pass 까지의 거리)를 robust 표준편차
    단위로 잽니다. 값이 크면 정상 무리와 fail 사이에 아무 값도 없다는 뜻입니다.
  effect: |
    내리면 꼬리가 이어진 항목까지 outlier 로 잡히고, 올리면 확실히 끊긴 것만 잡습니다.
  tip: |
    거리 하나로는 못 가릅니다 — 실측에서 4.5배 더 멀리 나간 항목이 오히려 "꼬리가 두꺼운
    것"(HEAVY_TAIL)이었고, 더 가까운 항목이 outlier 였습니다. 꼬리가 중심에서 규격까지
    이어져 넘어갔으면 이 값이 0 에 가깝고, 뚝 떨어져 나갔으면 커집니다.

region_fail_share_min:
  what: |
    "불량이 한 영역에 몰렸다"고 부르기 위한 **점유율** 기준입니다(0.95 = 전체 fail 의 95%).
  how: |
    전체 fail 개수 중 그 영역(E1/EDGE/CENTER/RING)에 있는 fail 개수의 비율입니다.
  effect: |
    내리면 공간 룰(E1_FAIL·EDGE_FAIL·CENTER_FAIL·RING_FAIL)이 쉽게 발화하고, 올리면
    사실상 전부 그 영역일 때만 발화합니다. 네 룰이 이 값 하나를 공유합니다.
  tip: |
    종전에는 "영역 불량률 ÷ 전체 불량률"(밀도 배수)로 판정했는데, 영역이 좁을수록 값이 쉽게
    커지고 영역마다 도달 가능한 최댓값이 달라(edge≈2.8, center≈11, ring≈1.8) 임계값을 공유할
    수 없었습니다. ring 은 최댓값이 임계 아래라 아예 발화하지 못했습니다.

bimodality_warn:
  what: |
    분포가 봉우리 하나가 아니라 **두 무리로 갈라져** 보이는 정도의 기준입니다(0.555 = 5/9, 권장값).
  how: |
    Sarle 의 이봉성 계수. 완전한 정규분포는 약 0.33, 두 무리로 뚜렷이 갈라지면 0.555 를 넘습니다.
  effect: |
    내리면 이봉 판정이 늘고(로트 혼입·조건 이원화 의심 코멘트 증가), 올리면 줄어듭니다.
  tip: |
    이 값 하나만으로 이봉이라고 단정하지 않습니다 — 아래 subpop_* 값들과 함께 여러 조건을 모두
    통과해야 BIMODALITY 가 발화합니다.

n_min:
  what: |
    "이보다 표본이 적으면 고급 통계는 믿지 않는다"는 최소 표본 수입니다(20개).
  how: |
    측정에 성공한 die 개수(n_dut)와 비교합니다.
  effect: |
    올리면 소표본에서 나오는 불안정한 판정이 줄지만 그만큼 미탐이 늘고, 내리면 반대입니다.
  tip: |
    이 값 미만이면 비대칭도·첨도·이봉성에 의존하는 룰이 **통째로 비활성**됩니다(조건이 거짓이
    되는 게 아니라 평가 자체를 건너뜁니다). 트레이스 화면에 "min-n 가드"로 표시됩니다.

edge_region_pct:
  what: |
    웨이퍼에서 어디부터를 "가장자리(edge)"로 볼지 정하는 경계입니다(0.8 = 바깥 20%).
  how: |
    웨이퍼 중심에서의 거리를 0~1 로 정규화한 뒤, 이 값보다 바깥에 있는 die 를 edge 로 셉니다.
  effect: |
    내리면 edge 로 세는 영역이 넓어져 edge 집중 판정이 둔해지고, 올리면 가장 바깥 테두리만 봅니다.
  tip: |
    영역을 나누는 정의값이라 signature 조건식에 직접 등장하지 않습니다. 공간 관련 룰 전체의
    계산 전제가 바뀝니다.

center_region_pct:
  what: |
    웨이퍼에서 어디까지를 "중심부"로 볼지 정하는 경계입니다(0.3 = 안쪽 30%).
  how: |
    edge_region_pct 와 같은 방식으로, 이 값보다 안쪽에 있는 die 를 center 로 셉니다.
  effect: |
    올리면 중심부로 세는 영역이 넓어지고, 내리면 정중앙만 봅니다.
  tip: |
    edge 와 center 사이 구간이 ring(중간 반경)이 됩니다 — 세 값이 서로 맞물려 있습니다.

spatial_fail_count_min:
  what: |
    공간 패턴(가장자리·중심·ring·뭉침) 룰을 적용하기 위한 **최소 불량 개수**입니다(10개).
  how: |
    그 항목·그 bin 의 fail 개수와 비교합니다.
  effect: |
    올리면 불량이 몇 개뿐인데 "패턴이다" 라고 말하는 오탐이 줄고, 내리면 민감해집니다.
  tip: |
    불량이 3개면 어디에 찍혀도 "몰려 있는 것처럼" 보입니다. 그 착시를 막는 안전장치입니다.

site_cpk_delta_warn:
  what: |
    같은 항목을 여러 test site(측정 자리)에서 쟀을 때 site 사이 Cpk 차이의 기준입니다.
  how: |
    site 별 Cpk 중 최대와 최소의 차이.
  effect: |
    내리면 장비/site 의심 경보가 늘고, 올리면 줄어듭니다.
  tip: |
    site 정보가 없는 데이터에서는 계산되지 않아 이 룰이 발화하지 않습니다.

code_edge_hit_warn:
  what: |
    CODE/TRIM 값이 조정 범위의 **끝(최소·최대)** 에 달라붙은 비율의 기준입니다(0.05 = 5%).
  how: |
    측정값이 가능한 최소값 또는 최대값과 같은 die 의 비율.
  effect: |
    내리면 "trim 범위가 모자란다" 는 경보가 늘고, 올리면 줄어듭니다.
  tip: |
    단위가 CODE 로 분류된 항목에서만 계산됩니다. 다른 항목에서는 결측이라 발화하지 않습니다.

subpop_outlier_sigma:
  what: |
    이봉(BIMODALITY) 판정을 **시도할지 말지** 정하는 문지기가 쓰는 outlier 컷입니다(4.5).
    화면에 보이는 outlier_sigma 와 **이름은 비슷하지만 목적이 다릅니다**.
  how: |
    계산 방식은 outlier_sigma 와 같습니다(중앙값에서 robust σ 의 몇 배 밖인가). 이 컷으로
    센 비율이 아래 subpop_outlier_ratio_max 를 넘으면 "두 무리가 아니라 산발" 로 보고
    무리 판정을 보류합니다.
  effect: |
    올리면 웬만큼 튀는 값이 있어도 이봉 판정을 시도하고, 내리면 아주 깨끗한 분포에서만 합니다.
  tip: |
    왜 키를 따로 두었나 — outlier_sigma 는 "튄 값을 얼마나 보여줄까"(표시 감도)이고 이쪽은
    "산발이라 이봉으로 못 볼 정도인가"(판정 게이트)입니다. 하나로 묶여 있던 시절에는 표시
    감도를 내렸을 뿐인데 이봉 발화가 통째로 사라졌습니다(2026-08-19 분리).

subpop_n_min:
  what: |
    분포가 두 무리로 갈라졌는지 판정하려면 최소 몇 개의 표본이 필요한지입니다(50개).
  how: |
    측정 die 개수와 비교하며, 미만이면 **판정 자체를 보류**합니다(무리 판정 결과가 아예 없음).
  effect: |
    올리면 신중해지고(미탐 증가), 내리면 적은 표본으로도 이봉 판정을 시도합니다(오탐 증가).

subpop_outlier_ratio_max:
  what: |
    "이건 두 무리가 아니라 그냥 산발적으로 튀는 것" 이라고 볼 outlier 비율 상한입니다(0.15 = 15%).
  how: |
    위 subpop_outlier_sigma 로 센 outlier 비율이 이 값 이상이면 무리 판정을 보류합니다.
  effect: |
    올리면 튀는 값이 좀 있어도 이봉 판정을 시도하고, 내리면 아주 깨끗한 분포에서만 판정합니다.
  tip: |
    "소수 무리"와 "산발 outlier" 는 눈으로도 헷갈립니다. 이 값이 그 둘을 가르는 문지기입니다.
    3% → 15% 로 완화했습니다(2026-08-19) — **몸통에서 떨어져 나간 무리는 그 자체가
    outlier 로도 세어지기 때문**에, 3% 로는 "떨어진 이봉" 이 구조적으로 전부 막혔습니다.

subpop_density_gap_warn:
  what: |
    두 봉우리 사이가 얼마나 **비어 있는지**(골이 깊은지)의 약한 기준입니다(0.3).
  how: |
    봉우리 높이 대비 골 깊이의 비율. 0 이면 골이 없고(한 무리), 1 에 가까울수록 완전히 갈라진 것입니다.
  effect: |
    내리면 얕은 골도 이봉으로 보고, 올리면 뚜렷한 골만 인정합니다.

subpop_density_gap_strong:
  what: |
    "완전히 분리(separated)" 판정에 쓰는 골 깊이 기준입니다(0.20).
  how: |
    계산은 위와 같습니다. 단독으로 쓰이지 않고 값 축 빈 구간(subpop_value_gap_warn)·소수쪽
    질량(subpop_minor_mass_min)과 **모두 충족**해야 분리로 봅니다.
  effect: |
    내리면 "완전 분리" 판정이 늘고, 올리면 줄어듭니다.
  tip: |
    ⚠ 이름은 "strong" 이지만 값이 위 density_gap_warn(0.3)보다 **작습니다**. 두 값은 강약
    서열이 아니라 서로 다른 판정의 컷입니다 — warn 은 "봉우리가 둘인가"(이봉/다봉),
    이쪽은 "값 축이 끊겼는가"(분리)입니다. 소수 무리가 떨어져 나간 모양은 히스토그램 골이
    얕게 나오므로, warn 보다 낮아야 실제로 잡힙니다(0.5 → 0.20, 2026-08-19).
    **분리 판정의 오탐을 실제로 막는 것은 이 값**입니다 — 아래 minor_mass 가 아닙니다.

subpop_value_gap_warn:
  what: |
    값 축에서 **아무 데이터도 없는 빈 구간**이 전체 범위의 몇 %나 되는지의 기준입니다(0.3 = 30%).
  how: |
    측정값을 크기순으로 늘어놓고 이웃한 값 사이 간격 중 가장 큰 것을 전체 범위로 나눕니다.
  effect: |
    내리면 작은 틈도 분리로 보고, 올리면 확실히 끊긴 것만 봅니다.
  tip: |
    2026-08-03 부터 "완전 분리" 판정 기준이 동일값 질량(cdf_gap)에서 이 값(값 축 빈 구간)으로
    바뀌었습니다. 눈으로 보는 "끊김"과 훨씬 잘 맞습니다.

subpop_minor_mass_min:
  what: |
    빈 구간 양쪽으로 갈린 두 무리 중 **작은 쪽**이 최소한 이만큼은 되어야 무리로 인정한다는 기준입니다
    (0.05 = 5%).
  how: |
    작은 쪽 무리에 속한 die 비율.
  effect: |
    올리면 극소수 점 몇 개를 "무리" 로 부르는 오탐이 줄고, 내리면 민감해집니다.
  tip: |
    5% → 0.03%(0.0003)로 크게 낮췄습니다(2026-08-19 사용자 지시). 솔직히 적자면 **이 하한은
    사실상 꺼진 상태**이고, 오탐을 막는 일은 위 subpop_density_gap_strong 이 합니다.
    되돌릴 때는 둘을 함께 보세요 — 이 값만 올리면 "떨어져 나간 소수 무리" 유형이 다시
    통째로 막힙니다.

source_min_count:
  what: |
    소스(웨이퍼/로트 파일) 간 비교를 하기 위한 최소 소스 개수입니다.
  how: |
    비교 대상 소스 수와 비교합니다.
  effect: |
    현재 운영 평가 경로(evaluate)에서는 쓰이지 않습니다 — 소스 간 비교 기능 전용입니다.

source_fail_rate_delta_warn:
  what: |
    소스 사이 불량률 격차의 기준입니다.
  how: |
    소스별 불량률의 최대−최소 차이.
  effect: |
    현재 운영 평가 경로(evaluate)에서는 쓰이지 않습니다 — 소스 간 비교 기능 전용입니다.
