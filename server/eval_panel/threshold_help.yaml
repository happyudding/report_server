# /pe/eval Thresholds 탭 "자세히" 설명 — 통계를 처음 보는 사람이 읽어도 이해할 수 있게.
#
# 한 줄 요약의 정본은 thresholds.yaml 의 주석이다(rules_io.threshold_descriptions).
# 이 파일은 그 한 줄로는 부족한 **긴 설명**만 담는다 — 화면에서 접었다 펼 수 있다.
# 키가 여기 없으면 한 줄 요약만 보인다(빠져도 화면은 정상 동작).
#
# 각 항목 구조:
#   what   : 이 숫자가 무엇을 재는가 (비유 포함)
#   how    : 어떻게 계산되는가 (수식은 말로 풀어서)
#   effect : 값을 올리면 / 내리면 판정이 어떻게 달라지는가
#   tip    : 실무에서 만지는 요령·주의

cpk_warn:
  what: |
    Cpk 는 "이 측정이 규격(LSL~USL) 안에 얼마나 여유 있게 들어가 있나"를 하나의 숫자로 만든 값입니다.
    규격 폭이 도로 폭이고 측정 산포가 자동차 폭이라면, Cpk 는 "차가 차선 안에서 좌우로 얼마나 여유가
    있는가"에 해당합니다. 클수록 안전하고, 1.33 은 업계에서 오래 쓰인 "합격선" 관례값입니다.
  how: |
    평균에서 아래쪽 규격까지의 거리와 위쪽 규격까지의 거리를 각각 표준편차의 3배로 나눈 뒤,
    둘 중 **더 나쁜(작은) 쪽**을 씁니다. 즉 한쪽이라도 규격에 붙어 있으면 Cpk 는 작아집니다.
    Cpk = 1.33 이면 가까운 쪽 규격까지 표준편차 4개만큼 여유가 있다는 뜻입니다.
  effect: |
    이 값보다 Cpk 가 작으면 "공정능력 부족"으로 봅니다. 값을 **올리면**(예 1.5) 더 엄격해져
    이슈로 잡히는 항목이 늘고, **내리면**(예 1.0) 어지간해선 넘어가 이슈가 줄어듭니다.
  tip: |
    이 값은 코멘트 생성 여부(L6 저장 게이트)에도 함께 쓰입니다 — 낮추면 Issue Table 에 올라오는
    항목 자체가 줄어듭니다. 이론값/업계 관례라서 자동 보정(calibration) 대상이 아닙니다.

cpk_bad:
  what: |
    "여유가 없다" 를 넘어 **명백히 부적합**이라고 보는 Cpk 절대 하한선입니다. 1.0 은 가까운 쪽
    규격까지 표준편차 3개, 즉 이론상 불량률이 눈에 띄게 나오기 시작하는 지점입니다.
  how: |
    계산은 cpk_warn 과 같습니다. 다른 건 쓰임새뿐입니다 — 이 값 아래이면서 수율까지 낮으면
    다른 판정을 모두 제치고 CRITICAL 로 확정합니다(아래 cpk_trump_yield_floor 와 짝).
  effect: |
    올리면 CRITICAL 강제 조건이 헐거워져 CRITICAL 이 늘고, 내리면 정말 심한 것만 CRITICAL 이 됩니다.
  tip: |
    단독으로는 아무 일도 하지 않습니다. 반드시 cpk_trump_yield_floor 와 **둘 다** 만족해야
    CRITICAL 이 강제됩니다.

cpk_trump_yield_floor:
  what: |
    "Cpk 도 나쁜데 수율까지 이 정도로 낮으면 두말할 것 없다"고 볼 수율 기준선입니다(0.7 = 70%).
  how: |
    수율 = 1 − (그 항목·그 bin 의 fail 개수 ÷ 전체 측정 die 수).
  effect: |
    올리면(예 0.9) 웬만큼 수율이 빠져도 CRITICAL 로 확정되어 CRITICAL 이 늘고, 내리면 아주 심한
    경우만 확정됩니다.
  tip: |
    Cpk 조건(cpk_bad)과 **AND** 입니다. 둘 중 하나만 만족하면 강제 CRITICAL 은 걸리지 않고
    일반 판정 경로를 따릅니다.

gross_yield_bad:
  what: |
    "이 정도면 대량 불량"이라고 볼 수율 선입니다(0.5 = 50%).
  how: |
    수율 계산은 위와 같습니다. 이 선 아래면 GROSS_FAIL 룰이 발화합니다. 또한 측정값이 없는
    양불(PF) 항목은 Cpk 를 계산할 수 없으므로, 이 값 하나만으로 CRITICAL 로 올립니다.
  effect: |
    올리면 대량 불량 판정 범위가 넓어지고, 내리면 정말 반 이상 죽은 경우만 잡습니다.
  tip: |
    PF(양불) 항목에는 이 값이 사실상 유일한 심각도 판단 근거입니다.

outlier_ratio_warn:
  what: |
    outlier(튀는 die)가 전체의 몇 %나 되는지에 대한 **주의** 기준입니다(0.02 = 2%).
    "대부분은 멀쩡한데 몇 개가 뜬금없이 다른 값" 인 상태를 잡습니다.
  how: |
    각 측정값이 중앙값에서 얼마나 떨어졌는지를 outlier_sigma 기준으로 재서 그 선을 넘으면
    outlier 로 셉니다. outlier 개수 ÷ 전체 개수 = outlier_ratio.
  effect: |
    올리면 어지간히 튀어도 넘어가고, 내리면 몇 개만 튀어도 주의 코멘트가 붙습니다.
  tip: |
    이 값은 실측 분포에서 자동 보정(calibration)되는 대상입니다 — 손으로 고쳐도 보정을 돌리면
    덮어써질 수 있습니다.

outlier_ratio_bad:
  what: |
    같은 outlier 비율이지만 **심각** 수준의 선입니다(0.05 = 5%).
  how: |
    계산은 outlier_ratio_warn 과 같고, 이 룰은 "비율도 높고 **개수도** 일정 수 이상"일 때만
    발화합니다(severe_outlier_count_min 과 AND).
  effect: |
    올리면 심각 판정이 줄고, 내리면 늘어납니다.
  tip: |
    표본이 20개뿐이면 1개만 튀어도 5% 입니다. 그래서 개수 조건을 함께 걸어 소표본 오탐을 막습니다.

severe_outlier_count_min:
  what: |
    "비율만 높은 게 아니라 실제로 이 개수 이상 튀어야 심각으로 본다"는 최소 개수입니다.
  how: |
    outlier 로 센 die 의 **개수**를 그대로 비교합니다.
  effect: |
    올리면 소표본에서 나오는 과잉 경보가 줄고, 내리면 작은 로트에서도 심각 판정이 뜹니다.
  tip: |
    표본이 작은 평가(웨이퍼 1장, 소량 die)에서 특히 효과가 큽니다.

outlier_sigma:
  what: |
    어떤 값을 "튀는 값(outlier)"으로 볼지 정하는 **감도 손잡이**입니다 — 중앙값에서 robust
    표준편차(σ)의 몇 배 밖이면 outlier 로 셀지의 배수입니다. 통계 교과서(Iglewicz-Hoaglin)의
    원 권장값은 3.5 이지만, 반도체 측정 데이터는 꼬리가 두껍고 값이 띄엄띄엄(이산)이라 3.5 로는
    과검출 경향이 있어 기본값을 4.5 로 완화했습니다.
  how: |
    평균·표준편차 대신 중앙값과 중앙값 절대편차(MAD)를 쓰는 robust 방식입니다. 몇 개의 극단값이
    기준 자체를 흔들지 못하게 하려는 것입니다. 값이 중앙에서 robust σ 의 이 배수만큼 떨어지면
    outlier 로 봅니다.
  effect: |
    내리면(예 3.5) outlier 로 세는 점이 많아져 outlier 비율이 전반적으로 올라가고, 올리면 줄어듭니다.
  tip: |
    자동차 반도체 표준(AEC-Q001 PAT)의 관행은 ±6 robust σ 라 여기서 더 완화할 여지도 있습니다.
    이 값은 signature 조건식에 직접 쓰이지 않고 **L2 feature 계산 단계**에서 쓰입니다. 즉 이 값을
    건드리면 outlier 관련 룰 전체의 입력이 한꺼번에 바뀝니다.

spread_norm_warn:
  what: |
    산포(값이 얼마나 퍼져 있나)가 **규격 폭 대비** 얼마나 넓은지에 대한 기준입니다(0.18 = 18%).
  how: |
    robust 표준편차 ÷ (USL − LSL). 규격 폭이 100 인데 산포가 18 이면 0.18 입니다.
  effect: |
    올리면 어지간히 퍼져도 넘어가고, 내리면 조금만 퍼져도 "산포 넓음"으로 잡습니다.
  tip: |
    SPEC_TOO_TIGHT 룰에서는 반대로 **이 값보다 좁을 때**(산포는 멀쩡한데 Cpk 가 낮을 때)를
    찾는 데 씁니다. 그래서 이 값을 내리면 "산포 넓음" 은 늘고 "spec 이 빡빡함" 은 줄어듭니다.

spec_margin_warn:
  what: |
    분포의 끝이 규격에 얼마나 가까운지를 표준편차 단위로 잰 여유입니다. 1.0 = 표준편차 1개만큼만
    남았다는 뜻으로, 사실상 규격에 붙어 있는 상태입니다.
  how: |
    (규격까지의 거리) ÷ (표준편차). 아래쪽·위쪽을 따로 계산합니다.
  effect: |
    올리면 "규격 근접" 판정이 넉넉하게 잡히고(경보 증가), 내리면 정말 붙은 것만 잡습니다.
  tip: |
    Cpk 와 재는 것이 비슷하지만, Cpk 는 양쪽 중 나쁜 쪽 하나로 접는 반면 이 값은 위/아래를
    따로 봅니다. 그래서 "한쪽 꼬리만 위험" 같은 방향성 판정에 씁니다.

mean_shift_warn:
  what: |
    분포의 중심이 규격 한가운데에서 한쪽으로 얼마나 치우쳤는지에 대한 기준입니다(0.30).
  how: |
    위쪽 여유와 아래쪽 여유의 차이를 두 여유의 합으로 나눈 값(−1 ~ +1, 0 이면 정확히 가운데).
    0.30 이면 한쪽으로 30% 쏠렸다는 뜻입니다.
  effect: |
    올리면 웬만한 쏠림은 넘어가고, 내리면 조금만 쏠려도 "센터링 필요" 코멘트가 붙습니다.
  tip: |
    위·아래 규격이 **둘 다 있어야** 계산됩니다. 한쪽만 있는 항목에서는 결측이 되어 이 룰이 발화하지
    않습니다(결측을 양호로 읽지 않기 위한 설계입니다).

skew_warn:
  what: |
    분포가 좌우 대칭이 아니라 한쪽으로 꼬리를 끌고 있는 정도(비대칭도)의 기준입니다.
  how: |
    좌우가 완전히 대칭이면 0, 오른쪽으로 꼬리가 길면 양수, 왼쪽이면 음수입니다. 부호를 무시하고
    크기만 비교합니다(조건식의 `abs`).
  effect: |
    내리면 조금만 비대칭해도 잡히고, 올리면 심하게 기울어야 잡힙니다.
  tip: |
    표본이 적으면 비대칭도는 매우 불안정합니다. 그래서 n_min 미만인 항목에서는 이 계열 룰이
    아예 비활성화됩니다.

kurtosis_warn:
  what: |
    분포의 꼬리가 정규분포보다 얼마나 두꺼운지(간헐적으로 크게 튀는 값이 얼마나 잦은지)의 기준입니다.
  how: |
    정규분포를 0 으로 놓은 초과첨도(excess kurtosis). 클수록 "평소엔 얌전한데 가끔 크게 튄다"는 뜻입니다.
  effect: |
    내리면 간헐 spike 경보가 늘고, 올리면 줄어듭니다.
  tip: |
    비대칭도와 마찬가지로 소표본에서 불안정해 n_min 가드의 적용을 받습니다.

bimodality_warn:
  what: |
    분포가 봉우리 하나가 아니라 **두 무리로 갈라져** 보이는 정도의 기준입니다(0.555 = 5/9, 권장값).
  how: |
    Sarle 의 이봉성 계수. 완전한 정규분포는 약 0.33, 두 무리로 뚜렷이 갈라지면 0.555 를 넘습니다.
  effect: |
    내리면 이봉 판정이 늘고(로트 혼입·조건 이원화 의심 코멘트 증가), 올리면 줄어듭니다.
  tip: |
    이 값 하나만으로 이봉이라고 단정하지 않습니다 — 아래 subpop_* 값들과 함께 여러 조건을 모두
    통과해야 SUBPOP_GAP 이 발화합니다.

n_min:
  what: |
    "이보다 표본이 적으면 고급 통계는 믿지 않는다"는 최소 표본 수입니다(20개).
  how: |
    측정에 성공한 die 개수(n_dut)와 비교합니다.
  effect: |
    올리면 소표본에서 나오는 불안정한 판정이 줄지만 그만큼 미탐이 늘고, 내리면 반대입니다.
  tip: |
    이 값 미만이면 비대칭도·첨도·이봉성에 의존하는 룰이 **통째로 비활성**됩니다(조건이 거짓이
    되는 게 아니라 평가 자체를 건너뜁니다). 트레이스 화면에 "min-n 가드"로 표시됩니다.

edge_region_pct:
  what: |
    웨이퍼에서 어디부터를 "가장자리(edge)"로 볼지 정하는 경계입니다(0.8 = 바깥 20%).
  how: |
    웨이퍼 중심에서의 거리를 0~1 로 정규화한 뒤, 이 값보다 바깥에 있는 die 를 edge 로 셉니다.
  effect: |
    내리면 edge 로 세는 영역이 넓어져 edge 집중 판정이 둔해지고, 올리면 가장 바깥 테두리만 봅니다.
  tip: |
    영역을 나누는 정의값이라 signature 조건식에 직접 등장하지 않습니다. 공간 관련 룰 전체의
    계산 전제가 바뀝니다.

center_region_pct:
  what: |
    웨이퍼에서 어디까지를 "중심부"로 볼지 정하는 경계입니다(0.3 = 안쪽 30%).
  how: |
    edge_region_pct 와 같은 방식으로, 이 값보다 안쪽에 있는 die 를 center 로 셉니다.
  effect: |
    올리면 중심부로 세는 영역이 넓어지고, 내리면 정중앙만 봅니다.
  tip: |
    edge 와 center 사이 구간이 ring(중간 반경)이 됩니다 — 세 값이 서로 맞물려 있습니다.

edge_fail_ratio_warn:
  what: |
    "가장자리에 불량이 몰렸다"고 볼 배수입니다(2.0 = 평균보다 2배 몰림).
  how: |
    edge 영역의 불량률 ÷ 전체 불량률. 고르게 퍼져 있으면 1 근처, edge 에 몰리면 커집니다.
  effect: |
    내리면 약한 쏠림도 잡히고, 올리면 확실히 몰린 것만 잡습니다.
  tip: |
    같은 값이 중심부 집중(CENTER_FAIL) 판정에도 재사용됩니다.

ring_fail_ratio_warn:
  what: |
    가장자리도 중심도 아닌 **중간 반경 띠(ring)** 에 불량이 몰린 정도의 기준입니다.
  how: |
    ring 영역 불량률 ÷ 전체 불량률.
  effect: |
    내리면 ring 성 패턴 경보가 늘고, 올리면 줄어듭니다.
  tip: |
    ring 패턴은 반경 방향 공정 편차(uniformity)를 의심하게 하는 신호입니다.

quadrant_imbalance_warn:
  what: |
    웨이퍼를 4등분했을 때 특정 사분면에만 불량이 몰린 정도의 기준입니다.
  how: |
    (사분면 불량률 최대 − 최소) ÷ 평균. 네 구역이 고르면 0 에 가깝습니다.
  effect: |
    내리면 국부 결함·스크래치 의심 경보가 늘고, 올리면 줄어듭니다.

gradient_norm_warn:
  what: |
    웨이퍼 한쪽에서 반대쪽으로 값이 **기울어지는** 세기의 기준입니다(0.3).
  how: |
    X 방향·Y 방향·반경 방향으로 값이 변해가는 기울기를 각각 정규화해 계산하고, 그중 절대값이
    가장 큰 것을 씁니다.
  effect: |
    내리면 약한 경사도 잡히고, 올리면 확실한 경사만 잡습니다.

spatial_fail_count_min:
  what: |
    공간 패턴(가장자리·중심·ring·경사) 룰을 적용하기 위한 **최소 불량 개수**입니다(5개).
  how: |
    그 항목·그 bin 의 fail 개수와 비교합니다.
  effect: |
    올리면 불량이 몇 개뿐인데 "패턴이다" 라고 말하는 오탐이 줄고, 내리면 민감해집니다.
  tip: |
    불량이 3개면 어디에 찍혀도 "몰려 있는 것처럼" 보입니다. 그 착시를 막는 안전장치입니다.

site_cpk_delta_warn:
  what: |
    같은 항목을 여러 test site(측정 자리)에서 쟀을 때 site 사이 Cpk 차이의 기준입니다.
  how: |
    site 별 Cpk 중 최대와 최소의 차이.
  effect: |
    내리면 장비/site 의심 경보가 늘고, 올리면 줄어듭니다.
  tip: |
    site 정보가 없는 데이터에서는 계산되지 않아 이 룰이 발화하지 않습니다.

code_edge_hit_warn:
  what: |
    CODE/TRIM 값이 조정 범위의 **끝(최소·최대)** 에 달라붙은 비율의 기준입니다(0.05 = 5%).
  how: |
    측정값이 가능한 최소값 또는 최대값과 같은 die 의 비율.
  effect: |
    내리면 "trim 범위가 모자란다" 는 경보가 늘고, 올리면 줄어듭니다.
  tip: |
    단위가 CODE 로 분류된 항목에서만 계산됩니다. 다른 항목에서는 결측이라 발화하지 않습니다.

subpop_n_min:
  what: |
    분포가 두 무리로 갈라졌는지 판정하려면 최소 몇 개의 표본이 필요한지입니다(50개).
  how: |
    측정 die 개수와 비교하며, 미만이면 **판정 자체를 보류**합니다(무리 판정 결과가 아예 없음).
  effect: |
    올리면 신중해지고(미탐 증가), 내리면 적은 표본으로도 이봉 판정을 시도합니다(오탐 증가).

subpop_outlier_ratio_max:
  what: |
    "이건 두 무리가 아니라 그냥 산발적으로 튀는 것" 이라고 볼 outlier 비율 상한입니다(0.03 = 3%).
  how: |
    outlier 비율이 이 값 이상이면 무리 판정을 하지 않고 보류합니다.
  effect: |
    올리면 튀는 값이 좀 있어도 이봉 판정을 시도하고, 내리면 아주 깨끗한 분포에서만 판정합니다.
  tip: |
    "소수 무리"와 "산발 outlier" 는 눈으로도 헷갈립니다. 이 값이 그 둘을 가르는 문지기입니다.

subpop_density_gap_warn:
  what: |
    두 봉우리 사이가 얼마나 **비어 있는지**(골이 깊은지)의 약한 기준입니다(0.3).
  how: |
    봉우리 높이 대비 골 깊이의 비율. 0 이면 골이 없고(한 무리), 1 에 가까울수록 완전히 갈라진 것입니다.
  effect: |
    내리면 얕은 골도 이봉으로 보고, 올리면 뚜렷한 골만 인정합니다.

subpop_density_gap_strong:
  what: |
    같은 골 깊이지만 "완전히 분리(separated)" 라고 부를 만한 강한 기준입니다(0.5).
  how: |
    계산은 위와 같고, 이 선을 넘으면 더 심각한 분리 상태로 분류합니다.
  effect: |
    내리면 "완전 분리" 판정이 늘고, 올리면 줄어듭니다.

subpop_value_gap_warn:
  what: |
    값 축에서 **아무 데이터도 없는 빈 구간**이 전체 범위의 몇 %나 되는지의 기준입니다(0.3 = 30%).
  how: |
    측정값을 크기순으로 늘어놓고 이웃한 값 사이 간격 중 가장 큰 것을 전체 범위로 나눕니다.
  effect: |
    내리면 작은 틈도 분리로 보고, 올리면 확실히 끊긴 것만 봅니다.
  tip: |
    2026-08-03 부터 "완전 분리" 판정 기준이 동일값 질량(cdf_gap)에서 이 값(값 축 빈 구간)으로
    바뀌었습니다. 눈으로 보는 "끊김"과 훨씬 잘 맞습니다.

subpop_minor_mass_min:
  what: |
    빈 구간 양쪽으로 갈린 두 무리 중 **작은 쪽**이 최소한 이만큼은 되어야 무리로 인정한다는 기준입니다
    (0.05 = 5%).
  how: |
    작은 쪽 무리에 속한 die 비율.
  effect: |
    올리면 극소수 점 몇 개를 "무리" 로 부르는 오탐이 줄고, 내리면 민감해집니다.

source_min_count:
  what: |
    소스(웨이퍼/로트 파일) 간 비교를 하기 위한 최소 소스 개수입니다.
  how: |
    비교 대상 소스 수와 비교합니다.
  effect: |
    현재 운영 평가 경로(evaluate)에서는 쓰이지 않습니다 — 소스 간 비교 기능 전용입니다.

source_fail_rate_delta_warn:
  what: |
    소스 사이 불량률 격차의 기준입니다.
  how: |
    소스별 불량률의 최대−최소 차이.
  effect: |
    현재 운영 평가 경로(evaluate)에서는 쓰이지 않습니다 — 소스 간 비교 기능 전용입니다.
