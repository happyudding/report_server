# 챗봇 골든 질문 세트 — 계획(intent)과 툴 선택의 안정성만 채점한다.
#
# 정답 "텍스트" 는 비교하지 않는다: 환경마다 DB 내용이 달라(개발 PC 에는 eval.db 가 없다)
# 답변 문자열을 고정하면 검증이 아니라 잡음이 된다. 대신 아래 둘만 본다.
#   expect_intent : planner 가 뽑아야 할 intent
#   expect_tools  : 반드시 호출돼야 하는 툴 (부분집합 — 추가 호출은 허용)
#
# 실행:
#   python -m chatbot --golden ../tests/chatbot_golden.yaml --no-llm   (규칙 계획 채점)
#   python -m chatbot --golden ../tests/chatbot_golden.yaml            (LLM 계획 채점)
# 규칙 계획은 LLM 없이도 통과해야 한다 — LLM 장애 시의 하한선이기 때문.

# ── 사용자가 실제로 던진 두 질문 (고정) ──────────────────────────────────────
- question: "PMIC 에 SOC Family 제품에 무슨 항목인지는 기억 안 나는데 SGM 들어가는 항목 예전에 어떻게 됬었지? 히스토리 알려줘"
  expect_intent: item_history
  expect_tools: [search_item_candidates, search_item_in_sessions]

- question: "내가 예전에 S3222 라는 제품 평가 한 보고서가 있었던거같은데 거기에 LDO 라는 item 어떻게 Issue close 됫었지?"
  expect_intent: session_issue
  expect_tools: [search_sessions]

# ── item 축 ──────────────────────────────────────────────────────────────────
- question: "SGM 항목 이력 보여줘"
  expect_intent: item_history
  expect_tools: [search_item_candidates]

- question: "이름에 PLL 들어간 항목 예전 사례 알려줘"
  expect_intent: item_history
  expect_tools: [search_item_candidates]

- question: "VREF 과거에 문제된 적 있어?"
  expect_intent: item_history
  expect_tools: [search_item_candidates]

- question: "TCON 제품에서 LDO 항목 히스토리"
  expect_intent: item_history
  expect_tools: [search_item_candidates]

# ── 세션/이슈 축 ─────────────────────────────────────────────────────────────
- question: "S3222 보고서에서 LDO 이슈 어떻게 close 됐어?"
  expect_intent: session_issue
  expect_tools: [search_sessions]

- question: "KTD2026 평가 보고서에 있던 이슈 조치 내용 알려줘"
  expect_intent: session_issue
  expect_tools: [search_sessions]

- question: "S3110 리포트에서 종결 안 된 이슈 있어?"
  expect_intent: session_issue
  expect_tools: [search_sessions]

# ── 제품 축 ──────────────────────────────────────────────────────────────────
- question: "S3222 라는 제품 평가한 적 있어?"
  expect_intent: product_search
  expect_tools: [search_products]

# ── 유사 사례 ────────────────────────────────────────────────────────────────
- question: "LDO 랑 비슷한 유형의 사례 있었어?"
  expect_intent: similar_case
  expect_tools: [search_item_candidates]

- question: "SGM 이랑 닮은 항목 사례 찾아줘"
  expect_intent: similar_case
  expect_tools: [search_item_candidates]

# ── 코멘트 본문 ──────────────────────────────────────────────────────────────
- question: "온도 올라갈 때 튀던 현상 코멘트 찾아줘"
  expect_intent: comment_search
  expect_tools: [search_comments]

# ── 세션 찾기 (웹 챗: 바로가기 링크가 목적) ─────────────────────────────────
- question: "S3222 보고서 찾아줘"
  expect_intent: session_find
  expect_tools: [search_sessions]

- question: "KTD2026 리포트 목록 보여줘"
  expect_intent: session_find
  expect_tools: [search_sessions]

# ── 세션 수치 (수율 / CPK / 측정값) ──────────────────────────────────────────
# 세션이 특정되지 않으면 되묻는 게 정답이라 툴 호출이 없을 수 있다(expect_tools 비움).
- question: "이 세션 수율 어때?"
  expect_intent: session_metrics
  expect_tools: []

- question: "S3222 수율 알려줘"
  expect_intent: session_metrics
  expect_tools: [search_sessions]

- question: "S3222 cpk 안 좋은 항목 뭐야?"
  expect_intent: session_metrics
  expect_tools: [search_sessions]

- question: "VDD_INT 측정값 보여줘"
  expect_intent: session_metrics
  expect_tools: []

# ── 화면 이동 (같은 페이지 점프 / 딥링크) ────────────────────────────────────
- question: "맵 열어줘"
  expect_intent: page_jump
  expect_tools: []

- question: "VDD_INT 상세 보여줘"
  expect_intent: page_jump
  expect_tools: []

# ── 집계 ("몇 건" — 목록이 아니라 숫자) ─────────────────────────────────────
- question: "PMIC 에 MAJOR 몇 건이야?"
  expect_intent: stats
  expect_tools: [stats_summary]

- question: "제품별 건수 알려줘"
  expect_intent: stats
  expect_tools: [stats_summary]

- question: "판정별 통계 알려줘"
  expect_intent: stats
  expect_tools: [stats_summary]

# ── item 목록 (제품군에 무슨 항목이 있나) ───────────────────────────────────
- question: "PMIC SOC 에 무슨 Item 있어"
  expect_intent: item_search
  expect_tools: [search_item_candidates]

- question: "PMIC 에 어떤 항목들 있어?"
  expect_intent: item_search
  expect_tools: [search_item_candidates]

- question: "TCON 에 어떤 아이템 종류 있어?"
  expect_intent: item_search
  expect_tools: [search_item_candidates]

- question: "PDDI LCD 항목 목록 뭐가 있어?"
  expect_intent: item_search
  expect_tools: [search_item_candidates]

# 반대편 앵커 — item_search 가 item_history 를 훔치지 않는다 (items·이력어휘가 막는다)
- question: "PMIC SOC 에 SGM 항목 예전 이력"
  expect_intent: item_history
  expect_tools: [search_item_candidates]

# ── 세션 메타 (컨텍스트 세션이 있을 때만) ───────────────────────────────────
- question: "이 세션 누가 올렸어?"
  context_session_id: "gold-ctx"
  expect_intent: session_meta
  expect_tools: [get_session_detail]

- question: "온도 몇 도야?"
  context_session_id: "gold-ctx"
  expect_intent: session_meta
  expect_tools: [get_session_detail]

- question: "언제 올렸어"
  context_session_id: "gold-ctx"
  expect_intent: session_meta
  expect_tools: [get_session_detail]

- question: "이 세션 공정이랑 리비전 뭐야?"
  context_session_id: "gold-ctx"
  expect_intent: session_meta
  expect_tools: [get_session_detail]

# 앵커 — 세션을 열어도 코멘트 질문은 comment_search, 수율은 session_metrics 여야 한다
- question: "온도 올라갈 때 튀던 현상 코멘트 찾아줘"
  context_session_id: "gold-ctx"
  expect_intent: comment_search
  expect_tools: [search_comments]

- question: "이 세션 수율 어때?"
  context_session_id: "gold-ctx"
  expect_intent: session_metrics
  expect_tools: []

# ── 도움말·인사 (unknown 으로 빠지지 않는다) ────────────────────────────────
- question: "안녕"
  expect_intent: help
  expect_tools: []

- question: "뭐 할 수 있어?"
  expect_intent: help
  expect_tools: []

- question: "도움말"
  expect_intent: help
  expect_tools: []

# ── 세션 존재 확인 / 짧은 제품·로트 코드 ────────────────────────────────────
- question: "IW06 세션 있어?"
  expect_intent: session_find
  expect_tools: [search_sessions]

- question: "P1 보고서 찾아줘"
  expect_intent: session_find
  expect_tools: [search_sessions]

- question: "LOT1 리포트 있나?"
  expect_intent: session_find
  expect_tools: [search_sessions]

- question: "S3222 보고서 있는지 확인해줘"
  expect_intent: session_find
  expect_tools: [search_sessions]

# 앵커 — 존재확인 어휘가 product_search 를 훔치지 않는다(_REPORT_KW 가 없으면 7번 불성립).
# ⚠ 제품 코드 모양(영문+숫자 3자리 이상)이어야 product 로 인식된다 — IW06 같은 짧은 코드는
#   설계상 product 가 아니라 자유검색(q) 으로 푼다(_PRODUCT_RE 완화 금지).
- question: "KTD2026 이라는 제품 평가한 적 있어?"
  expect_intent: product_search
  expect_tools: [search_products]

# ── 시간축 ──────────────────────────────────────────────────────────────────
- question: "최근에 올라온 보고서 보여줘"
  expect_intent: session_find
  expect_tools: [search_sessions]

- question: "어제 올라온 세션 목록"
  expect_intent: session_find
  expect_tools: [search_sessions]

- question: "이번주에 올린 리포트 있어?"
  expect_intent: session_find
  expect_tools: [search_sessions]

- question: "오늘 업로드된 보고서 찾아줘"
  expect_intent: session_find
  expect_tools: [search_sessions]

# ── 이슈·증상 어휘 확장 ─────────────────────────────────────────────────────
- question: "고온에서 문제된 적 있어?"
  expect_intent: comment_search
  expect_tools: [search_comments]

- question: "에러 났던 케이스 코멘트 찾아줘"
  expect_intent: comment_search
  expect_tools: [search_comments]

- question: "S3222 에서 문제된 항목 알려줘"
  expect_intent: session_issue
  expect_tools: [search_sessions]

- question: "이 세션에 이상동작 있었어?"
  context_session_id: "gold-ctx"
  expect_intent: session_issue
  expect_tools: []

# ── family 짧은 이름 오탐 (슬롯 회귀 — expect_plan) ─────────────────────────
# 소문자 "if" 는 family_product 'IF' 로 잡히면 안 된다(조회 범위가 잘못 좁아진다).
# ⚠ "이력" 을 넣어 weak=False 로 만든 것은 의도적이다 — weak 이면 근거 재분류가 돌아
#   실DB 내용에 따라 intent 가 달라져(데이터 의존) 골든이 흔들린다.
- question: "if 조건 이력 알려줘"
  expect_intent: item_history
  expect_tools: [search_item_candidates]
  expect_plan: {family_product: null}

- question: "TV 제품군 항목 목록 뭐 있어?"
  expect_intent: item_search
  expect_tools: [search_item_candidates]
  expect_plan: {family_product: "TV"}

# ── Issue Table 추림 (Open/fail/상위N/카테고리) ─────────────────────────────
# 세션 컨텍스트가 있어야 성립하는 질문들 — 슬롯이 제대로 뽑히는지가 핵심이다.
- question: "Issue 에 제일 Open 안된거 알려줘"
  context_session_id: "gold-ctx"
  expect_intent: session_issue
  expect_tools: []
  expect_plan: {issue_filter: "open"}

- question: "Issue 에 Fail 된거 뭐뭐있는지 상위 5개 알려줘"
  context_session_id: "gold-ctx"
  expect_intent: session_issue
  expect_tools: []
  expect_plan: {issue_filter: "fail", top_n: 5}

- question: "Issue 에 CPK 부분에 VDD_INT 아이템 있어?"
  context_session_id: "gold-ctx"
  expect_intent: session_issue
  expect_tools: []
  expect_plan: {issue_category: "CPK"}

- question: "지금 이 세션 VDD_INT item comment 뭐야?"
  context_session_id: "gold-ctx"
  expect_intent: session_issue
  expect_tools: []

# 앵커 — 항목 토큰이 없는 코멘트 질문은 세션을 열어도 전역 코멘트 검색이다
- question: "현상 코멘트 찾아줘"
  context_session_id: "gold-ctx"
  expect_intent: comment_search
  expect_tools: [search_comments]

# ── 화면 링크 요청 ("열어" 가 아니라 "링크/보고 싶은데") ────────────────────
- question: "Map 보고 싶은데 링크 알려줘"
  context_session_id: "gold-ctx"
  expect_intent: page_jump
  expect_tools: []
  expect_plan: {jump_target: "map"}

- question: "VDD_INT 상세 링크 알려줘"
  context_session_id: "gold-ctx"
  expect_intent: page_jump
  expect_tools: []
  expect_plan: {jump_target: "item_detail"}

# ── 서수 지목 (직전 목록에서 N번째) ─────────────────────────────────────────
# 대화 상태가 없으면 세션은 못 정하지만 **서수 슬롯은 뽑혀야** 한다.
- question: "1번 세션 Yield 알려줘"
  expect_intent: session_metrics
  expect_tools: []
  expect_plan: {ordinal: 1, metric: "yield"}

# ── 광역 폴백 (intent 는 unknown 유지 · 툴은 늘어도 통과) ───────────────────
- question: "ㅁㄴㅇㄹ"
  expect_intent: unknown
  expect_tools: []

- question: "그거 있잖아 그거"
  expect_intent: unknown
  expect_tools: []

# ── 알 수 없음 (지어내지 않고 되물어야 한다) ────────────────────────────────
- question: "어제 뭐 했더라"
  expect_intent: unknown
  expect_tools: []

# ── HONEY 기능 카탈로그 (DB·LLM 없이 정적 도움말만 조회) ──────────────────
- question: "Temperature 모드 있어?"
  expect_intent: feature_help
  expect_tools: [search_help_features]

- question: "Rawdata에서 DUT 제외 가능해?"
  expect_intent: feature_help
  expect_tools: [search_help_features]

- question: "Compare에서 Before 여러 개 가능해?"
  expect_intent: feature_help
  expect_tools: [search_help_features]

- question: "Shmoo 사용할 수 있어?"
  expect_intent: feature_help
  expect_tools: [search_help_features]
