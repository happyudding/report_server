# 챗봇 골든 질문 세트 — 계획(intent)과 툴 선택의 안정성만 채점한다.
#
# 정답 "텍스트" 는 비교하지 않는다: 환경마다 DB 내용이 달라(개발 PC 에는 eval.db 가 없다)
# 답변 문자열을 고정하면 검증이 아니라 잡음이 된다. 대신 아래 둘만 본다.
#   expect_intent : planner 가 뽑아야 할 intent
#   expect_tools  : 반드시 호출돼야 하는 툴 (부분집합 — 추가 호출은 허용)
#
# 실행:
#   python -m chatbot --golden ../tests/chatbot_golden.yaml --no-llm   (규칙 계획 채점)
#   python -m chatbot --golden ../tests/chatbot_golden.yaml            (LLM 계획 채점)
# 규칙 계획은 LLM 없이도 통과해야 한다 — LLM 장애 시의 하한선이기 때문.

# ── 사용자가 실제로 던진 두 질문 (고정) ──────────────────────────────────────
- question: "PMIC 에 SOC Family 제품에 무슨 항목인지는 기억 안 나는데 SGM 들어가는 항목 예전에 어떻게 됬었지? 히스토리 알려줘"
  expect_intent: item_history
  expect_tools: [search_item_candidates, search_item_in_sessions]

- question: "내가 예전에 S3222 라는 제품 평가 한 보고서가 있었던거같은데 거기에 LDO 라는 item 어떻게 Issue close 됫었지?"
  expect_intent: session_issue
  expect_tools: [search_sessions]

# ── item 축 ──────────────────────────────────────────────────────────────────
- question: "SGM 항목 이력 보여줘"
  expect_intent: item_history
  expect_tools: [search_item_candidates]

- question: "이름에 PLL 들어간 항목 예전 사례 알려줘"
  expect_intent: item_history
  expect_tools: [search_item_candidates]

- question: "VREF 과거에 문제된 적 있어?"
  expect_intent: item_history
  expect_tools: [search_item_candidates]

- question: "TCON 제품에서 LDO 항목 히스토리"
  expect_intent: item_history
  expect_tools: [search_item_candidates]

# ── 세션/이슈 축 ─────────────────────────────────────────────────────────────
- question: "S3222 보고서에서 LDO 이슈 어떻게 close 됐어?"
  expect_intent: session_issue
  expect_tools: [search_sessions]

- question: "KTD2026 평가 보고서에 있던 이슈 조치 내용 알려줘"
  expect_intent: session_issue
  expect_tools: [search_sessions]

- question: "S3110 리포트에서 종결 안 된 이슈 있어?"
  expect_intent: session_issue
  expect_tools: [search_sessions]

# ── 제품 축 ──────────────────────────────────────────────────────────────────
- question: "S3222 라는 제품 평가한 적 있어?"
  expect_intent: product_search
  expect_tools: [search_products]

# ── 유사 사례 ────────────────────────────────────────────────────────────────
- question: "LDO 랑 비슷한 유형의 사례 있었어?"
  expect_intent: similar_case
  expect_tools: [search_item_candidates]

- question: "SGM 이랑 닮은 항목 사례 찾아줘"
  expect_intent: similar_case
  expect_tools: [search_item_candidates]

# ── 코멘트 본문 ──────────────────────────────────────────────────────────────
- question: "온도 올라갈 때 튀던 현상 코멘트 찾아줘"
  expect_intent: comment_search
  expect_tools: [search_comments]

# ── 세션 찾기 (웹 챗: 바로가기 링크가 목적) ─────────────────────────────────
- question: "S3222 보고서 찾아줘"
  expect_intent: session_find
  expect_tools: [search_sessions]

- question: "KTD2026 리포트 목록 보여줘"
  expect_intent: session_find
  expect_tools: [search_sessions]

# ── 세션 수치 (수율 / CPK / 측정값) ──────────────────────────────────────────
# 세션이 특정되지 않으면 되묻는 게 정답이라 툴 호출이 없을 수 있다(expect_tools 비움).
- question: "이 세션 수율 어때?"
  expect_intent: session_metrics
  expect_tools: []

- question: "S3222 수율 알려줘"
  expect_intent: session_metrics
  expect_tools: [search_sessions]

- question: "S3222 cpk 안 좋은 항목 뭐야?"
  expect_intent: session_metrics
  expect_tools: [search_sessions]

- question: "VDD_INT 측정값 보여줘"
  expect_intent: session_metrics
  expect_tools: []

# ── 화면 이동 (같은 페이지 점프 / 딥링크) ────────────────────────────────────
- question: "맵 열어줘"
  expect_intent: page_jump
  expect_tools: []

- question: "VDD_INT 상세 보여줘"
  expect_intent: page_jump
  expect_tools: []

# ── 집계 ("몇 건" — 목록이 아니라 숫자) ─────────────────────────────────────
- question: "PMIC 에 MAJOR 몇 건이야?"
  expect_intent: stats
  expect_tools: [stats_summary]

- question: "제품별 건수 알려줘"
  expect_intent: stats
  expect_tools: [stats_summary]

- question: "판정별 통계 알려줘"
  expect_intent: stats
  expect_tools: [stats_summary]

# ── 알 수 없음 (지어내지 않고 되물어야 한다) ────────────────────────────────
- question: "어제 뭐 했더라"
  expect_intent: unknown
  expect_tools: []
